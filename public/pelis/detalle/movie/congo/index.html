<h1>Congo</h1>
<p>Una expedición al Congo africano termina siendo un desastre. Un grupo de expertos busca un tipo de diamantes que, por su tamaño y pureza, pueden ser utilizados para poner en funcionamiento un transmisor de comunicaciones por láser, que también puede ser utilizado como arma. Cuando el equipo pierde contacto, la novia de uno de ellos, una antigua agente de la CIA, se dispone a buscar a su prometido por la selva.</p>
<p><strong>Director:</strong> Frank Marshall · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción</p>
