<h1>Scarface, el terror del Hampa</h1>
<p>Tony Camonte, un pistolero de origen italiano, ignorante y sin escrúpulos, es el lugarteniente de Johnny Lovo, el hampón más poderoso del South End de Chicago. Ambicioso y cruel, Camonte, que por una cicatriz que le cruza el rostro recibe el apelativo de Cara cortada, elimina poco a poco a los rivales de su jefe hasta que, con la ayuda de su amigo Gino Rinaldo, le arrebata el poder también a él y se convierte en el amo de la ciudad. Tras un mes de vacaciones en Florida, descubre que su hermana Cesca, por la que siente un amor confuso y arrebatado, es la amante de Gino.</p>
<p><strong>Director:</strong> Howard Hawks · <strong>Año:</strong> 1932 · <strong>Géneros:</strong> Acción, Crimen, Drama, Suspense</p>
<p><strong>Reparto:</strong> Paul Muni, Ann Dvorak, Karen Morley, Osgood Perkins, C. Henry Gordon, George Raft</p>
