<h1>Encanto</h1>
<p>Encanto relata la historia de una familia extraordinaria; los Madrigal, quienes viven escondidos en las montañas de Colombia, en una casa mágica, un pueblo vibrante y en un lugar maravilloso llamado Encanto. La magia del Encanto ha bendecido a cada niño de la familia con un don único, desde la superfuerza hasta el poder de sanar; a todos, excepto Mirabel, quien desea ser tan especial como el resto de su familia. Pero cuando la magia que rodea al Encanto está en peligro, Mirabel decide que ella, la única Madrigal sin ningún tipo de don único, puede ser la única esperanza de su excepcional familia.</p>
<p><strong>Director:</strong> Charise Castro Smith · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Animación, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Stephanie Beatriz, María Cecilia Botero, John Leguizamo, Diane Guerrero, Jess Darrow, Carolina Gaitán</p>
