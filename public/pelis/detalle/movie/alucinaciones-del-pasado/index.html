<h1>Alucinaciones del pasado</h1>
<p>El cartero neoyorkino Jacob Singer intenta evitar que los jirones de su vida terminen de deshilacharse. Lo acosan incesantes flashbacks de su primer matrimonio, de su hijo muerto y de su periodo de servicio en Vietnam. En su nueva esposa busca un asidero hacia la lucidez, pero la línea entre la realidad y el delirio se hace cada vez más delgada. Tim Robbins protagoniza una escalofriante historia de un hombre que desciende al infierno, brillantemente dirigida por Adrian Lyne.</p>
<p><strong>Director:</strong> Adrian Lyne · <strong>Año:</strong> 1990 · <strong>Géneros:</strong> Drama, Misterio, Terror</p>
<p><strong>Reparto:</strong> Tim Robbins, Elizabeth Peña, Danny Aiello, Matt Craven, Pruitt Taylor Vince, Jason Alexander</p>
