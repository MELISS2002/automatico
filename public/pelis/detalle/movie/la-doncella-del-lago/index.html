<h1>La Doncella Del Lago</h1>
<p>En el verano de 1958, un pueblo japonés vive bajo la amenaza constante de los tifones. Un niño llamado Yucha escucha la antigua leyenda de una joven que murió ahogada en un lago de la montaña, y cuyo dolor provoca terribles inundaciones cada cierto tiempo. Cuando un gran tifón se aproxima, Yucha decide enfrentarse a sus miedos y subir al lago con la esperanza de evitar la tragedia.</p>
<p><strong>Director:</strong> 金子雅和 · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama, Fantasía</p>
<p><strong>Reparto:</strong> 有山実俊, 華村あすか, 葵揚, 足立智充, 山田キヌヲ, 堀部圭亮</p>
