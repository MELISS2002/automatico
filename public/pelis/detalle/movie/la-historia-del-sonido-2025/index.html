<h1>La historia del sonido</h1>
<p>Lionel es un talentoso cantante de la Kentucky rural criado con las canciones que su padre cantaba en el porche. En 1917, abandona la granja familiar para asistir al Conservatorio de Música de Boston. Allí conoce a David, un encantador estudiante de composición musical que pronto es llamado a filas al final de la guerra. En 1920, ambos pasan un invierno recorriendo los bosques y las islas de Maine, recopilando canciones populares con el fin de preservarlas para las generaciones futuras.</p>
<p><strong>Director:</strong> Oliver Hermanus · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama, Música, Romance</p>
