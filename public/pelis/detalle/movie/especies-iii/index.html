<h1>Especies III</h1>
<p>Nuevas aventuras de la bella y terrorífica especímen extraterrestre, esta vez centrada en Sara (Sunny Mabrey) la hija de Eve, la alienígena original. En la lucha continua por la supremacía entre el género humano y los híbridos humano-alienígenas, una debilidad fatal de éstos ha ofrecido a los seres humanos una cierta ventaja&amp;#8230; hasta ahora; cuando nace Sara, la hija de Eve (Natasha Henstridge), se convierte en el ente alienígena de genes más perfectos que haya existido nunca. En su afán por reproducirse y poblar la tierra con los de su clase, esta hermosa y peligrosa mujer fatal demuestra un insaciable apetito por aparearse&amp;#8230; mientras tanto, un grupo militar de élite le sigue los pasos para tratar de poner punto y final a la guerra entre las dos especies de una vez por todas.</p>
<p><strong>Director:</strong> Brad Turner · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Acción, Ciencia ficción, Terror</p>
<p><strong>Reparto:</strong> Robin Dunne, Robert Knepper, Sunny Mabrey, Amelia Cooke, Christopher Neame, Patricia Bethune</p>
