<h1>Togo: La verdadera historia</h1>
<p>Togo es una película estadounidense perteneciente al género dramático que se estrenó en Disney+. La película se centra en dos figuras clave en la carrera del suero a Nome en 1925, también conocida como «Gran Carrera de la Misericordia», en la que los equipos de trineos jalados por perros sirvieron para transportar el suero de antitoxina diftérica a través de condiciones difíciles durante casi 700 millas para salvar a Nome de una epidemia.</p>
<p><strong>Director:</strong> Ericson Core · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Aventura, Familia</p>
<p><strong>Reparto:</strong> Willem Dafoe, Julianne Nicholson, Christopher Heyerdahl, Richard Dormer, Adrien Dorval, Madeline Wickins</p>
