<h1>La elefanta del Mago</h1>
<p>Peter busca a su hermana, desaparecida mucho tiempo atrás. Por eso, cuando se topa con una vidente, solo se le ocurre preguntarle si ella sigue con vida. La respuesta es que debe encontrar a una misteriosa elefanta y al mago capaz de conjurarla. Así, Peter emprende un viaje sobrecogedor para completar tres tareas aparentemente imposibles que cambiarán para siempre su pueblo y lo sumergirán en la aventura de su vida.</p>
<p><strong>Director:</strong> Wendy Rogers · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Noah Jupe, Mandy Patinkin, Brian Tyree Henry, Natasia Demetriou, Sian Clifford, Benedict Wong</p>
