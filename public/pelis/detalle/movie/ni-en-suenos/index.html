<h1>Ni en sueños</h1>
<p>Cuando Fred Flarsky (Seth Rogen) se reencuentra inesperadamente con el primer amor de su vida, que ahora es una de las mujeres más influyentes del mundo, Charlotte Field (Charlize Theron), logra llamar su atención gracias a su peculiar sentido del humor y a su visión idealista del mundo y de la política. Mientras se prepara para aspirar a la presidencia del país, Charlotte contrata a Fred para que sea el encargado de escribir sus discursos. Sin embargo, Fred se va a encontrar como un pez fuera del agua en el equipo de élite de Charlotte.</p>
<p><strong>Director:</strong> Jonathan Levine · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Comedia, Romance</p>
