<h1>Una Tumba a la Eternidad</h1>
<p>Durante unas excavaciones en Londres, aparece un extraño objeto de gran tamaño. Al principio se cree que puede ser una bomba de la Segunda Guerra Mundial lanzada por los nazis. El ejército descubre que no es nada parecido y llama al profesor Quatermass, que junto con el doctor en antropología Roney y su ayudante Bárbara Judd intentaran explicar el enigma. El profesor Quatermass descubre en su interior unas criaturas alienígenas que intentaron conquistar la Tierra en tiempos prehistóricos y, a través de sus experimentos en los primeros hombres, alteraron la evolución humana hasta llegar a su estado actual. Aunque adormecidas por muchos siglos, ahora existe el peligro de que puedan despertar y tratar de dominar a la humanidad.</p>
<p><strong>Director:</strong> Roy Ward Baker · <strong>Año:</strong> 1967 · <strong>Géneros:</strong> Ciencia ficción, Terror</p>
<p><strong>Reparto:</strong> Andrew Keir, James Donald, Barbara Shelley, Julian Glover, Bryan Marshall, Maurice Good</p>
