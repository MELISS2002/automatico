<h1>Ga&#x27;Hoole: La leyenda de los guardianes</h1>
<p>Se centra en la heroica lucha de un joven búho por salvar a su comunidad de las fuerzas del Mal. Su nombre es Soren, y nació en el bosque Tyto, donde hubo un tiempo en el que habitaban en paz las lechuzas. Ahora la sombra del Mal planea sobre el reino de los búhos, amenazando con destruir la paz en el bosque Tyto y cambiar la vida de Soren para siempre. Para evitarlo buscará el Gran Árbol Ga&#x27;Hoole, en un viaje que se le antojará largo y angustioso. Cuando Soren y sus amigos lleguen por fin al Gran Árbol Ga&#x27;Hoole tendrán que someterse a pruebas que jamás habían soñado y afrontar desafíos que nunca habían imaginado. Si son capaces de aprender de sus jefes y unos de otros, pronto se convertirán en verdaderas lechuzas de Ga&#x27;Hoole: honestas y valientes, sabias y sinceras.</p>
<p><strong>Director:</strong> Zack Snyder · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Animación, Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Jim Sturgess, Ryan Kwanten, Hugo Weaving, Helen Mirren, Geoffrey Rush, Emily Barclay</p>
