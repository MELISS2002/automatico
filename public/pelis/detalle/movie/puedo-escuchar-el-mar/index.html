<h1>Puedo escuchar el mar</h1>
<p>Una chica de Tokio acaba de ser trasladada a una de las escuelas superiores de la ciudad de Kochi. Es guapa, buena en los deportes y en los estudios, pero de algún modo no consigue adaptarse a la vida social de la escuela. A ese mismo colegio pertenecen Taku Morisaki y Yukata Matsuno, dos grandes amigos, el primero de los cuales empieza a interesarse visiblemente por la recién llegada Muto.</p>
<p><strong>Director:</strong> 望月智充 · <strong>Año:</strong> 1993 · <strong>Géneros:</strong> Animación, Drama, Romance</p>
<p><strong>Reparto:</strong> 飛田展男, 坂本洋子, Toshihiko Seki, 天野由梨, 荒木香衣, 金丸淳一</p>
