<h1>La guardería de Papá</h1>
<p>Tras no obtener los resultados esperados en una campaña publicitaria sobre cereales vegetales, Charlie y Phil (Eddie Murphy &amp;#038; Jeff Garlin) son despedidos de sus trabajos. Después de fracasar en la búsqueda de un empleo, y quedarse al mando de sus casas y de sus hijos pequeños, Charlie tiene una idea: ¿Si Phil y él pueden arreglárselas para cuidar de 2 niños, porqué no cuidar a 10? Golosinas, superhéroes y destrozar todo lo que haya a la vista son los hobbies de los traviesos residentes de «La Guarderia de Papá», la loca pero divertida guardería montada en su propia casa, para el cuidado de niños durante el día&amp;#8230; para irritación de su principal competidora, la estricta Srta. Gwyneth Harridan (Angelica Huston).</p>
<p><strong>Director:</strong> Nancy Karlin · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Comedia, Familia</p>
<p><strong>Reparto:</strong> Eddie Murphy, Jeff Garlin, Steve Zahn, Anjelica Huston, Regina King, Khamani Griffin</p>
