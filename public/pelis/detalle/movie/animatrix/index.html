<h1>Animatrix</h1>
<p>Directamente de los creadores de la trilogía de Matrix, esta colección de películas cortas de animación de los principales directores de anime del mundo fusiona gráficos de computadora y anime japonés para proporcionar el fondo del universo Matrix y el conflicto entre el hombre y las máquinas. Los cortometrajes incluyen, el vuelo final del Osiris, el segundo renacimiento, historia del niño, programa, expediente del mundo, más allá, una historia del detective y matriculado.</p>
<p><strong>Director:</strong> Peter Chung · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Animación, Ciencia ficción</p>
<p><strong>Reparto:</strong> Keanu Reeves, Carrie-Anne Moss, Clayton Watson, Pamela Adlon, Melinda Clarke, John DiMaggio</p>
