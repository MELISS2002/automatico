<h1>12 monos</h1>
<p>En el año 2035, el convicto James Cole voluntarios a regañadientes para ser enviado de regreso en el tiempo para descubrir el origen de un virus mortal que aniquiló a casi toda la población de la tierra y obligó a los sobrevivientes a las comunidades subterráneas. Pero cuando Cole es enviado por error a 1990 en lugar de a 1996, es arrestado y encerrado en un hospital psiquiátrico. Allí conoce a la psiquiatra Dra. Kathryn Railly, y al paciente Jeffrey Goines, hijo de un famoso experto en virus, que puede tener la llave del misterioso grupo rebelde, el Ejército de los 12 Monos, que se cree será el responsable de desencadenar la enfermedad mortal.</p>
<p><strong>Director:</strong> Terry Gilliam · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Ciencia ficción, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Bruce Willis, Madeleine Stowe, Brad Pitt, Christopher Plummer, David Morse, Jon Seda</p>
