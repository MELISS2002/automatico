<h1>La Chica que Saltaba a Través del Tiempo</h1>
<p>El tiempo del instituto es uno de los más entrañables durante la adolescencia. Para la joven Makoto y sus amigos Chiaki y Kosuke es realmente importante pasarlo bien juntos tanto tiempo como puedan, jugando a béisbol después de clase, ya que los tres están a punto de subir de grado y el año que viene quizás no continúen juntos los estudios. Pero un día, Makoto recibe un peculiar don: la capacidad de ir hacia atrás en el tiempo dando agigantados brincos. Makoto usará esta habilidad para evadir los problemas y alargar la diversión</p>
<p><strong>Director:</strong> 細田守 · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Animación, Ciencia ficción, Drama, Fantasía</p>
<p><strong>Reparto:</strong> 仲里依紗, 石田卓也, 板倉光隆, 垣内彩未, 谷村美月, 関戸優希</p>
