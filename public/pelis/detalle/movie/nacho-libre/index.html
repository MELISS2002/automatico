<h1>Nacho Libre</h1>
<p>Nacho es un hombre sin talento. Se crió en un monasterio en México del que ahora es el cocinero, pero no parece encajar. Nacho quiere a los huérfanos para los que cocina, pero todo lo que hace sabe fatal. Según él, porque tiene una pésima materia prima. Se da cuenta de que debe ingeniárselas para cocinar algo mejor para los pobres huérfanos (y de paso, impresionar a la preciosa hermana Encarnación). Se le ocurre la idea de ganar dinero convirtiéndose en luchador de lucha libre y descubre que tiene un don innato.</p>
<p><strong>Director:</strong> Jared Hess · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Jack Black, Ana de la Reguera, Héctor Jiménez, Darius Rose, Moisés Arias, Carlos Maycotte</p>
