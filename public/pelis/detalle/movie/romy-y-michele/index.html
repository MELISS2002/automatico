<p>Romy (Mira Sorvino) y Michelle (Lisa Kudrow) son amigas desde la época del instituto. Cuando reciben una invitación para asistir a una fiesta de antiguos alumnos, se sienten avergonzadas porque son muy conscientes de lo grises y anódinas que son sus vidas. Sin embargo, en lugar de quedarse en casa, deciden inventarse una vida apasionante y acudir a la reunión.</p>
