<h1>Bill y Ted 2: El Alucinante Viaje</h1>
<p>En un futuro lejano, las enseñanzas de Bill S. Preston y Theodore Logan han traído la paz al planeta. El ansia de poder, de gobernar la tierra, lleva a Chuck de Nomolos a enviar unas versiones de cyborg a través del tiempo para que maten a Bill y Ted antes de que éstos se puedan difundir sus conceptos y, con ello, influir en el siguiente cambio del mundo. Bill y Ted, una vez muertos, se encuentran al temible Grim Reaper y lo retan a una serie de juegos como única forma de volver al mundo de los vivos. Logran vencerlo y Muerte se pone a su servicio. Luego se embarcan en una odisea cósmica para derrotar a los robots y ganar la Batalla de las Bandas</p>
<p><strong>Director:</strong> Peter Hewitt · <strong>Año:</strong> 1991 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Comedia</p>
<p><strong>Reparto:</strong> Keanu Reeves, Alex Winter, William Sadler, Joss Ackland, Pam Grier, George Carlin</p>
