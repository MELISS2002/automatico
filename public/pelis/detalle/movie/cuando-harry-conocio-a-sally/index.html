<h1>Cuando Harry conoció a Sally</h1>
<p>Harry Burns y Sally Albright se conocen fortuitamente cuando ella se ofrece para llevarle en su coche hasta la ciudad, entablan una conversación sobre la amistad entre personas de diferente sexo; la conversación acaba en discusión, pero entre ellos nace algo muy especial. Son un hombre y una mujer que se han pasado mucho tiempo intentando averiguar cómo seguir siendo amigos. Sin embargo, Harry tiene una firme creencia: que dos personas de sexo opuesto no pueden ser simplemente amigos, la relación siempre acaba en la cama o en el altar.</p>
<p><strong>Director:</strong> Rob Reiner · <strong>Año:</strong> 1989 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Billy Crystal, Meg Ryan, Carrie Fisher, Bruno Kirby, Steven Ford, Lisa Jane Persky</p>
