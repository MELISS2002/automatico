<h1>Depredador: La presa</h1>
<p>La historia no contada de una joven de la Nación Comanche, Naru: una guerrera feroz y altamente hábil, criada entre algunos de los mejores cazadores que vagaban por las Grandes Llanuras a principios de 1700. Confiada en que es tan capaz como los otros jóvenes cazadores, se dispone a proteger a su pueblo cuando el peligro amenaza a su campamento comanche. Armada con las armas más primitivas, Naru acecha y finalmente se enfrenta a su presa, que resulta ser un depredador alienígena altamente evolucionado con un arsenal técnicamente avanzado, lo que resulta en un enfrentamiento feroz y aterrador entre los dos adversarios.</p>
<p><strong>Director:</strong> Jeremy Marinas · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Acción, Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Amber Midthunder, Dakota Beavers, Michelle Thrush, Stormee Kipp, Julian Black Antelope, Dane DiLiegro</p>
