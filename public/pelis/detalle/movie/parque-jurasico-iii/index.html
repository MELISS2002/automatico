<h1>Parque Jurásico III</h1>
<p>El doctor Alan Grant, ansioso por conseguir fondos que financien su estudio sobre la inteligencia del velociraptor, acepta la oferta de pareja de millonarios, Paul y Amanda Kirby, para sobrevolar la Isla Sorna, en Puerto Rico, poblada por dinosaurios creados genéticamente para un parque recreativo. Tras producirse un aterrizaje forzoso en la isla, Alan descubre que los Kirby estaban buscando a su hijo adolescente, perdido en la isla tras un accidente de parapente.</p>
<p><strong>Director:</strong> Joe Johnston · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Suspense</p>
