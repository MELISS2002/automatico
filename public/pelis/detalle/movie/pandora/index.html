<h1>Pandora</h1>
<p>Jae-Hyeok vive con su madre, su cuñada y su sobrino Min-Jae en una pequeña ciudad coreana. Él está saliendo con Yeon-Joo, mientras trabajaba en la planta de energía nuclear local. Mientras tanto, Pyung-Sub trabaja en la misma planta de energía nuclear. Él está preocupado por las condiciones allí, pero nadie en el gobierno lo escucha. Un terremoto golpea la pequeña ciudad donde vive Jae-Hyeok y causa explosiones en la planta de energía nuclear. La situación rápidamente se sale de control, lo que lleva al pánico a toda la nación. Para evitar otro desastre nuclear, Jae-Hyeok y sus compañeros de trabajo regresan a la planta de energía nuclear.</p>
<p><strong>Director:</strong> Kim Min-sung · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Acción, Drama, Suspense</p>
<p><strong>Reparto:</strong> 김남길, 김주현, 김명민, 이경영, 김영애, 정진영</p>
