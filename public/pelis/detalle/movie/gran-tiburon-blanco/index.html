<h1>Gran tiburón blanco</h1>
<p>Lo que parecía una excursión fantástica en un hidroavión, rápidamente se convirtió en la peor pesadilla de sus cinco pasajeros al quedarse varados en medio del océano a kilómetros de la costa. Ahora, el grupo tratará desesperadamente de sobrevivir intentando llegar a tierra antes de que se terminen los suministros y los víveres con los que cuentan o de ser capturados por los tiburones que se encuentran debajo de su embarcación.</p>
<p><strong>Director:</strong> Wade Savage · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Suspense, Terror</p>
