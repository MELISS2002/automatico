<h1>Tarzán 2: El origen de la leyenda</h1>
<p>Antes de ser el Rey de la Selva, Tarzán era un niño inquieto que intentaba encontrar su papel en el mundo. Cuando una de sus travesuras pone a su familia en peligro, Tarzán decide que ellos estarán mejor sin él. Así se embarca en un emocionante viaje que le llevará a encontrarse cara a cara con el misterioso Zugor, la fuerza más poderosa del planeta. Juntos, Tarzán y Zugor descubren que ser diferentes no es una debilidad y que los amigos y la familia son el mayor apoyo de todos.</p>
<p><strong>Director:</strong> Brian Smith · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Animación, Aventura, Familia</p>
<p><strong>Reparto:</strong> Harrison Chad, George Carlin, Brad Garrett, Ron Perlman, Estelle Harris, Glenn Close</p>
