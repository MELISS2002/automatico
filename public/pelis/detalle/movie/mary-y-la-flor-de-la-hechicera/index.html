<h1>Mary y la flor de la hechicera</h1>
<p>Mary es una niña que vive con su tía abuela Charlotte en el campo, donde no pasa casi nada. Un día sigue a un misterioso gato hasta el bosque y descubre un viejo palo de escoba y una extraña flor que sólo florece cada siete años en ese mismo bosque. El palo de escoba y la flor llevarán a Mary por encima de las nubes hasta Endor College, una escuela de magia dirigida por Madam Mumblechook y el brillante Doctor Dee. Pero allí suceden cosas extrañas y Mary tendrá que arriesgar su vida para que todo vaya bien.</p>
<p><strong>Director:</strong> 米林宏昌 · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Animación, Aventura, Familia, Fantasía</p>
