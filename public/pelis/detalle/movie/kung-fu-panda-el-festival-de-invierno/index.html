<h1>Kung Fu Panda: El festival de Invierno</h1>
<p>La fiesta de invierno es la fiesta favorita de Po. Todos los años él y su padre cuelgan decoraciones, cocinan juntos y sirven sopa de fideos a los aldeanos. Pero este año Shifu le informa a Po que, como El Guerrero Dragon, es su deber organizar una Fiesta de Invierno formal en el Palacio de Jade. Po está atrapado entre sus obligaciones como El Guerrero Dragón y las tradiciones de su familia&amp;#8230; entre Shifu y el Sr. Ping.</p>
<p><strong>Director:</strong> Tim Johnson · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Animación, Comedia, Familia, Fantasía, Película de TV</p>
<p><strong>Reparto:</strong> Jack Black, Dustin Hoffman, Angelina Jolie, Seth Rogen, Lucy Liu, David Cross</p>
