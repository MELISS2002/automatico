<h1>Fantasma de la Ópera</h1>
<p>Un violinista de la Ópera de París (Claude Rains), locamente enamorado de Christine Dubois (Susanna Foster), una joven aspirante a soprano, es despedido porque su mano izquierda ya no es tan hábil como antes. Solo y sin dinero, después de haberlo gastado todo en pagar -sin que ella lo sepa- las lecciones de canto de Christine, decide publicar un concierto con el fin de completar la instrucción de la soprano y de hacerse famoso. Pero, a causa de un malentendido, ataca a su editor, y la secretaria de éste le desfigura el rostro con ácido. Se refugia entonces en los sótanos de la Ópera y, desde entonces, actúa como un fantasma cuya sombra amenazadora acecha en la oscuridad y siembra el pánico entre el público.</p>
<p><strong>Director:</strong> Arthur Lubin · <strong>Año:</strong> 1943 · <strong>Géneros:</strong> Romance, Terror</p>
<p><strong>Reparto:</strong> Nelson Eddy, Susanna Foster, Claude Rains, Edgar Barrier, Leo Carrillo, Jane Farrar</p>
