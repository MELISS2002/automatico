<h1>Robin Hood: El príncipe de los ladrones</h1>
<p>Tras volver de las cruzadas, el noble sajón Robin de Locksey descubre que el príncipe Juan, aprovechando la ausencia del rey Ricardo «Corazón de León», ha usurpado el trono e intenta imponer la tiranía, Costner se mete en el bosque se Sherwood encarnando al legendario héroe de los pobres. Cuando Robin y Azeem llegan a Inglaterra, gobernada ahora por el déspota sheriff de Nottingham, ayudado por su primo Guy de Gisborne y la bruja Morgana, descubren que el padre de Robin, lord Locksley, ha sido asesinado por el sheriff. Cómo venganza, Robin, ayudado por Azeem, empieza robar a la nobleza y la iglesia enriquecida para alimentar a los más necesitados. Por ello, el sheriff valora la cabeza de Hood en cien piezas de oro.</p>
<p><strong>Director:</strong> Kevin Reynolds · <strong>Año:</strong> 1991 · <strong>Géneros:</strong> Acción, Aventura, Drama</p>
<p><strong>Reparto:</strong> Kevin Costner, Morgan Freeman, Mary Elizabeth Mastrantonio, Christian Slater, Alan Rickman, Geraldine McEwan</p>
