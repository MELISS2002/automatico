<h1>Loca academia de policía</h1>
<p>Las nuevas normas dictadas por la alcaldesa significan que el sexo, el peso, la altura y la inteligencia ya no serán factores decisivos para alistarse en las fuerzas del orden. Esto abre las puertas de toda clase de chusma, para disgusto de los instructores, si bien es cierto que no todo el mundo estará ahí por elección, como es el caso de Mahoney cuya alternativa era la prisión, y que intentará por todos los medios que le expulsen hasta que se da cuenta de que le gusta ser cadete de la academia.</p>
<p><strong>Director:</strong> Hugh Wilson · <strong>Año:</strong> 1984 · <strong>Géneros:</strong> Comedia, Crimen</p>
