<h1>El último secreto de Sherlock Holmes</h1>
<p>Sherlock Holmes y el doctor Watson parten hacia Escocia para investigar la desaparición del marido de una bella mujer. Una vez allí, descubren que en el caso está involucrada una sociedad que pertenece al Servicio Secreto de su Majestad. Pero, antes de que pueda aplicar sus extraordinarias dotes de deducción para resolver el asunto, Holmes comete un error que, además de arruinar su reputación, podría también poner en peligro la seguridad de Gran Bretaña.</p>
<p><strong>Director:</strong> Billy Wilder · <strong>Año:</strong> 1970 · <strong>Géneros:</strong> Aventura, Comedia, Crimen, Misterio</p>
<p><strong>Reparto:</strong> Robert Stephens, Colin Blakely, Geneviève Page, Christopher Lee, Tamara Toumanova, Clive Revill</p>
