<h1>Héroes al rescate</h1>
<p>Es Navidad y la nieve cubre la ciudad de Tokio con su blanco manto. En algún lugar de Shinjuku encontramos a tres vagabundos: Gin, Hana y Miyuki. Una noche oyen unos lloros que salen de entre un montón basura y encuentran a un angelical bebé. Gin insiste en llevarlo a la policía y que ellos se encarguen de él. Sin embargo, Hana, que siempre ha tenido la ilusión de tener un bebé, no quiere dejárselo a nadie y que sean ellos mismos los que busquen a los padres. Así será como estos tres amigos se embarcan en la aventura de encontrar a la familia del bebé.</p>
<p><strong>Director:</strong> 今敏 · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Animación, Comedia, Drama</p>
<p><strong>Reparto:</strong> 岡本綾, 梅垣義明, 江守徹, こおろぎさとみ, 能登麻美子, Ryūji Saikachi</p>
