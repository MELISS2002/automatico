<h1>InuYasha: El amor a través del tiempo</h1>
<p>Inu Yasha es un semidemonio que ha pasado cincuenta años encadenado a un Árbol Sagrado. Ha sido liberado de su encierro por Kagome, una chica que viajó 500 años en el tiempo hasta el Japón feudal. Desde entonces, ambos intentan reunir los fragmentos de la Joya de los Cuatro Espíritus, que resultó dispersada por accidente. Juntos se tendrán que enfrentar con el demonio chino Menomaru, despertado de su letargo gracias a una astilla de la Joya de los Cuatro Espíritus.</p>
<p><strong>Director:</strong> 篠原俊哉 · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Acción, Animación, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> 山口勝平, ゆきのさつき, 辻谷耕史, 桑島法子, 渡辺久美子, 緒方賢一</p>
