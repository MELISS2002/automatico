<h1>Psíquico, El Reencuentro</h1>
<p>El falso detective psíquico Shawn Spencer (James Roday) y su mejor amigo, Burton “Gus” Guster (Dulé Hill), hacen equipo de nuevo en “Psíquico el reencuentro”. El creador de “Psíquico” Steve Franks, co escribe la película junto a James Roday, y también dirige este especial. Lassiter (Timothy Omundson), Juliet (Maggie Lawson), Henry (Corbing Bernsen) y la Jefa Vick (Kirsten Nelson) también regresan a la película, que continua tres años después del final de serie. Los ambiciosos amigos, así como algunos personajes favoritos, regresan en estas vacaciones cuando un misterioso agresor tiene como blanco a uno de los suyos. El resultado es una comedia, cuando el gracioso e impredecible equipo psíquico persiga a los chicos malos, la justicia y… la comida.</p>
<p><strong>Director:</strong> Steve Franks · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Comedia, Crimen, Misterio, Película de TV</p>
<p><strong>Reparto:</strong> James Roday Rodriguez, Dulé Hill, Maggie Lawson, Corbin Bernsen, Kirsten Nelson, Zachary Levi</p>
