<h1>Epidemia</h1>
<p>En África, el ejército de los Estados Unidos arrasa un campamento del Zaire en el que un virus mortal semejante al ébola estaba acabando con la población. Lo que se pretendía con esta medida era mantener el virus en secreto y, al mismo tiempo, impedir que se propagase. Lo que no estaba previsto era que un pequeño mono, portador del peligroso virus, viajara en un barco desde el Zaire a EE.UU. El pánico se desata cuando se descubre que todos los que que han estado en contacto con el simio empiezan a mostrar los primeros síntomas de la enfermedad.</p>
<p><strong>Director:</strong> Wolfgang Petersen · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Acción, Ciencia ficción, Drama, Suspense</p>
