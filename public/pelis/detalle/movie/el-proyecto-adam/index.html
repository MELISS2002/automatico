<h1>El proyecto Adam</h1>
<p>Adam Reed es un viajero del tiempo del año 2050 que se ha aventurado en una misión de rescate para buscar a Laura, la mujer que ama, que se perdió en el continuo espacio-tiempo en circunstancias misteriosas. Cuando la nave de Adam se estropea, es enviado en espiral al año 2022, y al único lugar que conoce de esta época de su vida: su casa, donde vive su yo cuando tenía 13 años.</p>
<p><strong>Director:</strong> Brian Smrz · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Comedia</p>
