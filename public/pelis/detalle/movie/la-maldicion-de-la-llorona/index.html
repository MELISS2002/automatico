<h1>La maldición de La Llorona</h1>
<p>La Llorona es una aparición tenebrosa, atrapada entre el cielo y el infierno, con un destino terrible sellado por su propia mano. La mera mención de esta terrorífica leyenda mexicana ha causado terror durante generaciones. En vida, ahogó a sus hijos llena de rabia, por celos, arrojándose en el río tras ver l que había hecho. Ahora sus lágrimas son eternas y letales, y aquellos que escuchan su llamada de muerte en la noche están condenados. Se arrastra en las sombras y ataca a los niños, desesperada por reemplazar a los suyos. A medida que los siglos han pasado, su deseo se ha vuelto más voraz y sus métodos más terroríficos.</p>
<p><strong>Director:</strong> Jeffrey Wetzel · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Linda Cardellini, Raymond Cruz, Patricia Velásquez, Roman Christou, Jaynee-Lynne Kinchen, Marisol Ramirez</p>
