<h1>Lupin III vs. Detective Conan: La película</h1>
<p>Un valioso diamante es robado y posteriormente abandonado en la cubeta de un pescador… Un acto tan temerario y desinteresado sólo puede llevar la firma de Lupin III, el encantador ladrón de guante blanco que disfruta ridiculizando a la policía. Mientras tanto, un popular cantante italiano recibe una amenaza de muerte y el único capaz de llegar al fondo del misterio es Conan Edogawa, el detective infalible atrapado en el cuerpo de un niño. Cuando ambas historias se entrelazan, Lupin III, el ladrón más astuto del mundo, y Conan Edogawa, el detective más brillante, se ven las caras en un desafío predestinado sólo para descubrir que tienen en común más de lo que se imaginan… Pero, ¿Quién está un paso por delante de quién y quién saldrá victorioso del juego?</p>
<p><strong>Director:</strong> 亀垣一 · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Acción, Animación, Suspense</p>
