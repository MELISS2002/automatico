<h1>Un hombre lobo entre nosotros</h1>
<p>Cuando un oleoducto propuesto crea hostilidades entre los residentes de una pequeña ciudad, un guardabosques recién llegado debe mantener la paz después de que una tormenta de nieve confina a la gente del pueblo en un antiguo albergue. Pero cuando una criatura misteriosa comienza a aterrorizar al grupo, sus peores tendencias y prejuicios salen a la superficie, y el guardabosques debe mantener con vida a los residentes, tanto entre ellos como con el monstruo que los atormenta.</p>
<p><strong>Director:</strong> Lenny Payan · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Comedia, Terror</p>
