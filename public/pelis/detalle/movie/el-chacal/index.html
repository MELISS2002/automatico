<h1>El Chacal</h1>
<p>A un asesino sin escrúpulos, conocido por el pseudónimo de «Chacal», lo contrata un jefe de la mafia rusa para que elimine a un alto mandatario del gobierno de los Estados Unidos como represalia por la muerte de su hermano. El director del FBI se enfrenta al reto más grande de su carrera: con la ayuda de Valentina Koslova, una agente de la inteligencia rusa, tendrá que localizar al «Chacal» y echar por tierra sus planes. Pero, para ello, necesita la colaboración de alguien que piense como él: Declan, un antiguo activista del IRA.</p>
<p><strong>Director:</strong> Michael Caton-Jones · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Bruce Willis, Richard Gere, Sidney Poitier, Diane Venora, J.K. Simmons, Mathilda May</p>
