<h1>Maquia, una historia de amor eterno</h1>
<p>Maquia pertenece a un grupo de gente que deja de envejecer en la adolescencia. Aunque vive tranquila, se siente sola. Esa tranquilidad se rompe cuando un ejército les invade para buscar el secreto de la inmortalidad. Maquia escapa, pero pierde a sus amigos y su hogar. En el bosque conocerá a Ariel, un pequeño que ha perdido a sus padres. La historia desarrolla la relación entre Maquia, que no envejece, y Ariel, que sí.</p>
<p><strong>Director:</strong> 篠原俊哉 · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Animación, Drama, Fantasía</p>
<p><strong>Reparto:</strong> Manaka Iwami, 入野自由, 櫻井優輝, 茅野愛衣, 梶裕貴, 細谷佳正</p>
