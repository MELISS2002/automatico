<h1>Barbie en una Aventura de Sirenas</h1>
<p>Barbie hace el papel de Merliah, una campeona de surf de Malibú. Merliah es una adolescente normal hasta que un día conoce un gran secreto familiar: ¡es una sirena! Merliah y su inseparable delfín Zuma planean una aventura acuática para rescatar a su madre, la reina de Oceana. Con la ayuda de sus nuevas amigas sirenas, Merliah salva al mundo marino. Al final descubre que aquello que te hace diferente puede convertirse en tu mayor fortaleza.</p>
<p><strong>Director:</strong> Adam Wood · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Animación, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Kelly Sheridan, Kathleen Barr, Tabitha St. Germain, Peter Mel, Nakia Burrise, Maryke Hendrikse</p>
