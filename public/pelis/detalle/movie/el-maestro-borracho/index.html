<h1>El Maestro Borracho</h1>
<p>La trama se centra en un joven y travieso Wong Fei Hung (a veces denominado como «Freddie Wong»). Wong se mete en una serie de problemas. En primer lugar, le enseña un abusivo maestro asistente de artes marciales una lección después que este humillara a un pobre campesino y lo estafara. Después, molesta a una mujer para impresionar a sus amigos y sólidamente es azotado por su tutora mayor como resultado; su vergüenza se agrava cuando estas dos se revelan más tarde como su tía y su prima de visita, a quienes no había conocido antes. Por último, él vence a un gamberro que es el hijo de un hombre influyente en la ciudad. Su padre decide castigarlo por su comportamiento haciéndolo a entrenar más difícil en las artes marciales.</p>
<p><strong>Director:</strong> 袁和平 · <strong>Año:</strong> 1978 · <strong>Géneros:</strong> Acción, Comedia</p>
<p><strong>Reparto:</strong> Jackie Chan, 袁小田, 황정리, 石天, 徐蝦, Linda Lin Ying</p>
