<h1>Sé lo que hicieron el verano pasado</h1>
<p>Cuando cinco amigos provocan sin querer un accidente de coche mortal, encubren su implicación y hacen un pacto para mantenerlo en secreto en lugar de afrontar las consecuencias. Un año después, su pasado vuelve para atormentarlos y se ven obligados a enfrentarse a una aterradora verdad: alguien sabe lo que hicieron el último verano&amp;#8230; y está empeñado en vengarse. A medida que los amigos son acechados uno a uno por un asesino, descubren que esto ya ha sucedido antes, y recurren a dos supervivientes de la legendaria Masacre de Southport de 1997 en busca de ayuda.</p>
<p><strong>Director:</strong> Jennifer Kaytin Robinson · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Misterio, Suspense, Terror</p>
<p><strong>Reparto:</strong> Chase Sui Wonders, Madelyn Cline, Sarah Pidgeon, Jennifer Love Hewitt, Freddie Prinze Jr., Jonah Hauer-King</p>
