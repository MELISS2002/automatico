<h1>American Pie 2: Tu Segunda Vez Es Mejor</h1>
<p>Los protagonistas masculinos de la primera entrega, entonces obsesionados por perder la virginidad, se reencuentran en su pueblo natal tras su primer año en la universidad. Ha pasado un año, y Jim, Oz, Kevin y Finch deciden para pasar juntos el verano. Para poder tener independencia y perseguir mujeres, como tradicionalmente acostumbran, aunque sin éxito, deciden alquilar una casa en la playa. Como el alquiler es algo caro deciden invitar también a Stifler, quien además de tener mucho dinero, supuestamente sabe mucho de mujeres, aunque su personalidad es detestable.</p>
<p><strong>Director:</strong> J.B. Rogers · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Jason Biggs, Thomas Ian Nicholas, Chris Klein, Seann William Scott, Eddie Kaye Thomas, Alyson Hannigan</p>
