<h1>Yo, Tonya</h1>
<p>Década de los años 90. Tonya Harding es una prometedora patinadora artística estadounidense, la segunda en la historia capaz de completar en competición un salto de triple axel. Claro que, Tonya también se hizo famosa por uno de los escándalos más sensacionales en la historia del deporte. En 1994 su principal rival para los Juegos Olímpicos de Lillehammer era su compatriota Nancy Kerrigan. Poco antes del inicio de la competición, Kerrigan sufrió un infame ataque por un matón a sueldo, que intentó romperle la rodilla. La sombra de la sospecha recae entonces sobre el entorno de Tonya, desde su ex marido Jeff Gillooly hasta su guardaespaldas, Shawn Eckhardt. El matrimonio se verá entonces envuelto en problemas legales y fue así como comenzó la decadencia de la carrera de Harding.</p>
<p><strong>Director:</strong> Craig Gillespie · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Margot Robbie, Sebastian Stan, Allison Janney, Julianne Nicholson, Paul Walter Hauser, Bobby Cannavale</p>
