<h1>La era de hielo: La gran búsqueda de pascua</h1>
<p>Una madre-ave prehistórica acosada le confía a Sid su precioso huevo que pronto eclosionará. Cuando Ella lo recomienda a sus vecinos, el negocio crece con su nuevo servicio de &amp;#8216;cuidador de huevos&#x27;. Sin embargo, el cobarde conejito pirata, Squint, que busca vengarse de la manada, roba, camufla y esconde todos los huevos. Una vez más, con la ayuda del hermano gemelo de Squint, Manny, Diego y el resto de la pandilla vienen al rescate y emprenden una atrevida misión que se convierte en la primera búsqueda de huevos de Pascua del mundo.</p>
<p><strong>Director:</strong> Ricardo Curtis · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Animación, Comedia, Familia, Película de TV</p>
<p><strong>Reparto:</strong> Ray Romano, John Leguizamo, Denis Leary, Taraji P. Henson, Queen Latifah, Gabriel Iglesias</p>
