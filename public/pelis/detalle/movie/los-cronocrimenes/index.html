<h1>Los cronocrímenes</h1>
<p>Un hombre descubre a través de sus prismáticos a una preciosa joven e intenta encontrarla en la profundidad del bosque. De repente, un individuo armado con unas tijeras y con la cara cubierta por vendas rosas le ataca por la espalda. Consigue huir y alcanza un complejo científico en mitad del bosque. Allí, una máquina lo transporta al pasado, poco más de una hora. Encontrarse consigo mismo será la primera de una serie de catástrofes de consecuencias imprevisibles.</p>
<p><strong>Director:</strong> Nacho Vigalondo · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Karra Elejalde, Candela Fernández, Bárbara Goenaga, Nacho Vigalondo, Juan Inciarte, Libby Brien</p>
