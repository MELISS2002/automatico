<h1>Volviendo a Casa 2: Perdidos en San Francisco</h1>
<p>Tres años después de su viaje por bosques y montañas, las tres mascotas de «Bienvenido a Casa» vuelven vivir una nueva aventura: la familia, que vive en San Francisco, ha decidido irse de vacaciones a Canadá. El problema es que las mascotas se escapan del aeropuerto y pierden el vuelo. Chance, el bulldog vitalista, Sassy, la gata mimosa, y el cariñoso Shadow se encuentran perdidos en la gran ciudad y, para llegar a su hogar, tendrán que superar grandes peligros.</p>
<p><strong>Director:</strong> David R. Ellis · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Aventura, Comedia, Drama, Familia</p>
<p><strong>Reparto:</strong> Michael J. Fox, Sally Field, Ralph Waite, Robert Hays, Kim Greist, Michael Bell</p>
