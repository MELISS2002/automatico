<h1>Escala Obligada</h1>
<p>Brutal y picante, Vacaciones inesperadas es la comedia del año. Meg (Kate Upton - ¡Mujeres al ataque!), soltera y sin trabajo, y Kate (Alexandra Daddario &amp;#8212; Baywatch, Terremoto: La Falla de San Andrés) están pasando por un mal momento. Desesperadas por escaparse, reservan un vuelo de último momento, pero sus planes para descansar y relajarse se desbaratan cuando una tormenta hace que su vuelo se desvíe a St. Louis. Atrapadas en un hotel aburrido mientras esperan que la tormenta se despeje, para divertirse, se hacen amigas de un pasajero, Ryan, un bombero rubio y alto. De repente, las vacaciones se convierten en una competencia despiadada por su atención. El vuelo se canceló, ¡pero la batalla recién empieza!</p>
<p><strong>Director:</strong> William H. Macy · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Comedia, Romance</p>
