<p>Aladin y Jazmin viven felices en el palacio real, rodeados de lujos y de la magia del genio. Pero, muy lejos de allí, algo se remueve en las arenas del desierto: Yago, el loro dentudo de Jafar, ha logrado escapar de la lámpara que los mantenía presos a ambos. Tras traicionar a su amo, Yago decide vivir una nueva vida en donde él es el jefe. Pero Jafar esconde más de un as en la manga&amp;#8230;</p>
<p><strong>Director:</strong> Tad Stones · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Animación, Aventura, Familia, Romance</p>
