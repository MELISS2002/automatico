<h1>La Balada de Buster Scruggs</h1>
<p>Una película de antología compuesta por seis historias, cada una de ellas sobre un aspecto diferente de la vida en el Viejo Oeste. Seis caminos que tejen las historias en el viejo Oeste al final de la Guerra Civil. Siguiendo los relatos de un cantor de filo, un aspirante a ladrón de bancos, dos artistas que viajan cansados, un buscador de oro solitario, una mujer que viaja a Occidente hacia un futuro incierto, y un equipo variopinto de extraños que realizan un viaje en carruaje.</p>
<p><strong>Director:</strong> Betsy Magruder · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Comedia, Drama, Western</p>
<p><strong>Reparto:</strong> Tim Blake Nelson, Willie Watson, Clancy Brown, Danny McCarthy, David Krumholtz, Thomas Wingate</p>
