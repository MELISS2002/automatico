<h1>Viaje al centro de la Tierra</h1>
<p>Una mañana, el profesor Lindenbrook recibe en su clase de manos de su alumno Alec una muestra de roca volcánica, en cuyo interior se encuentra una misteriosa indicación del antiguo científico Arne Saknussemm de cómo llegar al centro de la Tierra. El profesor decide entonces iniciar dicho viaje de exploración científica, solicitándole a Alec que le acompañe. Al viaje, guiado por el islandés Hans, se une la viuda de un eminente profesor sueco, Carla Goetabaug. Los cuatro personajes vivirán, a partir de entonces, sorprendentes y peligrosas aventuras en su viaje al centro de la Tierra…</p>
<p><strong>Director:</strong> Henry Levin · <strong>Año:</strong> 1959 · <strong>Géneros:</strong> Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> James Mason, Arlene Dahl, Pat Boone, Peter Ronson, Thayer David, Diane Baker</p>
