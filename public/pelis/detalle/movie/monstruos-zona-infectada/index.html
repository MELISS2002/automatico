<h1>Monstruos: Zona Infectada</h1>
<p>Hace seis años la NASA descubrió la posibilidad de vida extraterrestre dentro de nuestro sistema solar. Se lanzó una sonda para recolectar muestras, pero se estrelló al reingresar sobre América Central. Poco después, comenzaron a aparecer nuevas formas de vida y la mitad de México fue puesta en cuarentena como una zona infectada. Hoy en día, los militares estadounidenses y mexicanos todavía luchan por contener a «las criaturas», mientras que un periodista acepta escoltar a un turista sacudido a través de la zona infectada en México hasta la seguridad de la frontera de los EE.</p>
<p><strong>Director:</strong> Gareth Edwards · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Ciencia ficción, Drama, Suspense</p>
<p><strong>Reparto:</strong> Scoot McNairy, Whitney Able, Mario Zuniga Benavides, Annalee Jefferies, Justin Hall, Ricky Catter</p>
