<h1>Marabunta</h1>
<p>A lo largo de los años, Christopher Leiningen ha conseguido tirar adelante una próspera plantación de café en la jungla sudamericana. Para tener un hijo que herede sus propiedades, decide casarse por correspondencia. Su esposa resulta ser la bella Joanna Leiningen, a quien le costará adaptarse a la rudeza de su marido y al aislamiento del entorno. Por si fuera poco, una plaga de voraces hormigas amenaza con arrasar la plantación.</p>
<p><strong>Director:</strong> Byron Haskin · <strong>Año:</strong> 1954 · <strong>Géneros:</strong> Aventura, Drama, Romance</p>
<p><strong>Reparto:</strong> Eleanor Parker, Charlton Heston, Abraham Sofaer, William Conrad, Romo Vincent, Douglas Fowley</p>
