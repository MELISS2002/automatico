<h1>Regreso a Cold Mountain</h1>
<p>Adaptación de una novela de Charles Frazier. A punto de terminar la Guerra Civil americana (1861-1865), Inman (Jude Law), un soldado confederado herido, vive una auténtica odisea para regresar a su casa en Cold Mountain (Carolina del Norte) y reunirse con su prometida Ada (Nicole Kidman), que lleva años esperándolo. En su ausencia, Ada tiene que afrontar enormes dificultades para sobrevivir, pero consigue sacar adelante la granja de su padre con la ayuda de Ruby (Zellwegger), una intrépida y voluntariosa joven.</p>
<p><strong>Director:</strong> Anthony Minghella · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Aventura, Bélica, Historia, Romance</p>
<p><strong>Reparto:</strong> Jude Law, Nicole Kidman, Renée Zellweger, Eileen Atkins, Brendan Gleeson, Philip Seymour Hoffman</p>
