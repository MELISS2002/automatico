<article>
<h1>Batman: La Broma Mortal</h1>
<p>¿Qué se necesita para desquiciar una persona? ¿Cuánta desesperación quebranta una mente? Estas son las malévolas preguntas que el Joker se ha propuesto a responder, para demostrar a la Ciudad Gótica que hasta un hombre ordinario como el comisionado Gordon está a solo un mal día de la completa locura. Con base en la aclamada novela gráfica de DC Comics, sea testigo de un viaje dentro de la psique del Príncipe Payaso del Crimen. Siga sus humildes comienzos como un cómic que lucha hasta su fatídico encuentro con el Caballero de la Noche que lo cambió todo. Impulsado por el regreso de Kevin Conroy como Batman y Mark Hamill como el Joker, sea testigo del nacimiento de un súper villano, la fortaleza de un héroe y la frase clave que le quitará el habla.</p>
<p><strong>Director:</strong> Sam Liu · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Animación, Crimen, Drama</p>
<p><strong>Reparto:</strong> Kevin Conroy, Mark Hamill, Tara Strong, Ray Wise, John DiMaggio, Robin Atkin Downes</p>
