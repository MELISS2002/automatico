<h1>Supercan</h1>
<p>Basada en la serie clásica de dibujos animados “Underdog”. Tras un accidente en el misterioso laboratorio del científico chiflado, el Dr. Simon Barsinister (Peter Dinklage), un perro de raza beagle descubre de repente que tiene unos poderes inimaginables además de la capacidad de hablar. Ataviado con un traje de superhéroe, Superdog (voz original de Jason Lee) jura proteger a los atormentados ciudadanos de Capitol City y, en especial, a una bonita spaniel llamada Polly Purebread (voz de Amy Adams). Cuando un siniestro plan de Barsinister y su secuaz Cad (Patrick Warburton) amenaza con destruir Capitol City, sólo Superdog puede arreglar las cosas&amp;#8230;</p>
<p><strong>Director:</strong> Frederik Du Chau · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Jason Lee, Peter Dinklage, Jim Belushi, Patrick Warburton, Alex Neuberger, Taylor Momsen</p>
