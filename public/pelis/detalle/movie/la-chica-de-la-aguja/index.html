<h1>La chica de la aguja</h1>
<p>Karoline, una joven trabajadora de una fábrica, lucha por sobrevivir en la Copenhague posterior a la Primera Guerra Mundial. Cuando es despedida, abandonada en la calle y estando embarazada, conoce a Dagmar, una carismática mujer que dirige una agencia de adopción clandestina y ayuda a las madres a encontrar hogares de acogida para sus hijos no deseados. Sin ningún otro sitio al que acudir, Karoline asume el papel de nodriza. Se crea una fuerte conexión entre las dos mujeres, pero el mundo de Karoline se desmorona cuando descubre lo que se oculta tras su trabajo.</p>
<p><strong>Director:</strong> Magnus von Horn · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Vic Carmen Sonne, Trine Dyrholm, Besir Zeciri, Joachim Fjelstrup, Tessa Hoder, Ava Knox Martin</p>
