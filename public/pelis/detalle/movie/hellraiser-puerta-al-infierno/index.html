<h1>Hellraiser: Puerta al infierno</h1>
<p>Frank Cotton tiene en su poder un enigmático cubo dotado de poderes extraordinarios. Según antiguas leyendas, es una especie de puerta a seres de otra dimensión que pueden proporcionar placeres sensuales inimaginables. Cotton convoca a estas criaturas, pero sólo le inflingirán tormentos y dolor hasta acabar con él. 20 años después, dos nuevos inquilinos se instalan en la antigua casa de Frank: su hermano y su esposa. La aparición del espíritu de Frank es el principio de una vorágine de horror en estado puro.</p>
<p><strong>Director:</strong> Clive Barker · <strong>Año:</strong> 1987 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Andrew Robinson, Clare Higgins, Sean Chapman, Robert Hines, Ashley Laurence, Oliver Smith</p>
