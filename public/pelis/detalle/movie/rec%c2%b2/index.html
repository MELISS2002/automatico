<h1>[REC]²</h1>
<p>Quince minutos después del final de la primera parte, un grupo de policías entran en el edificio acompañados por un doctor con tal de conseguir la sangre de los infectados, en especial la de la infectada inicial que habitaba el ático, para encontrar una cura. A su vez, tres adolescentes, un bombero y un antiguo inquilino entran por el alcantarillado. Lo que ninguno sabe es que van a pasar el peor momento de su vida en cuanto se crucen con los infectados.</p>
<p><strong>Director:</strong> Paco Plaza · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Manuela Velasco, Jonathan D. Mellor, Óscar Zafra, Ariel Casas, Alejandro Casaseca, Pablo Rosso</p>
