<h1>Ni en tus sueños</h1>
<p>Kirk (Jay Baruchel, «Tropic Thunder») es un tipo normal y corriente, que no suele tener éxito con la chicas, que se queda sorprendido cuando un día una chica despampanante muestra interés en él. Kirk no puede creer en la suerte que está teniendo. A pesar de que está estancado en un trabajo sin futuro como guadia de seguridad del aeropuerto, contra todo pronóstico, Molly (Alice Eve), una chica con éxito y escandalosamente guapa, se enamora de él. Kirk está aturdido. También lo están sus amigos, su familia y hasta su ex-novia. Ahora tiene que encontrar la manera de hacer que la relación funcione, a pesar de que él es el primero en admitir que ella está totalmente «fuera de su liga».</p>
<p><strong>Director:</strong> Jim Field Smith · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Jay Baruchel, Alice Eve, T.J. Miller, Nate Torrence, Mike Vogel, Lindsay Sloane</p>
