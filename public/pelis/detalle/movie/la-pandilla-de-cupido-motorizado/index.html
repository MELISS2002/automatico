<h1>La pandilla de cupido motorizado</h1>
<p>Un promotor inmobiliario ha comprado varios bloques en el centro de la ciudad para construir una alameda gigantesca. El único obstáculo lo representa una anciana viuda que no esta dispuesta a vender su vivienda. El promotor entonces recurre a toda clase de artimañas para conseguirlo. pero la viuda cuenta con la ayuda de Herbie, el Volkswagen fantástico.</p>
<p><strong>Director:</strong> Robert Stevenson · <strong>Año:</strong> 1974 · <strong>Géneros:</strong> Comedia, Familia, Fantasía, Romance</p>
