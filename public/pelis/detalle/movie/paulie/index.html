<h1>Paulie</h1>
<p>Paulie, un loro inteligente que realmente habla, relaciona la historia de su lucha por un inmigrante ruso que trabaja como un portero en el instituto de investigación donde se aloja y se descuida. La historia de Paulie comienza muchos años antes cuando le dan como un regalo a una niña que tartamudea. Finalmente, enseña a la muchacha hablar correctamente, pero es llevado por su padre porque cree que la muchacha no puede distinguir la fantasía de la realidad porque cree que la ave puede hablar. Paulie pasa por una serie de aventuras con un dueño del monte de piedad, una viuda envejecida, un trovador mexicano-americano y ser el ladrón antes de tomarse al instituto donde ahora vive.</p>
<p><strong>Director:</strong> John Roberts · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Aventura, Comedia, Drama, Familia</p>
<p><strong>Reparto:</strong> Gena Rowlands, Tony Shalhoub, Cheech Marin, Bruce Davison, Trini Alvarado, Jay Mohr</p>
