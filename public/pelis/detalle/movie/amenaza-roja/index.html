<p>Cuando las tropas norcoreanas invaden suelo estadounidense para apoderarse de la ciudad de Spokane, un veterano de la guerra de Irak que acaba de regresar y un grupo de jóvenes huyen al bosque y forman una banda de luchadores por la libertad. Se hacen llamar los Wolverines, e inician unos ataques guerrilleros en contra de los invasores, ¿pero cuánto tiempo podrán mantener la pelea frente a un gran número de enemigos muy bien armados?. Remake de la película homónima dirigida en 1984 por John Milius, con Patrick Swayze en el papel principal.</p>
<p><strong>Director:</strong> Dan Bradley · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Acción, Suspense</p>
