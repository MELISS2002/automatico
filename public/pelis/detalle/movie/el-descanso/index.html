<h1>El descanso</h1>
<p>Amanda Woods, una chica americana que posee una próspera agencia de publicidad especializada en trailers de películas, vive en el sur de California y acaba de romper con su novio. Por su parte, Iris Simpkins, redactora de la popular columna de bodas para el London Daily Telegraph, vive en una encantadora casa de campo en Inglaterra y sus relaciones con los hombres tampoco son fáciles. A través de internet llegan a un acuerdo para intercambiarse sus respectivas viviendas durante las Navidades.</p>
<p><strong>Director:</strong> Nancy Meyers · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Comedia, Romance</p>
