<h1>Magnolia</h1>
<p>La película trata de nueve vidas qué muestran la verdadera cara, la de los sentimientos, todas diferentes pero que tienen en común que todos reconocen lo que sienten en el fondo. Lo interesante de la película es cómo se entretejen las distintas historias que parecen inconexas, y cómo lo relaciona con las supuestas casualidades de la vida. Las historias son trágicas y el mismo director reconoció la influencia decisiva que tuvo en esta película Short Cuts, de Robert Altman.</p>
<p><strong>Director:</strong> Paul Thomas Anderson · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Tom Cruise, Philip Baker Hall, Philip Seymour Hoffman, Julianne Moore, William H. Macy, John C. Reilly</p>
