<p>Charles Brady y su madre, Mary, son los últimos de una raza mortal cuyas necesidades no pertenecen a este mundo. Son sonámbulos, capaces de permanecer vivos a costa de alimentarse con la fuerza vital de jóvenes vírgenes. Capaces de cambiar su aspecto físico, están destinados a vagar por la tierra escapando de ser descubiertos y siempre en busca de su próxima víctima.</p>
