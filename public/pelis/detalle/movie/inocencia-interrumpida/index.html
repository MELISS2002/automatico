<h1>Inocencia interrumpida</h1>
<p>Año 1967. Susanna Kaysen, de 17 años, es como la mayoría de las chicas americanas de su edad: está confusa, se siente insegura y lucha por entender el mundo que la rodea. Su psiquiatra decide ingresarla en el Hospital Claymoore, diagnosticándole un trastorno de la personalidad, que se manifiesta a través de una gran inseguridad respecto a la propia imagen, a los objetivos a largo plazo y a los amigos. En el centro Susanna conoce a Lisa, Georgina, Polly y Janet, un grupo de chicas inadaptadas con las que entabla una estrecha amistad y que, además, le muestran el camino para encontrarse a sí misma.</p>
