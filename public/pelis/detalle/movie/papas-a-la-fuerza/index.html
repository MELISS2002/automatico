<h1>Papás a la fuerza</h1>
<p>Dan (Robin Williams) es un padre divorciado que tiene que hacerse cargo de sus gemelos de siete años y que intentará salir airoso de la prueba gracias a la ayuda de Charlie (John Travolta), un amigo soltero. Al mismo tiempo, la empresa en la que ambos trabajan tiene que firmar un importante acuerdo con una poderosa empresa japonesa. Menos mal que también contarán con la inestimable ayuda de Jimmy Lunchbox (Bernie Mac), un amigo suyo que conoce todos los trucos para entretener a los niños.</p>
<p><strong>Director:</strong> Walt Becker · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Comedia, Familia</p>
<p><strong>Reparto:</strong> John Travolta, Robin Williams, Kelly Preston, Conner Rayburn, Ella Bleu Travolta, Lori Loughlin</p>
