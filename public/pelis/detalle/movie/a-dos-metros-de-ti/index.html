<h1>A Dos Metros de Ti</h1>
<p>Will y Stella son dos adolescentes que padecen fibrosis quística y están ingresados en el hospital para tratarse. Aunque ambos tratan de refugiarse en su propio mundo, de forma inevitable acaban enamorándose. La pareja deberá luchar para mantener viva su relación, con una única regla: separarse con una distancia de alrededor de dos metros para evitar que ambos se puedan contagiar. Sin embargo, la vida de ambos estará en peligro.</p>
<p><strong>Director:</strong> Chelsea Donison · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Haley Lu Richardson, Cole Sprouse, Moisés Arias, Kimberly Hébert Gregory, Parminder Nagra, Claire Forlani</p>
