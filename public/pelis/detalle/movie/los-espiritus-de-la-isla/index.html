<h1>Los espíritus de la isla</h1>
<p>Ambientada en una isla remota frente a la costa oeste de Irlanda, ‘Almas en pena de Inisherin’ cuenta la historia de dos amigos de toda la vida, Pádraic y Colm, quienes se encuentran en un callejón sin salida cuando Colm pone fin a su amistad de un modo abrupto. Un Pádraic atónito, ayudado por su hermana Siobhán y por Dominic (un joven con problemas), se esfuerza por reconstruir la relación, negándose a aceptar las negativas de su amigo de siempre. Cuando Colm le plantea a Pádraic un ultimátum desesperado, los acontecimientos se precipitan y provocan consecuencias traumáticas.</p>
<p><strong>Director:</strong> Peter Kohn · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Colin Farrell, Brendan Gleeson, Kerry Condon, Barry Keoghan, Gary Lydon, Pat Shortt</p>
