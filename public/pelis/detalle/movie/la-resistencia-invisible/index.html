<h1>La resistencia invisible</h1>
<p>La impactante historia real de Michał Podchlebnik y Solomon Weiner, dos prisioneros que se convirtieron en los primeros en escapar del campo de exterminio de Chełmno en enero de 1942, y que valientemente dieron testimonio de los horrores perpetrados por el régimen alemán. De los más de 320.000 judíos enviados a Chełmno, solo sobrevivieron cuatro: dos de ellos fueron Weiner y Podchlebnik, que lo arriesgaron todo para sacar a la luz la verdad. Situado cerca de Łódź, Chełmno fue uno de los seis campos de exterminio creados exclusivamente para el asesinato en masa durante la Segunda Guerra Mundial.</p>
<p><strong>Director:</strong> Lior Geller · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> Oliver Jackson-Cohen, Jeremy Neumark Jones, Charlie MacGechan, Michael Epp, David Kross, Michael Fox</p>
