<h1>Los Ríos de Color Púrpura 2: Los ángeles del apocalípsis</h1>
<p>Para Niemans el hombre que encontraron emparedado en un monasterio de Lorena no es una víctima cualquiera. Las marcas esotéricas grabadas a su alrededor y el extraño rito de su sacrificio hacen pensar en algo muy distinto… Paralelamente, en la zona se van multiplicando los asesinatos. En todos los casos unos misteriosos monjes dotados de una fuerza sobrenatural eliminan de manera espectacular a una serie de desconocidos y luego desaparecen sin dejar rastro. ¿Quiénes son estos ángeles del apocalipsis que van sembrando el terror? ¿Qué relación tienen con las profecías de las sagradas escrituras? Niemans y Reda (Benoît Magimel) no entienden nada, hasta que se dan cuenta de que todas las víctimas tienen el mismo nombre y la misma profesión que los apóstoles.</p>
<p><strong>Director:</strong> Olivier Dahan · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Jean Reno, Benoît Magimel, Camille Natta, Christopher Lee, Johnny Hallyday, Gabrielle Lazure</p>
