<h1>Godzilla vs. Mechagodzilla</h1>
<p>Una profecía ancestral de Okinawa predice que un monstruo aparecerá a destruir el mundo pero será detenido por dos criaturas colosales. El hallazgo de una estatua en las cavernas de Okinawa indican que se trata de la llave para llamar a King Caesar, el guardián de la zona, y el único que puede detener la oleada de destrucción provocada por el recientemente aparecido Godzilla. Las señales de la profecía parecen cumplirse, pero un grupo de científicos comienza a descubrir pistas que indican que nada es lo que parece. Y ello se confirma cuando el verdadero Godzilla aparece en escena, desintegrando el camuflaje de la criatura que destruye las ciudades, y revelando ser un sosías robótico. Es MechaGodzilla, un ser cibernético construido por la raza alienígena del tercer planeta del Agujero Negro, que ha llegado a la Tierra con pretensiones de invadirla.</p>
<p><strong>Director:</strong> 福田純 · <strong>Año:</strong> 1974 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción</p>
<p><strong>Reparto:</strong> 大門正明, Kazuya Aoyama, 田島令子, 平田昭彦, 小泉博, 今福将雄</p>
