<h1>El Conde de Montecristo</h1>
<p>El honrado e inocente Edmond Dantes (Jim Caviezel) es traicionado por su mejor amigo (Guy Pearce) y encerrado de por vida en las mazmorras de la fortaleza de la isla de If. Con el paso de los años va cambiando y elabora los más despiadados planes de venganza. Tras una milagrosa fuga, Edmond se convierte en el misterioso y acaudalado Conde de Montecristo, y se introduce en los círculos de la nobleza francesa para llevar a cabo sus proyectos.</p>
<p><strong>Director:</strong> Kevin Reynolds · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Acción, Aventura, Drama, Historia, Suspense</p>
