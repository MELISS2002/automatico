<h1>Pesadilla en la calle del infierno 2</h1>
<p>Una nueva familia se ha trasladado a Elm Street, a una casa que llevaba un buen tiempo deshabitada. Pasado poco tiempo allí, los jóvenes comienzan a tener extrañas pesadillas, tal y como ocurriese años atrás. Uno de ellos consigue darse cuenta de que Freddy intenta poseerle desde el mundo de los sueños, para pasar su obra al mundo real. Aunque intenta resistirse, no puede evitar que el asesino le obligue a realizar terribles acciones. Sólo la novia del joven puede hacer algo por salvar a su compañero, y acabar con Krueger.</p>
<p><strong>Director:</strong> Jack Sholder · <strong>Año:</strong> 1985 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Robert Englund, Mark Patton, Kim Myers, Robert Rusler, Clu Gulager, Hope Lange</p>
