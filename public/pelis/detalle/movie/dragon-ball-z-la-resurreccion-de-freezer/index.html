<h1>Dragon Ball Z: La Resurrección de Freezer</h1>
<p>Después de que Bills, el Dios de la destrucción, decidiera no destruir la Tierra, se vive una gran época de paz. Hasta que Sorbet y Tagoma, antiguos miembros élite de la armada de Freezer, llegan a la Tierra con el objetivo de revivir a su líder por medio de las Bolas de Dragón. Su deseo es concedido y ahora Freezer planea su venganza en contra de los Saiyajin. La historia hace que una gran oleada de hombres bajo el mando de Freezer lo acompañe.</p>
<p><strong>Director:</strong> Yasunori Goto · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Acción, Animación, Ciencia ficción</p>
