<h1>La caja azul</h1>
<p>Pablo, un joven millonario solitario que vive en la Patagonia, sigue perseguido por un trágico accidente automovilístico que le cambió la vida. Su rutina aislada comienza a cambiar cuando conoce a Lara a través de una aplicación de citas centrada en una premisa peculiar: el intercambio de un objeto misterioso conocido como «la caja azul». A medida que su conexión se profundiza, Lara saca gradualmente a Pablo de su soledad autoimpuesta. Sin embargo, una advertencia anónima pronto plantea interrogantes inquietantes sobre su identidad y sus verdaderas intenciones. Lo que comienza como una relación íntima se convierte rápidamente en un tenso juego psicológico de manipulación y sospecha</p>
<p><strong>Director:</strong> Martín Hodara · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Romance, Suspense</p>
