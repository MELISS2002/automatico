<h1>Amor Redentor</h1>
<p>Situada en la Nueva Inglaterra de 1835, la trama sigue la historia de Angela, una pequeña que fue rechazada por su padre debido a que fue producto de una aventura adultera con su madre Mae. Desde entonces, la chica se sintió culpable de la depresión de su madre y de su propio abandono, creciendo con un evidente odio hacia los hombres, todos ellos obsesionados por la fiebre de oro de la época. En su adolescencia, Angela tuvo que venderse a la prostitución para tener un lugar donde dormir y en medio de ese odio, conoce a Michael Hosea, un hombre piadoso que parece cruzar su camino con Angela para conducirla al amor redentor de Dios, desafiando, día a día, las amargas expectativas y resistencia de ella, quien no parece creer que merece algo más en la vida, algo que pueda hacerla verdaderamente feliz.</p>
<p><strong>Director:</strong> D.J. Caruso · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Drama, Romance, Western</p>
<p><strong>Reparto:</strong> Abigail Cowen, Tom Lewis, Eric Dane, Famke Janssen, Logan Marshall-Green, Nina Dobrev</p>
