<h1>Noche larga y febril</h1>
<p>Tras ser expulsado de una población acusado de haber provocado un incendio, Ben Quick llega a un pueblo y es contratado por Will Varner, dueño y señor del lugar. Melodrama sureño, basado en relatos de William Faulkner, que permitió a un jovencísimo Paul Newman demostrar que era mucho más que una cara bonita. En efecto, gracias a este papel consiguió ganar el prestigioso premio al mejor actor en el Festival de Cannes.</p>
<p><strong>Director:</strong> Martin Ritt · <strong>Año:</strong> 1958 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Paul Newman, Joanne Woodward, Anthony Franciosa, Orson Welles, Lee Remick, Angela Lansbury</p>
