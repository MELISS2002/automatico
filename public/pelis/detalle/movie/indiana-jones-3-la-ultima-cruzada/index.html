<h1>Indiana Jones 3: La Última Cruzada</h1>
<p>En 1938, Indiana Jones es contratado por el empresario estadounidense Walter Donovan para encontrar el Santo Grial. Para su nueva misión, Indiana recibe la ayuda de la doctora Elsa Schneider, poco antes de enterarse de que su padre desapareció sin dejar rastro alguno. Para su sorpresa, Donovan y Elsa están relacionados con los nazis, y han sido ellos quienes han secuestrado al padre de Jones para obtener información acerca de la localización del Grial. Indiana recupera el diario privado de su padre, que contiene valiosa información sobre el cáliz sagrado, y consigue rescatar a este antes de conocer la ubicación de dicho objeto. Tras encontrarlo, Donovan y Elsa se lo arrebatan, en un intento por conseguir la inmortalidad, pero mueren en el acto por razones diferentes. Al final, Indiana y su padre se percatan de que su relación familiar es más importante que la búsqueda de la reliquia, y el Grial termina desapareciendo junto con el templo en el que se hallaba&amp;#8230;</p>
<p><strong>Director:</strong> Steven Spielberg · <strong>Año:</strong> 1989 · <strong>Géneros:</strong> Acción, Aventura</p>
<p><strong>Reparto:</strong> Harrison Ford, Sean Connery, Denholm Elliott, Alison Doody, John Rhys-Davies, Julian Glover</p>
