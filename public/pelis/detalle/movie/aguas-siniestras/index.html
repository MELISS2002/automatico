<h1>Aguas siniestras</h1>
<p>Ray Waller es un ex jugador de béisbol de las grandes ligas obligado a jubilarse anticipadamente por una enfermedad degenerativa. Se muda a una nueva casa con su preocupada esposa Eve y sus dos hijos. Con la esperanza secreta, contra todo pronóstico, de volver al béisbol profesional, Ray convence a Eve de que la resplandeciente piscina del patio trasero de la nueva casa será divertida para los niños y le brindará fisioterapia. Pero un oscuro secreto en el pasado del hogar desatará una fuerza malévola que arrastrará a la familia a las profundidades de un terror ineludible.</p>
