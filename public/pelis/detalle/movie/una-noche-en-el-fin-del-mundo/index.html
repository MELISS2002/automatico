<h1>Una Noche en el Fin del Mundo</h1>
<p>Cinco amigos de la infancia se reúnen después de 20 años porque uno de ellos está empeñado en volver a probar suerte en un maratón alcohólico que nunca pudieron llegar a completar. Gary King, un cuarentón que todavía no ha conseguido superar la adolescencia, convence a sus cuatro reacios amigos y los arrastra a su pueblo natal en un desesperado intento por llegar al famoso pub “The World’s End”. Pero mientras intentan reconciliar el presente con el pasado, empiezan a darse cuenta de que la auténtica lucha debe librarse por el futuro, y no solo el suyo, sino el de toda la humanidad. Llegar al pub “The World’s End” es ahora el último de sus problemas.</p>
<p><strong>Director:</strong> Edgar Wright · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Acción, Ciencia ficción, Comedia</p>
<p><strong>Reparto:</strong> Simon Pegg, Nick Frost, Paddy Considine, Martin Freeman, Eddie Marsan, Rosamund Pike</p>
