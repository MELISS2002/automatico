<h1>Un perro de otro mundo</h1>
<p>Owen Baker es un solitario jovencito de doce años de edad que ha estado trabajando como paseador de perros en su barrio para ganarse el privilegio de poder tener su propio perro. Su duro trabajo da sus frutos cuando sus padres, el señor y la señora Baker, dejan a Owen adoptar a un desaliñado chucho al que pone el nombre de Hubble. Tanto el perro como el chico van a conseguir mucho más de lo que hubieran previsto cuando Owen se despierta una mañana y descubre que puede entender todo lo que Hubble dice.</p>
<p><strong>Director:</strong> John Hoffman · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Ciencia ficción, Comedia, Familia</p>
<p><strong>Reparto:</strong> Molly Shannon, Liam Aiken, Matthew Broderick, Donald Faison, Cheech Marin, Brittany Murphy</p>
