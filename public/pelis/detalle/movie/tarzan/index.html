<h1>Tarzan</h1>
<p>Durante una expedición a una remota jungla de África, John Greystoke y su mujer fallecen en un accidente de helicóptero. Únicamente su hijo pequeño J.J., también conocido como Tarzán, sobrevive. Un grupo de gorilas descubre al niño y lo acoge como si fuera uno de ellos. El niño aprende las duras leyes de la jungla sin tener contacto con ningún otro ser humano hasta que, ya convertido en un poderoso joven, se encuentra con la hermosa Jane Porter. Jane es una valiente ecologista que viaja a África engañada por William Clayton, el actual presidente de la compañía Greystoke, que pretende acumular más poder.</p>
<p><strong>Director:</strong> Reinhard Klooss · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Acción, Animación, Aventura, Familia</p>
<p><strong>Reparto:</strong> Kellan Lutz, Spencer Locke, Les Bubb, Joe Cappelletti, Brian Huskey, Mark Deklin</p>
