<h1>Jurassic World 2: El Reino Caído</h1>
<p>Una erupción volcánica amenaza a los dinosaurios restantes en la Isla Nublar, donde las criaturas han vagado libremente durante años tras de la desaparición del parque temático «Jurassic World». Claire Dearing, ex gerente del parque, ahora fundó el Grupo de Protección de Dinosaurios, una organización dedicada a intentar preservarlos. Cuando a Claire le ofrecen la oportunidad de rescatar algunos ejemplares de la isla, acude a Owen Grady, el ex entrenador de dinosaurios que trabajó en el parque, para que la ayude a evitar la extinción de los dinosaurios&amp;#8230; Secuela de «Jurassic World».</p>
<p><strong>Director:</strong> J. A. Bayona · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Chris Pratt, Bryce Dallas Howard, Rafe Spall, Justice Smith, Daniella Pineda, James Cromwell</p>
