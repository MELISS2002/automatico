<h1>El Pacto</h1>
<p>En su último período de servicio en Afganistán, el sargento John Kinley se une al intérprete local Ahmed para inspeccionar la región. Cuando su unidad sufre una emboscada, Kinley y Ahmed son los únicos supervivientes. Con los combatientes enemigos persiguiéndoles, Ahmed arriesga su propia vida para llevar a Kinley herido a través de kilómetros de terreno agotador a un lugar seguro. De vuelta en suelo estadounidense, Kinley se entera de que Ahmed y su familia no recibieron el pasaje a Estados Unidos como se prometió. Decidido a proteger a su amigo y pagar su deuda, Kinley regresa a la zona de guerra para recuperar a Ahmed y su familia antes de que las milicias locales les capturen.‎</p>
<p><strong>Director:</strong> Guy Ritchie · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Acción, Bélica, Suspense</p>
