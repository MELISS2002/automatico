<p>Guillermo y Mechi se conocen en un viaje laboral organizado por la empresa para la que trabajan. Ambos están casados y arrastran vidas que ya no los representan: él, atrapado en un matrimonio rutinario bajo la presión de un suegro que parece manejarlo; ella, con un trabajo que no la identifica, un marido lleno de proyectos fallidos y una hija que la rechaza. Una madrugada se cruzan en la playa y, entre risas y copas, surge una conexión inesperada.</p>
<p><strong>Director:</strong> Juan Taratuto · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Comedia, Romance</p>
