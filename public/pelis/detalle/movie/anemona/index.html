<h1>Anémona</h1>
<p>Jem Stoker se adentra en el bosque para reencontrarse con su hermano Ray, convertido en ermitaño tras años de aislamiento. Mientras Jem intenta persuadirlo para que regrese con la familia, el trauma no resuelto de su pasado —especialmente de su servicio militar y sus consecuencias— se impone con fuerza. Por su parte, Brian, hijo de Jem, sufre de acoso escolar y teme estar reproduciendo los mismos errores que cometieron su padre y su tío. La película aborda los vínculos tensos entre hermanos, padres e hijos, y cómo la violencia del pasado continúa proyectándose sobre el presente.</p>
<p><strong>Director:</strong> Ronan Day-Lewis · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Daniel Day-Lewis, Sean Bean, Samantha Morton, Samuel Bottomley, Safia Oakley-Green, Lewis Ian Bray</p>
