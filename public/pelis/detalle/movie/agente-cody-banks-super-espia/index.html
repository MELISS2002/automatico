<h1>Agente Cody Banks: Súper espía</h1>
<p>Para su familia y amigos, Cody Banks es el típico adolescente, le encanta montar en monopatín, odia las matemáticas y se siente un completo imbécil delante de las chicas. Pero Cody guarda un extraordinario secreto: es en realidad un agente encubierto de la CIA. Cody está viviendo el sueño de cualquier niño, puede conducir un coche como un especialista, cuenta con un arsenal de artilugios y su jefa, la agente Ronica Miles, está buenísima. Pero el entrenamiento de Cody se pone a prueba cuando tiene que hacerse pasar por estudiante y hacerse amigo de Natalie Connors, para espiar a su padre, un científico que está desarrollando una partida mortal de nanorobots para la malvada organización ERIS. Desde persecuciones en coche o motos de nieve hasta un final espectacular con una pelea en lo alto de una montaña, Cody tiene que usar todo lo que le han enseñado para demostrarse a sí mismo que es un superagente y parar a ERIS.</p>
<p><strong>Director:</strong> Harald Zwart · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Acción, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> Frankie Muniz, Hilary Duff, Angie Harmon, Keith David, Cynthia Stevenson, Darrell Hammond</p>
