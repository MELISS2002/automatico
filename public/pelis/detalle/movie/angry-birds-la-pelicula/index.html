<h1>Angry Birds: La Película</h1>
<p>Basada en la colección de videojuegos «Angry Birds», la historia se desarrolla en una isla poblada por aves felices que no vuelan. En este paraíso, Red, un pájaro con muy mal genio, el veloz Chuck y el volátil Bomb nunca han terminado de encajar. Pero cuando llegan a la isla unos misteriosos cerdos verdes, serán estos tres marginados los que averigüen qué traman los extraños visitantes.</p>
<p><strong>Director:</strong> Clay Kaytis · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> Jason Sudeikis, Josh Gad, Danny McBride, Maya Rudolph, Bill Hader, Peter Dinklage</p>
