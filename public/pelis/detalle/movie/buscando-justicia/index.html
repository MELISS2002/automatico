<h1>Buscando justicia</h1>
<p>Una poderosa historia real. “Buscando justicia” sigue la vida del joven abogado, Bryan Stevenson (Jordan), y su histórica batalla por la justicia. Luego de graduarse en Harvard, Bryan pudo elegir trabajos lucrativos. Sin embargo, decide viajar a Alabama para defender a personas sin el apoyo legal adecuado e injustamente condenadas, con la ayuda de una abogada local, Eva Ansley (Larson). Uno de sus primeros casos y, el más escandaloso, es el de Walter McMillian (Foxx), sentenciado a muerte en 1987 por el asesinato de una joven de 18 años, a pesar de contar con evidencia a su favor y el hecho de que el único testimonio en su contra provino de un criminal con motivaciones para mentir. Mientras pasan los años, Bryan se verá enredado en un laberinto de maniobras legales y políticas, además de un racismo abierto y sin límites, mientras lucha por Walter, y otros como él, contra el sistema y con todas las probabilidades en su contra.</p>
<p><strong>Director:</strong> Michael J. Moore · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Crimen, Drama, Historia</p>
<p><strong>Reparto:</strong> Michael B. Jordan, Brie Larson, Jamie Foxx, O&#x27;Shea Jackson Jr., Rafe Spall, Rob Morgan</p>
