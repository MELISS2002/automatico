<h1>Extremadamente Goofy</h1>
<p>Nuevas aventuras de Goofy y su hijo adolescente Max. En esta ocasión, Max se ha matriculado en la universidad, y dedica su tiempo libre a practicar todo tipo de arriesgados deportes. Goofy le echa tanto de menos, que se da cuenta de que hasta entonces ha dedicado demasiado tiempo al trabajo y muy poco a su hijo. Así que toma una decisión radical: se matricula también en la universidad.</p>
<p><strong>Director:</strong> Douglas McCarthy · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Animación, Comedia, Familia</p>
