<h1>El juego del miedo</h1>
<p>Adam se despierta encadenado a un tubo oxidado dentro de una decrépita cámara subterránea. A su lado, hay otra persona encadenada, el Dr. Lawrence Gordon. Entre ellos hay un hombre muerto. Ninguno de los dos sabe por qué está allí, pero tienen un casette con instrucciones para que el Dr. Gordon mate a Adam en un plazo de ocho horas. Recordando una investigación de asesinato llevada a cabo por un detective llamado Tapp, Gordon descubre que él y Adam son victimas de un psicópata conocido como Jigsaw. Sólo disponen de unas horas para desenredar el complicado rompecabezas en el que están inmersos.</p>
<p><strong>Director:</strong> James Wan · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Crimen, Misterio, Terror</p>
<p><strong>Reparto:</strong> Tobin Bell, Cary Elwes, Leigh Whannell, Danny Glover, Monica Potter, Ken Leung</p>
