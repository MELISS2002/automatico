<h1>Regreso del Todopoderoso</h1>
<p>En esta secuela del éxito de 2003 «Todopoderoso» (Bruce Almighty), el presentador de TV Evan Baxter (Steve Carell) se convierte en congresista de los EE.UU., y se muda desde Buffalo a Washington con su mujer (Lauren Graham) y sus 3 hijos. El primer día en su nueva casa reza pidiendo ayuda para poder cumplir su promesa política de «cambiar el mundo», y entonces es cuando el mismísimo Dios (Morgan Freeman) le pide que construya un arca, ante el supuestamente inminente diluvio universal que se avecina.</p>
<p><strong>Director:</strong> Tom Shadyac · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Steve Carell, Morgan Freeman, Lauren Graham, Johnny Simmons, Graham Phillips, Jimmy Bennett</p>
