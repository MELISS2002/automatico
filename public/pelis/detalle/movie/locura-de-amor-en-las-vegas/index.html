<h1>Locura de amor en Las Vegas</h1>
<p>Al fiestero Jack Fuller lo acaba de despedir de la empresa su propio padre. Por otro lado a la atractiva Joy McNally, su novio la ha dejado plantada. Ambos deciden irse a Las Vegas, y ahí se conocen por una equivocación en las habitaciones de su hotel. Tras irse de fiesta, a la mañana siguiente se despiertan&amp;#8230; y descubren que se han casado tras una noche de locura y descontrol. Justo en su primera discusión, Jack gana en un tragamonedas 3 millones de dólares en una máquina del casino jugando con una moneda de Joy. Ambos intentarán quedarse con el dinero, aunque el amor quizá aparezca en el camino&amp;#8230;</p>
