<h1>Invasión del Mundo: Batalla Los Ángeles</h1>
<p>Durante años ha habido casos documentados de avistamientos de OVNIS en todo el mundo. Pero en 2011, lo que hasta ese momento eran simples avistamientos resulta una terrible realidad cuando la Tierra es atacada por fuerzas desconocidas. Mientras todos son testigos de cómo caen las grandes ciudades del mundo, Los Ángeles se convierte en el último bastión de la humanidad en una batalla que nadie esperaba. Un sargento de la Marina y su división son los que tendrán que definir los límites frente a un enemigo como jamás se habían encontrado.</p>
<p><strong>Director:</strong> Jonathan Liebesman · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Acción, Ciencia ficción</p>
<p><strong>Reparto:</strong> Aaron Eckhart, Ramón Rodríguez, Will Rothhaar, Michael Peña, Bridget Moynahan, Noel Fisher</p>
