<h1>Mi vida a los diecisiete</h1>
<p>Todo el mundo sabe que crecer es difícil, y la vida no es más fácil para la estudiante de secundaria Nadine, quien ya se encuentra en una situación incómoda cuando su hermano Darian comienza a salir con su mejor amiga Krista. De repente, Nadine se siente más sola que nunca, hasta que la amistad inesperada de un chico reflexivo le da un atisbo de esperanza de que las cosas podrían no ser tan terribles después de todo.</p>
<p><strong>Director:</strong> Kelly Fremon Craig · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Comedia, Drama</p>
