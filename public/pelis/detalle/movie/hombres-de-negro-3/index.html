<h1>Hombres de Negro 3</h1>
<p>La película comienza con la fuga de un extraño y poderoso extraterrestre llamado Boris el animal. Es el último superviviente de la raza alienígena boglodita, que sobrevive mediante el ataque, toma, y ocupación de otros planetas habitados. Boris es un asesino, que fue capturado por el agente K y encarcelado en una prisión secreta en la Luna. K también pudo desplegar un sistema de defensa (denominado «Arc Net»), y evitar una invasión boglodita, logrando así su extinción. Sin embargo, Boris logra burlar la seguridad y destruir gran parte de la cárcel, para escapar y vengarse de K.</p>
<p><strong>Director:</strong> Barry Sonnenfeld · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Acción, Ciencia ficción, Comedia</p>
<p><strong>Reparto:</strong> Will Smith, Tommy Lee Jones, Josh Brolin, Jemaine Clement, Emma Thompson, Michael Stuhlbarg</p>
