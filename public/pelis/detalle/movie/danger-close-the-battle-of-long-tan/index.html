<h1>Danger Close: The Battle of Long Tan</h1>
<p>Guerra de Vietnam, 1966. Australia y Nueva Zelanda envían tropas para apoyar a los Estados Unidos y a los vietnamitas del sur en su lucha contra el norte comunista. Los soldados son hombres muy jóvenes, reclutas y voluntarios que nunca han estado involucrados en un combate. El 18 de agosto, los miembros de la compañía Delta deberán afrontar el verdadero horror de una despiadada batalla entre los árboles de una plantación de caucho llamada Long Tân. Son apenas cien. El enemigo es una ola humana que está lista para destruirlos.</p>
<p><strong>Director:</strong> Greg Tynan · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Acción, Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> Travis Fimmel, Luke Bracey, Daniel Webber, Alexander England, Aaron Glenane, Nicholas Hamilton</p>
