<h1>Tinker bell y La Bestia de Nunca Jamas</h1>
<p>Un antiguo mito de una criatura de gran destruccion despierta la curiosidad de Tinker Bell y su buen amiga Fawn, una hada animal que no tiene miedo de romper las reglas para ayudar a un animal en necesidad. Pero esta criatura no es bienvenida en Pixie Hollow - y las hadas scout están decididas a capturar a la bestia misteriosa, que temen destruirá su hogar. Fawn debe convencer a sus amigas hadas de arriesgarlo todo para rescatar a La Bestia de Nunca Jamas.</p>
<p><strong>Director:</strong> Steve Loter · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Animación, Aventura, Familia</p>
<p><strong>Reparto:</strong> Ginnifer Goodwin, Mae Whitman, Rosario Dawson, Lucy Liu, Raven-Symoné, Megan Hilty</p>
