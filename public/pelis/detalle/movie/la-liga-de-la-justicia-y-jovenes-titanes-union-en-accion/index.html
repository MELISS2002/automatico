<h1>La Liga de la Justicia y Jóvenes Titanes: Unión en acción</h1>
<p>Frustrado y desilusionado con su trabajo en la Justice League, Robin se ve forzado a una nueva posición con un súper equipo más joven, los Teen Titans. Rápidamente aceptado en el equipo, inmediatamente le intriga la misteriosa Raven y la fuerza sobrenatural que amenaza sobre ellos, el padre de Raven: Trigon, un ser falaz suficientemente poderoso como para destruir Metropolis haciendo que se enfrente la poderosa Liga de la Justicia contra los Jóvenes Titanes. Con las lealtades en juego y vidas en peligro, presencie la confrontación de Superman, Batman, Wonder Woman y Cyborg contra Beast Boy, Starfire, Blue Beetle y Nightwing. ¡Solo un verdadero trabajo en equipo acabará con la amenaza en esta aventura de DC Universe!</p>
<p><strong>Director:</strong> Sam Liu · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Acción, Animación, Ciencia ficción</p>
<p><strong>Reparto:</strong> Stuart Allan, Taissa Farmiga, Jason O&#x27;Mara, Rosario Dawson, Jerry O&#x27;Connell, Jon Bernthal</p>
