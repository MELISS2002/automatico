<h1>El pico de Dante</h1>
<p>Harry Dalton (Pierce Brosnan), un prestigioso vulcanólogo (todavía afectado por la muerte de su esposa en la erupción del monte Pinatubo), detecta una peligrosa actividad sísmica y avisa de una posible erupción en las cercanías de Dante’s Peak, un tranquilo pueblecito del Noroeste coronado por un inmenso volcán apagado. Pero nadie da crédito a sus avisos hasta que ya es demasiado tarde. El volcán entra en erupción y la población, dominada por el pánico intenta huir. Harry intentará escapar con la alcaldesa (Linda Hamilton) y sus hijos.</p>
<p><strong>Director:</strong> Roger Donaldson · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Acción, Aventura, Drama, Suspense</p>
<p><strong>Reparto:</strong> Pierce Brosnan, Linda Hamilton, Arabella Field, Jamie Renée Smith, Jeremy Foley, Elizabeth Hoffman</p>
