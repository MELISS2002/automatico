<h1>Barrio Chino</h1>
<p>Los Ángeles, 1937. El detective Gittes, especializado en divorcios, recibe la visita de la esposa de Mulwray, el jefe del Servicio de Aguas de la ciudad, que sospecha que su marido la engaña. Al mismo tiempo, Gittes descubre que los agricultores acusan a Mulwray de corrupción por su negativa a construir un pantano que paliaría la sequía que sufren. Poco después, el escándalo salta a la prensa, pero la cosa se complica cuando una mujer se presenta en el despacho de Gittes con una sorprendente revelación.</p>
<p><strong>Director:</strong> Roman Polanski · <strong>Año:</strong> 1974 · <strong>Géneros:</strong> Crimen, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Jack Nicholson, Faye Dunaway, John Huston, Perry Lopez, Burt Young, John Hillerman</p>
