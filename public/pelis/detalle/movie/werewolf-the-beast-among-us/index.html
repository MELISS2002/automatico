<h1>Werewolf: The Beast Among Us</h1>
<p>Una monstruosa criatura aterroriza en el siglo XIX una aldea europea en las noches de luna llena y un joven tendrá que luchar para proteger a sus seres queridos en Werewolf: The Beast Among Us, una nueva adicción de Universal a su lardo legado de monstruos clásicos. Mientras estudia con un médico local, Daniel presencia las terribles consecuencias de los ataques de un hombre lobo. Observa como la temible reputación de la bestia atrae a cazarecompensas, buscadores de emociones fuertes y charlatanes hasta el pequeño pueblo, mientras sueña con acabar personalmente con el monstruo. Cuando un misterioso extranjero y su equipo de cazadores de hombres lobo llegan al pueblo, se ofrece a unirse a ellos a pesar de las protestas de su madre. Pero no tardarán en descubrir que esta criatura es más fuerte, más lista y más peligrosa de lo que ellos han enfrentado antes. Pronto los habitantes empiezan a levantarse unos contra otros para encontrar la verdadera identidad de la bestia.</p>
<p><strong>Director:</strong> Louis Morneau · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Drama, Suspense, Terror</p>
<p><strong>Reparto:</strong> Ed Quinn, Guy Wilson, Stephen Rea, Rachel DiPillo, Adam Croasdell, Ana Ularu</p>
