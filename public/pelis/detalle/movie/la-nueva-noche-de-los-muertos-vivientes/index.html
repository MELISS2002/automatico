<h1>La nueva noche de los muertos vivientes</h1>
<p>Lo que comienza como una simple visita a una tumba pronto se convierte en una noche de terror. En esta oscura adaptación animada del clásico de culto de 1968 La noche de los muertos vivientes, los zombis sedientos de sangre empiezan a acumularse por todas partes. Mientras Bárbara, Ben y un extraño grupo de desconocidos se esconden en una remota granja, su lucha por ahuyentar a los carnívoros del exterior crea una feroz tensión en el interior.</p>
<p><strong>Director:</strong> Jason Axinn · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Animación, Terror</p>
<p><strong>Reparto:</strong> Josh Duhamel, Dulé Hill, Katharine Isabelle, James Roday Rodriguez, Katee Sackhoff, Will Sasso</p>
