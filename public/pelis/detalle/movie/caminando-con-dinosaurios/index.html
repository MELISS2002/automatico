<h1>Caminando Con Dinosaurios</h1>
<p>Un acercamiento a la historia, evolución y supervivencia de los dinosaurios, que transmite su lucha a muerte por prevalecer en un mundo donde la naturaleza se abre camino a base de la Ley del más fuerte, así nos adentramos en un mundo prehistórico y vivir de cerca la evolución de los pequeños de la manada desde su nacimiento. Desde romper el cascaron, pasando por la incesante batalla por la comida, hasta la rivalidad por el liderazgo del grupo y el enfrentamiento contra los depredadores que les acechan a cada paso.</p>
<p><strong>Director:</strong> Neil Nightingale · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Animación, Aventura, Familia</p>
<p><strong>Reparto:</strong> Karl Urban, Charlie Rowe, Angourie Rice, Justin Long, John Leguizamo, Tiya Sircar</p>
