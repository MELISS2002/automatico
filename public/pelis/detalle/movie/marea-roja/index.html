<p>El impulsivo Comandante del Alabama, el Capitán Frank Ramsey, y su lugarteniente, el reflexivo Teniente Coronel Ron Hunter, se encuentran en medio de un conflicto mundial. El submarino nuclear que dirigen se ve amenazado por un desequilibrado nacionalista ruso que quiere provocar la Tercera Guerra Mundial. Pero, cuando reciben órdenes de lanzar misiles nucleares, Ramsey y Hunter reaccionan de manera muy distinta y acaban enfrentándose por el control de la nave.</p>
