<h1>Karate Kid</h1>
<p>Daniel Larusso llega a Los Angeles procedente de la costa Este de Estados Unidos dispuesto a hacer nuevos amigos. Sin embargo, se convierte en el blanco de los ataques de los Cobras, un hostil grupo de estudiantes de kárate, cuando comienza a salir con Ali, la antigua novia del cabecilla del grupo. En tal situación, no tiene más remedio que pedirle ayuda a Miyagi, un maestro de artes marciales, para que le enseñe kárate. Bajo la tutela de Miyagi, Daniel desarrolla no sólo sus aptitudes físicas, sino también la seguridad en sí mismo que necesita para superar todos los obstáculos.</p>
<p><strong>Director:</strong> John G. Avildsen · <strong>Año:</strong> 1984 · <strong>Géneros:</strong> Acción, Drama, Familia</p>
<p><strong>Reparto:</strong> Ralph Macchio, Pat Morita, Elisabeth Shue, William Zabka, Martin Kove, Randee Heller</p>
