<h1>Legítimo rey</h1>
<p>Una verdadera historia de David contra Goliat, de cómo Robert The Bruce, el gran rey escocés del siglo XIV, utilizó su astucia y valentía para intentar derrotar al ejército inglés de ocupación, mucho más numeroso y mejor equipado. Es la historia jamás contada de Roberto I Bruce, que en un año extraordinario pasó de ser un noble derrotado a un rey reticente, hasta convertirse en un héroe fugitivo. Obligado a entrar en batalla para salvar a su familia, su gente y su país de la tiránica ocupación inglesa, Roberto se apodera de la corona de la Escocia medieval y lidera a un grupo de hombres insurgentes para enfrentar la ira del ejército más fuerte del mundo conducido por el despiadado rey Eduardo I y su débil hijo, el príncipe de Gales</p>
<p><strong>Director:</strong> David Mackenzie · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Bélica, Historia</p>
