<h1>Miami Vice</h1>
<p>Adaptación al cine de la conocida serie de TV de los años ochenta. Sonny Crockett (Colin Farrell) y Ricardo Tubbs (Jamie Foxx) son una pareja de agentes de la Brigada Antivicio del Departamento de Policía de Miami. En medio de una operación menor, ambos se enteran de que un soplo en las altas esferas ha causado la muerte de dos agentes federales y la masacre de una familia por un asunto de drogas. Autorizada por el teniente Castillo (Barry Shabaka Henley), la DEA encarga a Sonny y Ricardo que trabajen para los narcotraficantes hispanoamericanos, que exportan grandes cargamentos a los Estados Unidos.</p>
<p><strong>Director:</strong> Michael Mann · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
