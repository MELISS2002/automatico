<h1>Wasabi: El Trato Sucio de la Mafia</h1>
<p>Hubert es un inspector de policía con unos métodos un poco ortodoxos, pero con un tierno corazón, al que obligatoriamente le darán unas vacaciones forzadas. Dos días después recibe la llamada de un abogado desde Tokyo, informándole que la mujer de su vida, que había desaparecido hacía 20 años, había muerto. Y lo que le había dejado, no era ni dinero, ni presentes, ni nada material; le había dejado a su propia hija, Yumi, una extravagante adolescente, adicta a ir de compras, y con doscientos millones de dólares en su cuenta. Hubert decide viajar a Tokyo, nueve años después de su última visita, y descubre que la muerte de Miko, no ha sido casualidad&amp;#8230;</p>
<p><strong>Director:</strong> Gérard Krawczyk · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Acción, Comedia, Drama</p>
<p><strong>Reparto:</strong> Jean Reno, 広末涼子, Michel Muller, Carole Bouquet, Yoshi Oida, Christian Sinniger</p>
