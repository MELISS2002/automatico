<p>French y Sue trabajan en lo que mejor se les da -romper cráneos y aplastar huesos- mientras persiguen a los criminales de poca monta que le deben dinero a Tommy, su jefe. Cuando reciben una citación para ir a buscar un dinero en un casino de Las Vegas, éste resulta ser un antiguo amante de Sue. Mientras tanto, un importante traficante de droga se propone encontrar a la pareja para vengar la muerte de su hermano. Sin otro remedio que luchar para sobrevivir, French y Sue tendrán que abrirse paso ante todo aquel que trate de interponerse en su camino&amp;#8230;. Secuela de «La deuda» (The Debt Collector).</p>
