<h1>Enola Holmes 2</h1>
<p>Después del éxito de su primer caso, Enola Holmes (Millie Bobby Brown) sigue los pasos de su popular hermano, Sherlock (Henry Cavill), abriendo su propia agencia, descubriendo que la vida como mujer detective a sueldo no es tan fácil como parece. Resignada a aceptar la realidad como adulta. A punto de cerrar el negocio cuando una joven cerillera sin dinero le ofrece a Enola su primer trabajo oficial: encontrar a su hermana desaparecida Sin embargo, este caso resulta ser mucho más desconcertante de lo esperado, que hace que Enola se vea inmersa en un nuevo y peligroso mundo: desde las siniestras fábricas de Londres y los coloridos salones de música, hasta los más altos niveles de la sociedad y el propio 221B de Baker Street. A medida que las chispas de una conspiración mortal se encienden, Enola debe recurrir a la ayuda de sus amigos -y del propio Sherlock- para desentrañar su misterio. ¡El juego comienza de nuevo!</p>
<p><strong>Director:</strong> Harry Bradbeer · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Aventura, Crimen, Misterio</p>
<p><strong>Reparto:</strong> Millie Bobby Brown, Henry Cavill, David Thewlis, Louis Partridge, Susan Wokoma, Adeel Akhtar</p>
