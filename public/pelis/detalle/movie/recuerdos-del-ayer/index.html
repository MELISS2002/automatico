<h1>Recuerdos del ayer</h1>
<p>Taeko Okajima es una joven de que pide permiso de vacaciones para poder regresar a casa a Yamagata, el pueblo de su cuñada, y donde de niña vivió los momentos mas felices de toda su vida. En el transcurso de su viaje a a la granja de sus familiares y a su posterior residencia, Taeko ira recordando su pasado en el colegio, mientras vive intensamente su presente, sin saber bien qué hacer con su vida y si acceder a las presiones de la familia para casarse con el granjero Toshio con el que le une un poderoso afecto.</p>
<p><strong>Director:</strong> Isao Takahata · <strong>Año:</strong> 1991 · <strong>Géneros:</strong> Animación, Drama, Romance</p>
<p><strong>Reparto:</strong> 今井美樹, 本名陽子, 柳葉敏郎, 山下容莉枝, 三野輪 有紀, 伊藤正博</p>
