<h1>El Imperio de las Hormigas</h1>
<p>Una agresiva empresaria del ramo inmobiliario que planea drenar una zona pantanosa para levantar un exclusivo centro residencial, se translada con sus potenciales clientes a dicha zona, con el objeto de cerrar el negocio. Habiendo alquilado el yate de un capitán de agua dulce, recorre el lugar con sus invitados. Pero se enteran que un desastre radioactivo ha traído aparejada la mutación de las hormigas, que en breve lapso, ahora alcanzan el tamaño de un ser humano y han evolucionado hasta dominar telepáticamente un pueblo cercano. Película basada libremente en el cuento de 1905 «Empire of the Ants» de H.G. Wells</p>
<p><strong>Director:</strong> Bert I. Gordon · <strong>Año:</strong> 1977 · <strong>Géneros:</strong> Ciencia ficción, Terror</p>
<p><strong>Reparto:</strong> Joan Collins, Robert Lansing, John David Carson, Albert Salmi, Jacqueline Scott, Pamela Susan Shoop</p>
