<h1>De vuelta a la realidad</h1>
<p>Tridan Lagache ha pasado su vida en el Club Med, cambiando de amigos cada 8 días. A los 50 renunció al club vacacional mexicano donde nació, decidido a encontrar, 42 años después, a su gran amor de infancia, Violette. Llega a París, ingenuo y perdido pero feliz de quedarse con Louis, un medio hermano que no sabía que existía. Para deshacerse de un engorroso Tridan, Louis le ruega a una de sus conquistas, Roxane, que se haga pasar por Violette, a quien Tridan cree reconocer a primera vista.</p>
<p><strong>Director:</strong> Dany Boon · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Dany Boon, Charlotte Gainsbourg, Kad Merad, Caroline Anglade, Maxime Gasteuil, Aurore Clément</p>
