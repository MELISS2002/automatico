<h1>El Informe Pelícano</h1>
<p>Darby Shaw, una estudiante de Derecho, escribe un informe en el que analiza las posibles razones del reciente asesinato de dos jueces del Tribunal Supremo. Su informe, en principio descabellado, parece que toca material «sensible», pues pronto será objeto de una implacable persecución, de la que saldrá con vida gracias a la ayuda de un periodista que también quiere descubrir quiénes están detrás de esos asesinatos.</p>
<p><strong>Director:</strong> Alan J. Pakula · <strong>Año:</strong> 1993 · <strong>Géneros:</strong> Crimen, Drama, Suspense</p>
<p><strong>Reparto:</strong> Julia Roberts, Denzel Washington, Sam Shepard, John Heard, Tony Goldwyn, James B. Sikking</p>
