<h1>Mortal Kombat Leyendas: La Batalla de los Reinos</h1>
<p>La historia toma lugar casi un año después de los eventos de Mortal Kombat Legends: La venganza de Scorpion, Tras la derrota del mundo exterior en el torneo del Mortal Kombat (Kombate Mortal) el poderoso emperador de este llamado Shao Kahn decide tomar este asunto en sus propias manos y para ello reúne a sus mejores comandantes, mientras en el reino de la Tierra el dios del trueno Raiden intenta completar el entrenamiento de Liu Kang al mismo tiempo que reúne a todos los mejores peleadores de la Tierra para que luchen en el inevitable conflicto.</p>
