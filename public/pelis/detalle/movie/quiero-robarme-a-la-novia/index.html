<h1>Quiero robarme a la novia</h1>
<p>Para Tom (Patrick Dempsey) la vida es maravillosa: es un triunfador, tiene éxito con las mujeres y sabe que siempre podrá confiar en su mejor amiga, la encantadora Hannah (Michelle Monaghan). Todo va bien hasta que Hannah se va seis semanas a Escocia por razones de trabajo; entonces Tom se da cuenta de que sin ella su vida está tan vacía que está decidido a pedirle que se case con él en cuanto vuelva. El problema es que cuando Hannah regresa está prometida y le pide a Tom que sea su «dama de honor»&amp;#8230;</p>
<p><strong>Director:</strong> Paul Weiland · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Patrick Dempsey, Michelle Monaghan, Kevin McKidd, Kadeem Hardison, Chris Messina, Richmond Arquette</p>
