<h1>Monster High: Scaris Ciudad del terror</h1>
<p>En Scaris, un viaje monstruosamente fashion, Clawdeen Wolf tiene la oportunidad de ganar un concurso para ser aprendiz de la famosísima diseñadora de moda Moanatela Ghostier. Pero no quiere ser la única en disfrutar de la ciudad más mostruosamente fashion del mundo, así que se va con sus amigas hacia Scaris. Durante el viaje hacen dos nuevas amigas: Skelita Calaveras y Jinafire Long, quienes, gracias a su asombroso estilo, pronto conectan con las chicas de Monster High. Una vez en Scaris, descubrirán que no todo es tan fashion como lo pintan…</p>
