<h1>No me olvides</h1>
<p>Melanie Carmichael (Reese Whitherspoon) es una joven y original diseñadora de moda de Nueva York, originaria del sur, que consigue conquistar a Andrew (Patrick Dempsey), el soltero más codiciado de la ciudad. El repentino anuncio de su compromiso obliga a Melanie a regresar a la ciudad donde nació, Alabama, a resolver un antiguo asunto relacionado con Jake (Josh Lucas), el hombre con quien se casó siendo demasiado joven y que se niega a darle el divorcio.</p>
<p><strong>Director:</strong> Andy Tennant · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Reese Witherspoon, Josh Lucas, Patrick Dempsey, Candice Bergen, Mary Kay Place, Fred Ward</p>
