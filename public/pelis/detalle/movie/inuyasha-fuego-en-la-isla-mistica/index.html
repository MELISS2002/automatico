<h1>InuYasha: Fuego en la Isla Mística</h1>
<p>Despues de 50 años reaparece la Isla Hourai, una legendaria isla donde convivian demonios y humanos en completa armonia. La Isla ahora tiene encerrados a un grupo de medio demonios que tienen que ofrecer sus vidas a los cuatro dioses que tambien estan encerrados en la isla, sin embargo una de ellos logra escapar encontrando a InuYasha y a sus amigos, pididiendole que rescate a sus hermanos. Sesshomaru tambien decide ir a enfrentarlos ya que al igual que InuYasha fueron marcados con la marca de los cuatro dioses hace 50 años, Sin embargo InuYasha y su grupo tendra una dura batalla al saber que no solo se enfrentara a los Cuatro Dioses sino tambien a un clon de Kikyou, que se formó de su sangre hace 50 años.</p>
<p><strong>Director:</strong> 篠原俊哉 · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Animación, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> 山口勝平, ゆきのさつき, 辻谷耕史, 桑島法子, 渡辺久美子, 日髙のり子</p>
