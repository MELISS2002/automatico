<h1>Fiebre de sábado por la noche</h1>
<p>Tony Manero es un oficinista de la tienda de la pintura de Brooklyn que daría algo para evadirse de su existencia sin salida. En la vida, Tony es un campesino; en la pista de baile de la discoteca, es un rey. Ya que la banda sonora juega un éxito de Bee Gees después del otro, puntales de Tony con el traje blanco su materia entre señales de luz y cuerpos sudorosos, ondulantes. Las aspiraciones de la clase de Tony se reflejan en su relación con su compañero de baile, un secretario ansioso de moverse en el mundo encantador de Manhattan.</p>
<p><strong>Director:</strong> John Badham · <strong>Año:</strong> 1977 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> John Travolta, Karen Lynn Gorney, Barry Miller, Joseph Cali, Paul Pape, Donna Pescow</p>
