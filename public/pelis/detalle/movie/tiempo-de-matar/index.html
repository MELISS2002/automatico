<h1>Tiempo de Matar</h1>
<p>En un tranquilo pueblo de Mississippi, dos jóvenes borrachos violan salvajemente a una niña negra de diez años. La mayoría blanca de la ciudad se muestra horrorizada ante un crimen tan atroz. Carl Lee, el padre de la niña, decide tomarse la justicia por su mano y mata a los violadores de su hija. Mientras la tensión va creciendo y reaparecen en las calles las cruces ardiendo del Ku Klux Klan, Jake Brigance, un joven abogado blanco, hará todo lo posible por salvar tanto la vida de Carl Lee como la suya.</p>
<p><strong>Director:</strong> Joel Schumacher · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Crimen, Drama, Suspense</p>
<p><strong>Reparto:</strong> Matthew McConaughey, Sandra Bullock, Samuel L. Jackson, Kevin Spacey, Ashley Judd, Donald Sutherland</p>
