<h1>Don Jon</h1>
<p>Jon Martello tiene un objetivo para todo en su vida: su apartamento, su automóvil, su familia, su iglesia y, por supuesto, las mujeres. Sus amigos incluso lo llaman Don Jon debido a su capacidad para sacar «10s» todos los fines de semana sin fallar. Sin embargo, incluso las mejores aventuras no se comparan con la felicidad trascendente que logra solo frente a la computadora viendo pornografía. Insatisfecho, se embarca en un viaje para encontrar una vida sexual más gratificante, pero termina aprendiendo lecciones más grandes de la vida y el amor a través de relaciones con dos mujeres muy diferentes.</p>
<p><strong>Director:</strong> Joseph Gordon-Levitt · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Joseph Gordon-Levitt, Scarlett Johansson, Julianne Moore, Tony Danza, Glenne Headly, Brie Larson</p>
