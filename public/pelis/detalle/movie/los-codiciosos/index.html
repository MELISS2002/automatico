<h1>Los Codiciosos</h1>
<p>Los McTeague, una familia de clase media, esperan heredar la fortuna del viejo tío Joe, que no parece tener ninguna prisa por morirse. Pero es que, además, sólo uno de ellos será el heredero. Durante la fiesta de cumpleaños del tío Joe, sus sobrinos no dudan en adularlo, someterse a toda clase de humillaciones, espiarse unos a otros y usar toda clase de artimañas para descalificarse mutuamente. Lo que no sospechaban es que la atractiva enfermera y amante de su tío es también candidata a heredar la fortuna, y cuando comprueban que el anciano se dedica a malgastar su dinero con la joven, deciden recurrir al sobrino favorito del millonario para que ponga fin a esta situación.</p>
<p><strong>Director:</strong> Jonathan Lynn · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Michael J. Fox, Kirk Douglas, Nancy Travis, Olivia D&#x27;Abo, Phil Hartman, Ed Begley Jr.</p>
