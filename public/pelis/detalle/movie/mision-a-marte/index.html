<h1>Misión a Marte</h1>
<p>En el año 2020 el comandante Luke Graham es seleccionado para dirigir la primera misión tripulada de la NASA a Marte. Una vez en el planeta rojo, descubre una antigua estructura con forma de domo que parece ser una especie de baliza. El domo mata a la tripulación y deja herido a Luc. El coronel Jim McConnell, recientemente enviudado, encabezará la segunda misión de rescate.</p>
<p><strong>Director:</strong> Brian De Palma · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Misterio</p>
<p><strong>Reparto:</strong> Gary Sinise, Tim Robbins, Don Cheadle, Connie Nielsen, Jerry O&#x27;Connell, Peter Outerbridge</p>
