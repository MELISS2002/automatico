<h1>Los 33: Una historia de esperanza</h1>
<p>Cuenta los hechos ocurridos cuando el derrumbe de la mina de San José dejó aislados bajo tierra a 33 mineros durante 69 días. Sin poder comunicarse con sus seres queridos y con la esperanza a punto de desaperecer, estos hombres hicieron acopio de todas sus fuerzas para sobrevivir al tormento que les tocó pasar. Con la angustia por el difícil y problemático rescate que mantuvo en vilo al mundo, la cinta contará de primera mano la desesperación y el heroico esfuerzo por mantener con vida a sus compañeros a 700 metros de profundidad, mientras en la superficie cada día se complicaba más sacarles de ahí. Un retrato de la supervivencia del ser humano en situaciones límite donde todo lo que tiene es el apoyo de la persona a su lado, ya que la esperanza y la vida están en manos de otros.</p>
<p><strong>Director:</strong> Patricia Riggen · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Antonio Banderas, Rodrigo Santoro, Kate del Castillo, Juliette Binoche, James Brolin, Lou Diamond Phillips</p>
