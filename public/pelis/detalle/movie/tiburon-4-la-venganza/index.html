<h1>Tiburón 4: La venganza</h1>
<p>Ellen Brody aún vive en el pueblo isleño de Amity, pero sus hijos Sean y Michael ya no trabajan en el Sea World, y su marido hace tiempo que murió de un ataque al corazón provocado por su miedo a los escualos. Sean, que es policía, una noche de Navidad tiene que acudir a una llamada para desenredar un tronco de una boya y es devorado por un gran tiburón blanco. Su madre piensa que se trata de una venganza contra su familia, por lo que su hijo Michael decide llevársela con su mujer y su hija lejos de Amity.</p>
<p><strong>Director:</strong> Joseph Sargent · <strong>Año:</strong> 1987 · <strong>Géneros:</strong> Aventura, Suspense, Terror</p>
<p><strong>Reparto:</strong> Lorraine Gary, Lance Guest, Mario Van Peebles, Michael Caine, Karen Young, Judith Barsi</p>
