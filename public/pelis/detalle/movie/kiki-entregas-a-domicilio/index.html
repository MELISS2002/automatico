<h1>Kiki: Entregas a Domicilio</h1>
<p>Kiki no es una niña como otra cualquiera porque es aprendiz de bruja. Con solo 13 años y por tradición del oficio que está aprendiendo, la niña tiene que abandonar la casa de sus padres y buscar algún sitio donde sean necesarios sus servicios de bruja. Para emprender el viaje, Kiki se acompaña de su amigo Jiji y también de su gato; juntos, y sobre una escoba voladora, los amigos se instalan en un pueblecito que da al mar, donde la niña empezará a conocerse verdaderamente a sí misma.</p>
<p><strong>Director:</strong> Hayao Miyazaki · <strong>Año:</strong> 1989 · <strong>Géneros:</strong> Animación, Familia, Fantasía</p>
<p><strong>Reparto:</strong> 高山みなみ, 佐久間レイ, 山口勝平, 戸田恵子, 信澤三惠子, 三浦浩一</p>
