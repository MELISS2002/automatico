<h1>Brigada A: Los Magníficos</h1>
<p>Adaptación al cine de la popular serie de televisión. El Coronel Hannibal Smith (Liam Neeson) es el líder de «El Equipo A», una unidad especial de veteranos de la guerra de Iraq, antiguos soldados de las Fuerzas Especiales que fueron acusados de un crimen que no cometieron. Hannibal es un experto planificador de misiones peligrosas que requieren un equipo de hombres extraordinariamente competentes y preparados: Templenton &amp;#8216;Fenix (Face)&#x27; Peck (Bradley Cooper) puede conseguir cualquier cosa para hacer posibles las poco ortodoxas actividades del grupo; M. A. Barracus (Quinton &amp;#8216;Rampage&#x27; Jackson) es el conductor del equipo, y Murdock (Charlto Copley) es un piloto excepcional y un loco acreditado. La capitana Charisa (Jessica Biel), una antigua novia de Fenix, los persigue por un crimen que no cometieron. Finalmente, Lynch (Patrick Wilson) es un misterioso agente de la CIA.</p>
<p><strong>Director:</strong> Joe Carnahan · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Acción, Comedia, Crimen</p>
<p><strong>Reparto:</strong> Liam Neeson, Bradley Cooper, Jessica Biel, Quinton &#x27;Rampage&#x27; Jackson, Sharlto Copley, Patrick Wilson</p>
