<h1>Percy Jackson y el ladrón del rayo</h1>
<p>Percy Jackson es un auténtico imán para los desastres y tiene problemas en el instituto -pero ése es el menor de sus retos-. Estamos en el siglo XXI pero los dioses del Olimpo parecen haberse escapado de las páginas del libro de texto de Percy sobre mitología griega para colarse en su vida. Percy se ha enterado de que su verdadero padre es Poseidón, dios del mar, lo que significa que Percy es un semidiós -mitad ser humano, mitad dios-. Al mismo tiempo, Zeus, el rey de todos los dioses, ha acusado a Percy de robarle su rayo&amp;#8230; la versión original de las armas de destrucción masiva&amp;#8230;</p>
<p><strong>Director:</strong> Chris Columbus · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Logan Lerman, Brandon T. Jackson, Alexandra Daddario, Jake Abel, Pierce Brosnan, Sean Bean</p>
