<h1>Veneciafrenia</h1>
<p>En la naturaleza existe vínculo indisoluble entre la belleza y la muerte. El ser humano, deudor de su entorno, imita lo que observa. Como mosquitos atraídos por el faro más brillante, los turistas están apagando la luz de la ciudad más hermosa del planeta. La agonía de las últimas décadas ha desatado la ira entre los venecianos. Para frenar la invasión, algunos se han organizado, dando rienda suelta a su instinto de supervivencia. Nuestros protagonistas, un sencillo grupo de turistas españoles, viajan a Venecia con la intención de divertirse, ajenos a los problemas que les rodean. Allí se verán obligados a luchar por salvar sus propias vidas.</p>
<p><strong>Director:</strong> Álex de la Iglesia · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Ingrid García Jonsson, Silvia Alonso, Goize Blanco, Nicolás Illoro, Alberto Bang, Enrico Lo Verso</p>
