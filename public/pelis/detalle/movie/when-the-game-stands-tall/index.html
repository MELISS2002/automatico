<h1>When the Game Stands Tall</h1>
<p>Basada en hechos reales, narra la historia de Bob Ladouceur, un entrenador de fútbol americano que con la ayuda de su ayudante, Terry Eidson, transformó al equipo de los “Spartans Concord”, de California, llevándolo de ser un equipo mediocre a conseguir 151 triunfos consecutivos entre 1992 y 2003, rompiendo así todos los récords de victorias en cualquier deporte. Cuando la racha se rompe y la tragedia golpea al equipo, el entrenador debe enseñar a sus jugadores, y a toda la ciudad, a superar la derrota.</p>
<p><strong>Director:</strong> Thomas Carter · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Jim Caviezel, Michael Chiklis, Laura Dern, Clancy Brown, Ser&#x27;Darius Blain, Stephan James</p>
