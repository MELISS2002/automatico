<h1>Xanadu</h1>
<p>Kira es una de las hijas de Zeus y musa de las artes. Cumpliendo ese trabajo, visita al pintor Sonny Malone, a quien inspira con un beso. Sin embargo, la bella diosa y el mortal se enamoran, lo que será un problema en el orden cósmico. Al mismo tiempo, un viejo músico sueña con abrir un club nocturno al viejo estilo, un proyecto en el que Kira y Sonny se involucrarán&amp;#8230; Los años 40 se encuentran con los 80 en «Xanadú», una mirada hacia el futuro a la vez que un recuerdo romántico de cómo eran las cosas durante la época dorada de Hollywood.</p>
<p><strong>Director:</strong> Robert Greenwald · <strong>Año:</strong> 1980 · <strong>Géneros:</strong> Ciencia ficción, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Olivia Newton-John, Gene Kelly, Michael Beck, James Sloyan, Katie Hanley, Fred McCarren</p>
