<h1>Zona de miedo</h1>
<p>En Irak, una unidad de élite de artificieros norteamericanos actúa en una caótica ciudad donde cualquier persona puede ser un enemigo y cualquier objeto, una bomba. El jefe del grupo, el sargento Thompson, muere en el transcurso de una misión y es sustituido por el impredecible y temerario sargento William James. Cuando falta poco para que la brigada sea relevada, el imprudente comportamiento de James hará que dos de sus subordinados, se planteen seriamente el riesgo que corren.</p>
<p><strong>Director:</strong> Kathryn Bigelow · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Bélica, Drama, Suspense</p>
<p><strong>Reparto:</strong> Jeremy Renner, Anthony Mackie, Brian Geraghty, David Morse, Guy Pearce, Evangeline Lilly</p>
