<h1>La leyenda del tesoro perdido 2: El libro de los secretos</h1>
<p>En esta segunda parte, el buscador de tesoros Ben Gates se ve de nuevo envuelto en una increíble aventura en la que se relacionan capítulos desconocidos de la historia con tesoros ocultos. Cuando una página del diario de John Wilkes Booth, el asesino de Abraham Lincoln, sale a la luz, el tatarabuelo de Ben se ve implicado como el principal conspirador del magnicidio. Decidido a probar la inocencia de su ancestro, Ben y su equipo emprenden un viaje para intentar descubrir uno de los tesoros más buscados del mundo.</p>
<p><strong>Director:</strong> Geoffrey Hansen · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Acción, Aventura, Misterio</p>
<p><strong>Reparto:</strong> Nicolas Cage, Diane Kruger, Justin Bartha, Ed Harris, Jon Voight, Helen Mirren</p>
