<h1>El cuento de la Princesa Kaguya</h1>
<p>Basada en un cuento popular japonés anónimo del siglo IX, «El cortador de bambú». La historia comienza cuando una pareja de ancianos campesinos encuentra a una niña diminuta dentro de una planta de bambú, y deciden adoptarla como si fuera su hija. Pasan los años, y rápidamente se convierte en una hermosa mujer pretendida por muchos hombres poderosos.</p>
<p><strong>Director:</strong> Isao Takahata · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Animación, Drama, Fantasía</p>
<p><strong>Reparto:</strong> 朝倉あき, 地井武男, 宮本信子, 高良健吾, 高畑淳子, 田畑智子</p>
