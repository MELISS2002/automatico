<h1>La otra Reina</h1>
<p>Inglaterra, siglo XVI. Narra la historia de dos hermanas, Ana y María Bolena (Portman &amp;#038; Johansson). El padre y el tío de ambas, movidos por la ambición de mejorar el nivel social y el poder de la familia, convencen a las jóvenes para que conquisten el amor de Enrique VIII (Eric Bana), Rey de Inglaterra. Ana y María abandonan su vida en el campo para trasladarse al peligroso y apasionante mundo de la corte. Pero, pronto surge entre ellas una rivalidad sin cuartel para obtener el amor del Rey. Al principio, el Rey escoge como amante a María y tiene con ella un bastardo. Pero Ana, que es muy inteligente y astuta, consigue eclipsar a su hermana e, incluso, que el rey repudie a Catalina de Aragón, su legítima esposa.</p>
<p><strong>Director:</strong> Justin Chadwick · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Drama, Historia, Romance</p>
<p><strong>Reparto:</strong> Natalie Portman, Scarlett Johansson, Eric Bana, Jim Sturgess, Mark Rylance, Kristin Scott Thomas</p>
