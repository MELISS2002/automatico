<h1>Chaplin</h1>
<p>Biografía de Charles Chaplin. Chaplin pertenecía a una familia numerosa que se ganaba la vida en los teatros de mala muerte de Londres. Cuando su padre murió alcoholizado, su madre, enferma, tuvo que trabajar duramente para sacar adelante a la familia hasta que fue ingresada en un psiquiátrico. Chaplin entró entonces a trabajar en una compañía musical que hizo una gira por los Estados Unidos. Allí conoció al productor de cine Mack Sennett con el que firmó un contrato que le permitió demostrar su gran habilidad como cómico. Además de actuar, empezó a dirigir los filmes que protagonizaba y su personaje de entrañable vagabundo dio la vuelta al mundo.</p>
<p><strong>Director:</strong> Richard Attenborough · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Robert Downey Jr., Geraldine Chaplin, Paul Rhys, Marisa Tomei, Milla Jovovich, John Thaw</p>
