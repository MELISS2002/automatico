<h1>Un puente a Terabithia</h1>
<p>Jess Aarons, un chico que se siente extraño tanto en el colegio como en su propia casa, se ha entrenado durante todo el verano para correr una carrera; pero llega al colegio Leslie Burke y le gana. A pesar de ello, pronto se hacen amigos. Leslie, aficionada a contar fantásticas y mágicas historias, le abre a Jess las puertas de un mundo dominado por la imaginación. A Jess le gusta dibujar, pero nunca había compartido esa afición con nadie. Los dos crean el reino secreto de Terabithia, un lugar mágico cuya entrada sólo ellos conocen. Allí reinan, luchan contra el Maestro Oscuro y sus criaturas y trazan planes para vengarse de los compañeros prepotentes del colegio.</p>
<p><strong>Director:</strong> Gábor Csupó · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Aventura, Drama, Familia</p>
<p><strong>Reparto:</strong> Josh Hutcherson, AnnaSophia Robb, Zooey Deschanel, Robert Patrick, Bailee Madison, Kate Butler</p>
