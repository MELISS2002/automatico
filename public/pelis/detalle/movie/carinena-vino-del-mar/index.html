<h1>Cariñena, vino del mar</h1>
<p>Galicia, 1978. Antón (Diego Garisa), un joven de 18 años tan inexperto como lleno de dudas, huye del servicio militar, dejando atrás su tierra natal y a un padre que ya había trazado su destino. En Zaragoza, se integra en un colectivo de objetores de conciencia, mientras empieza a explorar su vocación como escritor y vive de cerca los primeros latidos de la democracia. La búsqueda de trabajo lo lleva a Cariñena, donde conoce a Miguel (Alejandro Bordanove), un joven sin rumbo, tan extrovertido y mentiroso como entrañable, con quien forja una amistad inesperada. Entre barracones, viñedos y risas, Antón encuentra también el amor fugaz de Cris, una joven idealista y la amistad de Palmira e Isidro, dos figuras que le ayudan a crecer y comprender el mundo al que se enfrenta.</p>
<p><strong>Director:</strong> Javier Calvo Torrecilla · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Diego Garisa, Alejandro Bordanove, Itziar Miranda, Nacho Rubio, Alba Martínez, Blanca Laínez</p>
