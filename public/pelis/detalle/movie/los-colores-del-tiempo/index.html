<h1>Los colores del tiempo</h1>
<p>París, 2025. A una treintena de personas de una misma familia se les informa de que van a heredar una casa abandonada desde hace años. Cuatro de ellos reciben el encargo de hacer el inventario de la casa, donde descubren tesoros ocultos. Entre las antigüedades se encuentran con una misteriosa antepasada, Adèle, que abandonó su Normandía natal a los 20 años para viajar al París de finales del siglo XIX, en plena revolución industrial y cultural, cuando se inventaba la fotografía y nacía el Impresionismo.</p>
<p><strong>Director:</strong> Cédric Klapisch · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Suzanne Lindon, Abraham Wapler, Vincent Macaigne, Julia Piaton, Zinedine Soualem, Paul Kircher</p>
