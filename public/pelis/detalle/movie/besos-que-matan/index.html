<h1>Besos que matan</h1>
<p>El Dr. Axel Cross (Morgan Freeman) es detective, psicólogo forense y escritor de éxito de novelas criminales. Cuando su sobrina Naomí desaparece, inicia su propia investigación. Siete chicas han desaparecido y se han encontrado dos cadáveres. Al lado del último de ellos ha aparecido una nota firmada &amp;#8216;Casanova&#x27;. Cross recibe la ayuda de Kate McTiernan (Ashley Judd), una joven doctora que ha conseguido escapar del secuestrador y puede ser la única persona capaz de identificar a &amp;#8216;Casanova&#x27;. A pesar de la reticencia inicial del detective, juntos emprenden una carrera contrarreloj para encontrar a la sobrina de Cross y descubrir la estremecedora verdad que se oculta tras su desaparición.</p>
<p><strong>Director:</strong> Gary Fleder · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Crimen, Drama, Misterio, Suspense</p>
