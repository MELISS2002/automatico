<h1>Wishmaster 3: La piedra del diablo</h1>
<p>La Piedra del Diablo, un descubrimiento arqueológico del antiguo Islam, mantiene atrapado en su interior al demonio Djinn. Pero cuando una joven y brillante universitaria, Diana, desvela el secreto del Ojo de Dios, libera también inesperadamente al demonio. Ahora, lo único que separa al mundo de su destrucción total son los tres deseos de Diana. ¿Podrá descubrir el modo de detener al Djinn antes de que mate a sus amigos y acabe con nuestro universo?</p>
<p><strong>Director:</strong> Chris Angel · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Fantasía, Suspense, Terror</p>
<p><strong>Reparto:</strong> Jason Connery, A.J. Cook, Tobias Mehler, Louisette Geiss, Aaron Smolinski, Daniella Evangelista</p>
