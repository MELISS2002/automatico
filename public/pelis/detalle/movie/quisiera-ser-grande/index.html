<h1>Quisiera ser grande</h1>
<p>Josh Baskin tiene trece años pero, cansado de que las chicas no le hagan caso y de que sus padres le traten como a un niño, desea ser mayor. Una noche, encuentra, en una feria, una vieja máquina que concede un deseo a cambio de una moneda. Josh, sin dudarlo un instante, pide hacerse mayor. A la mañana siguiente, descubre en el espejo un cuerpo de adulto. La otra cara de la moneda serán los problemas y responsabilidades que debe asumir sin ninguna experiencia previa.</p>
<p><strong>Director:</strong> Penny Marshall · <strong>Año:</strong> 1988 · <strong>Géneros:</strong> Comedia, Drama, Fantasía</p>
