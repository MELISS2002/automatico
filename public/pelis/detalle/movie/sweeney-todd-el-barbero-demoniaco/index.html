<h1>Sweeney Todd: El Barbero Demoniaco</h1>
<p>Johnny Depp interpreta a Benjamin Barker, un hombre encarcelado 15 años injustamente en el otro lado del mundo, que escapa y vuelve a Londres con la promesa de vengarse, junto a Helena Bonham Carter como su obsesiva y devota cómplice, la Sra. Nellie Lovett. Adoptando el disfraz de Sweeney Todd, Barker regresa a su antigua barbería encima del local de empanadas de carne de la Sra. Lovett, y fija sus miras en el juez Turpin (Alan Rickman) que, con la ayuda de su vil secuaz Beadle Bamford (Timothy Spall), le mandaron lejos con una acusación falsa y así poder robarle a su esposa, Lucy (Laura Michelle Kelly), y a su hija bebé.</p>
<p><strong>Director:</strong> Tim Burton · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Drama, Terror</p>
<p><strong>Reparto:</strong> Johnny Depp, Helena Bonham Carter, Alan Rickman, Timothy Spall, Sacha Baron Cohen, Jamie Campbell Bower</p>
