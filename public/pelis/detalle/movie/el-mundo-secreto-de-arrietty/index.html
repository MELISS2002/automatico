<h1>El mundo secreto de Arrietty</h1>
<p>En una casita oculta bajo las tablas del suelo de una mansión campestre, vive una familia de seres diminutos, de apenas 10 cm. de altura, que tienen la norma de no dejarse ver nunca por los seres humanos; sin embargo, su tranquila existencia cambia cuando Arrietty, una audaz adolescente, es vista accidentalmente por un niño que se acaba de establecer en la casa debido a su delicada salud. Al tiempo que entre ambos surge una gran amistad, la existencia de los diminutos seres se verá peligrosamente amenazada&amp;#8230; Adaptación del cuento infantil «The Borrowers», escrito por Mary Norton y ambientado en el Tokio contemporáneo.</p>
<p><strong>Director:</strong> 米林宏昌 · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Animación, Familia, Fantasía</p>
<p><strong>Reparto:</strong> 志田未来, 神木隆之介, 三浦友和, 竹下景子, 樹木希林, 大竹しのぶ</p>
