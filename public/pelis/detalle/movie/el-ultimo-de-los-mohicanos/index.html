<h1>El último de los mohicanos</h1>
<p>En 1757, a orillas del río Hudson, tropas francesas e inglesas luchan por el dominio de la región. Los ingleses reclutan a los granjeros asentados en esas tierras para formar un ejército capaz de enfrentarse a las tropas franco-indias. Hawkeye -Ojo de halcón es un hombre blanco adoptado por los indios mohicanos que vive con su padre y su hermano Uncas. Tras rescatar de una emboscada de los hurones a Cora Munro y a su hermana pequeña Alice , hijas de un oficial británico, los tres deciden acompañarlas al fuerte inglés William Henry, que está siendo asediado por franceses y hurones. Allí les obligan a quedarse con un grupo de británicos que acaban de llegar de las colonias&amp;#8230;</p>
<p><strong>Director:</strong> Michael Mann · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Acción, Bélica, Historia, Romance</p>
<p><strong>Reparto:</strong> Daniel Day-Lewis, Madeleine Stowe, Jodhi May, Russell Means, Wes Studi, Eric Schweig</p>
