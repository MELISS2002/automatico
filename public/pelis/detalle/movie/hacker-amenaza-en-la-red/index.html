<h1>Hacker: Amenaza en la red</h1>
<p>Thriller cibernético en el que varios agentes norteamericanos y chinos, con ayuda de un convicto liberado, se unen para detener a un misterioso hacker. Todo comienza cuando los gobiernos de Estados Unidos y China se ven obligados a cooperar por el bien de la seguridad nacional de ambas potencias. El motivo: una fuerte amenaza informática está poniendo en riesgo las vidas y el futuro de la población; delitos informáticos de alto nivel para los que deberán recurrir a sus mejores agentes de campo si quieren llegar a tiempo para evitar lo peor.</p>
<p><strong>Director:</strong> Michael Mann · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Chris Hemsworth, 湯唯, 王力宏, Viola Davis, Holt McCallany, 安志傑</p>
