<h1>La Mitad Siniestra</h1>
<p>Thad Beaumont es un escritor que estuvo publicando, bajo el pseudónimo de George Stark y durante años, novelas de terror que narraban las matanzas del psicópata Alexis Máuina. Una vez conseguida fama y dinero, y con una preciosa familia compuesta por su atractiva esposa y dos gemelos, Beaumont decide que ya no necesita a su doble en su ascendente carrera literaria, por lo que decide desenmascarar al mundo su personaje. Pero pronto descubrirá que no es nada fácil deshacerse del fantasma que creó a lo largo de los años. Basada en la novela de Stephen King.</p>
<p><strong>Director:</strong> George A. Romero · <strong>Año:</strong> 1993 · <strong>Géneros:</strong> Misterio, Terror</p>
<p><strong>Reparto:</strong> Timothy Hutton, Amy Madigan, Michael Rooker, Julie Harris, Robert Joy, Kent Broadhurst</p>
