<h1>Leaving Neverland 2: Sobreviviendo a Michael Jackson</h1>
<p>Explora el impacto personal que James Safechuck y Wade Robson sufrieron tras hacer públicas sus acusaciones contra el ícono del pop Michael Jackson. Ambos hombres siguen buscando justicia mientras enfrentan la reacción negativa de su ejército global de fans. Con acceso exclusivo a las audiencias judiciales, el documental muestra hasta qué punto el estate de Jackson han luchado para evitar que Robson y Safechuck tengan su día en la corte.</p>
<p><strong>Director:</strong> Dan Reed · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Documental</p>
<p><strong>Reparto:</strong> James Safechuck, Wade Robson, Michael Jackson, Dan Reed</p>
