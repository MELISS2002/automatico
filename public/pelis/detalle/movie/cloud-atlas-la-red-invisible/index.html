<h1>Cloud Atlas: La Red Invisible</h1>
<p>La Red Invisible es una novela que da la vuelta al mundo y recorre desde el siglo XIX hasta un futuro apocalíptico, a través de seis historias entrelazadas. El relato se abre en 1850 con el regreso del notario estadounidense Adam Ewing desde las islas Chatham a su California natal. Durante el viaje, Ewing traba amistad con un médico, el doctor Goose, que comienza a tratarle de una extraña enfermedad causada por un parásito cerebral&amp;#8230; Repentinamente, la acción se traslada a 1931 en Bélgica, donde Robert Frobisher, un compositor bisexual que ha sido desheredado, se introduce en el hogar de un artista enfermizo, su seductora esposa y su núbil hija&amp;#8230; De ahí saltamos a la Costa Oeste en la década de los setenta, cuando Luisa Rey destapa una red de avaricia y crimen que pone en peligro su vida&amp;#8230; Y, del mismo modo, con idéntica maestría, viajamos a la ignominiosa Inglaterra de nuestros días.</p>
<p><strong>Director:</strong> Sebastian Fahr-Brix · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Ciencia ficción, Drama</p>
<p><strong>Reparto:</strong> Tom Hanks, Halle Berry, Jim Broadbent, Hugo Weaving, Jim Sturgess, 배두나</p>
