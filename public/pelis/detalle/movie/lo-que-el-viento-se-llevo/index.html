<h1>Lo que el viento se llevó</h1>
<p>Georgia, 1861. En la elegante mansión sureña de Tara, vive Scarlett O&#x27;Hara, la joven más bella, caprichosa y egoísta de la región. Ella suspira por el amor de Ashley, pero él está prometido con su prima, la dulce y bondadosa Melanie. En la última fiesta antes del estallido de la Guerra de Secesión (1861-1865), Scarlett conoce al cínico y apuesto Rhett Butler, un vividor arrogante y aventurero, que sólo piensa en sí mismo y que no tiene ninguna intención de participar en la contienda. Lo único que él desea es hacerse rico y conquistar el corazón de la hermosa Scarlett.</p>
<p><strong>Director:</strong> Victor Fleming · <strong>Año:</strong> 1939 · <strong>Géneros:</strong> Bélica, Drama, Romance</p>
<p><strong>Reparto:</strong> Vivien Leigh, Clark Gable, Olivia de Havilland, Leslie Howard, Hattie McDaniel, Thomas Mitchell</p>
