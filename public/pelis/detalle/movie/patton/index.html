<h1>Patton</h1>
<p>Esta película biográfica narra las acciones que George S. Patton, general del Ejército de los Estados Unidos, realizó durante la Segunda Guerra Mundial. Interpretado por George C. Scott, la película comienza con el controvertido discurso que, según los historiadores, impartió el general a los soldados antes de ir a la guerra. El carácter altivo de Patton hace que hasta los altos dirigentes nazis le teman ya que, entre otras muchas hazañas, ha conseguido vencer en el norte de África al poderoso mariscal alemán Erwin Rommel. De este modo comienza a adentrase por toda Europa con sus tropas logrando cada vez más prestigio gracias a sus victorias.</p>
<p><strong>Director:</strong> Franklin J. Schaffner · <strong>Año:</strong> 1970 · <strong>Géneros:</strong> Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> George C. Scott, Karl Malden, Stephen Young, Michael Strong, Carey Loftin, Albert Dumortier</p>
