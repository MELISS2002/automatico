<h1>Scooby-Doo! Miedo en el campamento</h1>
<p>Scooby-Doo y sus amigos se encuentran en un campamento de verano en el que cada vez que alguien cuenta una historia de miedo, la criatura de la que se habla ¡cobra vida!. Pero la pandilla de Misterio a La Orden no se asusta tan fácilmente. Reúnanse alrededor de la fogata para asar algunos chicos malos. Scooby-Doo, Shaggy, Freddy, Daphne y Vilma tratan de obtener pistas para resolver los misterios del Hombre del Bosque, el Pescador y el Espíritu del Cañón Negro. Y, por supuesto, ¡Shaggy y Scooby-Doo siguen muy de cerca el caso Qué hay para cenar!</p>
<p><strong>Director:</strong> Ethan Spaulding · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Animación, Comedia, Familia, Misterio</p>
<p><strong>Reparto:</strong> Frank Welker, Mindy Cohn, Matthew Lillard, Grey DeLisle, Dee Bradley Baker, Mark Hamill</p>
