<article>
<h1>Turno de guardia</h1>
<p>Floria es una enfermera que trabaja con gran dedicación y profesionalidad en el ala quirúrgica de un hospital suizo. Nunca comete un error, siempre escucha a sus pacientes incluso en las situaciones más estresantes y siempre está disponible de inmediato en caso de emergencia. Pero en la dura, y muchas veces impredecible, realidad diaria del hospital las cosas pueden ser diferentes. Un día, Floria llega para trabajar en el turno de noche, la sala de urgencias está completamente llena y hay falta de personal. A pesar del ritmo frenético, Floria trabaja incansable para atender a todos los pacientes pero comete un desastroso error y el turno amenaza con desbaratarse por completo. Comienza una angustiosa carrera contrarreloj.</p>
<p><strong>Director:</strong> Petra Biondina Volpe · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Leonie Benesch, Alireza Bayram, Jürg Plüss, Jasmin Mattei, Lale Yavaş, Andreas Beutler</p>
