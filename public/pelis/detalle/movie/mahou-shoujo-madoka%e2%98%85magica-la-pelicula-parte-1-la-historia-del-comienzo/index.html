<h1>Mahou Shoujo Madoka★Magica la Película (Parte 1) - La historia del comienzo</h1>
<p>Después de tener una extraña pesadilla, Madoka Kaname, una chica de 14 años encuentra a una criatura mágica llamada kyubee. A Madoka y Sayaka Miki, su amiga, les ofrece la oportunidad de ganar poderes mágicos si están de acuerdo en hacer un contrato con el. Kyubee les ofrece cumplir un deseo, pero a cambio deben arriesgar sus vidas para luchar contra brujas. Criaturas que, nacidas de maldiciones,son responsables de muchos asesinatos y suicidios. Una aliada de kyubee, una chica mágica llamada Mami Tomoe, se hace amiga de ellas y las alienta a aceptar el contrato. Por razones desconocidas, otra chica mágica llamada Homura Akemi esta decidida a impedir que Madoka acepte la oferta.</p>
<p><strong>Director:</strong> 宮本幸裕 · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Animación, Fantasía, Suspense</p>
<p><strong>Reparto:</strong> 悠木碧, 斎藤千和, 喜多村英梨, 水橋かおり, Ai Nonaka, 加藤英美里</p>
