<h1>La Casa del Lago</h1>
<p>En 2006 la Dra. Kate Forster abandona la casa que ha estado alquilando junto al lago para trasladarse a Chicago. Al marcharse deja una nota en el buzón para el nuevo inquilino con la intención de que le remita las cartas que puedan llegar a su nueva dirección y además le advierte de que las huellas de perro que hay en la entrada ya estaban allí cuando ella llegó. Dos años antes, en 2004, el arquitecto Alex Wyler llega a la casa del lago y encuentra la carta que Kate había dejado en el buzón. Al leerla Alex se sorprende, ya que la casa está abandonada y no hay huellas de perro en la entrada.</p>
<p><strong>Director:</strong> Alejandro Agresti · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Drama, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Keanu Reeves, Sandra Bullock, Christopher Plummer, Ebon Moss-Bachrach, Willeke van Ammelrooy, Dylan Walsh</p>
