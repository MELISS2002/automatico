<h1>Pecado Original</h1>
<p>En Cuba, Luis Vargas (Antonio Banderas) sostiene una relación epistolar con Julia Russell (Angelina Jolie), una atractiva americana. En principio ella es todo lo que él necesita para casarse y el hecho de que sea norteamericana, es ideal para proyectar el estatus al que él aspira. Pero un buen día Julia desaparece&amp;#8230; con el dinero de Luis. Ahora, Luis sólo piensa en vengarse y emprende un viaje hacia el complicado pasado de Julia. Las consecuencias de esa odisea de mentiras descubiertas y pasiones encontradas son devastadoras tanto para él como para ella</p>
<p><strong>Director:</strong> Michael Cristofer · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Drama, Historia, Misterio, Romance, Suspense</p>
<p><strong>Reparto:</strong> Angelina Jolie, Antonio Banderas, Thomas Jane, Gregory Itzin, Jack Thompson, Allison Mackie</p>
