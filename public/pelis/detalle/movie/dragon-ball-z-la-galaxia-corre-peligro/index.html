<h1>Dragon Ball Z: La Galaxia Corre Peligro</h1>
<p>Un misterioso torneo de las artes marciales llama la atención de los guerreros z, al cual deciden entrar. Krillin, Trunks y Gohan pasan a las semifinales, en donde tendrían que enfrentarse contra los discípulos de Satán, pero algo extraño sucede. Al comenzar cada batalla, los guerreros z se darán cuenta de que los cuatro peleadores rivales no son peleadores normales de este planeta y que son extremadamente fuertes.</p>
<p><strong>Director:</strong> 上田芳裕 · <strong>Año:</strong> 1993 · <strong>Géneros:</strong> Acción, Animación, Ciencia ficción</p>
