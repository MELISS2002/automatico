<h1>El Ciempiés Humano: Primera secuencia</h1>
<p>Lindsay y Jenny son dos turistas estadounidenses que viajan por Europa. Durante su escala en Alemania, una tarde deciden ir a una fiesta. Dirigiéndose allí, su automóvil sufre una avería en un camino solitario en medio de un pantano por lo que deciden caminar para pedir ayuda. En ese momento cae una fuerte lluvia y llegan a una casa ubicada en un claro. Ahí las recibe un sujeto misterioso que les invita a pasar para refugiarse. Sin embargo, las droga y al despertar descubren que están atadas a unas camas en un cuarto equipado a manera de laboratorio.</p>
<p><strong>Director:</strong> Tom Six · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Dieter Laser, Winter Williams (Formerly Ashley C. Williams), Ashlynn Yennie, Akihiro Kitamura, Andreas Leupold, Peter Blankenstein</p>
