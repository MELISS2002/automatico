<h1>Gracias, equipo</h1>
<p>Tío Mochales es una empresa que, hace años, era la reina indiscutible del queso español, pero hoy intenta mantener las apariencias. Su última gran idea: organizar un retiro rural para fomentar el espíritu de equipo en el pueblo donde se fundó la empresa. Pero lo que pretendía ser una escapada para reencontrarse con los «valores tradicionales» se convierte en una trampa cuando descubren que se avecinan despidos, y muchos. Lo que prometía ser una escapada motivadora se convierte rápidamente en un campo de batalla de halagos, traiciones y filtraciones.</p>
<p><strong>Director:</strong> Diego Núñez Irigoyen · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Comedia</p>
