<h1>Australia</h1>
<p>Lady Sarah Ashley, una aristócrata inglesa, se ha pasado la vida persiguiendo la perfección superficial, pero un matrimonio sin amor y sin hijos le ha privado de cualquier cosa importante que no sea su cuadra de caballos. Convencida de que su marido le es infiel, la empecinada Sarah viaja desde Londres hasta el remoto reducto tropical de Darwin (Australia) para enfrentarse a él. Su reacio guía a través del inmenso e inmisericorde terreno del territorio septentrional es Drover, un ganadero tan tosco y basto como refinada es Sarah. Su profunda antipatía mutua se ve aminorada por la tragedia cuando Sarah, de repente, se halla cuidando a un encantador y joven huérfano llamado Nullah, un muchacho mestizo a la deriva en una sociedad segregada que le trata como un paria.</p>
<p><strong>Director:</strong> Baz Luhrmann · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Aventura, Drama, Romance</p>
<p><strong>Reparto:</strong> Nicole Kidman, Hugh Jackman, Essie Davis, David Wenham, Bryan Brown, David Gulpilil</p>
