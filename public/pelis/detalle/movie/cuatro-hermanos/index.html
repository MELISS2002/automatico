<p>Después del asesinato de su madre adoptiva en un atraco, los hermanos Mercer -el impulsivo Bobby , el seductor Angel , el padre de familia y hombre de negocios Jeremiah y el roquero duro Jack - se reúnen de nuevo para aclarar su muerte. Ya en la pista del asesino, no tardan en darse cuenta de que su habitual comportamiento tiene nuevas consecuencias. En este drama de acción basado en la fuerza de los personajes dirigido por John Singleton , cuatro hermanos descubren que les une algo mucho más poderoso que la sangre.</p>
<p><strong>Director:</strong> John Singleton · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Acción, Crimen</p>
