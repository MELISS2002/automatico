<h1>El Engaño</h1>
<p>Guerra Civil norteamericana (1861-1865) John Mc Burney (Clint Eastwood), un soldado yanki malherido es rescatado por una jovencita de una escuela de señoritas del Sur. Se las arregla para llevarlo a la escuela, pero al principio todas las mujeres están aterrorizadas. Cuando empieza a recuperarse, una a una las irá conquistando a todas, y así el ambiente se irá enrareciendo a causa de los celos.</p>
<p><strong>Director:</strong> Don Siegel · <strong>Año:</strong> 1971 · <strong>Géneros:</strong> Bélica, Drama, Suspense</p>
<p><strong>Reparto:</strong> Clint Eastwood, Geraldine Page, Elizabeth Hartman, Jo Ann Harris, Darleen Carr, Mae Mercer</p>
