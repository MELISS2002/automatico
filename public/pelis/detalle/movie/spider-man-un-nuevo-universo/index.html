<h1>Spider-Man: Un nuevo universo</h1>
<p>En un universo paralelo donde Peter Parker ha muerto, un jóven de secundaria llamado Miles Morales es el nuevo Spider-Man. Sin embargo, cuando el líder mafioso Wilson Fisk (a.k.a Kingpin) construye el «Super Colisionador» trae a una versión alternativa de Peter Parker que tratará de enseñarle a Miles como ser un mejor Spider-Man. Pero no será el único Spider Man en entrar a este universo, 4 versiones alternas de Spidey aparecerán y buscarán regresar a su universo antes de que toda la realidad colapse.</p>
<p><strong>Director:</strong> Kyle Fukuto · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Animación, Aventura, Ciencia ficción</p>
<p><strong>Reparto:</strong> Shameik Moore, Jake Johnson, Hailee Steinfeld, Mahershala Ali, Brian Tyree Henry, Lily Tomlin</p>
