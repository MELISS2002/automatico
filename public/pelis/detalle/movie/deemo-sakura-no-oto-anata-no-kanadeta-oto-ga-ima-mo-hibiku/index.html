<p>Deemo es un personaje místico que vive en la soledad de su castillo. Un día, una niña pequeña cae del cielo sin saber quién es o de dónde viene. Para ayudarla a regresar a su mundo, Deemo se percata que un árbol va creciendo muy alto sobre el piano que suele tocar. Pero, ¿qué hará Deemo cuando empiece a sentirse cómodo con una compañía de la que nunca antes había gozado? ¿Qué pasará si la joven chica no puede enfrentar su pasado una vez recupere su memoria?</p>
