<h1>Terror bajo la Tierra 4: El comienzo de la leyenda</h1>
<p>Esta precuela de los Temblores escalofriantes comienza en la ciudad de Rejection, Nev., En 1889, donde mueren 17 hombres en circunstancias misteriosas. Asustados por los acontecimientos recientes, los mineros que pueblan la ciudad se van en tropel hasta que no queda nada más que un caparazón de una comunidad. Depende de los residentes restantes llegar al fondo de las muertes, pero deben hacerlo antes de que ellos también sean eliminados de la faz del planeta.</p>
<p><strong>Director:</strong> S.S. Wilson · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Acción, Comedia, Terror, Western</p>
<p><strong>Reparto:</strong> Michael Gross, Sara Botsford, Billy Drago, Brent Roam, August Schellenberg, J.E. Freeman</p>
