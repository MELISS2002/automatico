<h1>Buenos Muchachos</h1>
<p>Henry Hill, hijo de padre irlandés y madre siciliana, vive en Brooklyn y se siente fascinado por la vida que llevan los gángsters de su barrio, donde la mayoría de los vecinos son inmigrantes. Paul Cicero, el patriarca de la familia Pauline, es el protector del barrio. A los trece años, Henry decide abandonar la escuela y entrar a formar parte de la organización mafiosa como chico de los recados; muy pronto se gana la confianza de sus jefes, gracias a lo cual irá subiendo de categoría.</p>
<p><strong>Director:</strong> Martin Scorsese · <strong>Año:</strong> 1990 · <strong>Géneros:</strong> Crimen, Drama</p>
<p><strong>Reparto:</strong> Robert De Niro, Ray Liotta, Joe Pesci, Lorraine Bracco, Paul Sorvino, Frank Sivero</p>
