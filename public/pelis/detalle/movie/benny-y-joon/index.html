<h1>Benny y Joon</h1>
<p>Tras la muerte de sus padres, Joon (Masterson), una chica sensible y delicada, se ha convertido en una persona mentalmente desequilibrada, que vive bajo la estricta tutela y protección de su hermano Benny (Quinn). Como consecuencia de una disparatada apuesta en una partida de póker, Benny tiene que aceptar que Sam (Depp), un muchacho extravagante y solitario que tiene un don especial para la pantomima (homenaje al cine mudo), se vaya a vivir con ellos. Joon y Sam simpatizan enseguida y acaban enamorándose.</p>
<p><strong>Director:</strong> Jeremiah S. Chechik · <strong>Año:</strong> 1993 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Johnny Depp, Mary Stuart Masterson, Aidan Quinn, Julianne Moore, Oliver Platt, CCH Pounder</p>
