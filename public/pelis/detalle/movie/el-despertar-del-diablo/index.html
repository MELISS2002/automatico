<h1>El despertar del diablo</h1>
<p>La película gira en torno a los Carter, una familia de clase media cuyas vacaciones, acompañando a sus padres en sus bodas de plata, quedan truncadas cuando su caravana sufre un extraño accidente en el desierto de Nuevo México. Aislados del mundo, pronto se darán cuenta de que no están solos: en las colinas habita una estirpe de sanguinarios mutantes fruto de las continuas pruebas nucleares del ejército,como son Gruñidos y Slott y que no dudarán en aniquilar a los Carter de las formas más espeluznantes.</p>
<p><strong>Director:</strong> Jon-Luke Lourens · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Aaron Stanford, Dan Byrd, Emilie de Ravin, Vinessa Shaw, Ted Levine, Kathleen Quinlan</p>
