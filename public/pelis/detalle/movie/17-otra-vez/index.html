<h1>17 Otra Vez</h1>
<p>A los 35 años, la vida de Mike no ha ido por el camino del éxito que todos preveían cuando en el instituto era la estrella del equipo de baloncesto y el que ligaba con las chicas más guapas. Después de 18 años vendiendo productos farmacéuticos no ha conseguido ascender en el trabajo, no tiene buena relación con sus dos hijos y se acaba de separar de Scarlet, su encantadora mujer. Una noche de tormenta, Mike ve al que fuera bedel de su instituto subido encima de la valla de un puente mirando al río. Mike detiene su coche con intención de evitar que el hombre se tire, pero cuando llega a la altura del bedel, éste ha desaparecido y Mike cae irremediablemente al río. Cuando a la mañana siguiente Mike llega a casa de su amigo Ned, se da cuenta de que no es el mismo Mike vendedor de medicamentos sino Mike O’Donnell, el adolescente de 17 años.</p>
<p><strong>Director:</strong> Burr Steers · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Comedia, Fantasía</p>
<p><strong>Reparto:</strong> Zac Efron, Leslie Mann, Thomas Lennon, Michelle Trachtenberg, Sterling Knight, Matthew Perry</p>
