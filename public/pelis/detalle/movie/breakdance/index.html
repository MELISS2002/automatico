<h1>Breakdance</h1>
<p>Película que gira en torno al fenómeno del Breakdance durante los años 80. Kelly es una bailarina que a través de un compañero conoce a dos bailarines callejeros, para los cuales el baile es una forma de vida que nada tiene que ver con lo que enseñan en las academias. Poco a poco Kelly se interesará por el baile callejero, y bailando con ellos triunfará en las fiestas de Hip Hop, pero aún queda conquistar a los jueces de traje y corbata.</p>
<p><strong>Director:</strong> Joel Silberg · <strong>Año:</strong> 1984 · <strong>Géneros:</strong> Drama, Música, Romance</p>
<p><strong>Reparto:</strong> Lucinda Dickey, Adolfo Quinones, Michael Chambers, Ben Lokey, Christopher McDonald, Phineas Newborn III</p>
