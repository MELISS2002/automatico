<h1>El hechizo del halcón</h1>
<p>En una época de magia y aventuras, una leyenda heroica y sobrenatural relata la diabólica venganza del Obispo de Aquila que a consecuencia de una traición, jura impedir el amor de Navarre e Isabel. Apoderándose de las fuerzas del mal, lanza sobre la pareja un terrible hechizo: ella se convertirá en halcón durante el día y él en un acechante lobo gris por la noche&amp;#8230; Eternamente unidos y separados, encontrarán un aliado en la persona de Philippe que les ayudará a conjurar la maldición del obispo.</p>
<p><strong>Director:</strong> Richard Donner · <strong>Año:</strong> 1985 · <strong>Géneros:</strong> Aventura, Comedia, Fantasía</p>
<p><strong>Reparto:</strong> Matthew Broderick, Rutger Hauer, Michelle Pfeiffer, Alfred Molina, John Wood, Leo McKern</p>
