<h1>Hedwig y la pulgada furiosa</h1>
<p>Hedwig se sometió a una operación de cambio de sexo que le permitió casarse con un soldado americano y alcanzar la libertad al otro lado del Muro de Berlín. Sin embargo, la operación salió mal y Hedwig se quedó con esa “pulgada irritada” (“angry inch”) que da nombre a la película. En un parque de caravanas de Kansas, Hedwig decidió formar un grupo de rock. Así conoció a Tommy Gnosis, un joven que fue su amante y protegido antes de abandonarla, robarle sus canciones y triunfar como estrella del rock. Acompañada de su grupo paneslavo, “The Angry Inch”, siguió a Tommy en su gira, tocando en locales medio vacíos. Por medio de un collage de canciones, flashbacks e imágenes animadas, Hedwig cuenta la historia de su vida e intenta sacar partido de la prensa amarilla que se interesa por ella por haber sido amante del famoso cantante de rock Tommy Gnosis.</p>
<p><strong>Director:</strong> John Cameron Mitchell · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Comedia, Drama, Música</p>
<p><strong>Reparto:</strong> John Cameron Mitchell, Miriam Shor, Stephen Trask, Theodore Liscinski, Rob Campbell, Michael Aronov</p>
