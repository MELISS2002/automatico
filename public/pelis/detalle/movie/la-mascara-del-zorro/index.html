<h1>La Máscara del Zorro</h1>
<p>México, 1821. Un enmascarado y romántico héroe popular, conocido como El Zorro, lucha valientemente contra el dominio colonial español en la Alta California. Sin embargo, la víspera de la liberación de México, el despótico gobernador don Rafael Montero descubre que el Zorro es don Diego de la Vega. Un ataque contra la casa del rebelde, se salda con su captura, la muerte de su mujer, el secuestro de su única hija Elena y la destrucción de sus propiedades. Veinte años después, Montero regresa del exilio con Elena, que ignora la identidad de su padre, y se propone comprar California al Presidente de México, el General Santa Anna. Cuando don Diego de la Vega se entera, escapa de la prisión dispuesto a vengarse de Montero.</p>
<p><strong>Director:</strong> Martin Campbell · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Acción, Aventura</p>
<p><strong>Reparto:</strong> Antonio Banderas, Anthony Hopkins, Catherine Zeta-Jones, Stuart Wilson, Matt Letscher, L.Q. Jones</p>
