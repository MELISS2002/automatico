<h1>Llamas de venganza</h1>
<p>Drew Barrymore interpreta a una niña de ocho años dotada de un poder sobrenatural que le permite provocar incendios con la mente. Esta incontrolable y peligrosa habilidad fue adquirida por la niña a raíz de un experimento respaldado por el gobierno de los Estados Unidos, que pretende explotar este don como un arma secreta.</p>
<p><strong>Director:</strong> Mark L. Lester · <strong>Año:</strong> 1984 · <strong>Géneros:</strong> Ciencia ficción, Suspense, Terror</p>
<p><strong>Reparto:</strong> David Keith, Drew Barrymore, Freddie Jones, Heather Locklear, Martin Sheen, George C. Scott</p>
