<h1>El demonio 2</h1>
<p>Hoy es el 22º día en el ritual alimenticio de la abominable criatura conocida como The Creeper, la cual se alimenta de los órganos arrancados vivos de sus víctimas. A este monstruo caníbal procedente de tiempos remotos le queda todavía un día más para hartarse de carne humana y desaparecer de nuevo, y aguardar en hibernación hasta su próxima temporada de caza dentro de 23 años. Taggart y sus hijos se hallan trabajando en los maizales de su propiedad cuando la bestia de enormes alas agarra al benjamín de la familia, transportándolo por los aires hacia un destino que se adivina horripilante.</p>
<p><strong>Director:</strong> Victor Salva · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Travis Schiffner, Ray Wise, Jonathan Breck, Al Santos, Nicki Aycox, Eric Nenninger</p>
