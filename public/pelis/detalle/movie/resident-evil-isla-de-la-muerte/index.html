<h1>Resident Evil: Isla de la Muerte</h1>
<p>El agente Leon S. Kennedy tiene la misión de rescatar al Dr. Antonio Taylor de unos secuestradores, cuando una mujer misteriosa frustra su búsqueda. Mientras tanto, Chris Redfield está investigando un brote de zombis en San Francisco, donde no se puede identificar la causa de la infección. Lo único que tienen en común las víctimas es que todas visitaron la isla de Alcatraz recientemente. Siguiendo esa pista, Chris y su equipo se dirigen a la isla, donde les espera un nuevo horror.</p>
<p><strong>Director:</strong> 諸鍛冶裕太 · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Acción, Animación, Ciencia ficción, Terror</p>
