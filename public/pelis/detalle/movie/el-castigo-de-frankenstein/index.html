<h1>El castigo de Frankenstein</h1>
<p>Tras ser destruido el laboratorio donde trabajaba en sus experimentos, el Barón Frankenstein regresa a su pueblo natal, Karlstaad, de donde fue expulsado años atrás, en busca de las riquezas de su mansión para poder seguir sufragando su trabajo. Una vez allí, encuentra el monstruo que creó, el cual se ha preservado en las montañas gracias al hielo y decide intentar volver a darle vida. Pero algo en el cerebro de la criatura falla, por lo cual el Dr. Frankenstein recurre a los servicios del hipnotizador Zoltan.</p>
<p><strong>Director:</strong> Freddie Francis · <strong>Año:</strong> 1964 · <strong>Géneros:</strong> Ciencia ficción, Terror</p>
<p><strong>Reparto:</strong> Peter Cushing, Peter Woodthorpe, Duncan Lamont, Sandor Elès, Katy Wild, David Hutcheson</p>
