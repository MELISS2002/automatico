<h1>Magic Mike XXL</h1>
<p>Después de quemar la noche con sus incombustibles amigos strippers, la estrella Magic Mike tendrá que valorar si puede vivir para siempre siguiendo este estilo de vida. Elegir entre el dinero fácil y cambiar completamente de oficio (con algo más de ropa) vuelve a ser de nuevo un dilema en su vida. Hasta que lo tenga del todo claro, su show sigue enloqueciendo a las mujeres de todas las edades, que hacen cola por entrar en su club nocturno y deleitarse con sus performances sensuales que dejarán a más de una con la boca abierta y los bolsillos vacios. Mientras su vida personal parece complicarse por momentos Mike deberá hacer lo que mejor sabe si quiere salir de todos sus líos: bailar y crear un espectáculo desinivido y diferente.</p>
<p><strong>Director:</strong> Gregory Jacobs · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Comedia, Drama</p>
