<h1>¿Quién *&amp;#038;$%! son los Miller?</h1>
<p>El distribuidor de marihuana David aprende por las malas que ninguna buena acción queda sin castigo; él intenta ayudar a algunos jóvenes y es sorprendido por unos criminales, perdiendo su dinero y producto. David está endeudado con su proveedor y para solucionar el problema debe ir a México para recoger un cargamento del jefe. Para lograr la misión, David idea un plan infalible: reúne a una familia falsa y la sube a una casa rodante para dirigirse al sur durante un fin de semana salvaje.</p>
<p><strong>Director:</strong> Rawson Marshall Thurber · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Comedia, Crimen</p>
