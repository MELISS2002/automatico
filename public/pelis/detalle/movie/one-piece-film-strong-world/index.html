<h1>One Piece Film: Strong World</h1>
<p>Luffy y sus amigos comienzan su viaje en un bosque que está lleno de monstruos, pero de repente Nami desaparece, dejando un mensaje, y el inicio del equipo en busca de ella, ¿podrán encontrarla o no..? 20 años después de su huida de Impel Down, el legendario pirata Shiki, el León Dorado, quien perdió una batalla contra Gol D. Roger, vuelve a aparecer causando agitación masiva a los marines. Durante su larga reclusión, fue capaz de encontrar un plan para someter al Gobierno Mundial de rodillas. En su camino a ejecutar su plan, Shiki se cruza con los Piratas del Sombrero de Paja y queda muy impresionado con el conocimiento de Nami de la meteorología, tanto así que él la secuestra para alistarse en su tripulación.</p>
<p><strong>Director:</strong> 境宗久 · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Animación, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> 田中真弓, 中井和哉, 岡村明美, 山口勝平, 平田広明, 大谷育江</p>
