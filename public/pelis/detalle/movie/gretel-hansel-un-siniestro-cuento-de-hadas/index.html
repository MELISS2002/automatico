<h1>Gretel &amp;#038; Hansel: Un siniestro cuento de hadas</h1>
<p>A principios del siglo XIV en Baviera, Gretel y Hansel viven en la miseria desde que su padre falleció. Por la falta de recursos su padrastro se embarca con ellos en una huida por el bosque donde un cazador les indica el camino seguro. Así, los hermanos encontrarán la cabaña de Holda, una simpática mujer. Todo va bien y la comida abunda, pero algo les huele mal. Gretel y Hansel se van a enfrentar a sus peores miedos.</p>
<p><strong>Director:</strong> Osgood Perkins · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Fantasía, Misterio, Terror</p>
