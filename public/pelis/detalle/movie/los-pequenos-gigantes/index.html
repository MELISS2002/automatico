<h1>Los pequeños gigantes</h1>
<p>Danny OShea siempre ha vivido a la sombra de su hermano, el gran jugador de fútbol americano Kevin O&#x27;Shea. Kevin siempre fue el más grande, más fuerte, más rápido y más popular. Después de una brillante carrera, Kevin vuelve con su familia a su pueblo natal, donde organiza una liga infantil de fútbol. Sin embargo, a pesar que su sobrina (la hija de Danny) es la mejor jugadora, no la selecciona para el equipo representante del pueblo. Cuando se entera de que su hija es rechazada, Danny reunirá a una cuadrilla de los más flojuchos y regordetes del lugar para enseñarle una lección a su hermano.</p>
<p><strong>Director:</strong> Duwayne Dunham · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Comedia, Familia</p>
<p><strong>Reparto:</strong> Rick Moranis, Ed O&#x27;Neill, Devon Sawa, Shawna Waldron, Todd Bosley, Michael Zwiener</p>
