<h1>Doomsday: El día del juicio</h1>
<p>Gran Bretaña, 2007. El letal virus «Reaper» ha aniquilado a cientos de miles de personas. El gobierno británico decide evacuar a los supervivientes sanos y rodear con una muralla el área afectada para evitar la huida de los infectados. Cuando, treinta años después, el virus reaparece, el gobierno envía a la zona un equipo de especialistas de élite, dirigido por el Mayor Eden Sinclair, con la misión de obtener una vacuna a cualquier precio. Aislado del resto del mundo, el equipo deberá trabajar en medio de un paisaje de pesadilla.</p>
<p><strong>Director:</strong> Neil Marshall · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Acción, Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Rhona Mitra, Bob Hoskins, Adrian Lester, Alexander Siddig, David O&#x27;Hara, Malcolm McDowell</p>
