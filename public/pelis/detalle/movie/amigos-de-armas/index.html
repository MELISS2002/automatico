<h1>Amigos De Armas</h1>
<p>Con la guerra en Irak en toda su furia, un joven ofrece a su amigo de la infancia la oportunidad de ganar mucho dinero al convertirse en un vendedor internacional de armas. Juntos, explotan una iniciativa del gobierno que permite a las empresas de participar en contratos militares. Pero pronto se verán involucrados en un asunto de alto nivel, después de obtener un contrato de 300 millones de dólares para abastecer a las fuerzas afganas, que los pone frente a personas sombrías.</p>
<p><strong>Director:</strong> Todd Phillips · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Comedia, Crimen, Drama</p>
<p><strong>Reparto:</strong> Miles Teller, Jonah Hill, Ana de Armas, Bradley Cooper, Kevin Pollak, Patrick St. Esprit</p>
