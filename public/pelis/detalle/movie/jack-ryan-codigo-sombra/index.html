<h1>Jack Ryan: Código Sombra</h1>
<p>Jack Ryan es un veterano de guerra que lleva una doble vida: es un ejecutivo de Wall Street y además trabaja de forma encubierta como analista de la CIA. Cuando descubre un complot meticulosamente planeado para hundir la economía norteamericana y sembrar el caos en todo el mundo, deciden que él es el hombre más adecuado para impedirlo debido a su habilidad para interpretar datos globales. Jack tendrá que viajar a Moscú para intentar descubrir toda la verdad, porque de ello depende la vida de millones personas, pero eso implica moverse en un mundo en el que no puede fiarse de nadie.</p>
<p><strong>Director:</strong> Kenneth Branagh · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Acción, Drama, Suspense</p>
