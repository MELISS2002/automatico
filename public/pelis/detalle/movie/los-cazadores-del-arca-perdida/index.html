<h1>Los cazadores del arca perdida</h1>
<p>Año 1936. Indiana Jones es un profesor de arqueología, dispuesto a correr peligrosas aventuras con tal de conseguir valiosas reliquias históricas. Después de una infructuosa misión en Sudamérica, el gobierno estadounidense le encarga la búsqueda del Arca de la Alianza, donde se conservan las Tablas de la Ley que Dios entregó a Moisés. Según la leyenda, quien las posea tendrá un poder absoluto, razón por la cual también la buscan los nazis.</p>
<p><strong>Director:</strong> Steven Spielberg · <strong>Año:</strong> 1981 · <strong>Géneros:</strong> Acción, Aventura</p>
