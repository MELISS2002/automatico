<h1>El lobo solitario y su cachorro: ¡ahora vamos al infierno, Daigorō!</h1>
<p>Sexta entrega de la serie de adaptaciones al cine de imágen real del famoso manga escrito por Kazuo Koike y dibujado por Goseki Kojima. Narra las aventuras de un Samurai que trabaja con su hijo siempre acompañándole en sus viajes. El fin de la saga, y la batalla definitiva entre Ogami Itto y Retsudo. Con la mayoría de su familia muerta a manos de Ogami, Retsudo lanza su último ataque para destruirlo. Una vez fracasado, Ogami desata toda su furia contra el ejercito de los Yagyu.</p>
<p><strong>Director:</strong> 黒田義之 · <strong>Año:</strong> 1974 · <strong>Géneros:</strong> Acción, Aventura, Drama, Fantasía, Suspense</p>
<p><strong>Reparto:</strong> 若山富三郎, 富川晶宏, 瞳順子, 睦五朗, 草野大悟, 宮口二郎</p>
