<h1>Mascotas En Apuros</h1>
<p>Gracie y Pedro son mascotas que no tienen nada en común. Gracie es una perrita snob de pura raza que se considera «la mejor del espectáculo», mientras que Pedro es un descarado gato rescatado que prefiere su cena recién sacada de la basura. Después de que la familia emprende una gran mudanza, la pelea entre Gracie y Pedro destruye la cinta de equipaje del aeropuerto, dejando a las mascotas perdidas y varadas sin sus collares en un mundo aterrador y desconocido.</p>
<p><strong>Director:</strong> Kevin Donovan · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> Claire Alan, Cory Doran, Susan Sarandon, Brooke Shields, Alicia Silverstone, Bill Nighy</p>
