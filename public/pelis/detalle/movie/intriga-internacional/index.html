<h1>Intriga internacional</h1>
<p>Este clásico filme de suspenso muestra al ejecutivo de publicidad de la Ciudad de Nueva York, Roger O. Thornhill siendo perseguido por el espía Phillip Vandamm después de que Thornhill es confundido con un agente gubernamental. Acechado por los socios de Vandamm, el fugitivo Thornhill termina en un viaje a través del país, conociendo en el camino a la hermosa y misteriosa Eve Kendall. Los hombres de Vandamm se acercan a Thornhill y provocan muchas secuencias de acción.</p>
<p><strong>Director:</strong> Alfred Hitchcock · <strong>Año:</strong> 1959 · <strong>Géneros:</strong> Aventura, Suspense</p>
<p><strong>Reparto:</strong> Cary Grant, Eva Marie Saint, James Mason, Jessie Royce Landis, Leo G. Carroll, Josephine Hutchinson</p>
