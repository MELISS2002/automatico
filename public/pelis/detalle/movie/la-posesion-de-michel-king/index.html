<h1>La posesion de Michel King</h1>
<p>La película cuenta la historia del documentalista Michael King (Shane Johnson), que no cree en Dios o el Diablo. Tras la muerte repentina de su esposa, Michael decide hacer su próxima película sobre la búsqueda de la existencia de lo sobrenatural, convirtiéndose en el centro del experimento, permitiendo que demonólogos, nigromantes y diversos practicantes del ocultismo prueben lo más profundo y oscuro hechizos y rituales que pueden encontrar en él, con la esperanza de que cuando fallen, él tendrá de una vez y para siempre pruebas de que la religión, el espiritualismo y lo paranormal no son más que un mito. Pero algo sucede. Una fuerza malvada y horrible se ha apoderado de Michael King. Y no lo dejará ir.</p>
<p><strong>Director:</strong> Craig Borden · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Shane Johnson, Ella Anderson, Cara Pifko, Julie McNiven, Tomas Arana, Dale Dickey</p>
