<h1>Un paseo por las nubes</h1>
<p>Después de regresar del frente, un soldado norteamericano (Keanu Reeves) conoce de forma casual a la hermosa hija del dueño de un viñedo (Aitana Sanchez-Gijón) y acepta ser presentado como su esposo para ayudarla a enfrentarse a su dominante padre. Cuando la pasión entre ellos se enciende con la mágica sensualidad del rito de la cosecha, se dan cuenta de que están embarcándose en una aventura romántica al tener que luchar contra todos para estar juntos.</p>
<p><strong>Director:</strong> Alfonso Arau · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Keanu Reeves, Aitana Sánchez-Gijón, Anthony Quinn, Angélica Aragón, Evangelina Elizondo, Debra Messing</p>
