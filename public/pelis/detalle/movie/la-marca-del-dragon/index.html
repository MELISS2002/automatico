<h1>La Marca del Dragón</h1>
<p>Liu Jian (Jet Li) es un experto agente del gobierno chino que llega a París desde Shanghai para desarrollar una delicada y ultrasecreta misión. Liu va a París para ayudar a Richard (Tchéky Karyo), un poco ortodoxo oficial de policía con un pequeño ejército a sus órdenes. La misión es un completo desastre, pues el hombre al que Liu ha de ayudar le traiciona. Liu se ve atrapado en una vasta y mortal conspiración: acusado de un asesinato que no ha cometido y perseguido en una ciudad que no conoce. Sin ningún lugar a dónde dirigirse, Liu se une a una chica americana llamada Jessica (Bridget Fonda), a quien Richard ha obligado a ejercer la prostitución. Mientras Jessica y Liu conspiran contra su taimado y cruel adversario que ha puesto ya en marcha sus respectivas trampas, Liu hace a Jessica una promesa que podría poner en peligro su carrera e incluso su vida.</p>
<p><strong>Director:</strong> Chris Nahon · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> 李连杰, Bridget Fonda, Tchéky Karyo, Ric Young, Burt Kwouk, Laurence Ashley</p>
