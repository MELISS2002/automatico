<h1>Extraordinario</h1>
<p>Basada en el Bestseller del New York Times, Extraordinario cuenta la inspiradora y alentadora historia de Agust Pullman. Nacido con deformaciones faciales que hasta ahora le impedían ir a una escuela primaria, Auggie se convierte en un héroe poco común cuando entra al quinto grado. Tanto su familia como sus compañeros de clases y la comunidad en general luchan por encontrar la compasión y la aceptación, el extraordinario viaje de Auggie los unirá y les probará que no puedes mezclarte cuando naciste para sobresalir.</p>
<p><strong>Director:</strong> Stephen Chbosky · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Drama, Familia</p>
<p><strong>Reparto:</strong> Jacob Tremblay, Julia Roberts, Owen Wilson, Izabela Vidovic, Noah Jupe, Millie Davis</p>
