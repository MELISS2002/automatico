<h1>Ainbo: La Guerrera Del Amazonas</h1>
<p>Una niña nació y creció en la selva más profunda del Amazonas, Colonia, que descansa sobre el lomo del Espíritu Materno más poderoso del Amazonas, Turtle Motelo Mama. Un día descubre que su tierra natal está siendo amenazada y se da cuenta de que hay otros humanos en el mundo además de su gente. Mientras lucha por salvar su paraíso contra la codicia y la explotación de los niños, la tala y la minería ilegal, comienza a luchar para revertir esta destrucción y el mal inminente de Yucuruna, la oscuridad que vive en el Amazonas. Guiada por el espíritu de su madre, Ainbo está decidida a salvar su tierra y salvar a su gente antes de que sea demasiado tarde.</p>
<p><strong>Director:</strong> José Zelada · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Animación, Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Lola Raie, Alejandra Gollas, Thom Hoffman, Bernardo de Paula, Dino Andrade, Yeni Alvarez</p>
