<h1>Cartas de Van Gogh</h1>
<p>Película homenaje a Van Gogh, la trama trascurre un año despues de su «suicidio» y en donde su ultima carta debe ser entregada, cada fotograma es un cuadro pintado sobre óleo, tal y como el propio Vincent lo hubiera pintado. Sus 80 minutos de duración están compuestos por 56.800 fotogramas que han sido pintados, uno a uno, por una gran cantidad de excelentes pintores a lo largo de varios años, todos inspirándose en el estilo y arte magistral de Van Gogh.</p>
<p><strong>Director:</strong> Hugh Welchman · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Animación, Drama, Historia</p>
<p><strong>Reparto:</strong> Douglas Booth, Robert Gulaczyk, Eleanor Tomlinson, Helen McCrory, Saoirse Ronan, Chris O&#x27;Dowd</p>
