<h1>El peleador</h1>
<p>Massachusetts, años 80. Dicky Eklund, un boxeador conflictivo pero con talento, intenta redimirse entrenando a su hermano menor. En sus buenos tiempos había sido el orgullo de su ciudad natal por haber tumbado una vez al campeón del mundo Sugar Ray Leonard; pero después vinieron los tiempos difíciles en los que se hundió en una peligrosa mezcla de drogas y delincuencia. Mientras tanto, su hermano Micky Ward se ha convertido en una promesa del boxeo, y las riendas de su carrera las lleva su madre. Sin embargo, a pesar de su potente gancho de izquierda, siempre acaba derrotado. Tras un combate que nunca debió celebrarse, Micky decide seguir el consejo de su novia Charlene y alejarse de su familia.</p>
<p><strong>Director:</strong> David O. Russell · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Mark Wahlberg, Christian Bale, Amy Adams, Melissa Leo, Mickey O&#x27;Keefe, Jack McGee</p>
