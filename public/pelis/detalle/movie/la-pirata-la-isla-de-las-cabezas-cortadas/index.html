<h1>La Pirata: La Isla de las Cabezas Cortadas</h1>
<p>Morgan Adams y su esclavo, William Shaw, se lanzarán a la búsqueda de los tres trozos de un mapa del tesoro. Por desgracia, el último trozo está en manos de su cruel tío Dawg. Su tripulación no cree mucho en sus dotes de liderazgo, así que antes deberá enfrentarse a un conato de motín contra ella. Todo se complicará aún más con los esfuerzos de la Corona Británica para terminar con sus incursiones piratas.</p>
<p><strong>Director:</strong> Renny Harlin · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Acción, Aventura</p>
