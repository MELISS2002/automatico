<p>Heidi, es un huérfano suizo de ocho años quien da su tía a su abuelo que mora en la montaña. Es robada entonces atrás por su tía de su abuelo para vivir en la casa de Sesemann rica en Francfort, Alemania como un compañero a Klara, una muchacha abrigada, minusválida en una silla de ruedas. Heidi está descontenta, pero hace la mejor de la situación, que siempre añora a su abuelo.</p>
<p><strong>Director:</strong> Annette Stefan · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Aventura, Drama, Familia</p>
