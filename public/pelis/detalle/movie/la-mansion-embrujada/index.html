<p>Jim Evers (Eddie Murphy), un agente inmobiliario adicto al trabajo, arrastra a su familia a la enorme y espantosa mansión Gracey con la intención de reconstruirla. Pero nada más llegar, se presentan ante la familia 999 macabros y burlones fantasmas que no están dispuestos a marcharse mientras no se terminen las obras. Jim se verá obligado a conjurar el maleficio y, al mismo tiempo, descubrirá cuánto le necesita su familia.</p>
<p><strong>Director:</strong> Rob Minkoff · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Comedia, Familia, Fantasía, Misterio, Suspense</p>
