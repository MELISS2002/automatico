<h1>Dulce venganza 3: La venganza es mía</h1>
<p>Jennifer Hills sigue siendo atormentada por el brutal asalto sexual que sufrió hace años. Ella ha cambiado identidades y ciudades, a regañadientes unirse a un grupo de apoyo donde comienza a reconstruir una nueva vida. Pero cuando el asesino de su nueva amiga se libere y los relatos de violadores en serie la persigan, Jennifer buscará a los hombres responsables y hará lo que el sistema no hará - hacerlos pagar por sus crímenes de la manera más horrible imaginable. Sólo que esta vez, ningún jurado podrá salvarla.</p>
<p><strong>Director:</strong> Sarah Willgrube · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Terror</p>
