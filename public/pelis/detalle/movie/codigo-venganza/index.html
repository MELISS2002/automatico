<h1>Código Venganza</h1>
<p>La historia de Tin Soldier nos presenta una especie de culto liderado por The Bokushi (Foxx), quien predica a cientos de veteranos atraídos con la promesa de obtener protección y un propósito para sus vidas. Después de que Emmanuel Ashburn (De Niro) ha intentado infiltrarse en la secta sin éxito, el agente militar recluta a Nash Cavanaugh (Eastwood), un exactivo de las fuerzas especiales que alguna vez fue discípulo de The Bokushi. Nash acepta usar su conocimiento interno sobre el enigmático líder mientras busca vengarse del hombre que le quitó todo, incluido el amor de su vida.</p>
<p><strong>Director:</strong> Brad Furman · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Acción, Suspense</p>
<p><strong>Reparto:</strong> Scott Eastwood, Jamie Foxx, Robert De Niro, Nora Arnezeder, Joey Bicicchi, John Leguizamo</p>
