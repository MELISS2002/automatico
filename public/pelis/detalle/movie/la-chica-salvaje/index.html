<h1>La chica salvaje</h1>
<p>La Chica Salvaje cuenta la historia de Kya, una niña abandonada que se crió hasta la edad adulta en los peligrosos pantanos de Carolina del Norte. Durante años, los rumores de la «Chica Marsh» rondaron a Barkley Cove, aislando a la astuta y resistente Kya de su comunidad. Atraída por dos jóvenes de la ciudad, Kya se abre a un mundo nuevo y sorprendente; pero cuando uno de ellos es encontrado muerto, la comunidad inmediatamente la señala como la principal sospechosa. A medida que se desarrolla el caso, el veredicto sobre lo que realmente sucedió se vuelve cada vez más confuso y amenaza con revelar los muchos secretos que yacen en el pantano.</p>
<p><strong>Director:</strong> Olivia Newman · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Drama, Misterio, Romance</p>
<p><strong>Reparto:</strong> Daisy Edgar-Jones, Taylor John Smith, Harris Dickinson, David Strathairn, Michael Hyatt, Sterling Macer Jr.</p>
