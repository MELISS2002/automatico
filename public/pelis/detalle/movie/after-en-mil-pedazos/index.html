<h1>After: En mil pedazos</h1>
<p>Ha pasado el tiempo, y Hardin (Hero Finnes Tiffin) todavía no se sabe si es realmente el chico profundo y reflexivo del que Tessa (Josephine Langford) se enamoró, o ha sido un extraño todo este tiempo. Ella quiere alejarse, pero no es tan fácil. Tessa se ha centrado en sus estudios y comienza a trabajar como becaria en Vance Publishing. Allí conoce a Trevor (Dylan Sprouse), un nuevo y atractivo compañero de trabajo que es exactamente el tipo de persona con la que debería estar. Pero Hardin sabe que cometió un error, posiblemente el más grande de su vida y quiere corregir sus errores y vencer a sus demonios&amp;#8230; Secuela de la película &amp;#8216;After&#x27;.</p>
<p><strong>Director:</strong> Chad Rosen · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Josephine Langford, Hero Fiennes Tiffin, Dylan Sprouse, Louise Lombard, Charlie Weber, Candice King</p>
