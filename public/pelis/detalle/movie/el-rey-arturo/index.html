<h1>El Rey Arturo</h1>
<p>Arturo (Clive Owen) está deseando abandonar Bretaña para regresar a la paz y estabilidad de Roma. Pero antes, una última misión le hace comprender tanto a él como a los caballeros de la Mesa Redonda (Lancelot, Galahad, Bors,Tristán y Gawain) que, tras la caída de Roma (476 d.C.), lo que Bretaña necesita es un rey que la defienda de la amenaza de la invasión sajona y los guíe hacia un tiempo nuevo. Guiado por Merlín y por la valiente y hermosa Ginebra (Keira Knightley), Arturo tendrá que encontrar en sí mismo la fuerza necesaria para cambiar el curso de la historia.</p>
<p><strong>Director:</strong> Antoine Fuqua · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Acción, Aventura, Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> Clive Owen, Ioan Gruffudd, Keira Knightley, Mads Mikkelsen, Joel Edgerton, Hugh Dancy</p>
