<p>Una tripulación de seis integrantes queda atrapada en una instalación submarina que se está inundando a gran velocidad como consecuencia de un sismo devastador. Su única oportunidad para sobrevivir es caminar a través del suelo marino hasta una lejana plataforma petrolífera abandonada. Además de los retos físicos que implica el viaje, descubren rápidamente que están siendo cazados por depredadores marinos míticos y monstruosos, dispuestos a matarlos.</p>
<p><strong>Director:</strong> William Eubank · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Terror</p>
