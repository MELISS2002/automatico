<p>Nancy Stokes, una maestra de escuela jubilada, anhela algo de aventura y sexo. Buen sexo. Su difunto marido Robert le proporcionaba un hogar, una familia y algo parecido a una vida, pero nunca tuvo buen sexo de él. Ahora que hace tiempo que Robert falleció, Nancy pone en marcha su plan y contrata a un joven gigoló que responde al exótico nombre de “Leo Grande”. En una habitación de hotel anónima, Nancy recibe a Leo. Su aspecto es tan bueno como el de su foto, pero lo que ella no esperaba era una gran conversación. Nancy descubre que le gusta. Y a él le gusta ella. Con una gran confianza sexual, Nancy empieza a relajarse. En el transcurso de su encuentro, la dinámica de poder cambia y las máscaras de los personajes empezarán a desmoronarse.</p>
