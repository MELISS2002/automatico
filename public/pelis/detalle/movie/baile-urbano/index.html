<h1>Baile Urbano</h1>
<p>Cuando DJ, un joven con problemas de Los Ángeles, se traslada a Atlanta, Georgia, a asistir a la universidad Truth, descubre el “stepping”, el antiguo estilo de baile que se practicaba tradicionalmente en las fraternidades afroamericanas, donde los equipos exhiben complejos movimientos y crean sonidos rítmicos utilizando sus cuerpos. El talento natural de DJ y los movimientos inspirados en el hip hop rápidamente le colocan en medio de una fiera rivalidad entre dos fraternidades, donde el ganador se determinará en un estadio hasta arriba de gente ansiosa por ver el campeonato anual de stepping. Pero antes de poder ayudar a sus compañeros DJ deberá empezar a descubrirse a sí mismo, a luchar contra sus propios demonios y a aprender el verdadero significado de la hermandad.</p>
<p><strong>Director:</strong> Sylvain White · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Drama, Música</p>
<p><strong>Reparto:</strong> Columbus Short, Meagan Good, Ne-Yo, Darrin Henson, Jermaine Williams, Chris Brown</p>
