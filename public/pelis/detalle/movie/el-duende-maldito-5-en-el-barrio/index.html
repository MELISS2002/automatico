<h1>El duende maldito 5: En el barrio</h1>
<p>Tras un largo y dorado letargo, el Leprechaun es devuelto a la vida por unos raperos torpes que quieren un trampolín para su carrera musical. Cuando Butch, Postmaster P y Stray Bullet saquean el estudio del rey local del hip-hop para financiar su maqueta, los tres dan sin querer con el secreto del éxito de Mack Daddy: una flauta mágica. Sus conciertos se convierten en oro instantáneamente pero un Leprechaun sediento de sangre y un airado Mack Daddy van tras ellos, dejando una estela de destrucción salpicada de rimas políticamente incorrectas…</p>
<p><strong>Director:</strong> Rob Spera · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Comedia, Terror</p>
