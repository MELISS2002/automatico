<h1>Mi vecino Totoro</h1>
<p>Dos chicas jóvenes, Mei y Satsuki, se mudan a una nueva casa cerca del hospital en el que se encuentra su madre. En el patio junto a la casa ,existe un gran árbol que es el hogar de tres Totoros, dioses de la selva. Poco después, reciben noticias desde el hospital de que su madre no puede venir a casa como había prometido, por lo que Mei (la más joven) se escapa para ir a visitarla. Satsuki tiene que recurrir a un Totoro para ayudar a encontrarla.</p>
<p><strong>Director:</strong> Hayao Miyazaki · <strong>Año:</strong> 1988 · <strong>Géneros:</strong> Animación, Familia, Fantasía</p>
<p><strong>Reparto:</strong> 日髙のり子, 坂本千夏, 高木均, 糸井重里, Sumi Shimamoto, 北林谷栄</p>
