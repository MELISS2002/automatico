<h1>Amityville 3-D</h1>
<p>La familia Baxter decide mudarse al número 112 de Ocean Avenue, en Amityville. La familia, que está pasando por malos momentos, conoce el pasado de la casa, siempre rodeado de muertes y misterio. Antes de mudarse, la hija de la familia muere en un accidente de barco, justo en el momento en el que les recomiendan no mudarse a esa casa. Una vez instalados, la madre de la familia Baxter comenzará a ver a su hija muerta en su hogar, por lo que el Sr. Baxter decide llamar a un investigador paranormal para averiguar que ocurre en aquel lugar.</p>
<p><strong>Director:</strong> Richard Fleischer · <strong>Año:</strong> 1983 · <strong>Géneros:</strong> Terror</p>
