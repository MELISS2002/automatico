<h1>Masacre en la cárcel 13</h1>
<p>Quedan pocas horas para que el año toque a su fin y en la comisaría del distrito 13, sólo queda un puñado de policías encabezado por el sargento Jake Roenick (Ethan Hawke), un buen oficial que no consigue olvidar una operación fallida que tuvo lugar la primavera pasada. Pero es que, además, ese mismo día por la mañana, un policía de paisano había intentado arrestar al mafioso Marion Bishop (Laurence Fishburne), el cual consiguió matar al agente antes de ser capturado por la Unidad contra el Crimen Organizado encabezada por Marcus Duvall (Gabriel Byrne). Bishop es trasladado en autobús a la cárcel, pero la tormenta de nieve arrecia y el autobús, ante la imposibilidad de llegar a la cárcel de máxima seguridad, se dirige provisionalmente a la comisaría del distrito 13.</p>
<p><strong>Director:</strong> Jean-François Richet · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Acción, Aventura, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Ethan Hawke, Laurence Fishburne, Gabriel Byrne, Maria Bello, Drea de Matteo, John Leguizamo</p>
