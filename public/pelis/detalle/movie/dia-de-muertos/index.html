<h1>Día de muertos</h1>
<p>En un pequeño pueblo donde los espíritus regresan una vez al año durante el Día de Muertos, vive Salma, una joven de 16 años, quien es la única en el pueblo que no puede traer a nadie pues no conoce el paradero ni identidad de sus padres. Desde pequeña lo ha investigado sin éxito, hasta que un día Salma y sus amigos, Jorge y Pedro, descubren una pista que los lleva por un camino lleno de aventuras, fantasmas, calaveras y un hombre misterioso hasta el inframundo.</p>
<p><strong>Director:</strong> Carlos Gutiérrez Medrano · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Animación, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Fernanda Castillo, Alan Estrada, Memo Aponte, Carlo Rota, Susana Ballesteros, Dani Artaud</p>
