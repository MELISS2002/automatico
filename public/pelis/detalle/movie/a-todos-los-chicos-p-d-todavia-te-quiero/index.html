<h1>A todos los chicos: P. D. Todavía te quiero</h1>
<p>Es un nuevo año y Lara Jean (Lana Condor) y Peter (Noah Centineo) ya no fingen ser pareja: son una pareja. Y, mientras ella prueba montón de cosas por primera vez junto a él - su primer beso de verdad, su primera cita real, su primer San Valentín - encuentra más apoyo en Kitty y Margot (Anna Cathcart y Janel Parrish), Chris (Madeleine Arthur) y una nueva e inesperada confidente, Stormy (Holland Taylor). Pero cuando John Ambrose (Jordan Fisher), otro destinatario de una de las viejas cartas de amor de Lara Jean, vuelve a entrar en su vida, debe confiar en sí misma más que nunca, ya que se enfrenta a su primer dilema verdadero ¿puede una chica estar enamorada de dos chicos a la vez?</p>
<p><strong>Director:</strong> Marijke Richman · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Lana Condor, Noah Centineo, Jordan Fisher, Anna Cathcart, John Corbett, Sarayu Blue</p>
