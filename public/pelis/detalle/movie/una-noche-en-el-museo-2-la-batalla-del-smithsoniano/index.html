<h1>Una Noche en el Museo 2: La Batalla del Smithsoniano</h1>
<p>El vigilante jurado Larry Daley se ve obligado a decir adiós a todos sus amigos cuando deciden hacer el Museo de Ciencias Naturales más «interactivo» y sustituyen todas las figuras por hologramas. Sus amigos históricos son empaquetados y enviados a los archivos del famoso Smithsonian, en Washington, DC., el museo más grande del mundo. No han pasado ni 24 horas cuando Larry recibe una llamada de Jedediah, el cowboy en miniatura, y descubre que la tabla de Ahkmenrah ha sido extraviada y esto ha hecho que el Smithsonian cobre vida. Para salvar a sus amigos, Larry tendrá que viajar a Washington, DC y luchar contra Kahmunrah, Al Capone, Iván el Terrible y Napoleón que han planeado un complot para apoderarse de la tabla. En medio del caos, Larry hará nuevos amigos, como Amelia Earhart o Albert Einstein que le ayudarán a detener el complot y salvar el museo.</p>
<p><strong>Director:</strong> Shawn Levy · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Acción, Aventura, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Ben Stiller, Amy Adams, Owen Wilson, Hank Azaria, Robin Williams, Christopher Guest</p>
