<h1>Ong Bak 2</h1>
<p>Tien es un niño que huye para salvar su vida. No entiende por qué, pero toda su familia ha sido asesinada y no tiene dónde esconderse. Capturado por comerciantes de esclavos, su coraje y su espíritu de luchador le salvarán de una muerte segura. Tien es rescatado por una cuadrilla de bandoleros que lo acogerán y lo instruirán en las artes marciales, convirtiéndose en un gran guerrero. Ya adulto, Tien (Tony Jaa) quiere encontrar respuesta a los misterios de su infancia y, sobre todo, quiere saciar su sed de venganza por la cruel muerte de sus padres&amp;#8230; Continuación de la aclamada película de artes marciales «Ong Bak». En esta ocasión el protagonista, Tony Jaa, también se encargará de la dirección.</p>
