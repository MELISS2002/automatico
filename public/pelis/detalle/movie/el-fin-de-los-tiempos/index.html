<h1>El Fin de Los Tiempos</h1>
<p>En unos minutos, en las principales ciudades de Estados Unidos, se producen unas extrañas y escalofriantes muertes que escapan a toda explicación. Elliot Moore (Wahlberg), un profesor de ciencias de Filadelfia, intentando eludir este misterioso y letal fenómeno, se dirige a Pensilvania con su mujer (Deschanel), su amigo Julian (Leguizamo) y la hija de éste; sin embargo, pronto queda de manifiesto que ningún lugar es seguro. Pero, de repente, Elliot empieza a vislumbrar la verdadera naturaleza de lo que está ocurriendo…</p>
<p><strong>Director:</strong> M. Night Shyamalan · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Mark Wahlberg, Zooey Deschanel, John Leguizamo, Ashlyn Sanchez, Betty Buckley, Spencer Breslin</p>
