<h1>Año Uno</h1>
<p>Zed, un supuesto cazador prehistórico, come de un árbol de fruta prohibida y es desterrado de su tribu, acompañado por Oh, un tímido recolector. En sus viajes, se encuentran con Caín y Abel en un fatídico día, impiden que Abraham mate a Isaac, se convierten en esclavos y llegan a la ciudad de Sodoma, donde su tribu ahora está esclavizada. Zed y Oh están decididos a rescatar a las mujeres que aman, Maya y Eema. En medio de su camino está el sumo sacerdote de Sodoma y el omnipresente Caín. Zed intenta formar una alianza con la princesa Innana, la cual puede ser contraproducente. ¿Puede un cazador inepto y un recolector inteligente pero delgado y tímido convertirse en héroes y marcar la diferencia?</p>
<p><strong>Director:</strong> Harold Ramis · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Aventura, Comedia</p>
<p><strong>Reparto:</strong> Jack Black, Michael Cera, Oliver Platt, David Cross, Christopher Mintz-Plasse, Vinnie Jones</p>
