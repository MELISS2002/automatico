<p>Heinrich Harrer fue un famoso alpinista austríaco que intentó la ascensión al Nanga Parbat; desgraciadamente, su aventura se vio bruscamente interrumpida por el estallido de la Segunda Guerra Mundial (1939-1945). Tanto él como su compañero, Peter Ausehnaiter, fueron recluidos en un campo de concentración, del que lograron escapar a través de las montañas.</p>
<p><strong>Director:</strong> Jean-Jacques Annaud · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Aventura, Drama, Historia</p>
