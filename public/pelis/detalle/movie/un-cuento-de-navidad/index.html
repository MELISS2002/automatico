<h1>Un cuento de Navidad</h1>
<p>Ebenezer Scrooge es un hombre mezquino y desalmado. El día de Navidad se presentan en su casa los fantasmas de las Navidades Pasadas, Presentes y Futuras, que lo obligan a contemplar no sólo los errores que ha cometido, sino las consecuencias que su conducta tendrá en el futuro. Esa visión cambia el corazón del viejo Scrooge que intentará reparar todo el mal que ha hecho antes de que sea demasiado tarde. Adaptación televisiva del famoso relato del escritor inglés Charles Dickens.</p>
<p><strong>Director:</strong> Clive Donner · <strong>Año:</strong> 1984 · <strong>Géneros:</strong> Drama, Familia, Fantasía, Película de TV</p>
<p><strong>Reparto:</strong> George C. Scott, Roger Rees, David Warner, Susannah York, Edward Woodward, Angela Pleasence</p>
