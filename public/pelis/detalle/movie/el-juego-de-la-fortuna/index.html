<h1>El juego de la fortuna</h1>
<p>Billy Beane (Brad Pitt) es el gerente general del equipo de béisbol Atléticos de Oakland, que acaba de perder otra temporada más. Decidido a relanzar el equipo, y con la ayuda del joven economista Peter Brand (Jonah Hill), utilizará las estadísticas de éste para fichar a los jugadores que cree más oportunos. Un método que no es compartido por sus compañeros, ni por el entrenador del equipo Art Howe (Philip Seymour Hoffman).</p>
<p><strong>Director:</strong> Bennett Miller · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Brad Pitt, Jonah Hill, Philip Seymour Hoffman, Robin Wright, Chris Pratt, Stephen Bishop</p>
