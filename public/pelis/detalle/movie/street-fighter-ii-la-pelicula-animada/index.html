<h1>Street Fighter II: La pelicula Animada</h1>
<p>Bison, el líder despiadado de la organización terrorista internacional Shadowlaw, ha estado buscando desesperadamente el mayor combatiente del planeta durante años. Lo encuentra en Ryu, un joven vagabundo que nunca permanece en un lugar el tiempo suficiente para que Bison lo encuentre. Él, sin embargo, consigue una solución en Ken Masters, un campeón de artes marciales de América que estudió con Ryu como un niño bajo el mismo maestro. Mientras tanto, el mayor Guile del ejército de Estados Unidos se ve obligado a unirse a Chun Li de China con la esperanza de detener a Bison y poner fin a su círculo internacional de delitos.</p>
<p><strong>Director:</strong> 杉井ギサブロー · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Acción, Animación</p>
<p><strong>Reparto:</strong> 清水宏次朗, 羽賀研二, 藤谷美紀, 津嘉山正種, 日下武史, Kaneto Shiozawa</p>
