<h1>Harold y Maude</h1>
<p>Aclamada comedia negra que relata la historia de un joven de buena familia obsesionado con la muerte, hasta el punto de que su pasatiempo favorito es probar diferentes métodos de suicidio. Harold frecuenta funerales de personas que no conoce. En uno de estos funerales se encuentra con Maude, una señora mayor quien también asiste a los funerales de extraños, aunque con una motivación muy diferente a la de Harold.</p>
<p><strong>Director:</strong> Hal Ashby · <strong>Año:</strong> 1971 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Ruth Gordon, Bud Cort, Vivian Pickles, Cyril Cusack, Charles Tyner, Ellen Geer</p>
