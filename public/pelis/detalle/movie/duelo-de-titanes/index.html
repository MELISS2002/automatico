<h1>Duelo de Titanes</h1>
<p>Corre el año 1971, cuando en la ciudad de Alexandria, Virginia, se tomó la polémica decisión de integrar en el Secundario T.C. Williams a los estudiantes de raza negra con los de raza blanca. Los jugadores blancos veían con temor el ingreso de jugadores negros al equipo, llamado «Los Titanes», pues ponía en peligro sus puestos. Su miedo aumentó cuando el hasta entonces entrenador Bill Yoast es reemplazado en su cargo por Herman Boone, de raza afroamericana.</p>
<p><strong>Director:</strong> Boaz Yakin · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Denzel Washington, Will Patton, Wood Harris, Ryan Hurst, Donald Faison, Craig Kirkwood</p>
