<h1>Quo Vadis</h1>
<p>Cuando regresa victoriosamente a Roma, después de tres años en el campo de batalla, el general Marco Vinicio se enamora de Ligia. Pero ella es cristiana y sus creencias le impiden enamorarse de un guerrero. Aunque fue adoptada por un general retirado, jurídicamente es un rehén de Roma, de modo que Marco consigue sin dificultad que el emperador Nerón se la ceda en pago por sus servicios.</p>
<p><strong>Director:</strong> Mervyn LeRoy · <strong>Año:</strong> 1951 · <strong>Géneros:</strong> Drama, Historia, Romance</p>
