<h1>Un tiro en la noche</h1>
<p>Un anciano senador del Congreso de los Estados Unidos, Ransom Stoddard, relata a un periodista la verdadera historia de por qué ha viajado junto a su mujer Hallie para acudir al funeral de un viejo amigo, Tom Doniphon. Todo comenzó muchos años atrás, cuando Ransom era un joven abogado del este que llegó en diligencia a Shinbone, un pequeño pueblo del Oeste, para ejercer la abogacía e imponer la ley. Poco antes de llegar a su destino, es atracado y golpeado brutalmente por el temido pistolero Liberty Valance.</p>
<p><strong>Director:</strong> John Ford · <strong>Año:</strong> 1962 · <strong>Géneros:</strong> Western</p>
<p><strong>Reparto:</strong> John Wayne, James Stewart, Vera Miles, Lee Marvin, Edmond O&#x27;Brien, Andy Devine</p>
