<h1>Viviendo con El enemigo</h1>
<p>Año 1946, Alemania después de la Segunda Guerra Mundial. Rachael Morgan (Keira Knightley) llega a Hamburgo para reunirse con su esposo, Lewis (Jason Clarke). La ciudad está en ruinas destruida por los embates de la guerra y es pleno invierno, el frio se deja sentir hasta los huesos. El coronel británico recibe la misión de reconstruir la destruida ciudad. Al mudarse a su nueva casa, Lewis toma una inusual decisión: compartirán esta gran casa con sus antiguos propietarios, a los que se les había requisado su propiedad. Ellos son Stephen Lubert (Alexander Skarsgård), un viudo alemán y su atormentada hija. En esta atmósfera cargada de rencor, odio y venganza, la hostilidad y el dolor dan paso a la ardiente pasión y la traición.</p>
<p><strong>Director:</strong> Nige Watson · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Bélica, Drama, Romance</p>
<p><strong>Reparto:</strong> Keira Knightley, Alexander Skarsgård, Jason Clarke, Martin Compston, Kate Phillips, Flora Thiemann</p>
