<h1>Jackass 3D</h1>
<p>Jackass 3D es una película filmada en 3D y la tercera película de la serie de Jackass. Sigue la misma premisa que las dos primeras películas, así como las series de TV. Es una compilación de varias travesuras, trucos y parodias. Antes de que la película comience, una breve introducción es hecha por el Beavis y Butt-head explicando la tecnología 3D detrás de la película. La entrada presenta el molde alineación y luego atacarse por varios objetos en el ralentí. La película marca el 10o aniversario de la licencia, comenzada en 2000.</p>
<p><strong>Director:</strong> Jeff Tremaine · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Acción, Comedia, Documental</p>
<p><strong>Reparto:</strong> Johnny Knoxville, Bam Margera, Ryan Dunn, Steve-O, Chris Pontius, Jason &#x27;Wee Man&#x27; Acuña</p>
