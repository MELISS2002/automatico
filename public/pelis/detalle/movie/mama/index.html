<h1>Mamá</h1>
<p>El día que su padre mató a su madre, las hermanas Victoria y Lilly desaparecieron en el bosque cercano a la urbanización donde vivían. Su tío Lucas y su novia Annabel las han buscado sin cesar durante cinco años. Cuando ocurre lo imposible y las niñas aparecen en una cabaña medio derruida, la pareja empieza a preguntarse si no ha llegado alguien más a su casa acompañando a las niñas. Annabel intenta ofrecer una vida normal a las niñas, pero acaba convencida de que hay una presencia malévola en la casa. ¿Sufren las hermanas de estrés traumático o viene un fantasma a visitarlas? Mientras intenta contestar a estas inquietantes preguntas, la nueva madre acabará descubriendo que los susurros que se oyen a la hora de dormir proceden de los labios de una presencia letal.</p>
<p><strong>Director:</strong> Andy Muschietti · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Jessica Chastain, Nikolaj Coster-Waldau, Megan Charpentier, Isabelle Nélisse, Daniel Kash, Melina Matthews</p>
