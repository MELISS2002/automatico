<h1>Monster house: La casa de los sustos</h1>
<p>D.J. Walters es un chico de doce años al que se le ha metido en la cabeza que en la casa del anciano Nebbercracker, al otro lado de la calle, ocurre algo extraño. La víspera de Halloween, el balón con el que juegan D.J. y su amigo va a parar al jardín del señor Nebbercracker, pero misteriosamente llega al interior de la vivienda. Cuando su amiga Jenny está a punto de ser engullida por la extraña casa, nadie cree a los asustados chicos; así que los tres deciden investigar qué sucede en esa extraña casa.</p>
<p><strong>Director:</strong> Gil Kenan · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Animación, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Mitchel Musso, Sam Lerner, Spencer Locke, Steve Buscemi, Maggie Gyllenhaal, Kevin James</p>
