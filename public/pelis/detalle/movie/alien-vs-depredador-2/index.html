<p>Una secuela de 2004 Alien vs. Depredador, las criaturas icónicas de dos de las franquicias cinematográficas más aterradoras en la historia del cine libran su batalla más brutal jamás: en nuestro propio patio trasero. La pequeña ciudad de Gunnison, Colorado se convierte en una zona de guerra entre dos de las formas de vida extraterrestre más mortíferas: Alien y Depredador. Cuando un barco explorador Depredador se estrella en las colinas fuera de la ciudad, Alien Facehuggers y un híbrido Alien / Depredador son liberados y comienzan a aterrorizar a la ciudad.</p>
<p><strong>Director:</strong> Colin Strause · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Acción, Ciencia ficción, Suspense, Terror</p>
