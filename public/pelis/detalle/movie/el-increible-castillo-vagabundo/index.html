<h1>El increíble castillo vagabundo</h1>
<p>Sophie es una joven de 18 años que trabaja sin descanso en la tienda de sombreros de la familia. En uno de sus frecuentes paseos conoce al enigmático mago Howl, lo que despierta la ira de la Bruja Calamidad, que odia a Howl con todas sus fuerzas. Cuando Sophie vuelve a la tienda, la Bruja se hace pasar por una clienta para acercarse a ella y lanzarle un hechizo… ¡que convierte a Sophie en una anciana de 90 años! Sophie, que no puede revelar su auténtica identidad, recurre a Howl para buscar una solución a su problema. Para ello se embarca en un viaje fantástico en el castillo ambulante del mago, habitado por personajes de lo más curiosos. Sophie necesita ayuda pero quizás sea Howl el que realmente está en apuros.</p>
<p><strong>Director:</strong> Hayao Miyazaki · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Animación, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> 倍賞千恵子, 木村拓哉, 美輪明宏, 我修院達也, 神木隆之介, 伊崎充則</p>
