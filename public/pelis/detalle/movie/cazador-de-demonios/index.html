<p>Finales del XVI-ppios del XVII. Cuento épico (basado en un personaje del creador de Conan) cuyo protagonista es un soldado que vive atormentado por sus actos del pasado y que busca la redención luchando contra un siniestro poder que amenaza su reino. Solomon Kane es un guerrero puritano cuya única meta en la vida es terminar con la maldad en todas sus formas. Sus aventuras lo llevan desde los oscuros submundos de las principales capitales europeas, hasta las frondosas y peligrosas junglas africanas.</p>
<p><strong>Director:</strong> MJ Bassett · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Acción, Aventura, Fantasía</p>
