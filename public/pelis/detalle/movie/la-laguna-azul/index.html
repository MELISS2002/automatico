<h1>La laguna azul</h1>
<p>Durante la época victoriana, dos jóvenes niños, Emmeline y Richard Lestrange son pasajeros de un velero que hace la ruta del cabo de Hornos con el padre de Richard, ya que los padres de Emmeline están muertos, y actúa como su tío. Un incendio provoca la destrucción de la nave, y el ayudante de cocina, Paddy, lleva a los niños en un bote salvavidas con él, pero ésto hace que los separen de los demás supervivientes, y los dejan a la deriva. Después de días sin rumbo fijo, llegan a una exuberante isla tropical.</p>
<p><strong>Director:</strong> Randal Kleiser · <strong>Año:</strong> 1980 · <strong>Géneros:</strong> Aventura, Drama, Romance</p>
<p><strong>Reparto:</strong> Brooke Shields, Christopher Atkins, Leo McKern, William Daniels, Jeffrey Kleiser, Gus Mercurio</p>
