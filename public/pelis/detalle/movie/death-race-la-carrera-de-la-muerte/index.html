<h1>Death Race: La carrera de la muerte</h1>
<p>En un futuro próximo. Una penitenciaría atestada de presos inspiró a los carceleros para crear un pasatiempo tan cruel como lucrativo. Presos capaces de todo, un público global hambriento de violencia televisada y un ruedo espectacular se unen en DEATH RACE. El tricampeón de velocidad Jensen Ames es todo un experto a la hora de sobrevivir en el desértico paisaje en el que se ha convertido el país. Cree haber cambiado de vida, pero el ex convicto es acusado de un terrible crimen que no ha cometido. La directora de Terminal Island le obliga a ponerse la máscara de Frankenstein, un favorito del público al que parece imposible matar, y le da dos opciones: competir o pudrirse en una celda. Con el rostro escondido detrás de la máscara metálica, el preso deberá sobrevivir a los tres días más terribles de su vida, enfrentándose a los peores criminales procedentes de las cárceles más duras del país si quiere salir libre.</p>
<p><strong>Director:</strong> Paul W. S. Anderson · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Acción, Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Jason Statham, Joan Allen, Ian McShane, Tyrese Gibson, Natalie Martinez, Max Ryan</p>
