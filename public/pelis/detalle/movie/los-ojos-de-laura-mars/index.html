<h1>Los ojos de Laura Mars</h1>
<p>Una polémica fotógrafa de moda, Laura Mars, está teniendo grandes dificultades para realizar su trabajo. A través del objetivo de su cámara, visualiza horribles asesinatos, en lugar de captar las sesiones de fotos. Laura corre hacia el escenario del crimen para tratar de evitarlo, pero llega demasiado tarde: la muerte ha ocurrido en el mismo lugar y del mismo modo en que ella lo había visto. Gradualmente se da cuenta de que posee una extraña conexión psíquica con el asesino. La policía no cree su historia, sin embargo, el teniente John Neville comienza a interesarse por ella.</p>
<p><strong>Director:</strong> Irvin Kershner · <strong>Año:</strong> 1978 · <strong>Géneros:</strong> Misterio, Suspense, Terror</p>
<p><strong>Reparto:</strong> Faye Dunaway, Tommy Lee Jones, Brad Dourif, René Auberjonois, Raúl Juliá, Darlanne Fluegel</p>
