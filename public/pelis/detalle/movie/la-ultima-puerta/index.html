<h1>La Última Puerta</h1>
<p>Dean Corso (Johnny Depp) es un bibliófilo dotado de una sólida cultura, nervios de acero y pocos escrúpulos. Es, además, un hombre extremadamente minucioso y eficaz en su trabajo. Gracias a su reputación, Boris Balkan, un coleccionista de textos satánicos, le encarga una misión muy peligrosa: encontrar los dos últimos ejemplares del legendario manual de invocación satánica ”Las Nueve Puertas del Reino de las Sombras”; pero los recursos de Corso son ilimitados. De Nueva York a Toledo, de París a Sintra, se verá inmerso en un laberinto lleno de peligros y tentaciones, aterradoras sorpresas, violencia y muertes inesperadas.</p>
<p><strong>Director:</strong> Roman Polanski · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Misterio, Suspense, Terror</p>
<p><strong>Reparto:</strong> Johnny Depp, Frank Langella, Lena Olin, Emmanuelle Seigner, Barbara Jefford, Jack Taylor</p>
