<h1>Bird Box: A Ciegas</h1>
<p>Thriller posapocalíptico en el que una mujer y sus dos hijos, estos con los ojos vendados, navegan río abajo tras una sangrienta invasión alienígena de la Tierra intentando evitar a las criaturas extraterrestres. Cuando algo misterioso diezma la población mundial, solo se sabe una cosa: si lo ves, te suicidas. Malorie (Sandra Bullock) deberá huir junto a sus dos hijos por un caudaloso y traicionero río, rumbo al único sitio que parece ofrecer refugio. Pero para sobrevivir, deberán completar el peligroso viaje de dos días con los ojos vendados.</p>
<p><strong>Director:</strong> Susanne Bier · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Drama, Suspense, Terror</p>
<p><strong>Reparto:</strong> Sandra Bullock, Trevante Rhodes, John Malkovich, Sarah Paulson, Jacki Weaver, Rosa Salazar</p>
