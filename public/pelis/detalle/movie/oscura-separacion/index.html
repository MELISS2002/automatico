<h1>Oscura separación</h1>
<p>Aunque sólo tiene ocho años, Jenny está constantemente atrapada en medio de la disputa entre su madre abogada Maggie y su padre artista Jeff. Lleva una vida solitaria pero imaginativa, rodeada de títeres llamados «Grisly Kin», que se basan en las obras de su padre. Cuando Maggie muere trágicamente víctima de un atropello, Jeff y Jenny intentan reconstruir una nueva vida. Pero cuando el padre de Maggie demanda la custodia de la niña y la niñera Samantha intenta ser la nueva mujer de la casa, la vida en su casa de Brooklyn, Nueva York toma un giro oscuro. Jenny ha encontrado consuelo en los títeres… y en el fantasma de su madre. Poco a poco, los personajes aterradores cobran vida y Jenny es la única persona que puede verlos.</p>
<p><strong>Director:</strong> William Brent Bell · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Misterio, Terror</p>
<p><strong>Reparto:</strong> Brian Cox, Rupert Friend, Madeline Brewer, Violet McGraw, Mamie Gummer, Troy James</p>
