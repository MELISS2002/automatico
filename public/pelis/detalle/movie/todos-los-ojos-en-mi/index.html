<p>Todo los ojos en Mí hace una crónica de la vida y la herencia de Tupac Shakur, incluso su subida al superestrellato como un artista de hip-hop, actor, poeta y activista, así como su encarcelamiento y tiempo prolífico, polémico en Archivos de la Celda de los condenados a muerte. Contra probabilidades insuperables, Tupac se levantó para hacerse un icono cultural cuya carrera y personaje ambos siguen cultivando mucho después de su paso.</p>
<p><strong>Director:</strong> Benny Boom · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Drama, Historia, Música</p>
