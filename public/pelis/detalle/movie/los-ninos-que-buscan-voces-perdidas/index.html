<h1>Los niños que buscan voces perdidas</h1>
<p>Asuna vive junto a su padre y, este antes de morir, le deja a su hija una radio de cristal un tanto peculiar, ya que con esta radio ella sube a una pequeña colina y así poder sintonizar extrañas melodías que sólo capta esa radio en especial. Un cierto día un monstruo ataca a Asuna, pero ella es rescatada por un chico, que responde al nombre de Shun, este joven chico procede de una dimensión paralela a la de donde se desarrolla la trama y donde vive la protagonista Asuna, la dimensión paralela es llamada Agartha.</p>
<p><strong>Director:</strong> 新海誠 · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Animación, Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> 金元寿子, 井上和彦, 入野自由, 日高里菜, Fumiko Orikasa, Sumi Shimamoto</p>
