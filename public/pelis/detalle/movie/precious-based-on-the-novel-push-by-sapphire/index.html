<h1>Precious: Based on the Novel &amp;#8216;Push&#x27; by Sapphire</h1>
<p>Claireece &amp;#8216;Precious&#x27; Jones tiene 16 años, es obesa y analfabeta y espera su segundo hijo de su propio padre ausente. Vive en Harlem, el reino de los invisibles, de los sin voz, con su madre, una reclusa cruel que mira la televisión sin cesar y la somete a los más denigrantes abusos. Forzada a abandonar la escuela a causa de su embarazo, Precious acaba en un instituto para casos desesperados. Y allí, en el último escalón de aquellos que ya han bajado todas las escaleras, está la señorita Rain, una maestra joven, combativa y radical a través de la cual Precious tendrá la posibilidad de recuperar su voz y su dignidad descubriendo un nuevo mundo en el que puede al fin expresarse de una manera que nunca antes había imaginado.</p>
<p><strong>Director:</strong> Lee Daniels · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Drama</p>
