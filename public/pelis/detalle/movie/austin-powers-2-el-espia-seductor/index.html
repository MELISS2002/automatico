<h1>Austin Powers 2: El Espía Seductor</h1>
<p>Tras ser congelado, Austin Powers, un agente secreto de los años 60, vuelve a la vida en los años 90. Se encuentra con una nueva sociedad en la que tendrá que enfrentarse con nuevos villanos, pero también con el Doctor Maligno, su máximo enemigo. El malvado doctor tiene un siniestro plan: ha inventado una máquina del tiempo que le permitirá volver a los años 60 y destruir a su archienemigo. Pero Powers contará con la ayuda de una bella agente para derrotarlo.</p>
<p><strong>Director:</strong> Jay Roach · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Aventura, Comedia, Crimen</p>
<p><strong>Reparto:</strong> Mike Myers, Heather Graham, Verne Troyer, Michael York, Robert Wagner, Seth Green</p>
