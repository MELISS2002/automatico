<h1>Tom y Jerry: De vuelta a Oz</h1>
<p>Con la Malvada Bruja del Oeste ahora vencida de Oz, ¡Tom y Jerry junto con Dorothy están de vuelta en Kansas! ¡Pero no por mucho tiempo, cuando un villano completamente nuevo ha emergido de debajo de la tierra mágica, el Rey Gnomo! ¡Habiendo capturado a la Bruja Buena, el Rey Gnomo y su ejército están causando estragos en todo Oz y solo necesitan un elemento para tomar el control de La Ciudad Esmeralda, las zapatillas de rubíes de Dorothy! Depende de nuestro dúo favorito de gatos y ratones formar equipo, regresar a Oz y salvar la tierra que aman. Ve a los cielos, cortesía del mismo Mago, con Dorothy, Toto, el Espantapájaros, el Hombre de Hojalata y el León mientras hacen su viaje mágico. Las risas y la aventura rugirán cuando encuentren nuevos sustos y criaturas traviesas en Yellow Brick Road, porque «ya no estamos en Kansas».</p>
<p><strong>Director:</strong> Spike Brandt · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Grey DeLisle, Joe Alaskey, Michael Gough, Rob Paulsen, Todd Stashwick, Frances Conroy</p>
