<h1>Las momias y el anillo perdido</h1>
<p>En las entrañas de la tierra, ¡existe una ciudad de momias! Por mandato imperial, la Princesa Nefer debe casarse con Thut, un ex auriga de carros. Ninguno desea el matrimonio; Nefer porque ansía la libertad, y Thut porque es alérgico al matrimonio. Pero los designios de los dioses son irrevocables: Thut deberá desposar a Nefer y custodiar el anillo real que el Faraón le ha otorgado; si algo le ocurriera a este, Thut perdería los ojos y la lengua. Mientras tanto, en nuestro mundo, Lord Carnaby lleva a cabo una excavación arqueológica y encuentra algo único: ¡un anillo de boda real egipcia! Thut debe ir al mundo de los humanos para recuperarlo. Le acompaña Sekhem, su hermano de 12 años, con su mascota cocodrilo, y Nefer. Juntos vivirán una gran aventura en la moderna Londres y descubrirán algo que no entraba en sus planes: enamorarse.</p>
<p><strong>Director:</strong> Juan Jesús García Galocha · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Animación, Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Joe Thomas, Eleanor Tomlinson, Santiago Winder, Hugh Bonneville, Sean Bean, Shakka</p>
