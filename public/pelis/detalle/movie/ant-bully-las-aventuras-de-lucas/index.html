<h1>Ant Bully: Las aventuras de Lucas</h1>
<p>Al pobre Lucas Nickle, un niño de 10 años, todo le sale mal. Hace poco que se ha mudado a una nueva ciudad con su familia y no se ha hecho ni un amigo. Su hermana Tiffany, una quinceañera, no hace más que darle la tabarra y últimamente sus padres no le hacen ni caso ya que están muy ocupados planeando su gran viaje de aniversario de bodas a Puerto Vallarta. Mientras tanto la abuela, cariñosa pero algo excéntrica, dedica su tiempo a proteger a la familia de unos extraterrestres que conoce a través de la prensa sensacionalista. Por si esto no fuera suficiente, Lucas es el blanco favorito del «bully» del lugar, Steve, quién no pierde oportunidad de intimidarle. A su vez, Lucas disfruta destruyendo los pequeños montículos que forman las hormigas en su jardín - descarga su frustración sobre los montículos de tierra y sus minúsculos habitantes pataleándoles, pisoteándoles, y regándoles con la manguera.</p>
<p><strong>Director:</strong> John A. Davis · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Zach Tyler Eisen, Julia Roberts, Meryl Streep, Nicolas Cage, Paul Giamatti, Bruce Campbell</p>
