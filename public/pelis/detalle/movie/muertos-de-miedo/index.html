<h1>Muertos de miedo</h1>
<p>Una vez un arquitecto, Frank Bannister ahora se hace pasar como un exorcista de espíritus malignos. Para sostener su fachada, afirma que su regalo «especial» es el resultado de un accidente de tráfico que mató a su esposa. Pero con qué no cuenta es más personas que mueren en la pequeña ciudad donde vive. Como intenta a la pieza juntos el misterio sobrenatural de estas matanzas, se cae enamorado de la esposa de una de las víctimas y trata con un Agente del FBI loco.</p>
<p><strong>Director:</strong> Peter Jackson · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Comedia, Terror</p>
<p><strong>Reparto:</strong> Michael J. Fox, Trini Alvarado, Peter Dobson, John Astin, Jeffrey Combs, Dee Wallace</p>
