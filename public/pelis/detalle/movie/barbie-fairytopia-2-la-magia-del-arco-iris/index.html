<h1>Barbie Fairytopia 2: La magia del arco iris</h1>
<p>Elina y su peludo amigo Bibble van a la Escuela de Hadas del majestuoso Palacio de Cristal. Allí conoce a otras aprendices de hadas, elegidas para crear el primer arco iris de la primavera. Pero la malvada Laverna, que pretende sumir Fairytopia en un largo y gélido invierno de diez años, intentará impedirlo. A pesar de ello, Elina y sus amigos se dan cuenta de que si se mantienen unidos serán invencibles y podrán crear el arco iris.</p>
<p><strong>Director:</strong> William Lau · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Animación, Familia, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Kelly Sheridan, Lee Tockar, Kathleen Barr, Christopher Gaze, Tabitha St. Germain, Venus Terzo</p>
