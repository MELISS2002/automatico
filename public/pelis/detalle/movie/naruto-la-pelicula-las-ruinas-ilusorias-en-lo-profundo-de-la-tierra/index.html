<h1>Naruto la Película: Las Ruinas Ilusorias en lo Profundo de la Tierra</h1>
<p>Cronológicamente, la película se encuentra situada después de la huida de Sasuke con Orochimaru. La trama de la película ronda alrededor de una piedra llamada Gelel, que tiene un poder fuerte y misterioso. Había un clan que podía controlar los poderes de la piedra una vez con ese poder podían hacer madurar los árboles en un solo día y curar heridas al instante. Pero este poder llevó a la disputa y al final todo acabó en guerra.</p>
<p><strong>Director:</strong> 川崎博嗣 · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Animación, Aventura, Fantasía</p>
