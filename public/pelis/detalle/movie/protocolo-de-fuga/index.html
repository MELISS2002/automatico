<h1>Protocolo de Fuga</h1>
<p>Un asesino cuya especialidad es eliminar a otros asesinos que intentan salir del negocio decide que es su turno para retirarse. Sin embargo, escapar no es tan sencillo, y deberá aliarse con su antiguo objetivo para evadir a los sicarios que ahora los persiguen a ambos. Esta alianza inesperada desata una vertiginosa lucha por la supervivencia en medio de traiciones y combates letales. Dirigida por Shane Dax Taylor, protagonizada por Scott Martin, Dolph Lundgren y Michael Jai White, «Protocolo de salida» es un thriller de acción que combina adrenalina y tensiones al límite.</p>
<p><strong>Director:</strong> Shane Dax Taylor · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Acción, Suspense</p>
<p><strong>Reparto:</strong> Scott Martin, Dolph Lundgren, Michael Jai White, Charlotte Kirk, Lina Maya, Stephanie Beran</p>
