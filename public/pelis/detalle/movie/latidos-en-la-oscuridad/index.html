<h1>Latidos en la oscuridad</h1>
<p>Latidos en la Oscuridad Sean (Robert Sheehan) y su amigo Derek (Carlito Olivero), son dos jóvenes que trabajan en el valet parking de un restaurante local y han desarrollado una estafa brillante para robar las casas de los clientes mientras ellos comen. Las cosas van bien hasta que uno de ellos roba al cliente equivocado, Cale Erendreich (David Tennant) y descubre que tiene a una mujer cautiva en su casa. Temeroso de ir a prisión, deja a la mujer y regresa el auto al restaurante. Lleno de culpa, llama a la policía, que no descubre nada en la casa de Erendreich. Ahora, el joven valet debe soportar la ira del secuestrador que busca vengarse de él, mientras trata desesperadamente de encontrar y rescatar a la mujer cautiva que dejó atrás</p>
<p><strong>Director:</strong> Dean Devlin · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Crimen, Drama, Suspense, Terror</p>
