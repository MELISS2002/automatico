<h1>Sobreviviendo en el desierto</h1>
<p>En el norte de África, el francotirador de los marines estadounidenses Mike Stevens y su observador Tommy Madison están en una misión secreta para asesinar a un peligroso líder terrorista que asiste a una boda beduina. Mike falla el intento de asesinato, dudando cuando el hijo del objetivo se interpone en el camino. Debido a un resplandor del alcance del francotirador, Mike y Tommy son descubiertos por el enemigo y atacados. Sin embargo, una tormenta de arena obliga al enemigo a retirarse, dejando atrás a Mike y Tommy. Buscando una evacuación inmediata, los dos tienen instrucciones de encontrar el camino a una aldea donde pueden ser recogidos una vez que la tormenta de arena se detenga.</p>
<p><strong>Director:</strong> Fabio Guaglione · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Bélica, Suspense</p>
<p><strong>Reparto:</strong> Armie Hammer, Annabelle Wallis, Tom Cullen, Geoff Bell, Juliet Aubrey, Clint Dyer</p>
