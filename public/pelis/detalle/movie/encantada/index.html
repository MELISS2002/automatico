<h1>Encantada</h1>
<p>Narra la odisea que debe vivir la bella princesa Giselle (Amy Adams), que es transportada por un hechizo de la malvada reina Narissa (Susan Sarandon) desde su mágico mundo a la moderna y caótica Manhattan actual. Inmersa en un entorno en el que «fueron felices y comieron perdices» no funciona, Giselle deambula por un mundo caótico que necesita urgentemente unos cuantos hechizos. Pero Giselle se enamora de un abogado divorciado, encantador pero nada perfecto (Patrick Dempsey) que decide ayudarla. A pesar de que en su mundo está prometida al príncipe de cuento de hadas (James Marsden), la joven princesa se hará la siguiente pregunta: ¿Su visión del amor ideal tiene futuro en el mundo real?</p>
<p><strong>Director:</strong> Kevin Lima · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Comedia, Familia, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Amy Adams, Patrick Dempsey, James Marsden, Timothy Spall, Idina Menzel, Rachel Covey</p>
