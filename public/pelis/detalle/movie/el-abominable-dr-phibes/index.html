<h1>El abominable Dr. Phibes</h1>
<p>Después de que un equipo de cirujanos acabara con la vida de su esposa en una chapucera intervención quirúrgica, el doctor Phibes (Vincent Price), un diabólico personaje, asesina a algunos de ellos utilizando terribles métodos extraídos de textos antiguos. Un detective de Scotland Yard (Peter Jeffrey) le sigue la pista con la ayuda del doctor Vesalius (Joseph Cotten), el jefe del equipo médico que operó a la mujer de Phibes.</p>
<p><strong>Director:</strong> Robert Fuest · <strong>Año:</strong> 1971 · <strong>Géneros:</strong> Comedia, Terror</p>
<p><strong>Reparto:</strong> Vincent Price, Joseph Cotten, Hugh Griffith, Terry-Thomas, Virginia North, Peter Jeffrey</p>
