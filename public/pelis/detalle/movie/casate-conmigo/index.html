<h1>Cásate Conmigo</h1>
<p>Bastian (Maluma) y Kat Valdez (Jennifer López) son una exitosa pareja de artistas que está a punto de casarse. Pero, cuando llega el gran día, Bastian deja plantada en el altar del Madison Square Garden a su prometida delante de miles seguidores y tras haber lanzado una canción acerca de su enlace. Sin embargo, Kat se acaba de enterar de que su pareja le había estado engañando con su asistente y, de forma repentina, decide casarse con uno de sus seguidores (Owen Wilson), a quien no conoce de absolutamente nada.</p>
<p><strong>Director:</strong> Christopher Surgent · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Comedia, Música, Romance</p>
<p><strong>Reparto:</strong> Jennifer Lopez, Owen Wilson, Maluma, John Bradley, Sarah Silverman, Chloe Coleman</p>
