<h1>Guardianes Del Día</h1>
<p>Secuela del popular filme fantástico ruso «Guardianes de la noche» (2004). Ambientada en el Moscú de nuestros días, la historia gira en torno al conflicto y al equilibrio que vienen manteniendo las fuerzas de la luz y la oscuridad como consecuencia de una tregua establecida desde la Edad Media entre ambos bandos contrapuestos. Pero esta antigua guerra entre las fuerzas de la Luz y la Oscuridad está a punto de alcanzar un trágico resultado. Cada bando ha ganado para sí a un potente Gran Otro, el choque entre ambos se adivina inevitable y Anton Gorodetsky se ve envuelto una vez más en medio de todo este conflicto. Por un lado está el hijo de Anton, Egor, que se ha sumado a las filas de la Oscuridad, mientras que Svetlana, de la que Anton está enamorado, representa la esperanza de la Luz. Pero esto no es más que el comienzo de sus problemas&amp;#8230;</p>
<p><strong>Director:</strong> Timur Bekmambetov · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Acción, Aventura, Fantasía, Suspense, Terror</p>
<p><strong>Reparto:</strong> Константин Хабенский, Мария Порошина, Владимир Меньшов, Галина Тюнина, Жанна Фриске, Виктор Вержбицкий</p>
