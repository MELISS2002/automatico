<p>Inglaterra, año 1554. Tras la muerte de la reina María Tudor, que ha dejado al país sumido en un estado de inestabilidad financiera y crisis religiosa, sube al trono Isabel I (Cate Blanchett). Popularmente se la conoce como «La Reina Virgen», aunque por su participación en el reparto del botín obtenido tras los ataques del corsario Drake a las costas españolas, tanto peninsulares como coloniales, es también conocida como «La Reina Pirata».</p>
<p><strong>Director:</strong> Shekhar Kapur · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Drama, Historia</p>
