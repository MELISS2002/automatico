<h1>Karate Kid III: El desafío final</h1>
<p>El joven karateka Daniel Larusso libra su batalla mas difícil cuando el malvado Kreese le arrastra a una complicada situacion, al obligarle a defender su título de campeón del torneo del Valley. Su maestro Miyagi no está de acuerdo y el joven rompe con él. Daniel tendra un nuevo profesor, que más que como karateka realmente le entrena como si fuera un asesino. Cuando Daniel comprende que el kárate sólo debe usarse para defender el honor y la vida, regresa a las enseñanzas de su viejo maestro.</p>
<p><strong>Director:</strong> John G. Avildsen · <strong>Año:</strong> 1989 · <strong>Géneros:</strong> Acción, Aventura, Drama, Familia</p>
<p><strong>Reparto:</strong> Ralph Macchio, Pat Morita, Robyn Lively, Thomas Ian Griffith, Martin Kove, Sean Kanan</p>
