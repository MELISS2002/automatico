<h1>Dragon Ball Super: Broly</h1>
<p>La Tierra se encuentra en paz luego de disputarse el Torneo del Poder. Al darse cuenta de que en el universo aún hay personas extremadamente fuertes, Goku pasa los días entrenando para alcanzar un nivel superior. Pero un día, Goku y Vegeta son confrontados por un misterioso Saiyajin llamado Broly. La raza Saiyajin debería haberse extinguido por completo tras la destrucción del Planeta Vegeta, pero entonces, ¿qué está haciendo en la Tierra? Freezer, que ha regresado del infierno, está involucrado nuevamente y el encuentro entre estos tres Saiyajins, que han tenido un destino totalmente diferente, se convertirá en una batalla feroz.</p>
<p><strong>Director:</strong> 長峯達也 · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Animación, Ciencia ficción</p>
<p><strong>Reparto:</strong> Masako Nozawa, Aya Hisakawa, Ryō Horikawa, 古川登志夫, Takeshi Kusao, 中尾隆聖</p>
