<h1>La Redada</h1>
<p>Todo el mundo en Jakarta sabe que en los barrios bajos de la ciudad hay un edificio que sirve de refugio para los criminales más peligrosos de Indonesia. Algo así como una fortaleza del mal cuya leyenda crece día a día y a la que incluso la policía teme acercarse. Pese a ello, un grupo de fuerzas especiales de élite intentará derribar sus defensas y penetrar en sus entrañas. Pero la operación no sale según lo previsto, y los policías se encontrarán atrapados en el edificio, sin escapatoria posible y rodeados de asesinos y gángsters.</p>
<p><strong>Director:</strong> Gareth Evans · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Iko Uwais, Joe Taslim, Donny Alamsyah, Yayan Ruhian, Pierre Gruno, Ray Sahetapy</p>
