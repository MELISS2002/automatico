<h1>Hombres de Negro 2</h1>
<p>Después del abandono del agente K, el agente J no considera su trabajo igual: Ambos formaban parte de un organismo secreto que lucha contra los extraterrestres, sin que el resto de los mortales lo sepan, pueblan la Tierra. La misión de los hombres de negro, como se les conoce por sus atuendos, es, en ocasiones imponer el orden y en otras luchar directamente contra quienes tienen pretensiones de hacer daño al planeta Tierra. Pero el agente K prefirió perder la memoria para volver con su esposa y llevar una vida normal. Ahora ya no tiene a su esposa pero es un amable agente de correos. El agente J, que considera a K como su maestro, le echa mucho de menos y no termina de adaptarse a sus nuevos compañeros. Pero algo va a cambiar los acontecimientos: una peligrosa extraterrestre llamada Serleena</p>
<p><strong>Director:</strong> Barry Sonnenfeld · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Acción, Ciencia ficción, Comedia</p>
