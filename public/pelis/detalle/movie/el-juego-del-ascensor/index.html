<h1>El Juego del Ascensor</h1>
<p>Basada en el reto viral en internet del mismo nombre. Ryan descubre que su hermana, la noche en que desapareció, había jugado al «Juego del Ascensor», un ritual en el que los jugadores intentan viajar a otra dimensión siguiendo unas reglas muy concretas. Los participantes deben acatarlas si no quieren perderse para siempre en el otro mundo. Ryan, ignorando las advertencias, decide ir a buscarla.</p>
<p><strong>Director:</strong> Rebekah McKendry · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Gino Anania, Verity Marks, Alec Carlos, Nazariy Demkowicz, Liam Stewart-Kanigan, Madison MacIsaac</p>
