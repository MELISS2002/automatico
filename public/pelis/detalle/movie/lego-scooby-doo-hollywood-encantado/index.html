<h1>Lego Scooby-Doo!: Hollywood encantado</h1>
<p>¡Oooh Hollywood! El glamour, el glam &amp;#8230; el jinete sin cabeza ?! ¡Únete a tu detective K-9 favorito, Scooby-Doo, junto con Shaggy y la pandilla de Mystery Inc., ya que se encuentran en un giro de la ciudad de oropel! Durante una gira VIP de los legendarios estudios de Brickton, Scooby y sus amigos obtienen una experiencia de primera mano de los rumores de que los monstruos de la película clásica caen en una llamada de casting espeluznante. Sólo hay una manera de resolver este thriller y salvar el estudio de envejecimiento: ¡es el tiempo mágico de la película de Mystery Inc! ¡Coge tus Scooby Snacks y salta en la silla del director para esta nueva película de LEGO®!</p>
<p><strong>Director:</strong> Rick Morales · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Animación, Comedia, Familia, Misterio</p>
<p><strong>Reparto:</strong> Frank Welker, Grey DeLisle, Matthew Lillard, Kate Micucci, Dee Bradley Baker, JB Blanc</p>
