<h1>Samurai X: El Guerrero Samurai</h1>
<p>Kenshin Himura (Takeru Sato) es un famoso samurái conocido por su destreza con la katana y su frialdad a la hora de matar. En el pasado estuvo al servicio de los Ishin Shishi, un grupo de patriotas que luchaban para devolver el poder al Emperador, librando cientos de batallas y cobrándose muchas vidas. Pero tras terminar todos los enfrentamientos, jura no volver a matar y decide pasar al anonimato para dedicarse a viajar por el país como un vagabundo ayudando a quien lo necesite, como penitencia por todas las muertes que provocó. Diez años después, en 1878, Kenshin llega a Tokio donde conoce a Kaoru (Emi Takei), quien le invita a quedarse en su dojo hasta que decida volver a vagabundear. Sin embargo, el pasado que Kenshin intentó dejar atrás pronto volverá para cobrarse venganza contra él. Adaptación del manga de Nobuhiro Watsuki.</p>
<p><strong>Director:</strong> 大友啓史 · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Acción, Aventura, Bélica, Fantasía, Historia</p>
<p><strong>Reparto:</strong> 佐藤健, 武井咲, 吉川晃司, 蒼井優, 青木崇高, 綾野剛</p>
