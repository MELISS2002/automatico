<h1>Zathura: Una aventura espacial</h1>
<p>Walter y Danny son dos hermanos de 6 y 10 años que con frecuencia andan envueltos en riñas fraternales. Un día, tras la marcha de su padre al trabajo, se quedan al cuidado de su hermana mayor. En medio de una de sus múltiples peleas los chicos descubren en el sótano de su casa un juego de mesa llamado Zathura. Desde la primera jugada se dan cuenta de que no es un juego de mesa normal: la ficha de la nave espacial se mueve sola y lanza mensajes que se cumplen. Zathura los transportará entonces, en el más estricto de los sentidos, a una enorme aventura en el espacio, donde se verán obligados a trabajar juntos si quieren volver a casa antes de que acabe la partida.</p>
<p><strong>Director:</strong> Jon Favreau · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Familia</p>
<p><strong>Reparto:</strong> Josh Hutcherson, Jonah Bobo, Dax Shepard, Kristen Stewart, Tim Robbins, Frank Oz</p>
