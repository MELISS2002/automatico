<h1>Eternamente Joven</h1>
<p>Año 1939. Daniel McCormick, piloto de pruebas, es un hombre al que todo le va bien en la vida. Todo cambia una mañana en la que su novia, Helen, tiene un desgraciado accidente. Desolado, se ofrece voluntario para un experimento secreto: El cuerpo de Daniel queda congelado en una cápsula experimental. En 1992, más de cincuenta años después, dos niños descubren la cápsula y descongelan el cuerpo, llevando a Daniel a casa de uno de ellos, que vive con su madre Claire.</p>
<p><strong>Director:</strong> Steve Miner · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Drama, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Mel Gibson, Jamie Lee Curtis, Elijah Wood, Isabel Glasser, George Wendt, Joe Morton</p>
