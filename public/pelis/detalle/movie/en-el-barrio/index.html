<h1>En El Barrio</h1>
<p>Se encienden las luces en el barrio de Washington Heights en Nueva York&amp;#8230; El aroma de un cafecito caliente flota en el aire a las afueras de la parada de metro en 181st Street, donde un caleidoscopio de sueños reúne a esta comunidad vibrante y unida. En la intersección de todo esto está el simpático y magnético propietario de la tienda del barrio, Usnavi, quien ahorra cada centavo de su rutina diaria mientras espera, imagina y canta sobre una vida mejor.</p>
<p><strong>Director:</strong> Joseph P. Reidy · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Anthony Ramos, Corey Hawkins, Leslie Grace, Melissa Barrera, Olga Merediz, Daphne Rubin-Vega</p>
