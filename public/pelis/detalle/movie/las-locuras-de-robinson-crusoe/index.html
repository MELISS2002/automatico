<h1>Las locuras de Robinson Crusoe</h1>
<p>Año 1659. Mak, un guacamayo alirrojo, vive en armonía junto a sus variopintos amigos en una isla tropical, un lugar que bien podría ser «el paraíso». Sin embargo, él echa en falta algo de acción: sueña con descubrir un nuevo mundo. Sus deseos parecen ser escuchados cuando tras una fuerte tormenta aparece en la costa Robinson Crusoe, único sobreviviente de un naufragio. Este ser es para Mak, a quien Robinson apoda Tuesday, la ventana al ‘nuevo mundo’. El humano irá ganándose la confianza del grupo hasta integrarse por completo. Lo que no sabían los animales es que tras el naufragio desembarcan con él varios intrusos felinos que pretenderán dominar la isla.</p>
<p><strong>Director:</strong> Vincent Kesteloot · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Animación, Aventura, Familia</p>
<p><strong>Reparto:</strong> Ilka Bessin, Dieter Hallervorden, Matthias Schweighöfer, Aylin Tezel, Kaya Yanar, Ron Allen</p>
