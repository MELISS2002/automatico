<p>Un ex agente federal de Estados Unidos debe abandonar el programa de protección de testigos y salir de su escondite cuando su casa de Londres es invadida por error debido a una dirección equivocada. Cuando el evento termina con múltiples homicidios, la noticia desencadena que quien le caza envía al asesino más peligroso de Europa para matarlo. Ahora a la fuga con su hija y su vida en peligro, un padre determinado debe ponerla a salvo ante la gente que ha estado escondiéndole pistas sobre lo ocurrido.</p>
