<h1>El niño</h1>
<p>Greta es una joven americana que acepta trabajar como niñera en Inglaterra huyendo de su pasado. Para su sorpresa, el niño al que tiene que cuidar es un muñeco a tamaño real. Además, en el cumplimiento de su trabajo tiene que seguir unas reglas muy estrictas. Cuando se queda sola, Greta desobedece las normas, lo que desencadena una serie de eventos perturbadores que le llevarán a convencerse de que el muñeco podría estar vivo.</p>
<p><strong>Director:</strong> William Brent Bell · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Misterio, Suspense, Terror</p>
<p><strong>Reparto:</strong> Lauren Cohan, Rupert Evans, James Russell, Jim Norton, Diana Hardcastle, Ben Robson</p>
