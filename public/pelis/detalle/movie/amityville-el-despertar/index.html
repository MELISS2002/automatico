<h1>Amityville: El Despertar</h1>
<p>Belle, su hermana pequeña y su comatoso hermano gemelo se mudan a una nueva casa junto a su madre soltera Joan para ahorrar dinero y así pagar el carísimo tratamiento de su hermano. Pero cuando extraños fenómenos comienzan a ocurrir en la casa, incluyendo la milagrosa recuperación de su hermano, Belle comienza a sospechar que su madre no la ha contado todo y pronto descubre que se han mudado a la infame casa de Amityville.</p>
<p><strong>Director:</strong> Franck Khalfoun · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Terror</p>
