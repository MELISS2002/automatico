<h1>Legalmente Rubia 2: Más Rubia que Nunca</h1>
<p>Elle Woods (Reese Witherspoon) quiere que su perro Chihuahua, Bruiser, se reúna con su madre porque le gustaría que la madre de Bruiser vaya a su boda (la de Elle). Elle contrata a un detective para que encuentre a su madre, sólo para descubrir que la compañía que tiene a la madre de su perro es una cosmética que usa a la madre de Bruiser para probar los cosméticos. Ella descubre que su estudio jurídico representa a C&#x27;est Magnifique Corporation, y en sus propuestas anuales propone que el estudio detenga los ensayos con animales de C&#x27;est Magnifique. Ella dice que el estudio sobre animales es injusto, y como resultado la echan del estudio jurídico.</p>
<p><strong>Director:</strong> Charles Herman-Wurmfeld · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Reese Witherspoon, Sally Field, Regina King, Jennifer Coolidge, Bruce McGill, Dana Ivey</p>
