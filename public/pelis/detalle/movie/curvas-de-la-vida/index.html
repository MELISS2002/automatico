<h1>Curvas de la vida</h1>
<p>Durante décadas, Gus Lobel ha sido uno de los mejores buscadores de talentos del béisbol, pero ahora ya está muy viejo. Aun así, él rechaza el retiro a pesar de que sus jefes cuestionan su juicio. Gus tiene la tarea de observar a la mayor promesa del país y se ve obligado a aceptar la ayuda de su hija Mickey. Dado que han pasado muy poco tiempo juntos en años, padre e hija indagan poco a poco en el pasado del otro.</p>
<p><strong>Director:</strong> Robert Lorenz · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Drama, Romance</p>
