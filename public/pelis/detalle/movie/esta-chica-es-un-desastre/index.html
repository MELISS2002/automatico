<h1>Esta Chica es un Desastre</h1>
<p>Desde pequeña, Amy ha oído a su padre decir que la monogamia no es un estado realista. La periodista vive de acuerdo con las creencias de su padre, disfrutando de una vida sin ataduras, libre de aburridas promesas románticas. Sin embargo, ha llegado a un punto muerto. Cuando descubre que se está enamorando del hombre al que dedica un artículo, un encantador y exitoso médico deportivo llamado Aaron Conners, Amy se replantea sus creencias y su estilo de vida.</p>
<p><strong>Director:</strong> Matt Rebenkoff · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Comedia, Romance</p>
