<h1>Amores Prohibidos</h1>
<p>30 de marzo de 1924, Beechwood (Inglaterra). El matrimonio Niven (Olivia Colman &amp;#038; Colin Firth) perteneciente a la aristocracia inglesa y que ha perdido a sus hijos en la guerra, se prepara para celebrar el Día de la Madre y el compromiso de Paul (Josh O&#x27;Connor), el hijo de sus vecinos, con Emma Hobday (Caroline Harker). Los Niven han dado el día libre a su criada, Jane Fairchild (Odessa Young), huérfana de nacimiento y, durante siete años, amante de Paul. Con la casa vacía, Paul y Jane se encontrarán por primera vez en el dormitorio de Paul. La joven pareja dará rienda suelta a la pasión clandestina sabiendo que la aventura llega a su fin y que será su último día como amantes.</p>
<p><strong>Director:</strong> Eva Husson · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Odessa Young, Josh O&#x27;Connor, Ṣọpẹ́ Dìrísù, Patsy Ferran, Emma D&#x27;Arcy, Glenda Jackson</p>
