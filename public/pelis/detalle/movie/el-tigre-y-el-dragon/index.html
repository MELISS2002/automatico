<h1>El tigre y el dragón</h1>
<p>China del año 43 (1779) y ambientada en la historia de la Dinastía Quing. Li Mu Bai, un virtuoso de las artes marciales, tiene en su poder una espada mágica conocida como «Destino Verde». Éste no quiere seguir siendo un guerrero, por lo que decide darle la espada a su mejor amigo, Sir Te. Antes de que llegue el momento de entregarla, se la confía a su enamorada, la guerrera Yu Shu Lien, quien será la encargada de llevarla a la ciudad de Pekín, donde se encuentra su compañero. Sin embargo, una noche, un enmascarado entra en la casa de Sir Te y roba la espada. Así, Mu Bai y Shu Lien se lanzarán en la búsqueda de «Destino Verde», despertando, con ello, viejos fantasmas del pasado.</p>
<p><strong>Director:</strong> 李安 · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Acción, Aventura, Drama, Romance</p>
<p><strong>Reparto:</strong> 周潤發, Michelle Yeoh, 章子怡, 張震, 郎雄, 鄭佩佩</p>
