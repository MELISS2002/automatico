<h1>El Exorcista</h1>
<p>Regan, una niña de doce años, es víctima de fenómenos paranormales como la levitación o la manifestación de una fuerza sobrehumana. Su madre, aterrorizada, tras someter a su hija a múltiples análisis médicos que no ofrecen ningún resultado, acude a un sacerdote con estudios de psiquiatría. Éste, convencido de que el mal no es físico sino espiritual, es decir que se trata de una posesión diabólica, decide practicar un exorcismo. Seguramente la película de terror más popular de todos los tiempos.</p>
<p><strong>Director:</strong> William Friedkin · <strong>Año:</strong> 1973 · <strong>Géneros:</strong> Drama, Terror</p>
<p><strong>Reparto:</strong> Ellen Burstyn, Linda Blair, Jason Miller, Max von Sydow, Lee J. Cobb, William O&#x27;Malley</p>
