<h1>Tierra de Osos 2</h1>
<p>La trama se centra de nuevo en Kenai (que había sido transformado en oso durante la primera parte) y sus aventuras en la pintoresca costa del Pacífico Norte al final de la Edad de Hielo. Kenai sueña repetidamente con su anterior vida como humano, cuando era niño y su mejor amiga era Nita, la hija del jefe de la tribu. Ahora ambos revivirán este pasado común cuando se ven obligados a embarcarse en una peligrosa aventura…</p>
<p><strong>Director:</strong> Ben Gluck · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Animación, Aventura, Familia</p>
