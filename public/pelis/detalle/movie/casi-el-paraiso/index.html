<h1>Casi el Paraíso</h1>
<p>Al llegar a México, el Conde italiano Ugo Conti supo que había encontrado el paraíso: un lugar donde la alta sociedad mexicana se rindió a los pies del joven aristócrata. Alonso Rondia, - político con sueños de grandeza - ve en Conti su pasaporte al poder ofreciéndole lujos, dinero ilimitado y el corazón de su hija Teresa. Mientras el Conde aprovecha su relación con Alonso, se reencontrará con Frida Becker, el amor de su vida, y la única persona que conoce toda la verdad sobre el oscuro pasado que lo persigue.</p>
<p><strong>Director:</strong> Edgar San Juan · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Comedia, Crimen, Drama</p>
<p><strong>Reparto:</strong> Andrea Arcangeli, Esmeralda Pimentel, Karol Sevilla, Miguel Rodarte, Maurizio Lombardi, Enrique Arreola</p>
