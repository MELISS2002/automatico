<h1>Shaman</h1>
<p>Una familia misionera viaja a una zona rural de Ecuador para convertir a la población indígena. Todo marcha aparentemente bien hasta que el hijo se adentra en una cueva prohibida y regresa portando un espíritu demoníaco. Candida, la madre, cree que un exorcismo católico puede liberarlo de esa fuerza maligna; sin embargo, los chamanes locales advierten que esta entidad es mucho más antigua que su religión, y que si no se enfrenta adecuadamente, podría destruirlos a todos.</p>
<p><strong>Director:</strong> Antonio Negret · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Sara Canning, Daniel Gillies, Jett Klyne, Lisandro Morales, Alejandro Fajardo, Segundo Fuérez</p>
