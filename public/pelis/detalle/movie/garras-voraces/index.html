<h1>Garras voraces</h1>
<p>Emily Young, hermana de la hermandad, quiere tener un año fantástico y se da cuenta de que podría ser la mejor opción para su hermandad. Al comenzar su campaña, encuentra un adorable perezoso que le roba el corazón y pronto se da cuenta de que podría robar los corazones y los votos de sus hermanas de la hermandad. Pero cuando los cuerpos poco a poco comienzan a acumularse en la casa de Sigma Lambda Theta, Emily y sus hermanas de la hermandad se dan cuenta de que las muertes están siendo causadas por su nueva mascota de la casa, el tierno perezoso Alpha. ¿Emily y sus hermanas escaparán de la casa con vida? ¿O este perezoso mortal con tres garras afiladas es demasiado rápido para ellos?</p>
