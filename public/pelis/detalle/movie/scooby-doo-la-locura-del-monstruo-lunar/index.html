<h1>Scooby-Doo! La locura del monstruo lunar</h1>
<p>¡Es un paso de gigante para la clase del perro ya que Scooby-Doo y la Cuadrilla despegan para una aventura épica, desapegada del mundo en esta todo-nueva película original! Después de ganar los 5 últimos asientos en una lotería, Scooby-Doo, Peludos, Fred, Daphne y Velma son lejos al espacio en el barco flamante del Barón Astuto multimillonario, la Estrella Astuta Un. ¡Es toda la diversión sin gravedad hasta que un extranjero misterioso comience a destruir el barco! ¡Como el barco se estropea, el equipo se obliga a aterrizar en la base del Barón Astuto&amp;#8230; en el lado oscuro de la luna! ¿Desenmarañará la cuadrilla este misterio extranjero? ¿Van Scooby-Doo y Peludo encuentran bocados en la luna? ¿Quitará Alguna vez Fred su casco espacial?! ¡Viaje a los límites externos con Scooby-Doo para averiguar!</p>
