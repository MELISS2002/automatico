<h1>Triunfos Robados: Enfrentamiento mundial</h1>
<p>Vivica A. Fox hace su debut como Bring It On como Cheer Goddess, el popular «Cheer-lebrity» de Internet. Cuando Destiny (Prosperi), capitán de los tres campeones nacionales «The Rebels», es desafiado a un enfrentamiento global por un nuevo equipo llamado «The Truth», la diosa Cheer organiza una batalla virtual para escuadras de todo el mundo . Parece que el mundo entero quiere derribar a Destiny ya su equipo, y ellos podrían tener éxito, a menos que Destiny pueda resistir el desafío, dejar su ego aparte y averiguar quiénes son sus verdaderos amigos.</p>
<p><strong>Director:</strong> Jon-Luke Lourens · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Cristine Prosperi, Jordan Rodrigues, Gia Lodge-O&#x27;Meally, Sophie Vavasseur, Sven Ruygrok, Stephan Lee Benson</p>
