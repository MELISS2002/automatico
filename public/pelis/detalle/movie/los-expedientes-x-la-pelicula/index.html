<h1>Los Expedientes X: La película</h1>
<p>En el norte de Texas, un joven cae en una grieta del suelo mientras juega con sus amigos y éstos contemplan cómo es atacado por un cáncer negro que también infecta a dos bomberos que intentaban rescatarle. Mientras tanto los agentes del FBI Fox Mulder y Dana Scully, apartados de los expedientes-x, inspeccionan un edificio federal de Dallas cuando algo inesperado sucede.</p>
<p><strong>Director:</strong> Rob Bowman · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Ciencia ficción, Misterio, Suspense</p>
<p><strong>Reparto:</strong> David Duchovny, Gillian Anderson, Mitch Pileggi, William B. Davis, John Neville, Martin Landau</p>
