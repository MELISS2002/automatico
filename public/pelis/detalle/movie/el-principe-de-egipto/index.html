<h1>El Príncipe de Egipto</h1>
<p>En Egipto, hace miles de años, el Faraón Seti ordena el ahogamiento de todos los bebés judíos. Una madre desesperada coloca a su bebé en una cesta río abajo y deja que Dios la guíe hasta la orilla en donde será hallada por la esposa del Faraón y el bebé, Moisés, criado como hermano del heredero al trono, Ramsés. Años después los hermanos se distanciarán por el descubrimiento de los orígenes hebreos de Moisés.</p>
<p><strong>Director:</strong> Simon Wells · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Animación, Aventura, Drama, Familia</p>
<p><strong>Reparto:</strong> Val Kilmer, Ralph Fiennes, Michelle Pfeiffer, Sandra Bullock, Jeff Goldblum, Danny Glover</p>
