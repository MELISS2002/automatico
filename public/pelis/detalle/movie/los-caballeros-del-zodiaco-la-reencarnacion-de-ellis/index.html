<h1>Los Caballeros del Zodiaco: La Reencarnación de Ellis</h1>
<p>Eris, la diosa de la discordia, ha vuelto a la Tierra bajo la forma de una manzana de oro, tomando posesión del cuerpo de Erii Aizawa, una joven maestra del orfanato de la Fundación Graude. Capturando a Saori Kido, la reencarnación de Atena, Eris desafía a los Caballeros de bronce a enfrentar a su ejército de los Caballeros, los Guerreros Fantasma, para rescatar a Atena, antes de la puesta de sol . Primera película basada en el manga/anime Saint Seiya.</p>
<p><strong>Director:</strong> 森下孝三 · <strong>Año:</strong> 1987 · <strong>Géneros:</strong> Acción, Animación, Fantasía</p>
