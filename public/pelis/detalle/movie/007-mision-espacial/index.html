<h1>007: Misión espacial</h1>
<p>El agente secreto James Bond recibe la orden de localizar la nave espacial Moonraker, que ha desaparecido misteriosamente. Sus primeras pesquisas lo llevan a seguir al millonario Hugo Drax, el constructor de la nave. Tras ser capturado por Drax, Bond descubre que el villano posee una base de lanzamiento de cohetes espaciales con los que se propone esparcir un gas tóxico que acabe con la vida terrestre, pero ésta no es más que la primera fase de un perverso plan que Bond intentará frustrar con la ayuda de la Doctora Goodhead.</p>
<p><strong>Director:</strong> Lewis Gilbert · <strong>Año:</strong> 1979 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Roger Moore, Lois Chiles, Michael Lonsdale, Richard Kiel, Corinne Cléry, Bernard Lee</p>
