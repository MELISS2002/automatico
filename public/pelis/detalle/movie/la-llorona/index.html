<h1>La Llorona</h1>
<p>Con las palabras «si lloras, te mato» retumbando todavía en sus oídos, Ánima y sus hijos son asesinados en el conflicto bélico de Guatemala. Treinta años después, se abre una causa penal contra Enrique, un general retirado que estuvo al frente del genocidio. Mas el juicio es declarado nulo y es exculpado, y el espíritu de La Quejica se libera para deambular por el planeta como un ánima perdida entre los vivos. Por las noches, Enrique empieza a escucharla plañir. Su mujer y su hija piensan que está padeciendo accesos de demencia relacionados con el Alzheimer. Ninguno de los 3 sospecha que su nueva ama de llaves, Ánima, planea producir venganza para corregir lo que para ella fue un juicio injusto.</p>
<p><strong>Director:</strong> Fernando Schmukler · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Drama, Suspense, Terror</p>
<p><strong>Reparto:</strong> María Mercedes Coroy, Sabrina De La Hoz, Margarita Kénefic, Julio Díaz, María Telón, Juan Pablo Olyslager</p>
