<h1>Alguien tiene que ceder</h1>
<p>Harry Sanborn es un solterón recalcitrante que sólo sale con mujeres mucho más jóvenes que él. Él y Marin, su última conquista, han planeado un romántico fin de semana en la casa de la playa de la madre de ella. Cuando Harry sufre un infarto, la madre de Marin, Erica Barrry, una famosa escritora divorciada, acepta a regañadientes cuidarlo hasta que se reponga. La sorpresa de Harry es grande cuando se da cuenta de que se siente atraído por ella, que, a su vez, gracias a Harry, descubre de nuevo el amor. Pero a Erica también la corteja un joven y encantador médico. Una vez recuperado, Harry vuelve a su casa y a sus viejos hábitos. Sin embargo, la relación con Erica ha alterado su vida y sus sentimientos.</p>
<p><strong>Director:</strong> Nancy Meyers · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Jack Nicholson, Diane Keaton, Keanu Reeves, Frances McDormand, Amanda Peet, Jon Favreau</p>
