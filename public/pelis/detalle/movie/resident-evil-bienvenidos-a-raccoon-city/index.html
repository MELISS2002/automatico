<h1>Resident Evil: Bienvenidos a Raccoon City</h1>
<p>Raccoon City, antaño la floreciente sede del gigante farmacéutico Umbrella, es ahora una ciudad del Medio Oeste en vías de extinción. El éxodo de la compañía ha dejado la ciudad convertida en un páramo&amp;#8230; con un gran mal que se está gestando bajo la superficie. Cuando ese mal se desata, los habitantes de la ciudad cambian para siempre&amp;#8230; y un pequeño grupo de supervivientes debe colaborar para descubrir la verdad sobre Umbrella y sobrevivir a la noche.</p>
<p><strong>Director:</strong> Samantha McMeekin · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Acción, Ciencia ficción, Terror</p>
