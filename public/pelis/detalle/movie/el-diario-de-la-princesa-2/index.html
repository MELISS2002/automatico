<h1>El Diario De La Princesa 2</h1>
<p>Mia ya está preparada para ser princesa de Genovia. Sin embargo, nada más instalarse en el Palacio Real con su bella y sabia abuela, la Reina Clarisse, se entera de que tendrá que prepararse inmediatamente para ser reina. Pero, entonces, tendrá que afrontar un peliagudo problema: en Genovia hay una ley que establece que las princesas tienen que casarse antes de ser coronadas; así que Mia tendrá que soportar un desfile de pretendientes cuya única aspiración es ocupar el trono.</p>
<p><strong>Director:</strong> Garry Marshall · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Comedia, Drama, Familia, Romance</p>
<p><strong>Reparto:</strong> Anne Hathaway, Julie Andrews, Héctor Elizondo, John Rhys-Davies, Heather Matarazzo, Chris Pine</p>
