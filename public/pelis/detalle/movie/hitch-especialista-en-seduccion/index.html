<h1>Hitch: Especialista en seducción</h1>
<p>Alex Hitchens «Hitch» es conocido en su trabajo como el «Doctor de las Citas»: es capaz de conseguir que una mujer se enamore del hombre más mediocre del que nunca imaginó que lo haría en tan solo tres citas. Hitch es un experto en mujeres, puede saber todo sobre ellas, más de lo que suelen imaginar ellas mismas, y se conoce todos los trucos que uno pueda imaginar para conseguir que sus clientes, normalmente personas inseguras y tímidas, acaben teniendo idilios con las mujeres más despampanantes de la ciudad. Cuando Sara Melas, una periodista sensacionalista procedente del mundo de los cotilleos, decide hundirle en los medios creándole una imagen de farsante, surgirá una gran atracción entre los dos, que pondrá a prueba todo lo que Hitch creía conocer sobre las mujeres.</p>
<p><strong>Director:</strong> Andy Tennant · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Will Smith, Eva Mendes, Kevin James, Amber Valletta, Julie Ann Emery, Adam Arkin</p>
