<h1>La Pandilla 2: Pequeños Traviesos Al Rescate</h1>
<p>¡Disfruta a lo grande con Spanky, Alfalfa, Darla, Buckwheat, el perro Petey y la pandilla al completo, ya que se disponen a llevar a cabo sus habituales travesuras! La Pandilla está tratando de conseguir el dinero que necesita su abuela para salvar su panadería. El único problema es que no hacen nada bien. Desde un chapucero servicio de lavado de mascotas a un no menos espantoso servicio de taxi. No logran obtener ni un céntimo. Su única esperanza es ganar el premio de un concurso de talentos locales… pero ¿habéis oído cantar a Alfalfa?.</p>
<p><strong>Director:</strong> Alex Zamm · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Jet Jurgensmeyer, Drew Justice, Jenna Ortega, Connor Berry, Camden Gray, Isaiah Fredericks</p>
