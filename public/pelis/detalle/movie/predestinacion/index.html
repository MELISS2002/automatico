<h1>Predestinación</h1>
<p>Un agente especial de un departamento secreto del gobierno, una agencia creada en los años 80 que permite realizar viajes en el tiempo, tendrá que realizar una compleja serie de «saltos» hacia atrás en el tiempo con el fin de detener al conocido como «el terrorista fallido», un individuo que está poniendo bombas por todo el país con miles de víctimas. En uno de sus viajes a los 70, el agente, que trabaja encubierto como camarero de un bar, conoce a un hombre que le narra una historia extraordinaria.</p>
<p><strong>Director:</strong> Peter Spierig · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Ethan Hawke, Sarah Snook, Noah Taylor, Christopher Kirby, Madeleine West, Jim Knobeloch</p>
