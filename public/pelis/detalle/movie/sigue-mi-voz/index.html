<h1>Sigue mi voz</h1>
<p>Trata sobre Klara, una joven que, tras una crisis de salud mental, se encierra en casa y encuentra consuelo escuchando el programa de radio nocturno «Sigue mi voz», presentado por el misterioso Kang, de quien se enamora platónicamente por su voz; la trama se centra en su lucha por superar sus miedos, sanar y encontrar el coraje para enfrentar el mundo, especialmente cuando descubre que Kang podría ser uno de sus nuevos compañeros en el instituto, explorando temas como el amor propio, la autoestima y la salud mental.</p>
<p><strong>Director:</strong> Inés Pintor · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Berta Castañé, Jae Woo, Claudia Traisac, Fernando Guallar, Itziar Ituño, Nuno Gallego</p>
