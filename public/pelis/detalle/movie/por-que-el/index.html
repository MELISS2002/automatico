<h1>¿Por qué él?</h1>
<p>Durante sus vacaciones, Ned (Bryan Cranston), un padre sobreprotector y su familia visitan a su hija en la Universidad, donde conocerán a su mayor pesadilla: su novio, Laird (James Franco), un multimillonario de Silicon Valley bien intencionado pero socialmente bastante complicado. El conservador Ned, piensa que Laird es la pareja menos apropiada para su hija. La rivalidad unilateral y el nivel de pánico de Ned se disparan cuando descubre además que Laird está a punto de hacerle a su hija “la pregunta”.</p>
<p><strong>Director:</strong> John Hamburg · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Comedia</p>
