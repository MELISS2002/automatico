<article>
<h1>Disco, Ibiza, Locomía</h1>
<p>Estamos en la España de mediados de los 80. Un grupo de amigos capitaneados por Xavi Font (Jaime Lorente), acaban de llegar a Ibiza persiguiendo su sueño de dedicarse a la moda. Allí les descubre el productor José Luís Gil (Alberto Ammann), un magnate de la industria musical que busca nuevos talentos para lanzar un grupo. Sin tener ni idea de cantar, el grupo inicia una carrera que les lleva de vivir como hippies en Ibiza, a llenar estadios en Latinoamérica y revolucionar de paso las discotecas de medio mundo. Crearon un nuevo estilo, fueron perseguidos por fans y ganaron millones… Aunque para ello tuvieron que sacrificar su libertad.</p>
<p><strong>Director:</strong> Kike Maíllo · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Drama, Música</p>
<p><strong>Reparto:</strong> Jaime Lorente, Alberto Ammann, Alejandro Speitzer, Iván Pellicer, Pol Granch, Javier Morgade</p>
