<h1>Loco por Mary</h1>
<p>Ted (Ben Stiller), un torpe y tímido adolescente, tiene una cita de graduación con la chica de sus sueños, Mary Jensen (Cameron Diaz). La cita es un desastre cuando Ted tiene un doloroso y humillante problema con la cremallera de su pantalón y tiene que ir al hospital. Mary se traslada a otro estado lejos de Ted, y nunca se volvieron a ver. Trece años después, éste sigue enamorado de Mary. Por consejo de su mejor amigo Dom (Chris Elliott), decide contratar a un detective privado llamado Pat (Matt Dillon) para encontrarla; sólo que Pat también se enamora de Mary. Ted y Pat acaban mintiéndose, engañándose en su competencia por Mary y descubren que no son sólo ellos los únicos que toman medidas desesperadas para estar cerca de Mary.</p>
<p><strong>Director:</strong> Peter Farrelly · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Cameron Diaz, Matt Dillon, Ben Stiller, Lee Evans, Chris Elliott, Lin Shaye</p>
