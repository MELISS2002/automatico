<h1>Salvaje</h1>
<p>Kyle LeBlanc (Van Damme) es un estadounidense que trabaja en Rusia. Cuando escucha a su esposa ser atacada por teléfono, Kyle corre a casa para encontrar que ya es demasiado tarde. El hombre que mató a su esposa no es encontrado culpable por la falta de pruebas y soborno al juez. Así que Kyle toma la ley en sus propias manos, y mata al hombre para vengar la muerte de su esposa. Él es condenado a cadena perpetua sin posibilidad de libertad condicional. La prisión rusa a la que es enviado es bastante violenta, y el director se divierte organizando violentas peleas mano a mano donde se llena los bolsillos con dinero de apuestas. Kyle comienza a ceder a la presión y a perder la cordura, por lo que se ve obligado a entrar a estas luchas. La muerte de su amigo de prisión, lo hace pensar en que es por lo que está luchando. Con eso, Kyle sabe que ahora debe librar otra batalla: la lucha por la paz interior. Es la única manera que puede convertirse en el hombre que una vez fue</p>
