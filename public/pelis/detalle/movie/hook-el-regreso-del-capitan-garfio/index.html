<h1>Hook: El Regreso del Capitán Garfio</h1>
<p>Peter Pan es un prestigioso abogado y tiene una encantadora familia, pero ha perdido el contacto con algo maravilloso: su infancia. Sin embargo, cuando sus hijos son secuestrados por su antiguo enemigo, el Capitán Garfio, y llevados al País de Nunca Jamás, también él tendrá que viajar a ese reino encantado, donde, con la ayuda de Campanilla, podrá recuperar no sólo a sus hijos, sino también al niño que un día fue.</p>
<p><strong>Director:</strong> Steven Spielberg · <strong>Año:</strong> 1991 · <strong>Géneros:</strong> Aventura, Comedia, Familia, Fantasía</p>
