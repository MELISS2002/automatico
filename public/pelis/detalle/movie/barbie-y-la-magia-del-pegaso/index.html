<h1>Barbie y la magia del pegaso</h1>
<p>Barbie aprende a volar en su primer cuento de hadas y princesas con argumento original. La princesa Annika (Barbie) emprende una fabulosa aventura al trabar amistad con Brietta, un espléndido caballo alado que la lleva al hermosísimo Reino de las Nubes. Annika tiene solo 3 días para romper el conjuro de Wenlock, un brujo malvado que ha convertido en piedra a su familia. En su empeño por derrotar a Wenlok, Annika conoce a nuevos amigos y juntos viajan a bosques prohibidos, patinan en cavernas heladas y vuelan sobre las nubes intentando construir una varita mágica de luz.</p>
<p><strong>Director:</strong> Greg Richardson · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Animación, Familia, Romance</p>
<p><strong>Reparto:</strong> Kelly Sheridan, Kathleen Barr, Lalainia Lindbjerg, Colin Murdock, Mark Hildreth, Brian Drummond</p>
