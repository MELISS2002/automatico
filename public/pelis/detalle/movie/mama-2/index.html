<h1>Mamá</h1>
<p>Meredith (Emily Hampshire), una madre desconsolada, queda completamente sola tras la devastadora muerte de su hijo recién nacido, un suceso que destroza su mundo. Abandonada por su pareja y su familia, se refugia en el silencio asfixiante de su hogar, donde la soledad la consume. Sin embargo, la trágica muerte de su hijo ha engendrado algo mucho más oscuro: una entidad forjada a partir de la angustia y el dolor. Esta fuerza maligna se inmiscuye en su vida, manipulando su realidad y obligándola a revivir los momentos más desgarradores de su pasado en un bucle interminable y aterrador.</p>
<p><strong>Director:</strong> Adam O&#x27;Brien · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Suspense, Terror</p>
