<h1>R.I.P.D.: Policía del más allá</h1>
<p>Aunque Nick es un policía que acaba de morir asesinado, es reclutado para trabajar con Roy, un agente que murió hace cientos de años. Ambos forman parte del “Rest In Peace Department”, que se encarga de perseguir a los demonios que habitan en el mundo de los vivos y de mandarlos al infierno. A Nick le cuesta hacerse a la idea de su condición de muerto, y no acepta estar alejado de su esposa, a la que envía reiteradas señales para que perciba su presencia. Al menos, gracias a su empleo post mortem, el joven agente podrá trabajar en el caso de su propio asesinato.</p>
<p><strong>Director:</strong> Robert Schwentke · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Acción, Comedia, Fantasía</p>
<p><strong>Reparto:</strong> Jeff Bridges, Ryan Reynolds, Kevin Bacon, Mary-Louise Parker, Stephanie Szostak, Robert Knepper</p>
