<h1>Muerte en el Expreso de Oriente</h1>
<p>Adaptación de una de las novelas más conocidas de Agatha Christie. Narra la historia de un asesinato perpetrado durante un viaje en el legendario Orient Express. La investigación del famoso detective belga Hercules Poirot (Albert Finney) tropieza con grandes dificultades, pues los ilustres pasajeros disponen de una coartada que los excluye como sospechosos. Inmejorable reparto para un film que consiguió un Óscar (mejor actriz secundaria:Ingrid Bergman) y seis nominaciones.</p>
<p><strong>Director:</strong> Sidney Lumet · <strong>Año:</strong> 1974 · <strong>Géneros:</strong> Drama, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Albert Finney, Lauren Bacall, Martin Balsam, Ingrid Bergman, Sean Connery, Anthony Perkins</p>
