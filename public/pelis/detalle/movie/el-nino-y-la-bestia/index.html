<h1>El niño y la bestia</h1>
<p>Ren es un niño de nueve años que acaba de perder a su madre, con la que ha vivido desde el divorcio de sus padres. Sin saber nada de su padre, rechaza vivir con sus tutores legales y se escapa hacia las calles de Shibuya enfadado con todo el mundo. Mientras, en el Reino de las bestias el Venerable ha decidido que va a retirarse para así poder reencarnarse en un dios y para ello nombra dos sucesores potenciales: Iôzen, muy popular entre los ciudadanos y padre de dos hijos, y Kumatetsu, fuerte pero solitario y triste. El Venerable le sugiere a Kumatetsu que busque y acoja a un aprendiz con la esperanza de sucederle&amp;#8230;</p>
<p><strong>Director:</strong> 細田守 · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Acción, Animación, Aventura, Drama, Familia, Fantasía</p>
