<h1>RoboCop 2</h1>
<p>Después de un despliegue exitoso de la unidad de la Aplicación de la ley Robocop, OCP ve su objetivo de la pacificación urbana venir más cerca y más cerca, pero ya que esto se desarrolla, un nuevo narcótico conocido ya que «la Bomba nuclear» invade las calles conducidas por la Caña del líder Delirante por Dios. Cuando esta amenaza crece, puede resultar ser demasiado para Murphy para manejarse. OCP trata de reproducir el éxito de la primera unidad, pero termina con prototipos fracasados con cuestiones suicidas&amp;#8230; hasta el Dr. Faxx, un científico que se extravía lejos del camino del OCP, usa la Caña como el nuevo sujeto para el proyecto de Robocop 2, Dios vivo.</p>
<p><strong>Director:</strong> Irvin Kershner · <strong>Año:</strong> 1990 · <strong>Géneros:</strong> Acción, Ciencia ficción, Suspense</p>
