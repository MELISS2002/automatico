<h1>Mickey, Donald, Goofy: Los tres mosqueteros</h1>
<p>En la versión de Disney sobre el cuento de Alexander Dumas, Mickey Mouse, El pato Donald y Goofy no quieren más que realizar acciones valientes en nombre de su reina (Minnie Mouse), pero están bloqueados por el jefe Mosquetero, Pete. Pete secretamente quiere deshacerse de la reina, por lo que designa a Mickey y sus amigos torpes como guardianes de Minnie, pensando que tal maniobra asegurará el éxito de su plan. La partitura presenta canciones basadas en melodías clásicas familiares.</p>
<p><strong>Director:</strong> Donovan Cook · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> Wayne Allwine, Tony Anselmo, Bill Farmer, Russi Taylor, Tress MacNeille, Jim Cummings</p>
