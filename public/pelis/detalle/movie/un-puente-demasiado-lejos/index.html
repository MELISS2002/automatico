<h1>Un puente demasiado lejos</h1>
<p>En septiembre de 1944, alentados por el éxito de la invasión de Normandía, los aliados emprendieron con determinación la operación «Market Garden», un arriesgado plan para poner fin lo antes posible a la guerra, invadiendo Alemania y destruyendo la industria bélica de Hitler. La clave era conquistar varios puentes por los que pasarían las tropas. No obstante, las estrategias en el campo de batalla, combinadas con los errores del servicio de información, la mala suerte y las pésimas condiciones climáticas condujeron la operación a un desenlace inesperado.</p>
<p><strong>Director:</strong> Richard Attenborough · <strong>Año:</strong> 1977 · <strong>Géneros:</strong> Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> Dirk Bogarde, James Caan, Michael Caine, Sean Connery, Edward Fox, Robert Redford</p>
