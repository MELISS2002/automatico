<h1>El cuadro robado</h1>
<p>Un día, André Masson, subastador de la famosa casa de subastas Scottie&#x27;s, recibe una carta en la que se afirma que se ha encontrado un cuadro de Egon Schiele en la casa de un joven obrero de Mulhouse. Muy escéptico, acude al lugar y se ve obligado a afrontar los hechos: la obra es auténtica, una obra maestra desaparecida desde 1939, expoliada por los nazis. André ve en este descubrimiento la cumbre de su carrera, pero también el inicio de una batalla que podría ponerla en peligro. Afortunadamente, va a contar con la ayuda de su ex mujer y colega Bertina, y de su caprichosa aprendiz Aurore&amp;#8230;</p>
