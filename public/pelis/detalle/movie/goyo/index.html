<h1>Goyo</h1>
<p>Goyo es un hombre con Asperger, fanático de Van Gogh, que trabaja como guía en el Museo de Bellas Artes en la Ciudad de Buenos Aires. Su estructurada rutina se ve interrumpida cuando conoce a Eva, la nueva guardia de seguridad del museo, y el enamoramiento y la ternura se apoderan de él. Ella es una mujer que perdió la fe en el amor por una crisis en su matrimonio, y que por momentos la hace perder también la fe en sí misma. El inesperado encuentro entre Goyo y Eva les hará descubrir otra forma de amar y ser amados.</p>
<p><strong>Director:</strong> Marcos Carnevale · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
