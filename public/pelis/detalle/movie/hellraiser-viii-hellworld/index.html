<h1>Hellraiser VIII: Hellworld</h1>
<p>Los cenobitas se apoderan del ciberespacio. Cuando cinco acérrimos jugadores de un juego de internet son invitados a una fiesta especial organizada por la web HELLWORLD, están a punto de enfrentarse a una noche de terror como creían que solamente podía existir en el ciber espacio. Tras la muerte de uno de ellos en extrañas circunstancias, ocurrida un año atrás, y estrechamente vinculada con el mundo de Hellraiser, los cinco no pueden evitar seguir visitando la web ni acudir a la fiesta organizada por ésta.</p>
<p><strong>Director:</strong> Rick Bota · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Katheryn Winnick, Christopher Jacot, Henry Cavill, Khary Payton, Anna Tolputt, Lance Henriksen</p>
