<h1>Toro Salvaje</h1>
<p>Jake la Motta es un joven boxeador que se entrena duramente con la ayuda de su hermano y mánager Joey. Su sueño es convertirse en el campeón de los pesos medios. Pero Jake es un paranoico muy violento que descarga su agresividad tanto dentro como fuera del ring. Incluso su hermano es víctima de su enfermizo carácter. Cuando, por fin, alcanza el éxito, su vida se convierte en una pesadilla. Por un lado, su matrimonio marcha cada vez peor debido a sus contantes salidas nocturnas con otras mujeres; por otro, la mafia lo presiona para que amañe combates.</p>
<p><strong>Director:</strong> Martin Scorsese · <strong>Año:</strong> 1980 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Robert De Niro, Cathy Moriarty, Joe Pesci, Frank Vincent, Nicholas Colasanto, Theresa Saldana</p>
