<h1>Paranorman</h1>
<p>En la ciudad de Blithe Hollow, Norman Babcock es un niño que puede hablar con los muertos, pero nadie más que su excéntrico nuevo amigo, Neil, cree que su habilidad es real. Un día, el tío excéntrico de Norman le dice que debe realizar un importante ritual anual para proteger a la ciudad de una maldición lanzada por una bruja condenada hace siglos. Eventualmente, Norman decide cooperar, pero las cosas no van según el plan. Ahora, una tormenta mágica de la bruja amenaza a Blithe Hollow cuando los malditos muertos se elevan. Junto con nuevos compañeros inesperados, Norman lucha por salvar su ciudad, sólo para descubrir la horrible verdad de la maldición. Con esa visión, Norman debe resolver la crisis para bien como sólo él puede.</p>
<p><strong>Director:</strong> Sam Fell · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> Kodi Smit-McPhee, Tucker Albrizzi, Anna Kendrick, Casey Affleck, Christopher Mintz-Plasse, Leslie Mann</p>
