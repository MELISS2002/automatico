<h1>Percy Jackson y el mar de los monstruos</h1>
<p>Percy Jackson no se siente un héroe. El semidiós hijo de Poseidón el dios griego del mar pudo salvar el mundo en una ocasión, pero Percy está empezando a pensar que pudo ser fruto de la casualidad. Y ahora la pregunta es: ¿ha resultado ser un fiasco? Ahora que Percy ha descubierto que tiene un hermanastro que es un monstruo, se pregunta si ser el hijo de Poseidón es una bendición o, más bien, una maldición&amp;#8230;</p>
<p><strong>Director:</strong> Thor Freudenthal · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Aventura, Familia, Fantasía</p>
