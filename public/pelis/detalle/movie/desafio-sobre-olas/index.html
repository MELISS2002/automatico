<h1>Desafío sobre olas</h1>
<p>Es la historia verdadera inspiradora del surfista joven Bethany Hamilton. Bethany perdió su brazo izquierdo en un ataque del tiburón y valientemente venció todas las probabilidades para hacerse una campeona otra vez, a través de su determinación escarpada y fe constante. Bethany nació para hacer surf. Un talento natural quien tomó a las ondas en una edad joven, conducía una vida idílica en Kauai, participando en concursos del oleaje nacionales con su mejor amiga Alana, cuando todo cambió. Durante la mañana de la Víspera de todos los Santos, un tiburón del tigre de 14 pies no salió en ninguna parte y pareció rompió todos sus sueños. El Surfista del alma revela la lucha de Bethany para reponerse de sus ordalías y cómo luchó cuerpo a cuerpo con la pregunta de su futuro.</p>
<p><strong>Director:</strong> Sean McNamara · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Drama, Familia</p>
<p><strong>Reparto:</strong> AnnaSophia Robb, Helen Hunt, Dennis Quaid, Carrie Underwood, Kevin Sorbo, Ross Thomas</p>
