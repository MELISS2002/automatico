<h1>Lejos del mundanal ruido</h1>
<p>La independiente, inteligente y joven Bathsheba Everdene (Carey Mulligan) se gana la vida cuidando una granja más bien modesta. El joven y próspero ganadero Gabriel Oak (Matthias Schoenaerts) se enamora de ella y le propone matrimonio, pero Bathsheba quiere ser libre y no acepta su ofrecimiento. Sin embargo, el destino cambia la fortuna de ambos, pues ella hereda de su tío la mayor granja de la localidad y él pierde en un accidente sus bienes, teniendo que ganarse la vida como jornalero, a quien ella contrata. La nueva posición de Bathsheba la deja en situación de elegir entre los tres pretendientes que la rondan, Gabriel Oack; Frank Troy (Tom Sturridge), un experimentado y temerario sargento; y William Boldwood (Michael Sheen), un maduro y rico soltero. Basada en la clásica novela de Thomas Hardy.</p>
<p><strong>Director:</strong> Thomas Vinterberg · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Carey Mulligan, Matthias Schoenaerts, Michael Sheen, Tom Sturridge, Juno Temple, Jessica Barden</p>
