<h1>Los Dukes de Hazzard: El comienzo</h1>
<p>Los primos Bo y Luke son dos adolescentes adictos a las juergas y a la velocidad, y con gran facilidad para meterse en todo tipo de líos y problemas. Con el fin de que sienten cabeza, sus padres los envían a trabajar durante todo el verano a la granja de su tío Jesse, en Hazzard. Los chicos no tardan en darse cuenta de que Boss Hoss, el hombre más acaudalado del condado, pretende desplumar a los ciudadanos de Hazzard y quedarse con la granja del tío Jesse -donde se destila ilegalmente el mejor licor de los alrededores-. Con la ayuda de su prima Daisy, poseedora de los shorts mas cortos de todo el condado, y de su coche, “el general Lee”, los primos Duke harán todo lo posible para truncar los planes de Boss Hoss..</p>
<p><strong>Director:</strong> Robert Berlinger · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Acción, Aventura, Comedia, Película de TV</p>
<p><strong>Reparto:</strong> Jonathan Bennett, Randy Wayne, April Scott, Joel David Moore, Harland Williams, Sherilyn Fenn</p>
