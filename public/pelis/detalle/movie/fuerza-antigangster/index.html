<h1>Fuerza antigángster</h1>
<p>Los Angeles, 1949. Mickey Cohen, originario de Brooklyn, se ha convertido en el gran jefe de la mafia que dirige la ciudad. Todos parece pasar por sus manos: drogas, armas, prostitutas, y cualquier material robado. Se encuentra absolutamente protegido por los miembros de su clan, que lo veneran como a su líder indiscutible, pero no solo eso, pues sus tentáculos van más allá de los bajos fondos: parte del cuerpo de policía y algunos miembros del sector político se encuentran bajo su influjo. Sin embargo, todavía hay hombres dentro de la brigada policial que no se dejan amedrentar por la corrupción. Es el caso de los sargentos John O&#x27;Mara y Jerry Wooters, que contra todo y contra todos, intentarán destruir el imperio del todopoderoso Cohen.</p>
