<h1>Casper y la mágica Wendy</h1>
<p>Huyendo del envidioso brujo Desmond, Wendy y sus tías, tres brujas perversas y alocadas llamadas Gert, Gaby y Fanny, se esconden en un centro vacacional situado en plena montaña. Allí es donde inesperadamente se encontrarán con Casper y el trío fantasmal Látigo, Tufo y Gordi. La diversión sobrenatural llega al máximo cuando los fantasmas y las brujas unen sus fuerzas para salvar a Wendy y frustar los planes del malvado brujo Desmond.</p>
<p><strong>Director:</strong> Sean McNamara · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Comedia, Familia, Fantasía, Película de TV</p>
