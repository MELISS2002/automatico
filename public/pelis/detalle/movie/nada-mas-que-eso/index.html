<h1>Nada más que eso</h1>
<p>Oliwia es una chef de la gran ciudad que vive la vida que siempre quiso. Sus raíces rústicas están deshilachadas por el distanciamiento entre su madre y su abuela después de que la primera vendiera parte de las tierras familiares. Sin embargo, cuando muere su abuela, tiene que volver a su pintoresco pueblo. Pero al llegar, se entera de que su gruñona abuela Helina le ha jugado una mala pasada ya que está decidida a salvar su granja.</p>
<p><strong>Director:</strong> Bartosz Prokopowicz · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Comedia, Romance</p>
