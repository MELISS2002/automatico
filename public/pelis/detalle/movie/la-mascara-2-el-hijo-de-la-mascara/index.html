<h1>La Máscara 2: El hijo de la máscara</h1>
<p>Diez años después de perturbar la vida de un hombre ingenuo, la famosa máscara de Loki cae en manos de un joven padre: cuando el caricaturista Tim Avery supera su temor a la paternidad tras el nacimiento de su primer hijo, descubre que el niño ha nacido con los poderes de la máscara. La situación se complica cuando el celoso perro de la familia se enfrenta al niño por el control de la máscara. Lo que todos ignoran es que Loki (Alan Cumming), el malvado dios escandinavo, busca la máscara y está dispuesto a todo con tal de recuperarla.</p>
<p><strong>Director:</strong> Lawrence Guterman · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Aventura, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Jamie Kennedy, Alan Cumming, Traylor Howard, Kal Penn, Steven Wright, Ben Stein</p>
