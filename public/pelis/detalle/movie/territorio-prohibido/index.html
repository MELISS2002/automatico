<h1>Territorio prohibido</h1>
<p>Drama sobre la odisea de los inmigrantes ilegales para conseguir el permiso de residencia en Los Ángeles. Max Brogan (Harrison Ford) es un agente de inmigración estadounidense con una peculiaridad: se encariña con toda la gente que debe deportar. Su colega Hamid (Cliff Curtis), de origen iraní, trata de demostrar a su familia lo importante que es ser americano. Un abogado (Ashley Judd) intenta deportar a una chica de quince años, que ha sido acusada de terrorismo. Un joven judío (Jim Sturgess), a pesar de que no es creyente, utiliza la religión de sus padres para asegurarse un trabajo. Cole Frankel (Ray Liotta) abusa de su posición como supervisor de green cards para obtener los favores de una guapa modelo australiana (Alice Eve).</p>
<p><strong>Director:</strong> Wayne Kramer · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Crimen, Drama</p>
<p><strong>Reparto:</strong> Harrison Ford, Ray Liotta, Alice Eve, Ashley Judd, Jim Sturgess, Cliff Curtis</p>
