<h1>El hijo de Godzilla</h1>
<p>En una isla tropical, unos científicos dirigen experimentos meteorológicos con el fin de acabar con el problema de hambruna mundial, pero todo se ve frustrado cuando debido a una falla en el experimento, fuertes lluvias radiactivas y consecuentemente una ola de calor insoportable envuelve la isla, esto también causa que los insectos que habitan en la isla se vuelven gigantes.</p>
<p><strong>Director:</strong> 福田純 · <strong>Año:</strong> 1967 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Fantasía</p>
