<h1>RoboCop</h1>
<p>Año 2028. La compañía multinacional OmniCorp domina la tecnología robótica. Sus robots han ganado todo tipo de guerras fuera de los Estados Unidos y ahora quieren probarlos dentro del país. Por su parte, Alex Murphy, un policía de Detroit, trata de acabar con la ola de crímenes que arrasa la ciudad. Cuando Alex resulta gravemente herido en acto de servicio, OmniCorp utiliza sus conocimientos de ciencia robótica para salvarlo y también para dotarlo de extraordinarias habilidades que le permitirán afrontar problemas fuera de lo común.</p>
<p><strong>Director:</strong> Shane B. Scott · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Crimen, Suspense</p>
