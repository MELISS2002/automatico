<h1>Un santa no tan santo</h1>
<p>Willie, un amargado y solitario alcohólico, trabaja cada temporada de Navidad en los centros comerciales disfrazado de Papá Noel junto su compañero Marcus, que hace de duende. Cada vispera de Navidad, desconectan la alarma de seguridad después de que el centro comercial cierra, y revientan la caja fuerte. En su nuevo destino se encontrarán con un jefe de seguridad que sospecha de ellos, y con un niño muy peculiar, en cuya casa Willie se hospedará.</p>
<p><strong>Director:</strong> Terry Zwigoff · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Comedia, Crimen, Drama</p>
