<h1>Lupin III: El Primero</h1>
<p>El carismático ladrón A Arsène Lupin III hace equipo con una mujer llamada Letizia para encontrar y robar el Diario Bresson, un tesoro que ni siquiera su legendario abuelo Arsène Lupin pudo obtener. Esta aventura llevará a Lupin y su pintoresco equipo a revelar una conspiración Nazi, escapar de la policía y salvar al mundo. Adaptación en animación 3D por computadora de «Lupin III», el aclamado manga creado por Monkey Punch, que se ha convertido en un ícono en Japón.</p>
<p><strong>Director:</strong> 山崎貴 · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Crimen, Misterio</p>
<p><strong>Reparto:</strong> 栗田貫一, 小林清志, 沢城みゆき, 浪川大輔, 山寺宏一, 広瀬すず</p>
