<h1>The Divine Fury</h1>
<p>Después de perder a su padre a una edad temprana en un terrible accidente, Yong-hu (Park) abandona su fe cristiana y solo cree en sí mismo. Ahora como adulto, Yong-hu es un luchador campeón y tiene todo lo que siempre ha deseado, es decir, hasta que aparecen misteriosas heridas en las palmas de sus manos. Solicita ayuda de un sacerdote local, el padre Ahn (Ahn), con la esperanza de que el sacerdote pueda ayudarlo a aliviar las dolorosas marcas y se encuentre en medio de una peligrosa lucha contra las fuerzas malignas de otros mundos que buscan causar estragos en el mundo humano.</p>
<p><strong>Director:</strong> 김주환 · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Acción, Suspense, Terror</p>
