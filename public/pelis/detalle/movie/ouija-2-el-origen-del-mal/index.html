<h1>Ouija 2: El origen del mal</h1>
<p>En Ouija: El origen del mal, la secuela del éxito inesperado del 2014, un grupo de ilusos amigos debe confrontar sus más terribles miedos cuando desatan un mal del más allá que sólo ellos pueden mandar de regreso. El siguiente capítulo del thriller supernatural, inspirado por el antiguo tablero de los espíritus, es producida de nuevo por el equipo de Platinum Dunes, Michael Bay, Brad Fuller y Andrew Form (La masacre de Texas, la saga The Purge , Las tortugas ninja)y Blumhouse Productions de Jason Blum (The Purge- La noche de las bestias y La noche del domonio), junto con Brian Goldner de Hasbro (Transformers y G.I. Joe), Mike Flanagan y Jeff Howard (Oculus) escribieron el guión y Universal distribuirá la película internacionalmente.</p>
