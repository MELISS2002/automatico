<h1>Exorcismo en el Vaticano</h1>
<p>Angela Holmes lleva una vida completamente normal hasta que su presencia empieza a provocar sucesos terribles a su alrededor, causando dolor y muerte a todos los que le rodean. Los expertos creen que Holmes está poseída, pero cuando acuden al Vaticano para realizar un exorcismo descubren que su posesión es una fuerza satánica mucho más poderosa de lo que jamás habían imaginado. El Padre Lorenzo tendrá que luchar contra el mal para salvar el alma de Angela.</p>
<p><strong>Director:</strong> Mark Neveldine · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Olivia Taylor Dudley, Michael Peña, Peter Andersson, Djimon Hounsou, Kathleen Robertson, Montanna Gillis</p>
