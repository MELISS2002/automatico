<h1>Misterioso asesinato en la montaña</h1>
<p>Michel y Cathy, vendedores de árboles de Navidad que viven con su hijo Doudou en un pueblo del Jura, atraviesan graves problemas económicos y de pareja. Un día, Michel casi atropella a un oso y choca contra otro coche, matando a sus ocupantes. Al contárselo a Cathy, deciden ocultar los cuerpos, pero descubren en el maletero un bolso con más de dos millones de euros. Para evitar sospechas, se enredan en una serie de decisiones absurdas que solo empeoran su situación.</p>
<p><strong>Director:</strong> Franck Dubosc · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Comedia, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Franck Dubosc, Laure Calamy, Benoît Poelvoorde, Joséphine de Meaux, Kim Higelin, Mehdi Meskar</p>
