<p>Red es un leñador que vive alejado del mundo junto al amor de su vida, Mandy. Un día, mientras da un paseo abstraída en una de las novelas de fantasía que suele leer a diario, Mandy se cruza sin saberlo con el líder de una secta que desarrolla una obsesión por ella. Decidido a poseerla a cualquier precio, él y su grupo de secuaces invocan a una banda de motoristas venidos del infierno que la raptan y, en el proceso, hacen añicos la vida de Red. Decidido a vengarse y equipado con toda clase de artilugios, pone en marcha una matanza que deja cuerpos, sangre y vísceras allá por donde pasa.</p>
