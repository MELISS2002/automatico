<h1>El fantástico Sr. Zorro</h1>
<p>Tras muchos años de una vida serena y apacible, los instintos del Sr. Zorro resurgen con fuerza. Fiel a su naturaleza, decide retomar su antigua actividad como ladrón de gallinas y otros preciados botines de las granjas vecinas. Sin embargo, sus acciones no solo pondrán en riesgo la estabilidad de su familia, sino que también afectarán a todos los animales del bosque. Inspirada en la novela homónima del célebre escritor Roald Dahl.</p>
<p><strong>Director:</strong> Wes Anderson · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> George Clooney, Robin Hurlstone, Meryl Streep, Jason Schwartzman, Eric Chase Anderson, Wallace Wolodarsky</p>
