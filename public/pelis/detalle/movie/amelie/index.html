<h1>Amélie</h1>
<p>Amelie no es una chica como las demás. Ha visto a su pez de colores deslizarse hacia las alcantarillas municipales, a su madre morir en la plaza de Nôtre-Dame y a su padre dedicar todo su afecto a un gnomo de jardín. De repente, a los veintidós años, descubre su objetivo en la vida: arreglar la vida de los demás. A partir de entonces, inventa toda clase de estrategias para intervenir en los asuntos de los demás: su portera, que se pasa los días bebiendo vino de Oporto; Georgette, una estanquera hipocondríaca, o «el hombre de cristal», un vecino que sólo ve el mundo a través de la reproducción de un cuadro de Renoir.</p>
<p><strong>Director:</strong> Jean-Pierre Jeunet · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Audrey Tautou, Mathieu Kassovitz, Rufus, Serge Merlin, Jamel Debbouze, Clotilde Mollet</p>
