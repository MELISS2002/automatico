<h1>Tierra de Osos</h1>
<p>En los bosques del noroeste americano vive un niño indio llamado Kenai, cuya vida sufre un giro inesperado cuando los Grandes Espíritus lo transforman en un oso, el animal que más odia. Kenai se hace amigo de un osezno llamado Koda y se propone recuperar su forma humana. Mientras, su hermano (que no sabe que Kenai es ahora un oso) lo persigue para cumplir una misión de venganza en la que está en juego el honor familiar.</p>
<p><strong>Director:</strong> Aaron Blaise · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Animación, Aventura, Familia</p>
<p><strong>Reparto:</strong> Joaquin Phoenix, Jeremy Suarez, Jason Raize, Rick Moranis, Dave Thomas, D. B. Sweeney</p>
