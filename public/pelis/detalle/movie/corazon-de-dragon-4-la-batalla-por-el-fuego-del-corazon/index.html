<h1>Corazón de Dragón 4: La batalla por el fuego del corazón</h1>
<p>Patrick Stewart le da voz a Drago el magnífico dragón que se unió al rey Gareth. Cuando el rey muere, sus potenciales herederos, nietos gemelos que poseen las fuerzas únicas del dragón, utilizan sus poderes heredados el uno contra el otro para competir por el trono. Cuando la fuente de poder de Drago, conocida como Heartfire, es robada, más que el trono está en juego. Los hermanos deben terminar su rivalidad con espadas y hechicería o el reino podría colapsar.</p>
<p><strong>Director:</strong> Patrik Syversen · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Aventura, Fantasía</p>
<p><strong>Reparto:</strong> Marte Germaine Christensen, Patrick Stewart, Tom Rhys Harries, Jessamine-Bliss Bell, Tamzin Merchant, André Eriksen</p>
