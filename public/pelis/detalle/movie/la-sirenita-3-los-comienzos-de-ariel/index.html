<h1>La Sirenita 3: Los comienzos de Ariel</h1>
<p>Mucho antes de conocer al príncipe Eric y poner los pies en la tierra, Ariel era una de las siete hijas queridas del poderoso rey Tritón. Pero los tiempos estaban cambiando en el reino submarino, y la música estaba prohibida. En esta aventura, Ariel, sus hermanas y sus amigos los leales Sebastián y Flounder, se esfuerzan por devolver la música y la amistad al reino de Atlántica.</p>
<p><strong>Director:</strong> Peggy Holmes · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Animación, Familia</p>
<p><strong>Reparto:</strong> Jodi Benson, Samuel E. Wright, Jim Cummings, Sally Field, Tara Strong, Jennifer Hale</p>
