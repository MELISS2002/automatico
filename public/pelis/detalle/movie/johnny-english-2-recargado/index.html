<h1>Johnny English 2: Recargado</h1>
<p>Johnny English (Rowan Atkinson), el poco ortodoxo espía del MI7, parece haber desaparecido de la faz de la Tierra, pero en realidad, ha estado perfeccionado sus extraordinarias habilidades en una lejana región de Oriente. Cuando sus jefes se enteran de que alguien planea un atentado contra el primer ministro chino, tratan de localizarlo: ahora tendrá la posibilidad de redimirse y utilizar lo último en tecnología punta para desenredar una complicada conspiración que implica al KGB, a la CIA e incluso al MI7. Faltan pocos días para que se celebre una conferencia estatal y él deberá usar todos sus trucos para proteger a todos los participantes. En la mente de Johnny English el desastre puede ser una opción, pero el fracaso, jamás.</p>
<p><strong>Director:</strong> Oliver Parker · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Acción, Comedia, Crimen</p>
<p><strong>Reparto:</strong> Rowan Atkinson, Gillian Anderson, Dominic West, Rosamund Pike, Daniel Kaluuya, Tim McInnerny</p>
