<h1>El último unicornio</h1>
<p>Cansada de estar sola en el enorme bosque, la unicornio Amalthea comienza a preguntarse si es la última de su especie y sale por el mundo a buscar a sus semejantes. En su viaje se une al mago Schmendick y a Molly Grue que la ayudarán a buscar al Toro Rojo, una criatura mística que caza y aprisiona unicornios. Para pasar desapercibida entre los hombres y salvarla del Toro, Schmendrik transforma a Amalthea en una bella joven. Los tres se encaminan al tenebroso país del rey Haggard, el hombre que controla al Toro Rojo.</p>
<p><strong>Director:</strong> Jules Bass · <strong>Año:</strong> 1982 · <strong>Géneros:</strong> Animación, Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Mia Farrow, Alan Arkin, Tammy Grimes, Jeff Bridges, Christopher Lee, Angela Lansbury</p>
