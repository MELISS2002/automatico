<h1>Buena chica</h1>
<p>Durante un fin de semana, Sam (Collias), de 17 años, se embarca en un viaje de mochilera por los Catskills con su padre, Chris (Le Gros), y un viejo amigo de éste, Matt (McCarthy). Cuando los dos hombres comienzan una dinámica de enfrentamiento mutuo, aireando antiguos agravios, Sam, intenta mediar. Pero cuando se cruzan las líneas y se traicionan confianzas, las tensiones alcanzan su punto álgido, mientras la joven lucha con las limitaciones emocionales de su padre y experimenta el momento universal en que se pone a prueba el vínculo paterno.</p>
<p><strong>Director:</strong> Graham Mason · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Lily Collias, James Le Gros, Danny McCarthy, Sumaya Bouhbal, Diana Irvine, Sam Lanier</p>
