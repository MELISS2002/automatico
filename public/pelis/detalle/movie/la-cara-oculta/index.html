<h1>La cara oculta</h1>
<p>La cara oculta explora los límites del amor, los celos y la traición. Adrián (Quim Gutiérrez) el atractivo director de la Orquesta Filarmónica de Bogotá, y su novia Belén (Clara Lago) parecen estar muy enamorados, pero cuando Belén empieza a dudar de su fidelidad, desaparece sin dejar rastro. Afligido, Adrián encuentra consuelo tanto en su música como en los brazos de una hermosa camarera, Fabiana (Martina García), y a medida que la pasión entre ellos crece, las preguntas sobre la misteriosa desaparición de Belén comienzan a aflorar y el pasado de Adrián estará más presente de lo que nunca pudieron imaginar.</p>
<p><strong>Director:</strong> Andrés Baiz · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Misterio, Suspense</p>
<p><strong>Reparto:</strong> Quim Gutiérrez, Martina García, Clara Lago, Alexandra Stewart, María Soledad Rodríguez, Marcela Mar</p>
