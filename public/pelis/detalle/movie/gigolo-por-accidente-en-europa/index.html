<h1>Gigoló por accidente en Europa</h1>
<p>Deuce (Rob Schneider), un limpiador de peceras ingenuo y de buen corazón, creía que su carrera de gigoló había terminado. Pero cuando se veía lejos de todo aquello, es tentado a regresar a su increíble profesión de &amp;#8216;placer pagado&#x27;. Hicks (Eddie Griffin), su antiguo proxeneta, se ve implicado en los asesinatos de los gigolós más prestigiosos de Europa. Deuce se ve obligado a regresar como espía de incógnito para limpiar el nombre de su gran amigo. Para conseguir sus propósitos, éste debe competir con la poderosa Unidad Europea de Prostitutos e incluso exponerse a otra serie de estrafalarias clientes. Entre todos estos líos, conoce a la hermosa Eva (Hanna Verboom), que sufre de un desorden crónico obsesivo-compulsivo y a su vez es extremadamente talentosa.</p>
<p><strong>Director:</strong> Mike Bigelow · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Comedia</p>
