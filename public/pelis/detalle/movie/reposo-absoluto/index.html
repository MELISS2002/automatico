<h1>Reposo absoluto</h1>
<p>Tras años luchando por formar una familia, Julie Rivers (Melissa Barrera) está embarazada de nuevo y se muda a una nueva casa con su marido. Al recibir la orden del médico de guardar reposo absoluto, Julie comienza a sufrir unas aterradoras experiencias fantasmales que despertarán sus demonios del pasado y le harán preguntarse si su casa está embrujada o está todo en su cabeza. Atrapada y obligada a enfrentarse a su pasado y a lo sobrenatural Julie tendrá que luchar por protegerse a sí misma y a su bebé a punto de nacer.</p>
<p><strong>Director:</strong> Lori Evans Taylor · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Melissa Barrera, Guy Burnet, Edie Inksetter, Sebastian Billingsley-Rodriguez, Erik Athavale, Kristen Sawatzky</p>
