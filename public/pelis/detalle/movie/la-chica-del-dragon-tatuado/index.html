<h1>La chica del dragón tatuado</h1>
<p>Adaptación en inglés de la novela sueca de Stieg Larsson. Esperando poder distanciarse de la acusación de difamación que pesa sobre él, el periodista Mikael Blomkvist se traslada a una isla remota en el norte de Suecia donde la muerte aún no resuelta de una joven atormenta a su tío cuarenta años después. Alojado en una cabaña de la isla donde el asesino puede estar aún rondando, la investigación de Blomkvist le lleva a dibujar los secretos y mentiras de esta poderosa y rica familia junto a una muy peculiar aliada, Lisbeth Salander..</p>
<p><strong>Director:</strong> David Fincher · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Crimen, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Daniel Craig, Rooney Mara, Christopher Plummer, Stellan Skarsgård, Robin Wright, Yorick van Wageningen</p>
