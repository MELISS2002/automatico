<h1>Battle Angel: La última guerrera</h1>
<p>Cuenta la historia de Alita, una joven chica en el cuerpo de un cyborg que es rescatada por un científico tras ser encontrada entre los escombros de un desguace. Alita es reconstruida poco a poco, pero se da cuenta que ha perdido la memoria y no recuerda nada de lo que ha sido de ella antes de aterrizar en el desguace. La joven verá en el científico a su salvador, una figura paterna que la convertirá en un ser letal y peligroso para conseguir así un trabajo como cazarrecompensas.</p>
<p><strong>Director:</strong> Robert Rodriguez · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción</p>
<p><strong>Reparto:</strong> Rosa Salazar, Christoph Waltz, Jennifer Connelly, Mahershala Ali, Ed Skrein, Jackie Earle Haley</p>
