<h1>Jane Austen arruinó mi vida</h1>
<p>Agathe, irremediablemente torpe pero encantadora y llena de contradicciones, es una soltera cuyo sueño es ser escritora y vivir un amor digno de una novela de Jane Austen. En su lugar, pasa los días vendiendo libros en la legendaria librería británica Shakespeare &amp;#038; Co, en París. Al ser invitada a la Residencia de Escritores Jane Austen en Inglaterra, Agathe, deberá enfrentar sus inseguridades para cumplir el sueño de convertirse en novelista y se verá atrapada en un caótico triángulo amoroso digno de Austen que le hará replantearse su vida sentimental.</p>
<p><strong>Director:</strong> Laura Piani · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Camille Rutherford, Pablo Pauly, Charlie Anson, Annabelle Lengronne, Liz Crowther, Alan Fairbairn</p>
