<h1>Sólo los amantes sobreviven</h1>
<p>Adam es un músico “underground” deprimido y decepcionado por la situación que está viviendo a consecuencia de las últimas actividades humanas. Adam y Eve, su amante desde hace siglos, son dos vampiros apasionados por la literatura y la música que luchan por sobrevivir en un mundo donde los seres humanos son simples zombies cuya sangre es incomestible para ellos. Pero el feliz romance pronto se ve alterado por la llegada de la incontrolable hermana pequeña de Eve, que intentará por todos los medios acabar con su relación.</p>
<p><strong>Director:</strong> Jim Jarmusch · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Drama, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Tilda Swinton, Tom Hiddleston, Anton Yelchin, Mia Wasikowska, Jeffrey Wright, Slimane Dazi</p>
