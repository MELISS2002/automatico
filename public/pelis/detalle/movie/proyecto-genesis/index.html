<h1>Proyecto Génesis</h1>
<p>Stella, científica y madre soltera, regresa a su ciudad natal tras años de ausencia. Una noche, recibe una misteriosa transmisión en una vieja radio: es su padre, desaparecido hace décadas y ahora atrapado en el espacio en una configuración temporal alternativa. Para rescatarlo, Stella debe localizar la «Máquina Génesis», una reliquia de un proyecto clasificado de la CIA escondida en algún lugar de Tailandia. Su búsqueda la lanza a un viaje caleidoscópico a través del tiempo y el espacio que la enfrentará a bestias prehistóricas, tribus ancestrales, criaturas mutantes y a los límites de la propia realidad.</p>
<p><strong>Director:</strong> ชูเกียรติ ศักดิ์วีระกุล · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Misterio</p>
