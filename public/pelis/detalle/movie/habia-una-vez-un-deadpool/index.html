<h1>Había una vez un Deadpool</h1>
<p>Deadpool (Ryan Reynolds) le cuenta al actor Fred Savage (el niño de «La Princesa Prometida») algunas de sus aventuras, en un homenaje-parodia a dicha película de 1987 en la que el abuelo le contaba historias a Fred. &amp;#8216;Once Upon a Deadpool&#x27; es una revisión estrenada en cines de «Deadpool 2» adaptada a la calificación por edades PG-13, es decir: un reestreno navideño sin violencia, palabras malsonantes y otras características del film original de David Leitch, añadiéndose además nuevas escenas a la película.</p>
<p><strong>Director:</strong> David Leitch · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Comedia</p>
<p><strong>Reparto:</strong> Ryan Reynolds, Josh Brolin, Morena Baccarin, Julian Dennison, Zazie Beetz, T.J. Miller</p>
