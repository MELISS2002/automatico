<h1>Tom y Jerry: El Anillo Mágico</h1>
<p>El equipo de gato y raton favoritos del mundo vuelve a la acción en una nueva aventura animada de larga duración que sin duda hechizará a toda la familia. Tom se queda a cargo de un anillo mágico de valor incalculable por su joven maestro mago, y se horroriza cuando el anillo se atasca en la cabeza de Jerry, que luego se escapa a la ciudad. Antes de que puedas decir «abracadabra», toda la ciudad está en la cola de nuestros héroes.</p>
<p><strong>Director:</strong> James T. Walker · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Animación, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Jeff Bennett, Frank Welker, Charlie Schlatter, Jim Cummings, Maile Flanagan, Jess Harnell</p>
