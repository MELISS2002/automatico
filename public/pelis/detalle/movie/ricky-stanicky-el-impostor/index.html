<h1>Ricky Stanicky: El Impostor</h1>
<p>Cuando tres mejores amigos de la infancia hacen una broma que sale mal, inventan al Ricky Stanicky imaginario para sacarlos del problema. Veinte años después, el trío todavía utiliza al inexistente Ricky como una coartada útil para su comportamiento inmaduro. Pero cuando sus cónyuges y parejas sospechan y exigen conocer finalmente al legendario Sr. Stanicky, el trío culpable decide contratar a un actor acabado y un imitador de celebridad obsceno para darle vida.</p>
<p><strong>Director:</strong> Peter Farrelly · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Zac Efron, John Cena, Andrew Santino, Jermaine Fowler, Lex Scott Davis, Anja Savcic</p>
