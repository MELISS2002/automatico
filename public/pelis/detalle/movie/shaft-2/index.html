<h1>Shaft</h1>
<p>Puede que John John (JJ) sea un experto en ciberseguridad con una licenciatura en el MIT, pero para descubrir la verdad que se esconde tras la inesperada muerte de su mejor amigo necesita un tipo de ayuda que sólo su padre le puede proporcionar. Aunque ha estado ausente durante casi toda la infancia de JJ, John Shaft acepta ayudar a su hijo a investigar en las calles infestadas de heroína de Harlem. Pese a que la placa del FBI que porta JJ contrasta con el estilo de «tipo duro» de su padre, no cabe duda de que son padre e hijo. Además, Shaft tiene sus propios motivos para colaborar con la investigación y algunos casos abiertos que desea solucionar por las buenas&amp;#8230; o por las malas</p>
<p><strong>Director:</strong> Tim Story · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Acción, Comedia, Crimen, Misterio</p>
