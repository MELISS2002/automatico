<h1>El Manuscrito De Dante</h1>
<p>Sigue la historia del manuscrito original de La Divina Comedia que emerge en manos de una red de contrabando del mercado negro en los peligrosos bajos fondos de Nueva York, y el cansado erudito Nick es llamado por la mafia para autenticarlo. Abrumado por la tentación, Nick desafía a la mafia y roba el manuscrito en un intento frenético por tenerlo todo. Sigue un camino oscuro y violento desde un metafórico infierno hasta el paraíso con su amor Giulietta, mientras se desarrolla una historia paralela: la odisea del propio Dante, un hombre que está atrapado en un matrimonio sin amor con Gemma y reforzado solo por su tutoría bajo un intelectual austero. Escapa a Sicilia y crea su obra más grande, inmortalizando a su amor perdido, Beatriz. Las líneas de tiempo de Nick y Dante tejen caminos separados y, sin embargo, los dos hombres están inextricablemente unidos: ambos se pierden persiguiendo el amor, la belleza y la promesa misma de lo divino.</p>
<p><strong>Director:</strong> Julian Schnabel · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Crimen, Drama</p>
<p><strong>Reparto:</strong> Oscar Isaac, Gal Gadot, Gerard Butler, John Malkovich, Louis Cancelmi, Sabrina Impacciatore</p>
