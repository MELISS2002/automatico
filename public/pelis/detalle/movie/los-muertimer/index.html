<h1>Los Muértimer</h1>
<p>Nico es un chaval de quince años inteligente e introvertido que sufre acoso escolar porque sus padres son propietarios de la única funeraria del pueblo. Con la esperanza de conseguir un amigo, participa en un programa de intercambio cultural. Sólo hay un problema: el chico de intercambio resulta ser una chica, Gabrielle, una francesa de espíritu desafiante acostumbrada a todo menos a vivir rodeada de muertos. Cuando Pol, el tallista de lápidas, les cuenta una de las muchas historias misteriosas que oculta el cementerio, deciden investigar. El hallazgo de un cadáver y unas joyas robadas va más allá de lo que esperaban.</p>
<p><strong>Director:</strong> Álvaro Fernández Armero · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Comedia, Familia, Misterio, Terror</p>
<p><strong>Reparto:</strong> Diego Montejo, Iratxe Emparan, Adrián Checa, Bruna González, Melani García, Alexandra Jiménez</p>
