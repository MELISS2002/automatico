<h1>El patriota</h1>
<p>En 1776, Carolina del Sur, Benjamin Martin (Mel Gibson), viudo y héroe de guerra, se encuentra en medio de la Revolución Estadounidense mientras observa impotentemente cómo las salvajes fuerzas de los casacas rojas británicos separan a su familia. Incapaz de permanecer en silencio, recluta un grupo de reticentes voluntarios, incluyendo su idealista hijo patriota, Gabriel (Heath Ledger), para levantarse en armas contra los británicos. Luchando por la libertad de su familia y la independencia de su país, Martin descubre el dolor de la traición, la redención de la venganza y la pasión del amor.</p>
<p><strong>Director:</strong> Roland Emmerich · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Acción, Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> Mel Gibson, Heath Ledger, Joely Richardson, Jason Isaacs, Chris Cooper, Tchéky Karyo</p>
