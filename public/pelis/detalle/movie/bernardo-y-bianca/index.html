<p>Una niña huérfana que ha sido secuestrada envía una nota dentro de una botella pidiendo ayuda. Bernardo y Bianca, dos valientes ratones, miembros de la Sociedad Internacional de Rescate, reciben el mensaje que los llevará al peligroso «Pantano del Diablo». Allí, ayudados por la libélula Evinrude y los habitantes del pantano, vivirán un sinfín de emocionantes aventuras luchando contra la malvada Madame Medusa</p>
<p><strong>Director:</strong> Wolfgang Reitherman · <strong>Año:</strong> 1977 · <strong>Géneros:</strong> Animación, Aventura, Familia, Fantasía</p>
