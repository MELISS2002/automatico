<h1>Hijo de Dios</h1>
<p>Juan, el último discípulo sobreviviente de Cristo, que vive en el exilio, cuenta su historia. Jesús nace de una virgen (Leila Mimmack), y entonces tres hombres sabios lo visitan y declaran que va a ser el futuro rey. 33 años después, un adulto, Jesucristo (Diogo Morgado) viaja a Galilea y comienza a reclutar seguidores, a Santiago, a su hermano Juan, a Pedro el pescador, a Mateo, el recaudador de impuestos. Estos hombres se convertirían en sus discípulos.</p>
<p><strong>Director:</strong> Christopher Spencer · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Diogo Morgado, Roma Downey, Greg Hicks, Adrian Schiller, Darwin Shaw, Sebastian Knapp</p>
