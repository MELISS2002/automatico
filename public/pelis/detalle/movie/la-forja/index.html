<h1>La Forja</h1>
<p>Isaiah Wright, de 19 años, vive para el baloncesto y los videojuegos. Un año después de terminar la escuela secundaria, no tiene trabajo, ni planes, ni idea de cómo ser un hombre. En desacuerdo con su madre soltera Cynthia, Isaiah recibe un ultimátum: dar un paso adelante o mudarse. Entonces Isaiah es contratado por Moore Fitness, sin saber cómo la guía inesperada de su nuevo mentor afectará personalmente su vida y descubrir cómo Dios podría tener un propósito mayor para su vida.</p>
<p><strong>Director:</strong> Alex Kendrick · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Drama, Familia</p>
