<p>Cuando el amoroso Geppetto crea un títere de madera, su deseo se cumple cuando el títere cobra vida y se convierte en un niño de madera. Con su fiel amigo y conciencia, Pepe Grillo, a su lado, Pinocho se embarca en fantásticas aventuras que ponen a prueba su valentía, lealtad y honestidad hasta triunfar en la deseosa búsqueda de su corazón: convertirse en un niño de verdad.</p>
<p><strong>Director:</strong> Hamilton Luske · <strong>Año:</strong> 1940 · <strong>Géneros:</strong> Animación, Familia, Fantasía</p>
