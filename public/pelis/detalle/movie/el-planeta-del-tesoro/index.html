<h1>El planeta del tesoro</h1>
<p>Jim, conocido por ser un gran surfista solar, se enfrenta a una cacería intergaláctica de tesoros. En sus manos cae un legendario mapa que le llevará a buscar la fortuna más grande del Universo. A bordo de un espectacular «galeón solar», Jim se convierte en el ayudante del cocinero del barco, John Silver- mitad hombre, mitad máquina- que le enseña la forma de ser un buen explorador del espacio. Luchando por sus vidas, Jim y Morfi conocen a un simpático robot, conocido por el divertido nombre de B.E.N. (Bio Electro Navegador). Juntos, bajo el mando de la inteligente Capitán Amelia, descubrirán un impresionante tesoro mucho más grande de lo que nunca nadie imaginó&amp;#8230;. Fantasiosa adaptación por parte de la Disney del clásico de Robert Louis Stevenson «La isla del tesoro», una aventura con barcos voladores ambientada en el espacio exterior.</p>
<p><strong>Director:</strong> John Musker · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Animación, Aventura, Ciencia ficción, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Joseph Gordon-Levitt, Brian Murray, Emma Thompson, David Hyde Pierce, Martin Short, Dane A. Davis</p>
