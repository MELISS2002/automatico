<h1>San Valentín Sangriento</h1>
<p>Hace veinte años, en el tranquilo pueblo minero de Valentine Bluffs, ocurrió un desastre minero fatal en el Día de San Valentín, mientras que algunos miembros de la tripulación estaban decorando para una fiesta. El único sobreviviente del accidente mató a los miembros restantes de la tripulación y advirtió a la ciudad que no celebrara el Día de San Valentín nuevamente. Cuando un grupo de adolescentes decide desafiar esa orden, un maníaco asesino con equipo de minería comienza a enviar a la gente del pueblo de maneras sangrientas y creativas.</p>
<p><strong>Director:</strong> George Mihalka · <strong>Año:</strong> 1981 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Paul Kelman, Lori Hallier, Neil Affleck, Keith Knight, Cynthia Dale, Alf Humphreys</p>
