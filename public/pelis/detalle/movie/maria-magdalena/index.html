<h1>María Magdalena</h1>
<p>Drahim irigida por Garth Davis (Un Camino a Casa, Top of the Lake) y ambientada en Tierra Santa en el siglo I a. C., una joven (Rooney Mara) deja atrás su pequeño pueblo de pescadores y su familia tradicional para unirse a un nuevo movimiento social radical. A su cabeza está un líder carismático, Jesús de Nazaret (Joaquin Phoenix), quien promete que el mundo está cambiando. María está buscando una nueva forma de vida y una autenticidad que le niegan las rígidas jerarquías de la época. A medida que la notoriedad del grupo se extiende y se sienten atraídos por el mensaje inspirador de Jesús, el viaje espiritual de María la coloca en el corazón de una historia que los conducirá a la ciudad capital de Jerusalén, donde debe enfrentar la realidad del destino de Jesús y su propio lugar dentro de eso.</p>
<p><strong>Director:</strong> Garth Davis · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Rooney Mara, Joaquin Phoenix, Chiwetel Ejiofor, Ariane Labed, Ryan Corr, Tahar Rahim</p>
