<h1>El Maquinista</h1>
<p>Trevor Reznik, un empleado de una fábrica, padece desde hace un año un grave problema de insomnio, un mal que él oculta y que le provoca terribles alucinaciones. Debido a la fatiga se ha deteriorado tanto su salud física como su salud mental. Repelidos por su aspecto físico, sus compañeros de trabajo primero le evitan, y después se volverán contra él cuando uno de ellos pierde un brazo en un accidente en el que Trevor se ve involucrado.</p>
<p><strong>Director:</strong> Brad Anderson · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Drama, Suspense</p>
<p><strong>Reparto:</strong> Christian Bale, Jennifer Jason Leigh, Aitana Sánchez-Gijón, John Sharian, Michael Ironside, Lawrence Gilliard Jr.</p>
