<h1>El aprendiz de Satanás</h1>
<p>Dougie Whooly es un niño completamente obsesionado con Satan&#x27;s Little Helper, un videojuego en el que el protagonista, al servicio de Satanás, debe causar dolor y muerte a los ciudadanos para acumular puntos. Su obsesión le lleva a disfrazarse como el personaje del videojuego el día de Hallowwen y a buscar al Maligno para convertirse en su ayudante. Inesperadamente, Dougie lo encuentra, y juntos inician un macabro periplo en el que se dedican a sembrar el terror y la destrucción por el vecindario. Y ni siquiera los padres o la hermana de Dougie y su novio estarán a salvo&amp;#8230;</p>
<p><strong>Director:</strong> Jeff Lieberman · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Comedia, Terror</p>
<p><strong>Reparto:</strong> Alexander Brickel, Katheryn Winnick, Stephen Graham, Amanda Plummer, Wass Stevens, Dan Ziskie</p>
