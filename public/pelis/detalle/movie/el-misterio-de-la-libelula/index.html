<h1>El misterio de la libélula</h1>
<p>El doctor Joe Darrow (Costner), jefe de urgencias del Chicago Memorial Hospital, es un prestigioso traumatólogo que pierde a su mujer (Susanna Thompson) en un trágico accidente de autobús en una carretera de montaña de Venezuela. Seis meses después, el cuerpo de Emily sigue sin aparecer, y Joe no consigue superar el dolor por su pérdida. Entonces empieza a percibir señales que parecen indicar que ella quiere comunicarse con él.</p>
<p><strong>Director:</strong> Tom Shadyac · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Drama, Fantasía, Suspense</p>
<p><strong>Reparto:</strong> Kevin Costner, Joe Morton, Ron Rifkin, Susanna Thompson, Kathy Bates, Jacob Smith</p>
