<h1>Hellraiser IV</h1>
<p>Año 2127. El doctor Merchant, a bordo de una estación espacial, se prepara para cumplir una misión decisiva: acabar con los cenobitas, cerrando para siempre las puertas del infierno. Desde que un antepasado suyo del siglo XVIII construyera el cubo infernal conocido como la Configuración de los Lamentos, varias generaciones de los Merchant han sufrido la maldición de los cenobitas y su diabólico enviado, Pinhead. Pero ahora, el doctor Merchant ha creado un instrumento que anula los poderes de la Configuración de los Lamentos. En las profundidades del espacio, se acerca la confrontación final con Pinhead. Película dirigida por Kevin Yagher bajo el seudónimo Alan Smithee.</p>
<p><strong>Director:</strong> K.C. Colwell · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Ciencia ficción, Suspense, Terror</p>
<p><strong>Reparto:</strong> Bruce Ramsay, Valentina Vargas, Doug Bradley, Charlotte Chatton, Adam Scott, Kim Myers</p>
