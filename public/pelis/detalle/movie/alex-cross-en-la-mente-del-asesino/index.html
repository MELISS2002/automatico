<h1>Alex Cross: En la mente del Asesino</h1>
<p>El Dr. Alex Cross es un psicólogo y teniente de policía que ahora vive en Detroit con su esposa María y sus hijos. Después de enterarse de que María está embarazada, Cross considera aceptar un trabajo como perfilador del FBI. Mientras tanto, un hombre participa en un combate clandestino y seduce a la empresaria Fan Yau. Mientras en una escena del crimen, Cross encuentra un dibujo en carboncillo dejado por el asesino al estilo del artista Picasso. Mientras examina el boceto, Cross deduce que el próximo objetivo de «Picasso» es el empresario alemán Erich Nunemarcher. Picasso intenta matar a Nunemarcher pero es frustrado por Cross, y escapa después de ser disparado por el compañero de Cross Tommy Kane. Cross deduce que Picasso también planea apuntar al CEO multimillonario Giles Mercier.</p>
<p><strong>Director:</strong> Rob Cohen · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Acción, Crimen, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Tyler Perry, Edward Burns, Matthew Fox, Rachel Nichols, Carmen Ejogo, Jean Reno</p>
