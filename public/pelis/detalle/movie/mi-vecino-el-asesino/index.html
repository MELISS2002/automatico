<h1>Mi Vecino el Asesino</h1>
<p>Nicholas «Oz» Oseransky (Matthew Perry) es un dentista que vive con su insoportable esposa (Rosanna Arquette) en Montreal. Su vida dará un vuelco luego de que a la casa vecina se mude un conocido asesino a sueldo: Jimmy Tudeski (Bruce Willis). La codiciosa esposa de Oz lo envía a Chicago para tratar de conseguir dinero de la mafia a cambio de la información sobre el paradero de Jimmy. Mientras Oz se enreda con los mafiosos y conoce a la bella esposa de Jimmy (Natasha Henstridge), su esposa intenta contratar al peligroso vecino para que mate al marido. Muy pronto, Oz se halla envuelto en una disputa entre mafiosos y deberá encontrar la forma de salir vivo del enredo.</p>
<p><strong>Director:</strong> Jonathan Lynn · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Comedia, Crimen</p>
<p><strong>Reparto:</strong> Matthew Perry, Bruce Willis, Natasha Henstridge, Amanda Peet, Michael Clarke Duncan, Rosanna Arquette</p>
