<h1>LEGO Star Wars: Historias Aterradoras</h1>
<p>Después de un aterrizaje forzoso en el planeta volcánico Mustafar, Poe y BB-8 buscan ayuda dentro del espeluznante castillo de Darth Vader. Allí, se encuentran con un hutt intrigante, un valiente mecánico y al antiguo asistente de Darth Vader, Vaneé, que les cuenta tres historias aterradoras relacionadas con artefactos antiguos y villanos icónicos de todas las eras de Star Wars.</p>
<p><strong>Director:</strong> Ken Cunningham · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Animación, Ciencia ficción, Comedia, Familia</p>
<p><strong>Reparto:</strong> Jake Green, Raphael Alejandro, Dana Snyder, Tony Hale, Christian Slater, Matt Sloan</p>
