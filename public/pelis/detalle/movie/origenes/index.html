<h1>Orígenes</h1>
<p>La película cuenta la historia del Dr. Ian Gray, un biólogo molecular que estudia la evolución del ojo humano. Después de un breve encuentro con una exótica joven, su trabajo va a invadir su vida por completo. A medida que sus investigaciones continúan junto a su compañera de laboratorio, Karen, descubren algo sorprendente con implicaciones de amplio alcance que complican sus creencias científicas y espirituales. Entonces, emprende un viaje por medio mundo, en el que arriesga todo lo que sabe para validar su teoría.</p>
<p><strong>Director:</strong> Mike Cahill · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Ciencia ficción, Drama</p>
<p><strong>Reparto:</strong> Michael Pitt, Brit Marling, Astrid Bergès-Frisbey, Steven Yeun, Archie Panjabi, Cara Seymour</p>
