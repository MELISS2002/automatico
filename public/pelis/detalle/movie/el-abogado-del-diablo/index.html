<h1>El Abogado del Diablo</h1>
<p>Kevin Lomax es un joven y brillante abogado que nunca ha perdido un caso. Vive en Florida y parece feliz con su esposa Mary Ann. Un día, recibe la visita de un abogado de Nueva York que representa a un poderoso bufete que tiene la intención de contratarlo. Al frente de la prestigiosa empresa se encuentra John Milton, un hombre mundano, brillante y carismático, que alberga planes muy oscuros con respecto a Lomax.</p>
<p><strong>Director:</strong> Taylor Hackford · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Drama, Misterio, Terror</p>
