<h1>Relaciones Peligrosas</h1>
<p>Célène es una adolescente idealista que cree en el amor verdadero y muestra más interés por la lectura que por las redes sociales. Se está preparando para dejar París por el pueblo de Biarritz y vivir una temporada lejos de Pierre, su prometido. Sin embargo, muy pronto deberá enfrentar a la malvada élite de su nueva escuela, gobernada por Vanessa, una ex estrella de cine y reina del Instagram, y el famoso surfista Tristan, tan peligroso como seductor. Célène se enamora de él, pero no tiene ni idea de que se encuentra en el centro de una cruel apuesta entre Tristan y Vanessa. ¿Hasta dónde llegarán?</p>
<p><strong>Director:</strong> Rachel Suissa · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Paola Locatelli, Simon Rérolle, Ella Pellegrini, Héloïse Janjaud, Jin Xuan Mao, Oscar Lesage</p>
