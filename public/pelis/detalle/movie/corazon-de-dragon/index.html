<h1>Corazón de Dragón</h1>
<p>Ubicada en el siglo X, cuando los dragones volaban por la tierra y existía un antiguo código de honor respetado por dragones, reyes y caballeros. Bowen es un Caballero del antiguo código que enseña las artes de caballería al príncipe Einon. Sin embargo, el padre de Einon, un corrupto Rey, no está de acuerdo con esto y en una revuelta, el príncipe es herido y agoniza. La reina Aislinn, en un desesperado intento por salvarle la vida, va a un milenario castillo abandonado en busca del dragón que habita ahí y es guardián de los ritos antiguos. El dragón promete salvar la vida del príncipe dándole la mitad de su corazón a cambio de que este, al ser Rey, conserve los preceptos de caballería del código de honor. Al salvar la vida, el príncipe se convierte en una replica del padre solo que con más poder por lo que, al morir el Rey, Eion se convierte en un gobernante déspota y tiránico.</p>
<p><strong>Director:</strong> Rob Cohen · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Acción, Aventura, Drama, Fantasía</p>
<p><strong>Reparto:</strong> Dennis Quaid, Sean Connery, David Thewlis, Dina Meyer, Pete Postlethwaite, Jason Isaacs</p>
