<h1>Shanghai Kid</h1>
<p>Chon Wang es un guardián del emperador chino. Cuando la princesa Pei Pei es secuestrada de la Ciudad Prohibida imperial, Wang se siente personalmente responsable e insiste en unirse a los guardas encargados de rescatarla. Pero ella ha sido llevada a los EE.UU. Tras una persecución en Nevada, Wang se separa del grupo y pronto se encuentra junto al timador Roy O´Bannon, que le ayudará mal que bien a conseguir cumplir su misión.</p>
<p><strong>Director:</strong> Tom Dey · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Acción, Aventura, Comedia, Western</p>
<p><strong>Reparto:</strong> Jackie Chan, Owen Wilson, Lucy Liu, Xander Berkeley, Roger Yuan, 于荣光</p>
