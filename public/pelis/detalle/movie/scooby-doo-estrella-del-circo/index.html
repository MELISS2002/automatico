<p>La pandilla esta de viaje rumbo a Atlantic City, donde Fred los lleva con entusiasmo para ver el Circo Brancusi. El maestro de ceremonias contrata a la banda para capturar a un hombre lobo que ha estado asustando a los artistas intérpretes o ejecutantes y el robo de la joyería de los miembros del público. Scooby y Shaggy se unen al circo como artistas y dirigen la caza de la bestia feroz.</p>
<p><strong>Director:</strong> Heather A. Maxwell · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Animación, Comedia, Familia, Misterio</p>
