<h1>En Busca de la Felicidad</h1>
<p>Chris Gardner es un vendedor brillante y con talento, pero su empleo no le permite cubrir sus necesidades más básicas. Tanto es así que acaban echándolo, junto a su hijo de cinco años, de su departamento en San Francisco y no tienen ningún lugar al que ir. Cuando Gardner consigue hacer unas prácticas en una prestigiosa correduría de bolsa, los dos protagonistas tendrán que afrontar muchas adversidades parar hacer realidad su sueño de una vida mejor. Basada en hechos reales.</p>
<p><strong>Director:</strong> Gabriele Muccino · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Drama</p>
