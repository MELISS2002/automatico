<p>La joven y ambiciosa Nomi Malone (Elizabeth Berkley) viaja a Las Vegas con el objetivo de convertirse en una estrella del espectáculo. Empieza trabajando como bailarina de strip-tease, pero acaba consiguiendo una audición para cantar en el coro de una obra del Casino Stardust, donde trabaja la starlette Cristal (Gina Gershon). Sin embargo, Nomi no tardará en darse cuenta de que el mundo que la rodea es más duro y menos brillante de lo que pensaba.</p>
<p><strong>Director:</strong> Paul Verhoeven · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Drama</p>
