<p>En Shanghai, la Academia de Artes Marciales entrena a los jóvenes que aún creen en su país para convertirlos en luchadores. El maestro Huo, fundador de la Academia, es un obstáculo para los japoneses, por lo que deciden asesinarlo. Mientras, Chen Zen, uno de los alumnos de Huo regresa de su entrenamiento en Japón. Al enterarse de la muerte de su maestro, decide investigar lo ocurrido y restablecer la reputación de la Academia&amp;#8230;</p>
<p><strong>Director:</strong> 陳嘉上 · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Acción</p>
