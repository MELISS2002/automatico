<h1>Muerte súbita</h1>
<p>Un grupo de terroristas sin pasaporte liderados por el exagente de la CIA Joshua Foss (Powers Boothe) toma como rehenes a los ocupantes del palco de honor del partido decisivo por la Stanley Cup de hockey sobre hielo, entre los que se encuentra el vicepresidente de los Estados Unidos. Amenazan con volar el estadio a la conclusión del encuentro si no son transferidas unas grandes sumas de dinero a sus cuentas bancarias. Darren McCord (Jean-Claude Van Damme), un bombero retirado que se encuentra en el estadio viendo el partido con sus dos hijos, descubre por casualidad el complot y se enfrenta a los terroristas.</p>
<p><strong>Director:</strong> Peter Hyams · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Acción, Crimen, Drama, Suspense</p>
<p><strong>Reparto:</strong> Jean-Claude Van Damme, Powers Boothe, Raymond J. Barry, Whittni Wright, Ross Malinger, Dorian Harewood</p>
