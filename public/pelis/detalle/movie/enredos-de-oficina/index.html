<h1>Enredos de oficina</h1>
<p>Harto de su trabajo como programador informático y de su jefe, Peter Gibbons se propone que le despidan para cobrar una buena indemnización y dedicarse a la buena vida junto a una joven camarera llamada Joanna, que es en realidad la que le anima a seguir por ese camino. Pero sus múltiples acciones para conseguir el despido, entre las que figuran llegar tarde o no presentarse al trabajo, son consideradas como una nueva y revolucionaria manera de trabajar, lo que, contra todo pronóstico, le suponen un aumento de sueldo y un ascenso.</p>
<p><strong>Director:</strong> Mike Judge · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Ron Livingston, Jennifer Aniston, David Herman, Ajay Naidu, Diedrich Bader, Stephen Root</p>
