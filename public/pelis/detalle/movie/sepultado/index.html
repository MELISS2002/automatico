<h1>Sepultado</h1>
<p>Después de ser secuestrado, Paul Conroy (Ryan Reynolds), contratista civil en Irak, se despierta enterrado vivo en un viejo ataúd de madera, contando únicamente con un teléfono móvil y un mechero. El teléfono es el único medio que puede sacarlo de una pesadilla mortal, pero la precariedad de la cobertura y la escasa batería parecen obstáculos insalvables en su lucha contra el tiempo: sólo dispone de 90 minutos para ser rescatado antes de que se le agote el oxígeno. Interesante film español de suspense, que fue presentado en Sundance 2010 y que levantó mucha expectación.</p>
<p><strong>Director:</strong> Rodrigo Cortés · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Suspense</p>
<p><strong>Reparto:</strong> Ryan Reynolds, José Luis García Pérez, Robert Paterson, Stephen Tobolowsky, Samantha Mathis, Ivana Miño</p>
