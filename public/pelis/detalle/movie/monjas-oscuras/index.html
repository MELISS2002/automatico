<p>Dos monjas, la Hermana Junia y la Hermana Michaela, se enfrentan a un joven llamado Hee-joon, que ha sido poseído por un espíritu maligno muy poderoso. Impulsada por su fe y compasión, la Hermana Junia decide hacerse cargo de salvar al niño, mientras que la Hermana Michaela, inicialmente escéptica, se ve arrastrada a la investigación. A medida que profundizan en el misterio, se encuentran con una serie de eventos escalofriantes y descubren un oscuro secreto escondido dentro de los muros del convento. Las monjas deben enfrentarse a sus propios miedos y creencias mientras luchan contra el poderoso mal que amenaza la vida de Hee-joon y la santidad de su orden.</p>
