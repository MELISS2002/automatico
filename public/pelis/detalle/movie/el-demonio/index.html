<h1>El demonio</h1>
<p>Trish Jenner y su hermano menor Derry cruzan los Estados Unidos en coche, en un viaje largo y aburrido cuya monotonía sólo se rompe por sus continuas discusiones. De pronto, en mitad de ninguna parte, descubren una iglesia abandonada cuyo tejado está cubierto por una espesa bandada de cuervos y ven como un misterioso personaje arroja un bulto al interior de una gran boca del alcantarillado. A partir de ese momento comienzan una huída aterradora, perseguidos por una de las criaturas más letales que se pueda imaginar.</p>
<p><strong>Director:</strong> Victor Salva · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Gina Philips, Justin Long, Jonathan Breck, Patricia Belcher, Eileen Brennan, Brandon Smith</p>
