<article>
<h1>El monstruo de la laguna negra</h1>
<p>gran valor a nivel científico. Un grupo de expedicionarios se prepara para llegar al lugar donde se encuentran los fósiles. Marc Williams y David Reed son los dos expertos buceadores e ictiólogos imprescindibles para acometer esta expedición que completan al margen de guías nativos, el doctor Adams y la bella Kay. Ésta última había obtenido un puesto como investigadora merced al apoyo mostrado por el ambicioso Marc. Una vez instalados en una zona pantanosa, la tripulación de un pequeño barco se prepara para recabar información que confirme la presencia de fósiles que datan de fechas prehistóricas. No obstante, la muerte de uno de los guías desvela que algo vivo y de gran tamaño pervive en el fondo marino.</p>
<p><strong>Director:</strong> Jack Arnold · <strong>Año:</strong> 1954 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Terror</p>
<p><strong>Reparto:</strong> Richard Carlson, Julie Adams, Richard Denning, Antonio Moreno, Nestor Paiva, Whit Bissell</p>
