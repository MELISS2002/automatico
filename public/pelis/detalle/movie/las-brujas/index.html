<h1>Las Brujas</h1>
<p>Una anciana noruega Helga le explica a su nieto Luke que las brujas no solo existen, sino que quieren eliminar a todos los niños. Las describe como calvas -aunque usan pelucas-, manos deformes -que esconden bajo unos guantes- y pies cuadrados, con repugnantes muñones en sus dedos. También le cuenta que una amiga de la infancia, llamada Erica, fue víctima del ataque de una bruja y nunca más la volvió a ver. Tras la muerte de sus padres, Luke se muda a Inglaterra junto a su abuela y allí descubre a una mujer con los ojos morados, signo de que es una bruja. Ésta, con una serpiente en la mano, intenta convencer al niño de que baje de la casa del árbol en la que se encuentra, pero es Helga quien descubre lo que está ocurriendo y sale en ayuda de su nieto.</p>
<p><strong>Director:</strong> Nicolas Roeg · <strong>Año:</strong> 1990 · <strong>Géneros:</strong> Familia, Fantasía, Terror</p>
<p><strong>Reparto:</strong> Jasen Fisher, Mai Zetterling, Anjelica Huston, Charlie Potter, Rowan Atkinson, Bill Paterson</p>
