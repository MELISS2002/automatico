<h1>En La Mente Del Demonio</h1>
<p>Un científico contacta con la hija de una asesina en serie para proponerle participar en la prueba de una tecnología experimental. El objetivo es introducirse en la mente de su madre, que en la actualidad se encuentra en coma, para comunicarse con ella. Pero el experimento no sale según lo planeado y acaba despertando los demonios del pasado de una forma inesperada.</p>
<p><strong>Director:</strong> Neill Blomkamp · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Ciencia ficción, Drama, Terror</p>
<p><strong>Reparto:</strong> Carly Pope, Nathalie Boltt, Chris William Martin, Michael J Rogers, Kandyse McClure, Terry Chen</p>
