<h1>José: El Rey de los Sueños</h1>
<p>Con su don de la interpretación de los sueños y su abrigo de colores brillantes, José inspira celos en sus hermanos y es vendido como esclavo. Esta narración animada de la historia del libro de Génesis de la Biblia cuenta con animación de primera clase y un trabajo de voz excelente, con Ben Affleck, Mark Hamill y Jody Benson. Sano y sin sermonear, José: Rey de los sueños hará las delicias de toda la familia.</p>
<p><strong>Director:</strong> Robert C. Ramirez · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Animación, Drama, Familia</p>
<p><strong>Reparto:</strong> Ben Affleck, Mark Hamill, Richard Herd, Maureen McGovern, Jodi Benson, Judith Light</p>
