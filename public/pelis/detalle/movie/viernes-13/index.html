<h1>Viernes 13</h1>
<p>Buscando a su hermana desaparecida, Clay se dirige al bosque del legendario Crystal Lake, donde tropieza con los viejos y decrépitos restos de una cabaña que yace detrás de unos árboles cubiertos por denso musgo. Y esto no es lo único que se esconde entre la maleza… En contra del consejo de la policía y las advertencias de los habitantes de la zona, Clay continúa con su búsqueda, ayudado por una joven mujer que ha conocido entre un grupo de jóvenes estudiantes preparados para pasar un emocionante fin de semana. Sin embargo, ellos están a punto de encontrar algo más que no habían tenido en cuenta.</p>
<p><strong>Director:</strong> Marcus Nispel · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Jared Padalecki, Travis Van Winkle, Danielle Panabaker, Amanda Righetti, Aaron Yoo, Derek Mears</p>
