<h1>Conquistando a mi Suegro</h1>
<p>Percy y Marilyn Jones están por celebrar sus bodas de plata y para la celebración, entre todos los amigos invitados, no puede faltar su única hija, Theresa, quien decide que el momento perfecto para presentarles a su novio, Simon. El problema es que Theresa no les informo que Simon es un hombre blanco y esto provoca que Percy, de raza afroamericana, tenga una buena cantidad de reservas sobre él y su relación con su hija. Sin embargo, no solo las diferencias racistas se hacen presente, sino que ambos empiezan a tramar planes, llenos de mentiras y engaños, para sabotearse y convencer a Theresa de sus planes.</p>
<p><strong>Director:</strong> Kevin Rodney Sullivan · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Bernie Mac, Ashton Kutcher, Zoe Saldaña, Judith Scott, Hal Williams, Kellee Stewart</p>
