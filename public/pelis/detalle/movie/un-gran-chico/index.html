<h1>Un gran chico</h1>
<p>Will Freeman es un londinense de moda que un día se da cuenta de que sus amigos están involucrados en las responsabilidades de la vida matrimonial y eso lo deja solo en el frío. Pasándose como padre soltero, comienza a conocer a una serie de madres solteras, confiando en su habilidad para dejarlas atrás cuando empiezan a pedir un compromiso. Pero la esperanza de Will de continuar soltero se ve interrumpida cuando conoce a Marcus, de 12 años, en muchos sentidos su completo opuesto.</p>
<p><strong>Director:</strong> Chris Weitz · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Hugh Grant, Nicholas Hoult, Toni Collette, Rachel Weisz, Natalia Tena, Victoria Smurfit</p>
