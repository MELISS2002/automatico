<h1>Ni idea</h1>
<p>Cher y Dionne son dos de las chicas más populares de un instituto académico privado de Beverly Hills y cuya preocupación más que las notas académicas de la escuela es llevar la ropa más atractiva y ser tan populares como sea posible. Cher vive con su riguroso padre, un famoso abogado de California, y con su sensible hermanastro, quien es el hijo de la ex-esposa de su padre y trabaja como pasante de abogado. Él estudia leyes en la Universidad y es muy querido por el padre de Cher. La película muestra los problemas sociales y emocionales de los jóvenes de la clase económica alta de California; Cher tiene la necesidad innata de ayudar a los desamparados, de esta manera termina presentando a dos de sus profesores y convirtiendo a su tímida nueva amiga Tai en todo un prodigio de belleza en la escuela.</p>
<p><strong>Director:</strong> Amy Heckerling · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Alicia Silverstone, Stacey Dash, Brittany Murphy, Paul Rudd, Donald Faison, Elisa Donovan</p>
