<p>Después de escuchar a un niño gritando pidiendo ayuda desde las verdes profundidades de un vasto campo de hierba alta, Becky, una mujer embarazada, y Cal, su hermano, aparcan su auto cerca de una misteriosa iglesia abandonada y entran imprudentemente en el campo, descubriendo que no están solos y que por alguna razón son incapaces de escapar de un laberinto vegetal completamente inextricable.</p>
