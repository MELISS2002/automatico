<h1>El Primer Poder</h1>
<p>Un joven nacido de una relación incestuosa, después de soportar una infancia con cicatrices emocionales, se rinde al lado oscuro de las fuerzas satánicas y se convierte en un arma del mal. Mata con tanta ferocidad que se convierte en el objetivo principal de L.A.P.D. El detective Russell Logan se involucra en una batalla de ingenio con Channing en la vida y después de la muerte. Parece que Channing no puede ser detenido, pero Logan tiene algunos trucos propios para que coincida con Channing - «First Power».</p>
<p><strong>Director:</strong> Robert Resnikoff · <strong>Año:</strong> 1990 · <strong>Géneros:</strong> Crimen, Suspense, Terror</p>
<p><strong>Reparto:</strong> Lou Diamond Phillips, Tracy Griffith, Jeff Kober, Mykelti Williamson, Dennis Lipscomb, Carmen Argenziano</p>
