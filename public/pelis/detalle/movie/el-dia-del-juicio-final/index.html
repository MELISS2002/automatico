<h1>El día del juicio final</h1>
<p>Una estrella gigante está a punto de chocar con la Tierra, lo que inevitablemente provocaría el fin del mundo. El Gobierno rehúsa escuchar a los científicos, pero un grupo de empresarios financia la construcción de una nave espacial con el fin de transportar a un número limitado de personas a otro planeta para crear allí una nueva civilización. A medida que se aproxima el fin, tendrán que luchar no sólo contra el tiempo, sino también contra el pánico de los que están condenados a quedarse en la Tierra.</p>
<p><strong>Director:</strong> Rudolph Maté · <strong>Año:</strong> 1951 · <strong>Géneros:</strong> Ciencia ficción, Drama</p>
<p><strong>Reparto:</strong> Richard Derr, Barbara Rush, Peter Hansen, John Hoyt, Larry Keating, Rachel Ames</p>
