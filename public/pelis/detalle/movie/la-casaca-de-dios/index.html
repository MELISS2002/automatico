<h1>La casaca de Dios</h1>
<p>En México 1986, una camiseta azul quedó en la historia cuando Maradona marcó ante Inglaterra dos goles inolvidables. Décadas después, al saber que será subastada, Tití Malvestiti, un humilde utilero que estuvo junto a la selección argentina en México 86 y quedó marcado por la pérdida, emprende un último viaje para enfrentar su pasado y reconstruir la relación con su hija.</p>
<p><strong>Director:</strong> Fernán Mirás · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Comedia, Drama</p>
