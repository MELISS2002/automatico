<h1>El Último Dragón</h1>
<p>Muchos años después de que se perdió la guerra y todos los dragones fueron asesinados, un caballero solitario viaja por las tierras de Agonos buscando formar un ejército contra el señor de los demonios Abaddon. Cuando la visión de un sanador revela que un dragón aún vive, y junto con un joven escudero entusiasta, el caballero parte en busca de la legendaria criatura. A medida que los ejércitos de Abaddon descienden sobre los reinos humanos, el dragón es su última esperanza para defenderse de la horda, antes de que arrase las tierras de los hombres. Pero, ¿existe la criatura? Y si lo hace, ¿luchará por ellos una vez más?</p>
<p><strong>Director:</strong> Lawrie Brewster · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Acción, Aventura, Fantasía</p>
