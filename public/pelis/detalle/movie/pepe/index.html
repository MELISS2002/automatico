<article>
<h1>Pepe</h1>
<p>Pepe, es un empleado de un rancho. Un director de Hollywood compra un semental blanco que pertenece al jefe de Pepe. Pepe, decidido a recuperar el caballo (como lo considera su familia), decide irse a Hollywood. Allí se encuentra con estrellas de cine como Jimmy Durante, Frank Sinatra, Zsa Zsa Gabór, Bing Crosby, Maurice Chevalier y Jack Lemmon, como Daphne de Some Like It Hot. También le sorprenden las cosas que eran nuevas en Estados Unidos en ese momento, como las puertas batientes automáticas. Cuando finalmente llega al hombre que compró el caballo, se le hace creer que no hay esperanza de recuperarlo.</p>
<p><strong>Director:</strong> George Sidney · <strong>Año:</strong> 1960 · <strong>Géneros:</strong> Comedia, Música</p>
<p><strong>Reparto:</strong> Cantinflas, Dan Dailey, Shirley Jones, Carlos Montalbán, Vicki Trickett, Matt Mattox</p>
