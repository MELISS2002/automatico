<h1>Digimon Adventure: La última evolución – Kizuna</h1>
<p>Esta nueva entrega de la saga Digimon busca dar un cierre a la historia original, haciendo hincapié en la relación de Tai y Agumon y presentándonos la cinta como su última aventura juntos (vamos, que los que crecimos viendo el primer anime podemos ir preparando los pañuelos). La amistad entre el niño elegido y su digimon promete ser el centro de la trama de la película, con Tai asegurandole a Agumon «Siempre estaremos juntos».</p>
<p><strong>Director:</strong> 田口智久 · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Acción, Animación, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> 花江夏樹, 市道真央, 三森すずこ, 細谷佳正, 榎木淳弥, 田村睦心</p>
