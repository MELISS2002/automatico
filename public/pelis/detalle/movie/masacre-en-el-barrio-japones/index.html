<h1>Masacre en el Barrio Japonés</h1>
<p>La Yakuza, una poderosa organización ancestral japonesa, trata de implantarse en Los Angeles extorsionando a los comerciantes de Little Tokyo, así como hacerse con el mercado norteamericano introduciendo una droga sofisticada envasada en botellas de cerveza. Dos jóvenes policías, en misión secreta, tendrán que desarticular el brazo armado de la Yakuza, la «Garra de Hierro», cuyo jefe es conocido de uno de ellos.</p>
<p><strong>Director:</strong> Mark L. Lester · <strong>Año:</strong> 1991 · <strong>Géneros:</strong> Acción, Comedia, Crimen</p>
<p><strong>Reparto:</strong> Dolph Lundgren, Brandon Lee, Cary-Hiroyuki Tagawa, Tia Carrere, Toshishiro Obata, Philip Tan</p>
