<h1>Euroviaje Censurado</h1>
<p>Cuando la berlinense Mieke se declara vía e-mail a un norteamericano Scott, éste la rechaza creyendo que es un hombre. Cuando descubre su error intenta ponerse en contacto con ella, pero resulta imposible. La única forma de conquistarla parece viajar hasta Berlín (Alemania) y para ello, en su viaje le acompañarán su amigo Cooper y los gemelos Jenny y Jamie.</p>
<p><strong>Director:</strong> Jeff Schaffer · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Comedia</p>
