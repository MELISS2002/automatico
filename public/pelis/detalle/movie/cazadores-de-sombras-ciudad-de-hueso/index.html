<h1>Cazadores de sombras: Ciudad de hueso</h1>
<p>Clary Fray, una adolescente de Brooklyn, conoce una noche a Jace, un chico misterioso, lleno de tatuajes, que resulta ser un ángel guerrero que ejerce como cazador de sombras. Cuando raptan a la madre de Clary, la chica espera que Jace la ayude a liberarla. Después de entrar en un portal dorado, Clary se ve transportada a través del tiempo y del espacio, y descubre algo sorprendente sobre sí misma.</p>
<p><strong>Director:</strong> Harald Zwart · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Acción, Fantasía, Misterio</p>
