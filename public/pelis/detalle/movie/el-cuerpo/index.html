<h1>El cuerpo</h1>
<p>Un guardia de seguridad de la morgue huye y es atropellado. En el depósito de cadáveres, la policía descubre que la puerta de una de las neveras está abierta y el cadáver de una mujer ha desaparecido. El inspector de policía encargado de la investigación cuenta con la colaboración del marido de la difunta, aunque no descarta la posibilidad de que esté relacionado con el asunto&amp;#8230; Debut en la dirección del guionista Oriol Paulo (Los ojos de Julia).</p>
<p><strong>Director:</strong> Oriol Paulo · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Misterio, Suspense</p>
<p><strong>Reparto:</strong> Jose Coronado, Hugo Silva, Belén Rueda, Aura Garrido, Cristina Plazas, Montse Guallar</p>
