<h1>El Museo de las Maravillas</h1>
<p>Ben y Rose son dos niños de dos épocas distintas que, en secreto, desean que su vida sea diferente: Ben sueña con conocer a su padre, mientras que Rose, aislada por su sordera, se obsesiona con la carrera de una misteriosa actriz. Cuando Ben descubre la pista que podría conducirle hasta su padre y Rose se entera de que su ídolo estará pronto en escena, los dos niños se lanzan en una búsqueda que los llevará hasta Nueva York.</p>
<p><strong>Director:</strong> Mark Friedberg · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Drama</p>
