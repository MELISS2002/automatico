<h1>Playa de lobos</h1>
<p>Manu trabaja en un chiringuito de playa, y Klaus es un turista que no quiere levantar el culo de la última tumbona que falta por recoger. Aparentemente parece sólo el encuentro casual de dos tipos totalmente opuestos y condenados a no entenderse. Pero Manu empieza a sospechar que Klaus no está en esa playa por casualidad, ni es quien decía ser. La tensión va subiendo entre ellos, hasta que Klaus le hace a Manu una desconcertante y perturbadora propuesta.</p>
<p><strong>Director:</strong> Javier Veiga · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Comedia, Suspense</p>
<p><strong>Reparto:</strong> Guillermo Francella, Dani Rovira, Antonia San Juan, Denisse Peña, Marta Hazas, Javier Veiga</p>
