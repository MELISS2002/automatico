<h1>Ronin</h1>
<p>Cuando un equipo internacional de ex-agentes de inteligencia y ex-guerreros de la guerra fría se reunen en una bodega, su aventura de amor, amistad y traición apenas comienza. Al igual que el honorable e independiente samurai de hace cientos de años, estos ronin modernos se embarcan en su más peligrosa misión secreta: recobrar una misteriosa maleta y entregársela a su desconocido jefe y a la vez conservar sus vidas. Un criminal que se vende al mejor postor lidera un grupo de profesionales del crimen que busca un misterioso maletín, cuyo contenido es desconocido incluso para el espectador.</p>
<p><strong>Director:</strong> John Frankenheimer · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Robert De Niro, Jean Reno, Natascha McElhone, Stellan Skarsgård, Skipp Sudduth, Jonathan Pryce</p>
