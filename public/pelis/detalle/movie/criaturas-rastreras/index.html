<h1>Criaturas Rastreras</h1>
<p>Wheelsy es un pueblo soñoliento de Estados Unidos, pintoresco y tranquilo. Sus simpáticos habitantes no meten las narices donde no les llaman. Pero por debajo de este bonito barniz se esconde algo sin nombre, malévolo, y ese algo crece. Nadie parece darse cuenta de que cada vez hay más avisos de animales de compañía perdidos ni que Grant Grant , uno de los ciudadanos más prósperos del pueblo, empieza a comportarse de un modo muy raro. Pero cuando el ganado aparece horriblemente mutilado y una joven desaparece, el sheriff Bill Pardy y sus hombres, con la ayuda de la esposa de Grant, Starla descubren la existencia de una fuerza oscura que asedia el pueblo.</p>
<p><strong>Director:</strong> James Gunn · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Ciencia ficción, Comedia, Terror</p>
<p><strong>Reparto:</strong> Nathan Fillion, Michael Rooker, Elizabeth Banks, Gregg Henry, Tania Saulnier, Don Thompson</p>
