<h1>Coyote Ugly: El Bar Coyote</h1>
<p>A sus 21 años, Violet Sanford llega a Nueva York con la esperanza de convertirse en letrista. Pero sus sueños de dedicarse al mundo de la música quedan aparcados momentáneamente por el éxito que alcanza trabajando como camarera en el bar Coyote. El bar Coyote es un nuevo club nocturno y el punto más caliente de la ciudad. Cuenta con un ambicioso plantel de chicas, todas jóvenes y muy atractivas. Lil es el cerebro y la estricta propietaria del local, que reina con autoridad sobre sus chicas. Entre ellas están la coqueta Cammie, la cabezota y variable Rachel y Zoe, la que más propinas consigue. Las «chicas Coyote», como las llaman cariñosamente, provocan a los clientes y a los medios de comunicación con sus atrevidos atuendos, y convierten el bar Coyote en el punto de atracción de los chicos que merodean por la zona.</p>
<p><strong>Director:</strong> David McNally · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Comedia, Drama, Música, Romance</p>
<p><strong>Reparto:</strong> Piper Perabo, Maria Bello, Bridget Moynahan, Tyra Banks, Izabella Miko, John Goodman</p>
