<h1>El Cuervo</h1>
<p>En Detroit, Míchigan, el músico de rock Eric Draven, es brutalmente asesinado al ser arrojado por una ventana de su departamento y su novia, Shelly Webster, que tras ser violada por varios hombres es llevada al hospital donde, unas horas después, muere también. El doble crimen fue perpetrado por una banda liderada por Top Dollar, la cual asola las entrañas de la ciudad. El asesinato se produce en una noche llamada la noche del diablo (noche antes de Halloween). Un año más tarde, Eric resucita gracias a la ayuda de un cuervo que lo devuelve a la vida; regresa a la ciudad donde fue asesinado con el único objetivo de vengarse.</p>
<p><strong>Director:</strong> Alex Proyas · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Acción, Fantasía, Suspense</p>
<p><strong>Reparto:</strong> Brandon Lee, Rochelle Davis, Ernie Hudson, Michael Wincott, Bai Ling, Sofia Shinas</p>
