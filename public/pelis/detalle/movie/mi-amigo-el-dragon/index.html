<h1>Mi amigo el dragón</h1>
<p>Durante años el Sr. Meacham, un viejo tallador de madera, ha fascinado a los niños de la región con sus cuentos acerca de un feroz dragón que reside en lo más profundo de los bosques del Noroeste del Pacífico. Para su hija Grace, que trabaja como guarda forestal, estas historias no son más que cuentos para niños… hasta que conoce a Peter. Peter es un misterioso niño de 10 años que no tiene familia ni hogar, y que asegura que vive en el bosque con un gigante dragón verde llamado Eliott. Con la ayuda de Natalie, una niña de 11 años cuyo padre es dueño de la serrería local, Grace partirá en busca de respuestas que averigüen de dónde viene Peter, cuál es su verdadero hogar y la verdad acerca de ese dragón.</p>
<p><strong>Director:</strong> David Lowery · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Oakes Fegley, Bryce Dallas Howard, Wes Bentley, Karl Urban, Oona Laurence, Robert Redford</p>
