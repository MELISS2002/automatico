<h1>Susurros del Corazón</h1>
<p>Shizuku Tsukishima es una chica que le encanta leer. Su padre trabaja en una biblioteca, y ella a veces traduce canciones occidentales al jápones. Es entonces cuando se da cuenta de que, en las tarjetas de los libros de la biblioteca, Seiji Amasawa aparece antes que ella, y se empieza a imaginar como será el chico que se leyo los mismos libros antes que ella. Es entonces cuando por seguir a un gato llega a una bonita tienda, el nieto del tendero es ese tal Seiji, comenzará así una historia de amor, con dificultades ya que ella no se siente segura de lo que va a ser en la vida mientras que Seiji quiere viajar para realizar su sueño de convertirse en un artesano de violines.</p>
<p><strong>Director:</strong> 近藤喜文 · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Animación, Drama, Familia</p>
<p><strong>Reparto:</strong> 本名陽子, 高橋一生, 立花隆, 室井滋, 高山みなみ, 飯塚雅弓</p>
