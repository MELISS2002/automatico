<h1>Kubo y La Búsqueda del Samurái</h1>
<p>Kubo vive tranquilamente en un pequeño y normal pueblo hasta que un espíritu del pasado vuelve su vida patas arriba, al reavivar una venganza. Esto causa en Kubo multitud de malos tragos al verse perseguido por dioses y monstruos. Si de verdad Kubo quiere sobrevivir, antes debe localizar una armadura mágica que una vez fue vestida por su padre, un legendario guerrero samurái.</p>
<p><strong>Director:</strong> Travis Knight · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Animación, Aventura, Familia</p>
<p><strong>Reparto:</strong> Art Parkinson, Charlize Theron, Brenda Vaccaro, Cary-Hiroyuki Tagawa, Meyrick Murphy, George Takei</p>
