<h1>El gran jefe</h1>
<p>Cheng (Bruce Lee) llega a Bangkok desde China habiendo prometido a su madre que no se metería en peleas. Nada más llegar, encuentra trabajo en la fábrica del Sr. Mi, pero descubre que la factoría es en realidad una tapadera para encubrir el tráfico de drogas y la prostitución. Dos obreros desaparecen misteriosamente y los restantes trabajadores deciden ir a la huelga. La dirección envía contra ellos a hombres armados, y es cuando Cheng decide intervenir revelando su maestría en las artes marciales y haciendo que triunfen los obreros. Entonces, el Sr. Mi hace nombrar capataz a Cheng y da una fiesta en su honor, pero cuando éste descubre las verdaderas intenciones del jefe decide enfrentarse a él con todas sus consecuencias.</p>
<p><strong>Director:</strong> 羅維 · <strong>Año:</strong> 1971 · <strong>Géneros:</strong> Acción</p>
<p><strong>Reparto:</strong> Bruce Lee, Maria Yi, 田俊, Marilyn Bautista, 韩英杰, 劉永</p>
