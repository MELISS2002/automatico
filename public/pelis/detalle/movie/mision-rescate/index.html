<h1>Misión Rescate</h1>
<p>Durante una misión a Marte de la nave tripulada Ares III, una fuerte tormenta se desata dando por desaparecido y muerto al astronauta Mark Watney (Matt Damon), sus compañeros toman la decisión de irse pero él ha sobrevivido. Está solo y sin apenas recursos en el planeta. Con muy pocos medios deberá recurrir a sus conocimientos, su sentido del humor y un gran instinto de supervivencia para lograr sobrevivir y comunicar a la Tierra que todavía está vivo esperando que acudan en su rescate.</p>
<p><strong>Director:</strong> Ridley Scott · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Drama</p>
<p><strong>Reparto:</strong> Matt Damon, Jessica Chastain, Kristen Wiig, Jeff Daniels, Michael Peña, Sean Bean</p>
