<h1>Oppenheimer: el dilema de la bomba atómica</h1>
<p>La verdadera historia del recorrido del físico J. Robert Oppenheimer, de científico ambicioso y motivado a hombre atormentado y lleno de remordimientos, golpeado por la gravedad de lo que había hecho. Para Oppenheimer, la detonación con éxito de la primera bomba atómica valida años de incansable trabajo. Pero en este momento de aparente triunfo, Oppenheimer ve ante sí un poder destructivo de magnitud casi sobrenatural.</p>
<p><strong>Director:</strong> Christopher Cassel · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Documental, Historia</p>
<p><strong>Reparto:</strong> J. Robert Oppenheimer, Ellen Bradbury Reid, Christopher Nolan, Jon Else, Kai Bird, Bill Nye</p>
