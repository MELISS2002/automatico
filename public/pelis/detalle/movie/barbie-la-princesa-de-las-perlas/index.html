<h1>Barbie: La princesa de las perlas</h1>
<p>Barbie es Lumina, una sirena que sueña con convertirse en princesa. Desde siempre ha tenido un poder mágico con el que puede hacer que las perlas bailen y brillen. Lumina y su mejor amigo Kuda, una caballito de mar rosa, inician una aventura en un majestuoso reino marino. Allí utiliza sus poderes para ayudar a que sus amigos se preparen para el Baile Real. Entonces Lumina descubre que sus perlas mágicas son la clave para conocer su verdadero destino y para salvar al reino.</p>
<p><strong>Director:</strong> Ezekiel Norton · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Animación, Familia</p>
<p><strong>Reparto:</strong> Kelly Sheridan, Katie Crown, Mark Oliver, Rebecca Shoichet, Trish Pattendon, John Novak</p>
