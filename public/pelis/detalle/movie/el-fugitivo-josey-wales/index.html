<h1>El fugitivo Josey Wales</h1>
<p>Josey Wales, es un ex-soldado confederado que se dedica ahora a atender su granja al lado de su esposa y su pequeño hijo… hasta que un día, llegan miembros de la guerrilla Los botas rojas (al servicio de los ejércitos de la Unión) y matan a su familia. Desde entonces, Wales decidirá cobrar venganza y se convertirá en perseguido fugitivo al ser el último hombre que se ha negado a firmar un acuerdo de paz con los vencedores en la Guerra de secesión.</p>
<p><strong>Director:</strong> Clint Eastwood · <strong>Año:</strong> 1976 · <strong>Géneros:</strong> Western</p>
