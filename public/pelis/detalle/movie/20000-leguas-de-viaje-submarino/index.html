<h1>20,000 leguas de viaje submarino</h1>
<p>Adaptación de la novela homónima de Julio Verne. En 1870, debido a los relatos de marineros que aseguran haber visto un monstruo marino al sur del Pacífico, los Estados Unidos fletan un buque de guerra para destruir a la bestia que altera la tranquilidad de los mares. Pero, cuando el monstruo los ataca, de nada sirve todo su poderío bélico para evitar el desastre. Tras el hundimiento del buque, los tripulantes son rescatados por el propio «monstruo», que resulta ser un buque capaz de sumergirse en el mar, algo inédito hasta entonces.</p>
<p><strong>Director:</strong> Richard Fleischer · <strong>Año:</strong> 1954 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Fantasía</p>
<p><strong>Reparto:</strong> Kirk Douglas, James Mason, Paul Lukas, Peter Lorre, Robert J. Wilke, Ted de Corsia</p>
