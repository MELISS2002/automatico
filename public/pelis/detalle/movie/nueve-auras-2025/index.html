<h1>Nueve auras</h1>
<p>Este documental revive la historia de &amp;#8216;Nueve reinas&#x27; y el legado de su creador, Fabián Bielinsky. Tras años de perseverancia, su guion se convirtió en un fenómeno: más de 1,2 millones de espectadores, elogios de la crítica y remakes en Hollywood e India. Luego sorprendió con &amp;#8216;El aura&#x27;, un thriller que lo consagró como director versátil, antes de morir repentinamente. Actores y técnicos volverán a las locaciones originales, mientras su familia y material inédito revelan al hombre detrás del artista.</p>
<p><strong>Director:</strong> Mariano Frigerio · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Documental</p>
<p><strong>Reparto:</strong> Ricardo Darín, Gastón Pauls, Leticia Brédice, Dolores Fonzi, Nahuel Pérez Biscayart</p>
