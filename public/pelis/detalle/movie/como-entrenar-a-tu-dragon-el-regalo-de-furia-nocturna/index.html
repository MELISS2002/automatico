<h1>Cómo Entrenar a Tu Dragón: El regalo de Furia Nocturna</h1>
<p>La ciudad vikinga de Berk, que ahora disfruta de su nueva alianza con los dragones, se está preparando para sus vacaciones de invierno. Sin embargo, ese espíritu está amenazado cuando todos los dragones se van volando de repente por alguna razón. Cuando Hipo le hace una cola nueva a Chimuelo, éste sale volando. A medida que se acerca el día festivo, Hipo se ve obligado a aprender el secreto de los dragones por el camino difícil y a encontrar una solución para llevarlos a casa.</p>
<p><strong>Director:</strong> Tom Owens · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> Jay Baruchel, Gerard Butler, Craig Ferguson, America Ferrera, Jonah Hill, Christopher Mintz-Plasse</p>
