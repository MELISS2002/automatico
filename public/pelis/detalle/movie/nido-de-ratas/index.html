<h1>Nido de ratas</h1>
<p>Johnny Friendly (Lee J Cobb), el jefe del sindicato portuario, utiliza métodos mafiosos para controlar y explotar a los estibadores de los muelles neoyorquinos. Terry Malloy (Marlon Brando), un boxeador fracasado que trabaja para él, se ha visto involuntariamente implicado en uno de sus crímenes. Cuando Malloy conoce a Edie Doyle (Eva Marie Saint), la hermana de la víctima, se produce en él una profunda transformación moral que lo lleva a arrepentirse de su vida pasada. A través de Edie conoce al padre Barrie (Karl Malden), que trata de animarlo para que acuda a los tribunales y cuente todo lo que sabe.</p>
<p><strong>Director:</strong> Elia Kazan · <strong>Año:</strong> 1954 · <strong>Géneros:</strong> Crimen, Drama, Romance</p>
<p><strong>Reparto:</strong> Marlon Brando, Eva Marie Saint, Karl Malden, Lee J. Cobb, Rod Steiger, Pat Henning</p>
