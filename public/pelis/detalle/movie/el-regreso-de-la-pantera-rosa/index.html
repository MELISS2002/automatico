<h1>El regreso de la pantera rosa</h1>
<p>Un valioso diamante conocido como la «Pantera rosa» ha sido robado, y sólo hay una pista: un guante blanco, la inconfundible firma del mundialmente famoso ladrón apodado «El fantasma» (Christopher Plummer). Aunque se creía que se había retirado, para el inspector Clouseau (Peter Sellers) es el primer sospechoso. Decidido a limpiar su nombre, «El fantasma» se lanza a la búsqueda del verdadero ladrón y engaña a Clouseau con una serie de pistas falsas.</p>
<p><strong>Director:</strong> Blake Edwards · <strong>Año:</strong> 1975 · <strong>Géneros:</strong> Comedia, Crimen, Misterio</p>
<p><strong>Reparto:</strong> Peter Sellers, Christopher Plummer, Catherine Schell, Herbert Lom, Peter Arne, Peter Jeffrey</p>
