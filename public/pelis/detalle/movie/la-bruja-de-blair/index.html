<h1>La bruja de Blair</h1>
<p>Un grupo de estudiantes universitarios se aventuran en Black Hills Forest en Maryland para descubrir los misterios que envuelven la desaparición de Heather, la hermana de James Donahue, quien muchos creen está conectada a la leyenda de la Bruja de Blair después de su desaparición hace 20 años. Al principio el grupo tiene esperanzas, especialmente cuando un par de locales se ofrecen a actuar como guías a través del oscuro bosque, pero mientras la interminable noche avanza, el grupo es atormentado por una presencia amenazante. Lentamente, el grupo empieza a entender que la leyenda es muy real y más siniestra de lo que pudieron haber imaginado.</p>
<p><strong>Director:</strong> Amy Arter · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> James Allen McCune, Callie Hernandez, Brandon Scott, Corbin Reid, Valorie Curry, Wes Robinson</p>
