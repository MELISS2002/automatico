<h1>Cómo Perder A Un Hombre En 10 Días</h1>
<p>Andie Anderson es una periodista que debe terminar un reportaje poco usual y dispone tan sólo de diez días. Se trata de escribir, basándose en experiencias de primera mano, sobre las cosas que las mujeres hacen sin querer y que provocan el alejamiento de los hombres. Para ello tiene que conseguir que un chico se enamore de ella y luego cometer todos los errores posibles para que la deje. El hombre elegido es el cotizado soltero Benjamin Barry, que precisamente acaba de apostar con el director de la agencia de publicidad en la que trabaja que es capaz de hacer que una mujer se enamore de él en diez días.</p>
<p><strong>Director:</strong> Donald Petrie · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Kate Hudson, Matthew McConaughey, Kathryn Hahn, Annie Parisse, Adam Goldberg, Thomas Lennon</p>
