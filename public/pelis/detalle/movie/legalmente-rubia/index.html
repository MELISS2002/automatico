<h1>Legalmente Rubia</h1>
<p>Elle Woods es una rubia auténtica, además de muy popular, buena estudiante, presidenta de su hermandad y Miss Junio en el calendario de la Universidad. Ha disfrutado de una vida maravillosa y está enamorada de Warner Huntington III. Pero todo se derrumba cuando su novio decide romper con ella debido a que es demasiado rubia y no lo suficientemente formal para su futura carrera en el mundo de la política. Decidida a salir adelante, Elle se matricula en la Facultad de Derecho de la Universidad de Harvard, asumiendo un reto aún mayor de lo que esperaba.</p>
<p><strong>Director:</strong> Robert Luketic · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Reese Witherspoon, Luke Wilson, Selma Blair, Matthew Davis, Victor Garber, Jennifer Coolidge</p>
