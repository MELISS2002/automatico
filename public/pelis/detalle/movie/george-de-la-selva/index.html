<h1>George de la Selva</h1>
<p>En lo más profundo de la jungla africana los gorilas han criado a un bebé, George. Crecerá para ser el más valiente rey de la jungla. George va de un árbol a otro llevándose por delante todo lo que está en su camino. Pero cuando una bella mujer llamada Úrsula, procedente de la civilización, irrumpe en el mundo de George, éste perderá definitivamente el control. Dejando atrás la jungla y todos sus salvajes amigos, incluidos Mono, un gorila que habla, y Shep, un elefante que aspira a ser un perro, George aterrizará en la ciudad de San Francisco.</p>
<p><strong>Director:</strong> Sam Weisman · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Aventura, Comedia, Familia, Romance</p>
<p><strong>Reparto:</strong> Brendan Fraser, Leslie Mann, Thomas Haden Church, John Cleese, Richard Roundtree, Abraham Benrubi</p>
