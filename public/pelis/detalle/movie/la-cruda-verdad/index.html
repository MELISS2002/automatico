<h1>La cruda verdad</h1>
<p>Abby Ritcher es una joven productora de un programa matutino de TV de Sacramento que tiene problemas para el amor. Su búsqueda de «el hombre perfecto» le ha dejado soltera y sin esperanzas, y está llegando a pensar que está incapacitada para el romance. A Abby le espera una buena cuando sus jefes deciden que forme equipo con Mike Chadway, un rudo personaje televisivo que promete desvelar la cruda realidad del por qué los hombres y las mujeres son como son. Sorprendentemente, Abby contará con la insospechada ayuda de su desagradable presentador, que la asesorará en sus citas, haciéndola pasar por una serie de sonrojantes pruebas para demostrar sus teorías sobre las relaciones. Pero las tretas del hombre les conducirán a un resultado inesperado.</p>
<p><strong>Director:</strong> Robert Luketic · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Katherine Heigl, Gerard Butler, Eric Winter, Nick Searcy, Bree Turner, John Michael Higgins</p>
