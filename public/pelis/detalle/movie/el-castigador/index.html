<h1>El Castigador</h1>
<p>Frank Castle es un agente secreto del FBI que hasta el momento ha logrado una carrera intachable. Frank también es un ex operativo de las Fuerzas Especiales. Finalmente sale del campo de batalla para trabajar en una oficina y así poder tener una vida normal con su esposa e hijo. Será entonces cuando el mundo de Frank se viene abajo por el peor temor que siempre tuvo: Su familia es ejecutada como repercusión de su último trabajo. Ahora Frank Castle busca castigar a los asesinos, para encontrar al final lo que menos esperaba: La redención.</p>
<p><strong>Director:</strong> Jonathan Hensleigh · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Acción, Crimen, Drama</p>
