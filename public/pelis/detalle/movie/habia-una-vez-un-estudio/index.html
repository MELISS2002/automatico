<h1>Había una vez un estudio</h1>
<p>En «Había una vez un estudio», un conjunto estelar de queridos personajes de Walt Disney Animation Studios se reúne para tomar una foto grupal en honor al centenario de The Walt Disney Company, lo que resulta en una reunión alegre, entretenida y emotiva. Con 543 personajes de más de 85 largometrajes y cortometrajes, «Había una vez un estudio» da la bienvenida a héroes y villanos, príncipes y princesas, compinches y hechiceros, en una animación CG y dibujada a mano completamente nueva, para celebrar 10 décadas de narración y arte. y logros tecnológicos.</p>
<p><strong>Director:</strong> Dan Abraham · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Animación, Comedia, Drama, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Chris Diamantopoulos, Kaitlyn Robrock, Tony Anselmo, Bill Farmer, Jim Cummings, Auliʻi Cravalho</p>
