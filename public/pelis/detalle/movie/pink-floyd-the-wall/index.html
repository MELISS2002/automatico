<h1>Pink Floyd: The Wall</h1>
<p>Película visualmente evocativa, basada en la música del disco homónimo y las visiones del grupo de rock psicodélico «Pink Floyd». Narra la vida de una estrella de rock ficticia: «Pink». Una mezcla de relaciones humanas, abuso de drogas, sexo, infancia, la Segunda Guerra Mundial y fascismo se combinan en un relato que alterna cine en vivo con animación creada por el caricaturista británico Gerald Scarfe.</p>
<p><strong>Director:</strong> Alan Parker · <strong>Año:</strong> 1982 · <strong>Géneros:</strong> Drama, Música</p>
<p><strong>Reparto:</strong> Bob Geldof, Christine Hargreaves, James Laurenson, Eleanor David, Kevin McKeon, Bob Hoskins</p>
