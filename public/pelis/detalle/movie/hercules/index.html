<h1>Hércules</h1>
<p>Hace mil cuatrocientos años, un alma atormentada recorrió la tierra que no era hombre ni dios. Hércules era el poderoso hijo del dios rey Zeus, por lo cual no recibió más que sufrir toda su vida. Después de doce trabajos arduos y la pérdida de su familia, este alma oscura y cansada del mundo dio la espalda a los dioses encontrando su único consuelo en una sangrienta batalla. A lo largo de los años se calentó a la compañía de seis almas similares, siendo su único vínculo su amor por la lucha y la presencia de la muerte. Estos hombres y mujeres nunca se preguntan dónde van a pelear o por qué o quién, cuánto se les pagará. Ahora el rey de Tracia ha contratado a estos mercenarios para que entrenen a sus hombres para que se conviertan en el mayor ejército de todos los tiempos.</p>
<p><strong>Director:</strong> Brett Ratner · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Acción, Aventura</p>
