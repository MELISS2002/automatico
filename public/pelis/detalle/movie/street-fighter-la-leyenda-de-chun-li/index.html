<h1>Street Fighter: La leyenda de Chun-Li</h1>
<p>Siendo sólo una niña, Chun-Li (Kristin Kreuk) ve, impotente, cómo su padre es secuestrado. Diez años después, recibe la visita de Gen (Robin Shou), un antiguo delincuente reconvertido en defensor de los más débiles. Éste le revelará que su padre está en manos de Bison (Neal McDonough), un peligroso criminal. Gen se ofrecerá a entrenar a Chun-Li para que pueda enfrentarse a Bison y rescatar a su padre. Basado en el videojuego Street Fighter (dentro del arco Street Fighter Alpha).</p>
<p><strong>Director:</strong> Andrzej Bartkowiak · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Acción, Aventura</p>
<p><strong>Reparto:</strong> Kristin Kreuk, Chris Klein, Neal McDonough, Michael Clarke Duncan, Moon Bloodgood, Robin Shou</p>
