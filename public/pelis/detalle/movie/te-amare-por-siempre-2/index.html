<h1>Te Amaré Por Siempre</h1>
<p>Clare (Rachel McAdams) ha estado siempre enamorada de Henry (Eric Bana), un bibliotecario de Chicago. Está convencida de que están destinados a vivir juntos, aunque no sepa cuándo tendrán que volver a separarse: Henry es un viajero del tiempo, con una rara anomalía genética que lo condena a vivir su vida en una escala de tiempo cambiante, avanzando y retrocediendo a través de los años sin ningún control. A pesar de que los viajes de Henry son tan imprevisibles que Clare nunca sabe cuándo volverán a verse, intenta desesperadamente adaptarse a esa vida, pues lo que sí sabe es que no podría vivir sin Henry.</p>
<p><strong>Director:</strong> Robert Schwentke · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Drama, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Eric Bana, Rachel McAdams, Arliss Howard, Ron Livingston, Stephen Tobolowsky, Michelle Nolden</p>
