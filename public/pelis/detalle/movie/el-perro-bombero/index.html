<h1>El Perro Bombero</h1>
<p>Rex es el perro más consentido de todo Hollywood. Tiene una importante carrera como estrella de películas donde muestra toda la clase de suertes, y por lo tanto se comporta como si fuera una diva del cine mundial. Un día, durante una grabación, Rex comete un error en la rutina y hace creer a sus entrenadores que está muerto. Rex, en realidad, está perdido.</p>
<p><strong>Director:</strong> Libby Hodgson · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Comedia, Familia</p>
