<p>Dos detectives diferentes son asignados en un mismo caso. Ambos tendrán que adaptarse a las costumbres del otro para poder concluir su trabajo con éxito, pero no va a ser una tarea fácil. El detective inspector Lee es el rey de las artes marciales y pertenece a la Royal Hong Kong Police. Su pupila preferida es la hija de once años del Cónsul chino, de la cual el inspector Lee es su guardaespaldas y su mejor amigo. Esta muchacha es capturada en los Estados Unidos por un peligroso grupo criminal.</p>
<p><strong>Director:</strong> Brett Ratner · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Acción, Comedia, Crimen</p>
