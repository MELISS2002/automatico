<h1>Baba Yaga: El terror del Bosque Oscuro</h1>
<p>La joven familia que se mudó a un nuevo apartamento en las afueras de la ciudad. La niñera contratada por ellos para la hija recién nacida rápidamente ganó confianza. Sin embargo, el niño mayor, Egor, habla del comportamiento aterrador de una mujer, pero sus padres no le creen. Las cámaras de vigilancia instaladas por el padre para mayor comodidad solo confirman que todo está en orden. Entonces, un día, Egor, al regresar a casa, no encuentra rastro ni de la niñera ni de la hermana pequeña, y los padres están en un trance extraño y ni siquiera recuerdan que tuvieron una hija. Entonces Egor, junto con sus amigos, va en busca, durante la cual resulta que la niñera es un antiguo demonio eslavo, conocido popularmente como Baba Yaga.</p>
<p><strong>Director:</strong> Святослав Подгаевский · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Олег Чугунов, Глафира Голубева, Артём Жигулин, Игорь Хрипунов, Светлана Устинова, Алексей Розин</p>
