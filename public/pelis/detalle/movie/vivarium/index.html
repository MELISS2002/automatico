<h1>Vivarium</h1>
<p>Gemma (Imogen Poots) y Tom (Jesse Eisenberg) son una joven pareja que se ha planteado la compra de su primera casa. Para ello visitan una inmobiliaria donde los recibe un extraño agente de ventas, que les acompaña a Yonder, una nueva, misteriosa y peculiar urbanización donde todas las casas son idénticas, para mostrarles una vivienda unifamiliar para ellos. Volviendo de la visita, quedan atrapados en una laberíntica e interminable pesadilla surrealista.</p>
<p><strong>Director:</strong> Neil Guerin · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Ciencia ficción, Misterio, Terror</p>
<p><strong>Reparto:</strong> Imogen Poots, Jesse Eisenberg, Senan Jennings, Éanna Hardwicke, Jonathan Aris, Côme Thiry</p>
