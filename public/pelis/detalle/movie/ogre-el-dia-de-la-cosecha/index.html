<h1>Ogre - El Día de la Cosecha</h1>
<p>Jules, de seis años, y su madre Chloé aterrizan en la campiña francesa desierta. Para comenzar una nueva vida, lejos de un pasado doloroso, ha aceptado hacerse cargo de la escuela del pueblo. Pero la comunidad aparentemente tranquila está consumida por la inexplicable desaparición de un niño hace meses. Mathieu, el médico de la ciudad, no es insensible al encanto del recién llegado. A medida que se acerca a Chloé, su hijo Jules se vuelve cada vez más ansioso. Él lo sabe, lo puede sentir: Mathieu es la bestia, que ahora quiere devorarlo y llevarse a su madre.</p>
<p><strong>Director:</strong> Arnaud Malherbe · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Drama, Fantasía, Terror</p>
<p><strong>Reparto:</strong> Ana Girardot, Samuel Jouy, Giovanni Pucci, Fabien Houssaye, Albertine Rivière, Félix Malherbe</p>
