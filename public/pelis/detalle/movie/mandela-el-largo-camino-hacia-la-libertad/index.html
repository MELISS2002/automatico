<h1>Mandela: El largo camino hacia la libertad</h1>
<p>Biopic que narra la extraordinaria vida del líder sudafricano Nelson Mandela, desde su niñez en una población rural y sus 27 años en prisión por activismo contra el &amp;#8216;apartheid&#x27; hasta su investidura como el primer presidente elegido democráticamente de Sudáfrica. Se trata de la increíble historia de un hombre corriente con grandes valores que se enfrentó al desafío de su tiempo y triunfó, un retrato íntimo de cómo se convirtió en un icono moderno.</p>
<p><strong>Director:</strong> Justin Chadwick · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Idris Elba, Naomie Harris, Tony Kgoroge, Riaad Moosa, Fana Mokoena, Robert Hobbs</p>
