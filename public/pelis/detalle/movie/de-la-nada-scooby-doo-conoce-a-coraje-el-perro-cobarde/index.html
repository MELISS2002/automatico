<h1>De la nada: ¡Scooby-Doo! Conoce a Coraje, el Perro Cobarde</h1>
<p>La comedia empieza cuando Scooby-Doo, el perro detective favorito, se une por primera vez a Coraje, el perro cobarde. La dupla canina huele algo extraño en el medio de Ningún Lugar, Kansas, hogar de Coraje y sus dueños, Justo y Muriel. Enseguida este misterioso descubrimiento los lleva al encuentro de una cigarra monstruosa gigante y su extraño ejército de bichos voladores. Fred, Vilma, Dafne y Shaggy saben bien que un matamoscas no bastará, y necesitarán la ayuda del dúo perruno para resolver el misterio. ¿Podrán Scooby y Coraje vencer sus miedos y derrotar al ejército de insectos antes de que infeste al mundo? ¡Te reto a que no estires la pata del susto!</p>
<p><strong>Director:</strong> Cecilia Aranovich · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Animación, Misterio</p>
<p><strong>Reparto:</strong> Matthew Lillard, Thea White, Grey DeLisle, Frank Welker, Kate Micucci, Jeff Bennett</p>
