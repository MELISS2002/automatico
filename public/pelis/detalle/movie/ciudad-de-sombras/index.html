<h1>Ciudad de sombras</h1>
<p>Siete años después de haberse visto obligado a dejar su puesto en la policía de Nueva York por un escándalo producido por un desafortunado tiroteo, el detective privado Billy Taggart es contratado por el alcalde de la ciudad, Nicholas Hostetler, para que investigue la presunta infidelidad de su mujer. Pero cuando el supuesto amante de ésta aparece muerto, las cosas se complican mucho más de lo que Taggart podría haber previsto. El detective, que no tarda en descubrir que no era más que un peón en una partida mayor, se adentra en la zona gris que une los mundos del crimen, la política y los negocios.</p>
<p><strong>Director:</strong> Allen Hughes · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Crimen, Drama, Suspense</p>
<p><strong>Reparto:</strong> Mark Wahlberg, Russell Crowe, Catherine Zeta-Jones, Jeffrey Wright, Barry Pepper, Alona Tal</p>
