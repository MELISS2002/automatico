<h1>A prueba de balas</h1>
<p>Archie Moses y Rock Keats han sido amigos y compañeros en el crimen durante demasiado tiempo como para no conocerse mutuamente. Sin embargo, durante una operación de tráfico de drogas de cierta envergadura, se descubre que Keats es un policía infiltrado y Moses acaba disparándole accidentalmente a la cabeza. Tras una dolorosa recuperación, los dos antiguos amigos están en lados opuestos de la partida, aunque las circunstancias puede que acaben demostrándoles que su amistad está hecha a prueba de balas, y que la lealtad que les ha unido está por encima del odio que actualmente se profesan.</p>
<p><strong>Director:</strong> Ernest R. Dickerson · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Acción, Comedia, Crimen</p>
<p><strong>Reparto:</strong> Damon Wayans, Adam Sandler, James Caan, Jeep Swenson, James Farentino, Kristen Wilson</p>
