<h1>Masacre Americana</h1>
<p>Después de que un gobernador emita una orden ejecutiva para arrestar a los hijos de inmigrantes indocumentados, a los jóvenes recién detenidos se les ofrece la oportunidad de que se les retiren los cargos ofreciéndose como voluntarios para cuidar a los ancianos. Una vez dentro de la instalación de cuidado de ancianos, los voluntarios descubren que el gobernador y el supervisor de la instalación han tramado una conspiración terriblemente depravada.</p>
<p><strong>Director:</strong> Diego Hallivis · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Comedia, Misterio, Suspense, Terror</p>
<p><strong>Reparto:</strong> Jorge Lendeborg Jr., Jenna Ortega, Allen Maldonado, Yumarie Morales, Jorge Diaz, Bella Wholey Ortiz</p>
