<h1>El Día de la Independencia</h1>
<p>El 2 de julio, mothership extranjero gigantesco entra en la órbita alrededor de la Tierra y despliega varias docenas de naves espaciales del &amp;#8216;destructor&#x27; en forma de platillo que rápidamente ponen la basura a ciudades principales alrededor del planeta. El 3 de julio, los Estados Unidos conducen un contraataque coordinado que falla. El 4 de julio, un plan se idea para ganar el acceso al interior de mothership extranjero en el espacio, a fin de plantar un misil nuclear.</p>
<p><strong>Director:</strong> Roland Emmerich · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción</p>
