<h1>[REC]</h1>
<p>Cada noche, Ángela, una joven reportera de una televisión local, sigue con su cámara a un grupo profesional distinto. Esta noche le toca entrevistar a los bomberos y tiene la secreta esperanza de poder asistir en directo a un impactante incendio. Pero la noche transcurre tranquilamente. Y cuando, por fin, reciben la llamada de una anciana que se ha quedado encerrada en su casa, no le queda otro remedio que seguirlos durante la misión de rescate. En el edificio donde vive la anciana, los vecinos están muy asustados. La mujer, encerrada en su piso, lanza unos gritos desgarradores&amp;#8230; Es sólo el comienzo de una larga pesadilla y de un dramático reportaje único en el mundo.</p>
<p><strong>Director:</strong> Jaume Balagueró · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Misterio, Terror</p>
<p><strong>Reparto:</strong> Manuela Velasco, Pablo Rosso, Javier Coromina, Ferrán Terraza, Martha Carbonell, David Vert</p>
