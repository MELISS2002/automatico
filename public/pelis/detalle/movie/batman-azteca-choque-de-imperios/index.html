<h1>Batman Azteca: Choque de imperios</h1>
<p>En la época del Imperio Azteca, Yohualli Coatl, un joven azteca, experimenta una tragedia cuando su padre y líder de la aldea, Toltecatzin, es asesinado por los conquistadores españoles. Yohualli escapa a Tenochtitlán para advertir al rey Moctezuma y a su sumo sacerdote, Yoka, del peligro inminente. Usando el templo de Tzinacan, el dios murciélago, como guarida, Yohualli entrena con su mentor y asistente, Acatzin, desarrollando equipo y armamento para enfrentar la invasión española, proteger el templo de Moctezuma y vengar la muerte de su padre.</p>
<p><strong>Director:</strong> Juan Jose Meza-Leon · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Acción, Animación, Fantasía</p>
<p><strong>Reparto:</strong> Horacio García Rojas, Álvaro Morte, Omar Chaparro, Humberto Busto, Jorge R. Gutierrez, Jesús Guzmán</p>
