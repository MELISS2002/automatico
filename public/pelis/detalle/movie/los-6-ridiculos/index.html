<h1>Los 6 Ridículos</h1>
<p>En la época del Lejano Oeste, un hombre tranquilo llamado Tommy «Cuchillo Blanco» Stockburn (Adam Sandler) junto a sus cinco hermanos -todos huérfanos- han crecido bajo el cuidado de una tribu de nativos americanos. Cuando todos ellos alcanzan la edad adulta, la seguridad de la zona es cada vez más frágil y surgen problemas para mantener el orden en la región, por lo que, a menudo, tiene encuentros violentos con un grupo de bandidos con parches en el ojo liderados por Will Patch (Will Forte). Todo cambia cuando en la ciudad reaparece un ladrón de bancos llamado Frank Stockburn (Nick Nolte), quien dice ser el padre biológico de Tommy y a quien se dio por muerto durante mucho tiempo. Junto a él, Tommy tiene que emprender un viaje lleno de aventuras que hará que ambos revivan recuerdos del pasado al mismo tiempo que buscan dentro de sí mismos una valentía inexistente de la que habrá que echar mano cuando llegue el momento de enfrentarse a nuevos y temidos enemigos&amp;#8230;.</p>
<p><strong>Director:</strong> Nicholas Mastandrea · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Acción, Aventura, Comedia, Western</p>
<p><strong>Reparto:</strong> Adam Sandler, Terry Crews, Jorge Garcia, Taylor Lautner, Rob Schneider, Luke Wilson</p>
