<h1>Viernes 13 Parte 10: Jason X - Al Espacio</h1>
<p>En el año 2455, Old Earth es ahora un planeta contaminado abandonado por siglos - un mundo marrón de violentas tormentas, tierras tóxicas y mares venenosos. Sin embargo, los humanos han vuelto al lugar mortal que una vez huyeron, no a vivir, sino a investigar los artefactos antiguos y oxidados de las civilizaciones desaparecidas hace tiempo. Pero no es el ambiente dañino el que podría resultar fatal para los intrépidos, jóvenes exploradores que acaban de aterrizar en la Vieja Tierra. Para ellos, es viernes 13, y Jason vive!</p>
<p><strong>Director:</strong> James Isaac · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Ciencia ficción, Terror</p>
<p><strong>Reparto:</strong> Kane Hodder, Jeff Geddis, Lexa Doig, David Cronenberg, Markus Parilo, Jonathan Potts</p>
