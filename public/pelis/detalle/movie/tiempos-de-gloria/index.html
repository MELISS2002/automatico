<h1>Tiempos De Gloria</h1>
<p>Entre 1861 y 1865 tuvo lugar la Guerra de Secesión que enfrentó al ejército confederado (Sur) con las tropas de la Unión (Norte). Los militares del Norte eran reacios a reclutar negros y armarlos para luchar contra el Sur; pero, finalmente, se aprobó una ley que lo permitía. El regimiento 54 de Massachusetts fue el primero y el más valeroso de los batallones formados por negros, y el Coronel Robert Gould Shaw fue el encargado de organizarlo.</p>
<p><strong>Director:</strong> Edward Zwick · <strong>Año:</strong> 1989 · <strong>Géneros:</strong> Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> Matthew Broderick, Denzel Washington, Cary Elwes, Morgan Freeman, Jihmi Kennedy, Andre Braugher</p>
