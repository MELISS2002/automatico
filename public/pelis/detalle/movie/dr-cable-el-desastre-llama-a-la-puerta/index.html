<h1>Dr. Cable: El desastre llama a la puerta</h1>
<p>Steven Kovacs es un joven que acaba de romper con su novia y que pretende instalar en su casa un servicio de televisión por cable de forma gratuita. Pero Kovacs se encuentra con un instalador un tanto peculiar, que busca incansablemente un amigo con el que compartir su vida. Desde el momento en el que el «Chico del Cable» entra en casa del protagonista, intenta adentrarse en la vida de éste hasta arruinársela&amp;#8230; y poco a poco se va convirtiendo en un ser peligroso, capaz de hacer cualquier cosa por mantener la incipiente amistad con su cliente.</p>
<p><strong>Director:</strong> Ben Stiller · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Comedia, Drama, Suspense</p>
<p><strong>Reparto:</strong> Jim Carrey, Matthew Broderick, Leslie Mann, Jack Black, George Segal, Diane Baker</p>
