<h1>Rescatando al soldado Ryan</h1>
<p>Segunda Guerra Mundial, 1944. Tras el desembarco de los Aliados en Normandía, a un grupo de soldados americanos se le encomienda una peligrosa misión: poner a salvo al soldado James Ryan. Los hombres de la patrulla del capitán John Miller deben arriesgar sus vidas para encontrar a este soldado, cuyos tres hermanos han muerto en la guerra. Lo único que se sabe del soldado Ryan es que se lanzó con su escuadrón de paracaidistas detrás de las líneas enemigas.</p>
<p><strong>Director:</strong> Steven Spielberg · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Bélica, Drama, Historia</p>
