<h1>Bolt: Un perro fuera de serie</h1>
<p>¡Que comience la acción! Prepárate para la aventura más absolutamente fabulosa de todos los tiempos cuando Bolt, el mejor héroe de todo el planeta, y yo, Rhino, su fiel compañero y leal hámster acompañante, ¡emprendemos una misión súper secreta! Como uno de los integrantes de este Dúo Dinámico, te contaré cuál es la acción. Un día, estaba viendo «Bolt», mi programa favorito de televisión, y al momento siguiente ¡ya estaba trabajando en modalidad «stealth», al lado de mi héroe favorito de todos los tiempos! Juntos tenemos que recorrer la distancia de Nueva York a Hollywood para derrotar a las fuerzas del mal y salvar a la adorable Miss Penney del máximo peligro. Pero no se preocupen – armado con el «súper ladrido» de Bolt y mi pelota de trueno – estamos preparados para todo.</p>
<p><strong>Director:</strong> Chris Williams · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> John Travolta, Miley Cyrus, Susie Essman, Mark Walton, Malcolm McDowell, James Lipton</p>
