<h1>Me las vas a pagar, papá</h1>
<p>Después de mucho tiempo sin verse, el pequeño Timmy aparece en casa de su padre con la intención de pasar una temporada con él. Por desgracia, su padre tiene otros planes. Metido en un chanchullo con dos torpes colaboradores, Ray se ha prometido a sí mismo que será el último golpe, el que le permita ganar el dinero suficiente para montar una pastelería y ganarse la vida de manera honrada. Sin embargo, surge un pequeño problema: el imaginativo Timmy hará todo lo posible para que su padre cumpla como tal desde el primer momento.</p>
<p><strong>Director:</strong> Howard Deutch · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Comedia, Crimen, Familia</p>
<p><strong>Reparto:</strong> Macaulay Culkin, Ted Danson, Glenne Headly, Saul Rubinek, Gailard Sartain, Sam McMurray</p>
