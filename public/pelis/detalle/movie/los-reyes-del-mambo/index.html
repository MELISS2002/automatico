<h1>Los reyes del mambo</h1>
<p>Procedentes de Cuba, los hermanos César y Néstor Castillo llegan a Nueva York para intentar triunfar en el mundo de la música. El primero es el más mujeriego, mientras que Néstor, más nostálgico y tímido, es el compositor y trompetista. Por culpa de su carácter, César comienza a tener problemas con los gángsters locales.</p>
<p><strong>Director:</strong> Arne Glimcher · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Drama, Música</p>
