<h1>Coctel</h1>
<p>Brian Flanagan (Tom Cruise), un joven ambicioso recién licenciado del ejército, trabaja como camarero en un local de copas de Nueva York para costearse los estudios. Gracias a los consejos de su jefe Douglas Coughlin (Brian Brown), se convierte en la atracción del local. Pero él aspira a abrir su propio local con el nombre de «Coktails y Sueños». Para conseguir el dinero necesario se va a Jamaica a trabajar de camarero. Allí conoce a Jordan Mooney (Elisabeth Shue), una ingenua joven que está de vacaciones en la isla.</p>
<p><strong>Director:</strong> Roger Donaldson · <strong>Año:</strong> 1988 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Tom Cruise, Bryan Brown, Elisabeth Shue, Lisa Banes, Kelly Lynch, Gina Gershon</p>
