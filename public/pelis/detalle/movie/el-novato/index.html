<article>
<h1>El novato</h1>
<p>Basada en hechos reales. Jim Morries (Dennis Quaid) era un jugador de béisbol que nunca logró salir de la segunda división. Además, sufrió una lesión en el hombro que puso fin a su carrera hace doce años. Ahora es un hombre casado y con hijos, profesor de química y entrenador de béisbol en un instituto de Texas. Un día, su equipo le propone un trato: si consiguen ganar el campeonato regional, Jim podrá presentarse a las pruebas de un equipo de primera división. Se trata de un gran desafío para el equipo, que, de ser uno de los peores, pasa a ganar el campeonato por primera vez en la historia del instituto. Jim se ve obligado a cumplir su parte del trato y se presenta a las pruebas, pero ocurre algo sorprendente.</p>
<p><strong>Director:</strong> John Lee Hancock · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Drama, Familia</p>
<p><strong>Reparto:</strong> Dennis Quaid, Rachel Griffiths, Jay Hernandez, Beth Grant, Angus T. Jones, Brian Cox</p>
