<h1>Pollonejo y el hámster de la oscuridad</h1>
<p>Cuenta la historia de Hopper, el hijo adoptivo del Rey Pedro, un famoso aventurero que nació mitad pollo y mitad liebre. Ansioso por ser aceptado a pesar de sus diferencias, Hopper se embarca en una emocionante aventura junto con su fiel sirviente Abe, una tortuga sarcástica, y Meg, una mofeta intrépida experta en artes marciales, en busca de la codiciada reliquia conocida como el Hámster de la Oscuridad. Los tres se enfrentan a todo un reto al tener que llegar antes que Lapin, un villano cuya reciente fuga de la cárcel amenaza la paz del reino.</p>
<p><strong>Director:</strong> Benjamin Mousquet · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Jordan Tartakow, Joe Ochman, Laila Berzins, Danny Fehsenfeld, Chris McCune, Michael Orenstein</p>
