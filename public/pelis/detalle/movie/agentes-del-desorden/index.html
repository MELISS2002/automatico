<h1>Agentes del Desorden</h1>
<p>Podría parecer que esta es la última película sobre las aventuras de dos compañeros policía, pero hay un problema, ninguno de los dos lo es. Cuando los dos amigos se disfrazan de agentes de la ley para una fiesta de disfraces se convierten en la sensación del barrio. Al ver el inmenso poder que les ofrecen estos uniformes los dos compañeros deciden aprovecharse al máximo de esta nueva situación de autoridad. Pero cuando estos dos héroes de nuevo cuño se ven enredados en una trama mafiosa de la vida real deberán decidir si poner sus placas falsas en acción o faltar a su deber como falsos policías.</p>
<p><strong>Director:</strong> Luke Greenfield · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Comedia</p>
