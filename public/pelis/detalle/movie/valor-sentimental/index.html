<h1>Valor sentimental</h1>
<p>Tras la muerte de su madre, las hermanas Nora y Agnes se reencuentran con su distanciado padre, Gustav Borg, un veterano director de cine de renombre, que le ofrece a su hija Nora, actriz de teatro, un papel en su próxima película. Nora lo rechaza y pronto descubre que le ha dado ese papel a una joven y entusiasta estrella de Hollywood. De repente, las dos hermanas deben sortear su complicada relación con su padre y lidiar con una actriz estadounidense que se encuentra en medio de su compleja dinámica familiar.</p>
<p><strong>Director:</strong> Joachim Trier · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Renate Reinsve, Stellan Skarsgård, Inga Ibsdotter Lilleaas, Elle Fanning, Anders Danielsen Lie, Jesper Christensen</p>
