<h1>El Club de los Milagros</h1>
<p>Ballygar, Dublín, Irlanda, 1968: las amigas Lily, Eileen y Dolly ganan el viaje de sus vidas: una peregrinación a Lourdes. Cada una de ellas necesita desesperadamente un milagro personal, por lo que el viaje parece la respuesta a todas sus plegarias. Pero cuando se les une Chrissie, que regresa a Dublín tras décadas en América, se reabren profundas heridas del pasado y quedan al descubierto amargas verdades. A medida que se enfrentan unos a otros y aceptan su pasado común, el grupo se enfrenta a revelaciones que les cambiarán para siempre.</p>
<p><strong>Director:</strong> Thaddeus O&#x27;Sullivan · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Maggie Smith, Laura Linney, Kathy Bates, Agnes O&#x27;Casey, Stephen Rea, Mark O&#x27;Halloran</p>
