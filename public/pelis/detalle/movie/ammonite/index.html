<h1>Ammonite</h1>
<p>Narra la historia de amor en la Inglaterra de 1840 entre la paleontóloga Mary Anning y Charlotte Murchinson, una mujer casada. En la conservadora sociedad británica del siglo XIX, la aclamada pero desconocida buscadora de fósiles Mary Anning trabaja sola en el sur del país. Cuando toda su fama ya ha pasado, se dedica a vender fósiles a los turistas para salir adelante, hasta que un visitante rico quiere que Mary cuide a su mujer. La relación entre ambas se irá desarrollando y tomará un camino inesperado.</p>
<p><strong>Director:</strong> Francis Lee · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Kate Winslet, Saoirse Ronan, Gemma Jones, James McArdle, Alec Secăreanu, Fiona Shaw</p>
