<h1>Las Brujas</h1>
<p>Cuenta la conmovedora historia de un pequeño huérfano que, a finales de 1967, se va a vivir con su querida abuela a Demopolis, un pueblo de Alabama. El niño y su abuela tienen extraños encuentros con algunas brujas aparentemente glamurosas pero absolutamente diabólicas, así que ella decide quitarse de en medio y llevarse al chico a un hotel de lujo en la costa. Por desgracia, llegan exactamente al mismo tiempo que la Gran Bruja que ha reunido a sus compinches de todo el planeta -que van de incógnito- para llevar a cabo sus horribles planes. Adaptación del libro «Las brujas» de Roald Dahl.</p>
<p><strong>Director:</strong> Robert Zemeckis · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Comedia, Familia, Fantasía, Terror</p>
<p><strong>Reparto:</strong> Anne Hathaway, Octavia Spencer, Stanley Tucci, Jahzir Bruno, Chris Rock, Codie-Lei Eastick</p>
