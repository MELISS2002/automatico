<h1>Hermanos</h1>
<p>Remake del film danés de Susanne Bier, «Brothers» (2004). El condecorado capitán Sam Cahill es enviado a combatir en Afganistán. Unos meses después, el gobierno lo da por muerto o desaparecido. Tras conocer la noticia, su hermano Tommy se queda en Estados Unidos, cuidando de su cuñada y sus sobrinos. Con el tiempo, Tommy se gana su cariño y llega a sustituir a su hermano como marido y como padre. Pero un día reciben una noticia inesperada que perturbará sus vidas.</p>
<p><strong>Director:</strong> Jim Sheridan · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Bélica, Drama, Suspense</p>
<p><strong>Reparto:</strong> Tobey Maguire, Jake Gyllenhaal, Natalie Portman, Sam Shepard, Mare Winningham, Bailee Madison</p>
