<h1>Ong Bak</h1>
<p>Ong Bak es una estatua legendaria de Buda que se halla en el templo de Nong Para-du, en la Tailandia rural. Los aldeanos creen que los poderes mágicos de Ong Bak les protegen de todo mal. Un despiadado gánster roba la cabeza del buda dejando al pueblo totalmente desprotegido. Sus habitantes buscarán a un guerrero para recuperar el buda y enfrentarse a la banda de gánsters, encontrando a Ting, un huérfano criado en el templo, y alumno de Pra Kru, un amable monje, experto en el ancestral arte del Muay Thai: “Las Nueve Armas Corporales».</p>
<p><strong>Director:</strong> ปรัชญา ปิ่นแก้ว · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
