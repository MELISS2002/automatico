<h1>Asesino Kung Fu</h1>
<p>Un asesino va por Hong Kong matando a los máximos exponentes de las artes marciales. Cuando Xia, asesino convicto y experto en kung fu, se entera de esto ofrece a la policía atrapar al asesino y recuperar su libertad. Sin embargo, el astuto asesino se le escapa una y otra vez, aunque dejando claro que Xia será su último desafío. Este se niega a dejarse arrastrar a un duelo a vida o muerte, hasta que el asesino amenaza a la mujer que más le importa.</p>
<p><strong>Director:</strong> 陳德森 · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Acción, Aventura, Crimen, Suspense</p>
<p><strong>Reparto:</strong> 甄子丹, 楊采妮, 王宝强, 白冰, 吳浩康, 方中信</p>
