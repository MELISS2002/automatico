<h1>Tenacious D: La Pua del Destino</h1>
<p>En 1994 tuvieron lugar en Los Ángeles dos acontecimientos que sacudieron la tierra: el terremoto de Northridge y el nacimiento de Tenacious D, la banda liderada por Jack Black y Kyle Gass. Los dos se conocieron cuando eran miembros de la Actor’s Gang, una compañía de teatro de Los Ángeles fundada por Tim Robbins, y allí fue donde ambos descubrieron su amor por el rock and roll. Desde su primera actuación en el Al’s Bar de Los Ángeles, donde interpretaron su única canción, Tribute, hasta su revelación como la autoproclamada Mejor Banda de la Tierra, The D, como los conocen sus seguidores, han encantado a todo el que podido escucharlos. Aunque Black y Gass describen Tenacious D in The Pick of Destiny como una autobiografía, se han tomado ciertas libertades, pero claro, ¿por qué no iban a hacerlo? al fin y al cabo se trata de The D, los trovadores más irreverentes dentro de los reverentes.</p>
<p><strong>Director:</strong> Liam Lynch · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Aventura, Comedia, Fantasía, Música</p>
<p><strong>Reparto:</strong> Jack Black, Kyle Gass, JR Reed, Ronnie James Dio, Paul F. Tompkins, Troy Gentile</p>
