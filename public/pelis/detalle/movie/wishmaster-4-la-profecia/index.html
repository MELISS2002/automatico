<h1>Wishmaster 4: La profecía</h1>
<p>Tras un accidente de tráfico que deja a Sam inválido, la relación de Lisa y Sam empieza a desmoronarse. El abogado de la pareja, Steven Verdel, enamorado de Lisa desde hace tiempo, ve su oportunidad y, como muestra de su amor, le regala una pequeña caja antigua que accidentalmente Lisa deja caer al suelo. El golpe hace que surja la Piedra del Fuego Secreto que despierta al Djinn, un genio demoníaco cuyo único propósito es liberar a sus hermanos de las profundidades del infierno. El Wishmaster acaba de encontrar una nueva y bella víctima a quien concederá tres deseos, dejando a su paso un rastro de terror y sangre.</p>
<p><strong>Director:</strong> Chris Angel · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Fantasía, Terror</p>
<p><strong>Reparto:</strong> Tara Spencer-Nairn, Michael Trucco, Jason Thompson, John Novak, Victor Webster, John Benjamin Martin</p>
