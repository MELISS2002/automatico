<h1>El Día que la Tierra se Detuvo</h1>
<p>Un día la Dr. Helen Benson (Jennifer Connelly) es sacada repentinamente de su casa por la Agencia de Seguridad Nacional, y llevada junto a otros científicos para intentar explicar las causas de un misterioso objeto del espacio que va a chocar de forma inmintente contra la isla de Manhattan. Pero la colisión no se produce pues el OVNI, que resulta ser una nave espacial de origen desconocido, aterriza en medio de Central Park. Las extraordinarias circustancias que siguen a tan prodigioso acontecimiento, con el planeta entero en estado de shock, llevarán a Helen a conocer a Klaatu (Keanu Reeves), un extraterrestre humanoide que dice llegar a la Tierra -aparentemente con fines pacíficos- para advertir a la población&amp;#8230;</p>
<p><strong>Director:</strong> Scott Derrickson · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Ciencia ficción, Drama, Suspense</p>
<p><strong>Reparto:</strong> Keanu Reeves, Jennifer Connelly, Jaden Smith, Jon Hamm, Kathy Bates, John Cleese</p>
