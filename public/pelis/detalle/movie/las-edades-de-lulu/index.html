<h1>Las edades de Lulú</h1>
<p>Lulú es una chica de quince años que sucumbe a los atractivos de Pablo, un amigo de la familia. Después de esta experiencia, Lulú alimenta durante mucho tiempo el deseo por ese hombre, que volverá a entrar en su vida años más tarde, prolongando así el juego amoroso de la niñez. Pablo crea para ella un mundo aparte, un universo privado donde el tiempo carece de valor. Pero pronto ese mundo idealizado se quebrará, cuando Lulú, con treinta años, se adentre en el universo de los deseos prohibidos. Adaptación de la novela homónima de Almudena Grandes.</p>
<p><strong>Director:</strong> Bigas Luna · <strong>Año:</strong> 1990 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Francesca Neri, Óscar Ladoire, María Barranco, Fernando Guillén Cuervo, Rosana Pastor, Javier Bardem</p>
