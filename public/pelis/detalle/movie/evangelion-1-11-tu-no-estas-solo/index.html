<h1>Evangelion: 1.11 Tú (No) Estás Solo</h1>
<p>En 1999 un cataclismo ocurre en la Antártida llamado “El Segundo Impacto” como resultado de un incidente ocasionado por unos seres conocidos como “Ángeles”. Gran parte de la Tierra quedó devastada por el fenómeno, aunque gradualmente se va recuperando. Años después, los “Ángeles” regresan y comienzan a atacar a la Tierra. La organización NERV revela su nuevo proyecto con miras a salvar el mundo: gigantes y bio-mecánicos robots conocidos como Evas que son unos de las pocas fuerzas sobre la Tierra capaces de enfrentar a los “Ángeles”.</p>
<p><strong>Director:</strong> 鶴巻和哉 · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Acción, Animación, Ciencia ficción, Drama</p>
<p><strong>Reparto:</strong> 緒方恵美, 林原めぐみ, 三石琴乃, 山口由里子, 石田彰, 立木文彦</p>
