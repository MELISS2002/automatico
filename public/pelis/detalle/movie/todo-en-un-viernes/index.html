<h1>Todo en un viernes</h1>
<p>Craig James, de 22 años, acaba de ser despedido como vendedor de zapatos, por lo que sus padres quieren exponerlo. Craig está enamorado de Debbie, la hermosa entrenadora física. Solo tiene un problema: su amigo patológicamente celoso Joi. Pero hay cosas peores: su mejor amigo Smokey arruinó un trato de drogas y ahora está bastante hecho un desastre. Va a ser un viernes caluroso para Craig: antes del atardecer tiene que ayudar a Smokey a encontrar un trabajo, escapar de Joi, conquistar a Debbie y, para colmo, sobrevivir a una discusión con el poderoso musculoso Deebo.</p>
<p><strong>Director:</strong> Dwight Williams · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Ice Cube, Chris Tucker, Nia Long, Tommy Lister Jr., John Witherspoon, Anna Maria Horsford</p>
