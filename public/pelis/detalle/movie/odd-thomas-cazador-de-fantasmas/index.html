<h1>Odd Thomas: Cazador de fantasmas</h1>
<p>Aunque Thomas no pretende cambiar el mundo, ayuda al jefe de la policía local a resolver crímenes, sirviéndose de sus poderes: tiene la capacidad de poder ver y hablar con los fantasmas e incluso con los espíritus malignos que se regodean con el dolor ajeno y cuya presencia significa la inminencia de actos violentos. Thomas empieza a alarmarse cuando ve a cientos de esos espíritus revoloteando alrededor de un forastero. Cuando descubre que ese hombre ha construido un santuario para asesinos y que ha puesto en marcha un peligroso complot, intentará detenerlo por todos los medios a su alcance.</p>
<p><strong>Director:</strong> Stephen Sommers · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Misterio, Suspense</p>
<p><strong>Reparto:</strong> Anton Yelchin, Addison Timlin, Willem Dafoe, Gugu Mbatha-Raw, Nico Tortorella, Patton Oswalt</p>
