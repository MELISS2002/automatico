<h1>El triángulo</h1>
<p>Cuando Jess, de camino al puerto, atropella a una gaviota, no se imagina que se trata de un mal presagio. Cuando llega al yate, donde lo espera un grupo de amigos, nota que algo va mal, pero no acierta a saber por qué. Sus temores se acrecientan cuando se desencadena una tormenta que obliga al grupo a abandonar el yate para subir a otro barco, en el que Jess tiene la sensación de haber estado antes. El barco parece desierto, pero no están solos. Alguien los está cazando uno a uno. Y Jess, sin saberlo, tiene la llave que puede acabar ese horror.</p>
<p><strong>Director:</strong> Christopher Smith · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Melissa George, Liam Hemsworth, Emma Lung, Rachael Carpani, Michael Dorman, Joshua McIvor</p>
