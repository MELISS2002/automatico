<h1>Un Hombre Diferente</h1>
<p>Sean Vetter es un agente de aduanas especializado en la lucha contra el tráfico de drogas en el sur de California. Allí trabaja duramente para dar caza al mayor capo de la zona, Memo Gamboa. Todo cambia cuando asesinan a su mujer. Convencido de que Gamboa es el responsable del crimen, decide tomarse la justicia por su mano. Pero pronto descubre que el capo es solo una marioneta: por encima hay alguien que mueve los hilos. Responde al nombre de Diablo.</p>
<p><strong>Director:</strong> F. Gary Gray · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Acción, Crimen, Drama</p>
<p><strong>Reparto:</strong> Vin Diesel, Larenz Tate, Timothy Olyphant, Geno Silva, Jacqueline Obradors, Steve Eastin</p>
