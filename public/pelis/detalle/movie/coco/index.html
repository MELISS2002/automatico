<h1>Coco</h1>
<p>A pesar de la desconcertante prohibición de la generación de música de su familia, Miguel sueña con convertirse en un músico consumado como su ídolo, Ernesto de la Cruz. Desesperado por demostrar su talento, Miguel se encuentra en la deslumbrante y colorida Tierra de los Muertos siguiendo una misteriosa cadena de eventos. En el camino, se encuentra con el encantador y tramposo Héctor. Juntos, realizan un viaje extraordinario para descubrir la historia real detrás de la familia de Miguel.</p>
<p><strong>Director:</strong> Seong-Young Kim · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Animación, Aventura, Familia, Música</p>
