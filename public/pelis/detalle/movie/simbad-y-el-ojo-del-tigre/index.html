<h1>Simbad y el ojo del tigre</h1>
<p>Cuando Simbad, intrépido marino y Príncipe de Bagdad, pone rumbo a Charnak para pedir al Príncipe Kassim la mano de su hermana Farah, descubre que Kassim es víctima de un hechizo de Zenobia, su diabólica madrastra. Para conjurar el maleficio, tendrá que emprender un peligroso viaje que nadie ha realizado nunca y que lo llevará a enfrentarse con monstruosas criaturas como el Minoton, un coloso de bronce, el troglodita gigante, el tigre con dientes de sable y un babuino casi humano.</p>
<p><strong>Director:</strong> Sam Wanamaker · <strong>Año:</strong> 1977 · <strong>Géneros:</strong> Acción, Aventura, Familia, Fantasía</p>
