<h1>6 Balas</h1>
<p>El veterano mercenario Samson Gaul sabe que, en el fragor de la batalla, cada bala cuenta. Cuando sus acciones dieron como resultado la muerte de víctimas indefensas se retiró pero ahora es la última esperanza de Andrew Fayden un padre desesperado. Fayden sabe luchar pero solo no está preparado para encontrar a su hija en las corruptas calles de un país extranjero. Juntos, ambos guerreros, no se detendrán ante nada para destrozar la red criminal que se aprovecha de los inocentes.</p>
<p><strong>Director:</strong> Ernie Barbarash · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
