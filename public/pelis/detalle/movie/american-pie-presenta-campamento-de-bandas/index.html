<h1>American Pie presenta: Campamento de bandas</h1>
<p>Matt, el hermano pequeño de Stifler, es condenado a pasar un verano en el inmundo campamento de la banda de música, donde hace de las suyas con cámaras ocultas y ardientes tutores. Pero, cuando se queda prendado de su compañera de banda, Elyse, su empeño por maquillar sus rudos modales tiene resultados imprevistos. El padre de Jim (Eugene Levy) vuelve como estrafalario tutor para intentar devolver al redil al descarriado hermano menor de Stifler.</p>
<p><strong>Director:</strong> Steve Rash · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Comedia</p>
