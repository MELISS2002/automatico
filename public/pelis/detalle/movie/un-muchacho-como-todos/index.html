<h1>Un muchacho como todos</h1>
<p>Terry, una joven de dieciocho años, está convencida de que sus profesores no la toman en serio, principalmente por el mero hecho de ser una chica. El periódico local ha convocado un concurso de literatura y su profesor se niega a presentar el artículo de Terry, por la única razón de ser una mujer. Harta de ser discriminada, Terry decide hacerse pasar por un chico y demostrar al mundo que el talento no tiene nada que ver con el sexo de las personas. Su hermano Buddy le ayudará a llevar a cabo su plan, pero Terry no cuenta con la posibilidad de enamorarse de uno de los chicos.</p>
<p><strong>Director:</strong> Marshall Schlom · <strong>Año:</strong> 1985 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Joyce Hyser, Clayton Rohner, Billy Jayne, William Zabka, Toni Hudson, Leigh McCloskey</p>
