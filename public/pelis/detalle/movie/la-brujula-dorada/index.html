<h1>La brújula dorada</h1>
<p>Lyra Belacqua (Dakota Blue Richards) vive en un mundo paralelo en el que las almas humanas adoptan las formas de unos animales de compañía llamados daemons. Las fuerzas oscuras trabajan en el mundo de Lyra, y muchos niños han sido secuestrados por seres malditos conocidos como Gobblers. Cuando Roger, el mejor amigo de Lyra, desaparece, ella promete salvarlo. Acompañado por su daemon, una tribu de navegantes, una bruja, un oso polar, un piloto de Texas, Lyra realiza una búsqueda épica.</p>
<p><strong>Director:</strong> Nikki Clapp · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Aventura, Fantasía</p>
