<h1>La marca de la horca</h1>
<p>Año 1889, Oklahoma. Un grupo de personas acusan a Jed Cooper de haber robado ganado y quieren ahorcarlo. Llevan a cabo lo que tienen pensado pero de último momento aparece un comisario que trabajó bajo las órdenes del juez Fentom y detiene el asesinato, además de aclarar la situación y demostrar que es inocente. Dicho juez tiene un trato para Jed, convertirlo en Comisario para que atrape vivos a quienes intentaron lincharlo para ser juzgados por dicho juez.</p>
<p><strong>Director:</strong> Ted Post · <strong>Año:</strong> 1968 · <strong>Géneros:</strong> Drama, Western</p>
<p><strong>Reparto:</strong> Clint Eastwood, Inger Stevens, Ed Begley, Pat Hingle, Ben Johnson, Charles McGraw</p>
