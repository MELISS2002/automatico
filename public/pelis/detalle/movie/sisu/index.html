<h1>Sisu</h1>
<p>Durante los últimos y desesperados días de la Segunda Guerra Mundial, un solitario buscador de oro (Jorma Tommila) se cruza con los nazis en una retirada al norte de Finlandia. Cuando los nazis le roban el oro, descubren rápidamente que no se han metido con un minero cualquiera. Aunque no existe una traducción directa de la palabra finlandesa «sisu», este legendario ex-comando encarnará lo que significa sisu: una forma de coraje y determinación inimaginables frente a probabilidades abrumadoras. Y no importa lo que los nazis le echen encima, el escuadrón de la muerte de un solo hombre hará todo lo posible por recuperar su oro, aunque eso signifique matar a todos los nazis que se crucen en su camino.</p>
<p><strong>Director:</strong> Jalmari Helander · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Acción, Bélica, Suspense</p>
<p><strong>Reparto:</strong> Jorma Tommila, Aksel Hennie, Jack Doolan, Mimosa Willamo, Onni Tommila, Tatu Sinisalo</p>
