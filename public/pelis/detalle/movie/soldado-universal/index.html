<h1>Soldado Universal</h1>
<p>Luc Deveraux y Andrew Scott son dos soldados estadounidenses que se encuentran sirviendo en la guerra de Vietnam en 1969. Un día Scott se enloquece y cuando Deveraux interfiere en la masacre de Scott de un pueblo inocente, ellos terminan por asesinarse el uno al otro. Marcados como «desaparecidos en combate», en realidad son congelados y enviados a una instalación de alto secreto, donde un equipo de científicos dirigido por el coronel Perry los revive, les borra su memoria y los convierte, junto con otros especímenes a seleccionar, en súper soldados conocidos como «UniSol», un procedimiento ilegal.</p>
<p><strong>Director:</strong> Roland Emmerich · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Acción, Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Jean-Claude Van Damme, Dolph Lundgren, Ally Walker, Ed O&#x27;Ross, Ralf Moeller, Jerry Orbach</p>
