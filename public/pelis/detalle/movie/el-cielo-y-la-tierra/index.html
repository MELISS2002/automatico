<h1>El Cielo y la Tierra</h1>
<p>Tercera parte de la trilogía de Stone sobre el Vietnam. Si en «Platoon» retrata la guerra en sí misma, y en «Nacido el 4 de Julio» ahonda en las tremendas secuelas psicológicas sufridas por los soldados que regresaron del frente, en esta ocasión muestra las repercusiones sociales de la guerra a través de la historia de un sargento que regresa a los Estados Unidos casado con una vietnamita, la cual tiene dificultades para integrarse en su nuevo país.</p>
<p><strong>Director:</strong> Oliver Stone · <strong>Año:</strong> 1993 · <strong>Géneros:</strong> Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> Hiep Thi Le, Tommy Lee Jones, Joan Chen, Haing S. Ngor, Debbie Reynolds, Conchata Ferrell</p>
