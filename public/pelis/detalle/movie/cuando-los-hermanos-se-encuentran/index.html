<h1>Cuando los Hermanos se Encuentran</h1>
<p>En este papel que le valió el Oscar®, Dustin Hoffman al lado del rompecorazones de Hollywood Tom Cruise, nos ofrece una divertida y conmovedora historia de amor fraternal. El insensible Charlie Babbitt, espera recibir una enorme herencia tras la muerte de su alejado padre. Pero Raymond, su hermano mayor recluido en una institución y a quien prácticamente no conoce, es el único heredero. Raymond “es un sabio autista” con algunas habilidades mentales limitadas, pero con otras destrezas geniales. Cuando Charlie secuestra a Raymond, el recorrido a lo largo del país que los llevará hasta Los Ángeles, les enseña algunas lecciones para toda la vida. Así, mientras superan su mutua desconfianza, un fuerte lazo se forma al compartir recuerdos del pasado, problemas del presente y un posible y deslumbrante futuro juntos.</p>
<p><strong>Director:</strong> Barry Levinson · <strong>Año:</strong> 1988 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Dustin Hoffman, Tom Cruise, Valeria Golino, Gerald R. Molen, Jack Murdock, Michael D. Roberts</p>
