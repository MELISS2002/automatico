<h1>Session 9</h1>
<p>Hace 15 años que el Centro de salud Mental de Danvers, que se levanta amenazador en la mitad de un bosque, ha sido cerrado, y los vecinos intentan sostenerse distanciados del sitio. Gordon Fleming, un emigrante escocés que tiene y dirige Hazmat Elimination Co., precisa urgentemente lograr el contrato para retirar los peligrosos restos de amianto del centro de salud. Con tal de cerrar el pacto, Gordon, temerariamente, promete al ingeniero local Bill Griggs que el trabajo va a durar solo una semana. Una vez firmado el contrato, los hombres de Hazmat se adentran en los amplios y horribles salones y corredores del centro de salud. Conforme pasa el tiempo, el equipo se siente poco a poco más arrastrado por los misterios que rodean al centro de salud.</p>
<p><strong>Director:</strong> Brad Anderson · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Drama, Misterio, Terror</p>
<p><strong>Reparto:</strong> Peter Mullan, David Caruso, Stephen Gevedon, Josh Lucas, Brendan Sexton III, Paul Guilfoyle</p>
