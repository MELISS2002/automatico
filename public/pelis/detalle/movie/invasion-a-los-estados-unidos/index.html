<h1>Invasión a los Estados Unidos</h1>
<p>Mikhail Rostov (Richard Lynch), un peligroso terrorista que dirige a un grupo de mercenarios sin escrúpulos, planea comenzar una campaña de terror en los Estados Unidos, pero antes decide acabar con Matt Hunter (Chuck Norris), antiguo integrante de la CIA, que fue su bestia negra en el pasado. Mientras que Hunter trata de salvar su vida de cientos de enemigos que le buscan por todo el país, tendrá que destruir los planes de Rostov que amenazan la estabilidad del país.</p>
<p><strong>Director:</strong> Joseph Zito · <strong>Año:</strong> 1985 · <strong>Géneros:</strong> Acción, Suspense</p>
