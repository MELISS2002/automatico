<h1>¿&amp;#8230;Y Dónde Están las Rubias?</h1>
<p>Dos hermanos y agentes del FBI, Kevin y Marcus, han desempeñado y fracasado torpemente en casos que se les han asignado y su jefe enojado les advierte que la próxima vez que hagan mal cualquier misión serán despedidos. Ambos se disponen a esforzarse por tratar de no volver a fracasar y demostrar que son grandes agentes y se ofrecen para llevar a cabo el próximo caso. Su jefe los pone de encargados de escoltar a dos jóvenes y bellas muchachas millonarias, las hermanas Wilson, desde el aeropuerto hasta su hotel en Hamptons debido a que esas mujeres son dos posibles objetivos de un secuestrador del que se está investigando su identidad.</p>
<p><strong>Director:</strong> Keenen Ivory Wayans · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Comedia, Crimen</p>
<p><strong>Reparto:</strong> Shawn Wayans, Marlon Wayans, Frankie Faison, Terry Crews, Faune Chambers Watkins, Rochelle Aytes</p>
