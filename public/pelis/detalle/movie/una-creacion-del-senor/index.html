<h1>Una creación del Señor</h1>
<p>En Baltimore, en los años 40, el doctor Alfred Blalock (Alan Rickman) y su ayudante Vivien Thomas (Mos Def) trabajaban para encontrar una técnica revolucionaria que garantizaría el éxito de las operaciones de corazón en «bebés azules». A pesar de ser colegas, pertenecían a mundos muy distintos: Blalock, blanco y rico, era el jefe de cirugía del Hospital Johns Hopkins; Thomas, en cambio, era un hábil carpintero, negro y pobre. Mientras estos hombres abrían nuevos y espectaculares caminos en el campo de la medicina, las presiones sociales amenazaban con destruir tanto su trabajo como su amistad.</p>
<p><strong>Director:</strong> Joseph Sargent · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Drama, Película de TV</p>
<p><strong>Reparto:</strong> Alan Rickman, Yasiin Bey, Kyra Sedgwick, Gabrielle Union, Merritt Wever, Charles S. Dutton</p>
