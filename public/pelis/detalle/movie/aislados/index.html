<h1>Aislados</h1>
<p>Tras un cataclismo que asola la ciudad de New York, ocho personas se refugian en el sótano del edificio en el que viven. Todo sería asumible si no fuera porque sin comerlo ni beberlo un grupo de hombres vestido con trajes Hazmat se cuelan y comienza a dispararles. Tras una escaramuza, en ambos bandos hay bajas, los supervivientes logran expulsar a los intrusos y se aíslan por completo… en ese momento comenzará el verdadero horror. Están encerrados, ataques de claustrofobia, los víveres están contaminados con radiación. En ese punto arranca lo peor de lo peor, la locura invade al grupo y se acaban convirtiendo en depredadores de sus iguales.</p>
<p><strong>Director:</strong> Xavier Gens · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Ciencia ficción, Suspense, Terror</p>
<p><strong>Reparto:</strong> Lauren German, Michael Biehn, Milo Ventimiglia, Courtney B. Vance, Ashton Holmes, Rosanna Arquette</p>
