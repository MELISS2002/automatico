<h1>Ali G anda suelto</h1>
<p>El Centro de Ocio John Nike en West Staines va a cerrar por falta de fondos. A Ali G le preocupa el destino del club alternativo de boy scouts que ha estado dirigiendo hasta ese momento. Decidido a salvar el centro se encadena a una estación de autobuses de Staines. Así­ consigue llamar la atención del primer ministro, que andaba buscando a un joven intelectual que le ayudase a ganar las elecciones en Staines, y que cree haber encontrado en él al hombre que necesitaba. El político convence a Ali de que la mejor forma de salvar el centro es presentarse a las elecciones para el Gobierno, y Ali le toma la palabra.</p>
<p><strong>Director:</strong> Mark Mylod · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Sacha Baron Cohen, Michael Gambon, Charles Dance, Kellie Bright, Martin Freeman, Paul Clayton</p>
