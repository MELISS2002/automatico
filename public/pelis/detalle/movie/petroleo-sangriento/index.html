<p>Texas, principios del siglo XX. Una historia sobre la familia, la avaricia y la religión. Daniel Plainview se traslada a una miserable ciudad con el propósito de hacer fortuna, pero, a medida que se va enriqueciendo, sus principios y valores desaparecen y acaba dominado por la ambición. Tras encontrar un rico yacimiento de petróleo en 1902, se convierte en un acaudalado magnate. Cuando, años después, intenta apoderarse de un nuevo yacimiento, tiene que enfrentarse al predicador Eli Sunday. Adaptación de la novela de Upton Sinclair «Petróleo», escrita en 1927.</p>
<p><strong>Director:</strong> Paul Thomas Anderson · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Drama</p>
