<h1>El arte de la guerra</h1>
<p>Un relato sobre las artes marciales y el alma de la civilización china. Dos maestros de kung fu, Ip Man (Tony Leung), el hombre que entrenó al mítico Bruce Lee, y la bella Gong Er (Zhang Ziyi) se reúnen en la ciudad natal de Ip Man en vísperas de la invasión japonesa de 1936. El padre de Gong Er, un gran maestro de renombre, también viaja a esa ciudad para la ceremonia de su jubilación, que tendrá lugar en el legendario burdel El pabellón de oro. Historia de traición, honor y amor que se desarrolla en la tumultuosa época que siguió a la caída de la última dinastía china, un tiempo de caos y guerra, pero también una época de oro de las artes marciales en China.</p>
<p><strong>Director:</strong> Wong Kar-Wai · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Acción, Drama, Historia</p>
<p><strong>Reparto:</strong> 梁朝偉, 章子怡, 張震, 赵本山, 小沈阳, 송혜교</p>
