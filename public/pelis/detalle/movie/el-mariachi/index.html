<h1>El Mariachi</h1>
<p>Ganadora del Premio del Público en el Festival de Cine de Sundance de 1993, El Mariachi cuenta la historia de un joven mariachi (Carlos Gallardo), o músico ambulante, que llega a un pueblo mexicano fronterizo buscando trabajo. Viste de negro y lleva consigo un estuche de guitarra. Un asesino llega al mismo pueblo el mismo día, vestido exactamente igual, solo que el idéntico estuche de guitarra del pistolero está lleno de armas. Al producirse un caso de confusión de identidades, el tranquilo mariachi se ve envuelto en la disputa familiar de otro, y la gente comienza a dispararle. Cuando la sensual dueña del bar (Consuelo Gomez), quien le ofrece su amistad, resulta ser el objeto del deseo no correspondido del líder militar local, el mariachi se enfrenta a muchos problemas, que requerirán coraje, suerte y balas para ser resueltos.</p>
<p><strong>Director:</strong> Robert Rodriguez · <strong>Año:</strong> 1993 · <strong>Géneros:</strong> Acción, Crimen, Suspense, Western</p>
<p><strong>Reparto:</strong> Carlos Gallardo, Consuelo Gómez, Jaime de Hoyos, Peter Marquardt, Reinol Martinez, Ramiro Gómez</p>
