<h1>Los Malditos</h1>
<p>una viuda del siglo XIX que debe tomar una decisión imposible cuando un barco se hunde frente a la costa de su aislado puesto de pesca en medio de un invierno especialmente cruel. Con las provisiones escaseando, Eva y su unida comunidad deben elegir entre rescatar a la tripulación naufragada o priorizar su propia supervivencia. Enfrentados a las consecuencias de su decisión y atormentados por la culpa, los habitantes luchan con una creciente sensación de pavor y comienzan a creer que todos están siendo castigados por sus decisiones.</p>
<p><strong>Director:</strong> Thordur Palsson · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama, Misterio, Terror</p>
<p><strong>Reparto:</strong> Odessa Young, Joe Cole, Siobhan Finneran, Rory McCann, Turlough Convery, Lewis Gribben</p>
