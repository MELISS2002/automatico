<h1>Siniestro</h1>
<p>Ellison (Ethan Hawke, &amp;#8216;Gattaca&#x27;), es un periodista especializado en escribir artículos y novelas sobre casos de crímenes célebres. Para poder dedicarse a esta tarea en cuerpo y alma, ha instaurado una sistema de vida itinerante un tanto particular con su familia: se trasladan todos juntos de condado en condado para instalarse durante un tiempo en el lugar de los hechos y así poder investigar en profundidad cada uno de los casos. Una de estas investigaciones le llevará a una casa donde toda la familia murió asesinada. Sin embargo, una vez en la casa, la familia descubrirá una serie de documentación y de cintas de vídeo en las que se recogen los detalles de estos misteriosos homicidios. Ellison comenzará a tirar del hilo de estas pistas y descubrirá que las muertes no han sido causadas por la mano de ningún ser humano, sino de una entidad sobrenatural que todavía se encuentra presente en la casa&amp;#8230;</p>
<p><strong>Director:</strong> Scott Derrickson · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Misterio, Suspense, Terror</p>
<p><strong>Reparto:</strong> Ethan Hawke, Juliet Rylance, Vincent D&#x27;Onofrio, James Ransone, Fred Thompson, Clare Foley</p>
