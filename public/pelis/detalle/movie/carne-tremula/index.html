<h1>Carne trémula</h1>
<p>David (Javier Bardem) y Sancho (Pepe Sancho) son una pareja de policías que se encuentran con Víctor (Liberto Rabal), un joven inmaduro y marginal. Durante una noche de patrulla por la ciudad, en la que conocen a Helena (Francesca Neri), se desata una discusión entre ellos y David resulta herido en la columna vertebral. Víctor es detenido y condenado a seis años de cárcel, mientras que David tendrá que rehacer su vida postrado en una silla de ruedas.</p>
<p><strong>Director:</strong> Pedro Almodóvar · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Drama, Romance, Suspense</p>
<p><strong>Reparto:</strong> Javier Bardem, Francesca Neri, Liberto Rabal, Ángela Molina, José Sancho, Penélope Cruz</p>
