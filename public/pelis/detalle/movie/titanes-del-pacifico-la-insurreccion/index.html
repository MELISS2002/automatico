<h1>Titanes del Pacífico: La insurrección</h1>
<p>Un futuro cercano. Han pasado 10 años tras la primera invasión que sufrió la humanidad, pero la lucha aún no ha terminado. El planeta vuelve a ser asediado por los Kaiju, una raza de alienígenas colosales, que emergen desde un portal interdimensional con el objetivo de destruir a la raza humana. Ante esta nueva amenaza, los Jaegers, robots gigantes de guerra pilotados por dos personas para sobrellevar la inmensa carga neuronal que conlleva manipularlos, ya no están a la altura de lo que se les viene encima. Será entonces cuando los supervivientes de la primera invasión, además de nuevos personajes como el hijo de Pentecost, tendrán que idear la manera de sorprender al enorme enemigo, apostando por nuevas estrategias defensivas y de ataque. Con la Tierra en ruinas e intentando reconstruirse, esta nueva batalla puede ser decisiva para el futuro&amp;#8230;</p>
<p><strong>Director:</strong> Steven S. DeKnight · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Fantasía</p>
<p><strong>Reparto:</strong> John Boyega, Scott Eastwood, Cailee Spaeny, 景甜, 菊地凛子, Burn Gorman</p>
