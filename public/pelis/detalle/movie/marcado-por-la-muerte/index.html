<h1>Marcado por la muerte</h1>
<p>Victor es la mano derecha de Alphonse, un mafioso neoyorquino que vive bajo la amenaza de un asesino que está matando a todos los miembros de su banda. Victor conoce a Beatrice, una mujer misteriosa que vive enfrente de su edificio y por la que empieza a sentirse atraído. Pronto descubre que la mujer ha sido víctima de un crimen y busca venganza. Pero ella también descubre que Víctor pretende vengar la muerte de su mujer y de su hija. Estos dos seres heridos y obsesionados llevarán a cabo juntos un oscuro y violento plan de venganza.</p>
<p><strong>Director:</strong> Niels Arden Oplev · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Acción, Crimen, Drama, Suspense</p>
<p><strong>Reparto:</strong> Colin Farrell, Noomi Rapace, Terrence Howard, Dominic Cooper, Isabelle Huppert, Luis Da Silva</p>
