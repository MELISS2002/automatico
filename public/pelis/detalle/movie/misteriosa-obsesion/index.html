<h1>Misteriosa Obsesión</h1>
<p>Telly Paretta se encuentra atormentada por el recuerdo de su hijo de ocho años, Sam, fallecido hace 14 meses en un accidente aéreo. Mientras intenta superar la pena y el consiguiente alejamiento de su marido Jim, su psiquiatra, el Dr. Munce, le informa de que está sufriendo alucinaciones, que su hijo nunca existió y que ella misma está creando sus memorias. Confusa, intenta encontrar evidencias de la existencia de Sam, fotos, vídeos, libros de recuerdos. Pero todo ha desaparecido. Telly está convencida de que se está volviendo loca hasta que conoce a Ash Correll, el padre de una de las otras víctimas del accidente de aviación. Juntos, se embarcan en una búsqueda para probar la existencia de sus hijos y demostrar su salud mental.</p>
<p><strong>Director:</strong> Joseph Ruben · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Ciencia ficción, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Julianne Moore, Dominic West, Gary Sinise, Anthony Edwards, Alfre Woodard, Linus Roache</p>
