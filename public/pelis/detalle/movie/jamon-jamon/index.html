<h1>Jamón Jamón</h1>
<p>José Luis es el hijo de un acaudalado matrimonio que posee una fábrica de ropa interior masculina, en la que trabaja su novia Silvia. Cuando ella se queda embarazada, él promete casarse con ella a pesar de la oposición de sus padres. Con el fin de frustrar esa boda no deseada, la madre decide contratar a un joven aspirante a torero para que seduzca a la joven.</p>
<p><strong>Director:</strong> Bigas Luna · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Stefania Sandrelli, Anna Galiena, Juan Diego, Penélope Cruz, Javier Bardem, Jordi Mollà</p>
