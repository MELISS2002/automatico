<h1>Aladdín y el rey de los ladrones</h1>
<p>Por fin Aladdin se va a casar con la princesa Jasmine. A pesar de la presencia y ánimo de sus amigos Genio, Alfombra y el mono Abú, está algo preocupado: tiene miedo porque no sabe qué tipo de padre va a ser, si él nunca tuvo ninguno. Pero todas sus preocupaciones quedarán de lado cuando 40 ladrones irrumpen en la boda para robar un mágico talismán.</p>
<p><strong>Director:</strong> Tad Stones · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Animación, Aventura, Familia</p>
