<h1>Golpe de suerte</h1>
<p>Ashley (Lindsay Lohan) es la chica más afortunada de Nueva York: todo le sale bien. Siempre. El caso es que desde pequeña siempre ha tenido buena suerte, y nunca nada le ha salido mal. Pero un día, en un baile de máscaras, Ashley besa a Jake (Chris Pine), el joven con peor suerte de la ciudad, y sus papeles se intercambian. Ella, que parecía tocada por la buena estrella, comienza a sufrir desgracias.</p>
<p><strong>Director:</strong> Donald Petrie · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Comedia, Drama, Familia, Fantasía, Romance</p>
