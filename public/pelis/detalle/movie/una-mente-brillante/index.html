<h1>Una Mente Brillante</h1>
<p>En la Universidad de Princeton, John Nash se esfuerza por hacer una valiosa contribución y así dejar un legado al mundo de las matemáticas. Después de la escuela de postgrado se enfoca en la enseñanza, lo que lo lleva a una relación romántica con su estudiante Alicia. Mientras tanto, el gobierno pide su ayuda para romper los códigos soviéticos, lo que pronto lo involucra en una conspiración aterradora. Ahora sólo con la ayuda de Alicia podrá recuperar su fuerza mental y recuperar su estatus como el gran matemático que hoy conocemos.</p>
<p><strong>Director:</strong> Ron Howard · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Russell Crowe, Jennifer Connelly, Ed Harris, Paul Bettany, Christopher Plummer, Adam Goldberg</p>
