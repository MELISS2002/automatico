<p>Lance Walters, un respetado abogado que, después de ser forzado a “retirarse tempranamente”, decide dejar la ciudad y mudarse a un pequeño pueblo con su prometida Vanessa y con su hijo Tommy. Lance planea construir una mega mansión, pero las cosas no resultan como planea ya que está construyendo en el territorio de un ave hiperactiva de cabeza roja, con quien comienza una guerra para conservar su hogar; ¿Adivinen quién está de regreso? El ave más bromista y famosa de todos los tiempos, Woody Woodpecker.</p>
<p><strong>Director:</strong> Alex Zamm · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Animación, Comedia, Familia</p>
