<h1>Lapönia</h1>
<p>Después de varios años sin celebrar las fiestas juntas, Nuria (Ángela Cervantes), asentada en Laponia junto a su marido Olavi (Vebjørn Enger) y su hija, decide invitar a su hermana Mónica (Natalia Verbeke), a su marido (Julián López) y al hijo de ambos a celebrar una Navidad de ensueño en su casa de Romanievi. El plan se presenta perfecto hasta que la hija de Nuria le cuenta a su primo pequeño la verdad sobre la existencia de Papá Noel. La que estaba destinada a ser la más especial de las navidades, se convierte de golpe en una batalla campal entre hermanas, cuñados y primos. Una noche que sacará a relucir secretos inconfesables en medio de un debate sobre qué es más adecuado, si contar la verdad a toda costa o mantener la ilusión, aunque sea a base de mentiras.</p>
<p><strong>Director:</strong> David Serrano · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Comedia, Familia</p>
<p><strong>Reparto:</strong> Ángela Cervantes, Vebjørn Enger, Natalia Verbeke, Julián López, Blanca Ramírez, Adrián Gámiz Lara</p>
