<h1>Bajo el muelle</h1>
<p>La comedia musical sigue a los cangrejos ermitaños que viven bajo el paseo marítimo de la costa de Jersey. Cuando Armen (un habitante de la ciudad cangrejo de tierra) se enamora de Ramona (una turista cangrejo de mar), aumentan las tensiones entre sus amigos y familias. Pero cuando una tormenta arroja al dúo lejos de casa, su amor les llevará a una aventura épica que unirá a la dividida comunidad.</p>
<p><strong>Director:</strong> David Soren · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia, Romance</p>
<p><strong>Reparto:</strong> Michael Cera, Keke Palmer, Bobby Cannavale, John Magaro, Jon Rudnitsky, Steven Van Zandt</p>
