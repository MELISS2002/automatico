<h1>El niño y la garza</h1>
<p>Mientras la Segunda Guerra Mundial hace estragos, el adolescente Mahito, atormentado por la trágica muerte de su madre, es trasladado de Tokio a la serena casa rural de su nueva madrastra Natsuko, una mujer que tiene un sorprendente parecido con la madre del niño. Mientras intenta adaptarse, este nuevo y extraño mundo se vuelve aún más extraño tras la aparición de una persistente garza real, que deja perplejo y atormenta a Mahito, llamándolo «el tan esperado».</p>
<p><strong>Director:</strong> 片山一良 · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Animación, Drama, Fantasía</p>
<p><strong>Reparto:</strong> 山時聡真, Masaki Suda, 柴咲コウ, あいみょん, 木村佳乃, 木村拓哉</p>
