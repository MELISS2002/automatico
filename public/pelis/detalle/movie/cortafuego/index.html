<h1>Cortafuego</h1>
<p>Cuando Jack Stanfield, un especialista en seguridad informática de un banco, regresa a casa tras un día de trabajo para estar con su mujer Beth y sus hijos, suele suspirar aliviado. No es que no esté entregado a su trabajo; tan sólo está contento por estar lejos de las cámaras omnipresentes y los controles de identidad, de las constantes tareas de mantenimiento y actualización de los complejos firewalls electrónicos y las otras medidas de defensa, que se han convertido en práctica comercial normalizada en esta era en que todo se hace a través de la red: la comunicación, el comercio&amp;#8230; y el crimen. Pero lo que Jack jamás sospecharía es que, mientras aparca el coche y abre la puerta de su acomodado hogar suburbano, cada uno de sus movimientos es observado a escondidas, y que su vida y la de su familia en breve se convertirá en una pesadilla.</p>
<p><strong>Director:</strong> Richard Loncraine · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Harrison Ford, Paul Bettany, Virginia Madsen, Carly Schroeder, Jimmy Bennett, Mary Lynn Rajskub</p>
