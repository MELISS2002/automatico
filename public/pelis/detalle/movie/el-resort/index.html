<h1>El Resort</h1>
<p>Lex es una escritora obsesionada con lo paranormal. Para su cumpleaños, los tres amigos más cercanos de Lex deciden llevarla a un viaje sorpresa a un resort abandonado en Hawái. El complejo es el supuesto refugio de un fantasma infame, The Half-Faced Girl, y Lex está decidida a encontrarla. Cuando llegan a la isla, se encuentran con un complejo enorme, hermoso y misteriosamente vacío. Justo cuando Lex decide que esto era solo una leyenda urbana, sus amigos comienzan a desaparecer uno por uno, dejándola a merced del espíritu maligno…</p>
