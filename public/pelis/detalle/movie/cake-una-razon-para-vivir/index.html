<h1>Cake: Una razón para vivir</h1>
<p>Claire (Jennifer Aniston) tiene prácticamente una vida llena de problemas. Lucha día a día para lidiar con el dolor que la está debilitando y después de su divorcio, la última cosa que ella necesita en su vida es el trauma añadido del suicidio de Nina (Anna Kendrik), una mujer del grupo de apoyo al que ella acude. Mientras Claire lucha por tranquilizarse y combatir los desafíos del día a día, establece un vínculo con su ama de llaves y el ex marido de Nina. Mientras investiga las causas del suicidio de la mujer, se ve incapaz de dar respuesta a sus dudas, sin embargo sí que empieza a servirle de ayuda para apaciguar su propia angustia y comenzar así un lento proceso de curación.</p>
<p><strong>Director:</strong> Daniel Barnz · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Jennifer Aniston, Adriana Barraza, Anna Kendrick, Sam Worthington, Mamie Gummer, Felicity Huffman</p>
