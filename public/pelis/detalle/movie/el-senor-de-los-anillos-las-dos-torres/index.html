<h1>El señor de los anillos: Las dos torres</h1>
<p>La Compañía del Anillo se ha disuelto. El portador del anillo Frodo y su fiel amigo Sam se dirigen hacia Mordor para destruir el Anillo Único y acabar con el poder de Sauron. Mientras, y tras la dura batalla contra los orcos donde cayó Boromir, el hombre Aragorn, el elfo Legolas y el enano Gimli intentan rescatar a los medianos Merry y Pipin, secuestrados por los ogros de Mordor. Por su parte, Saurón y el traidor Sarumán continúan con sus planes en Mordor, en espera de la guerra contra las razas libres de la Tierra Media.</p>
<p><strong>Director:</strong> Carolynne Cunningham · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Acción, Aventura, Fantasía</p>
