<h1>La Guerra De Los Monstruos</h1>
<p>En 1999, la UNSC (United Nations Scientific Council) ha reunido a todos los grandes monstruos en una zona de la isla de Ogasawara denominada Monsterland, con el objetivo de estudiarlos a fondo, controlándolos mediante un complejo campo electromagnético. Entre los monstruos kaijus se encuentran nada menos que: Godzilla, Mothra, Ghidorah, Rodan, Baragon, Varan, Kumonga, Manda, Minilla, Gorosaurus y Anguirus. Sin embargo los Kilaaks, una raza extraterrestre, pretende esclavizar la Tierra y boicotea los sistemas de comunicación de la isla y controla mentalmente a los monstruos, que se lanzan a una frenética carrera de destrucción por todo el mundo.</p>
<p><strong>Director:</strong> 本多猪四郎 · <strong>Año:</strong> 1968 · <strong>Géneros:</strong> Acción, Ciencia ficción</p>
<p><strong>Reparto:</strong> 久保明, 田崎潤, 小林夕岐子, 土屋嘉男, 当銀長太郎, 田島 義文</p>
