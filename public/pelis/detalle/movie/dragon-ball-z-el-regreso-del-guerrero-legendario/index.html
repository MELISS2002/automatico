<h1>Dragon Ball Z: El Regreso del Guerrero Legendario</h1>
<p>Después de ser derrotado por Goku, Broly logra escapar en una capsula hacia la tierra. Goten, Trunks y Videl se encuentran en una aventura recolectando las esferas del dragón llegando a una aldea que estaba siendo amenazada por un monstruo, deciden ayudarlos con la condición que le den la esfera que poseían, en el transcurso Goten se pone a llorar porque no le dan un poco de comida haciendo que su lloriqueo despierte a un Broly dormido. El caoz se desata, Gohan llega en su ayuda para dar camino a una batalla épica Gohan contra Broly.</p>
<p><strong>Director:</strong> 山内重保 · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Acción, Animación, Ciencia ficción</p>
<p><strong>Reparto:</strong> Masako Nozawa, 田中真弓, Takeshi Kusao, Yūko Minaguchi, 嶋方淳子, 茶風林</p>
