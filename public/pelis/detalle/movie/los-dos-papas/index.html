<h1>Los Dos Papas</h1>
<p>Es el año 2012. Frustrado por el rumbo que está tomando la iglesia, el cardenal Bergoglio solicita el permiso del Papa Benedicto para retirarse. Sin embargo, el Papa Benedicto convocará a su crítico y futuro sucesor en Roma. Entre ambos se sucederán extensas charlas para buscar posturas en común. Tras los muros del Vaticano, habrá un profundo debate entre la tradición y el progreso, con el objetivo de forjar un futuro para los millones de fieles católicos de todo el mundo. Además, Benedicto revelará un secreto que sacudiría los cimientos de la iglesia católica, ya que sorprendió al mundo cuando anunció que renunciaba al pontificado de la Iglesia.</p>
<p><strong>Director:</strong> Fernando Meirelles · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Jonathan Pryce, Anthony Hopkins, Juan Minujín, Luis Gnecco, Cristina Banegas, María Ucedo</p>
