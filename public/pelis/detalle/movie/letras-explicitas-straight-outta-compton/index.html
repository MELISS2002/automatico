<h1>Letras Explícitas: Straight Outta Compton</h1>
<p>Letras explícitas cuenta la historia de cómo cinco jóvenes rebeldes – armados únicamente con sus letras, su fanfarronería, su valentía y su talento natural – se enfrentaron a las autoridades que pretendían oprimirlos y formaron al grupo más poderoso del mundo: N.W.A. Cuando expresaron la verdad que nadie había dicho y expusieron la vida en el barrio, su voz encendió una revolución social que sigue sonando hasta el día de hoy.</p>
<p><strong>Director:</strong> F. Gary Gray · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Drama, Historia, Música</p>
