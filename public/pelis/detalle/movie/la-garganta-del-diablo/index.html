<h1>La garganta del diablo</h1>
<p>Para alejarse de la frenética vida urbana, Cooper (Dennis Quaid) y su esposa Leah (Sharon Stone) deciden mudarse con sus hijos a las afueras de Nueva York y se instalan en una casa en ruinas, que en otro tiempo fue una gran mansión. La pareja está dispuesta a devolverle su antiguo esplendor y todo va sobre ruedas hasta que Dale Massie (Stephen Dorff), el anterior propietario, sale de prisión y reclama sus derechos sobre la casa sirviéndose de todos los medios a su alcance.</p>
<p><strong>Director:</strong> Mike Figgis · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Misterio, Suspense</p>
<p><strong>Reparto:</strong> Dennis Quaid, Sharon Stone, Stephen Dorff, Juliette Lewis, Kristen Stewart, Christopher Plummer</p>
