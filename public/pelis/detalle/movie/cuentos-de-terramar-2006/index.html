<h1>Cuentos de Terramar</h1>
<p>Arren tenía una vida tranquila como príncipe de Enlad, pero ahora que se encuentra en el exilio es constantemente perseguido por una misteriosa sombra que conoce sus debilidades. Cuando se da cuenta de que el equilibrio del mundo se ha roto por culpa de una bruja, pide la ayuda de Gavilán, el mago más poderoso de las islas de Terramar. Juntos emprenderán un viaje fascinante en el que unirán su destino al de una joven maltratada por el pasado. La batalla contra las fuerzas del mal les espera.</p>
<p><strong>Director:</strong> 宮崎吾朗 · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Animación, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> 岡田准一, 手嶌葵, 菅原文太, 田中裕子, 香川照之, 風吹ジュン</p>
