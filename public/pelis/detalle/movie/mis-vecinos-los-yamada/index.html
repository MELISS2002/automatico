<h1>Mis vecinos los Yamada</h1>
<p>Basada en el famoso manga de Hisachi Ishii, esta película cuenta pequeñas e imaginativas historias de la vida diaria de una típica familia de clase media de Tokyo. Los Yamada son Takashi y Matsuko (el padre y la madre), Shige (la suegra), Noboru (el hijo), Nonoko (la hija) y Pochi (el perro de la familia).</p>
<p><strong>Director:</strong> Isao Takahata · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Animación, Comedia, Familia</p>
<p><strong>Reparto:</strong> Hayato Isohata, 荒木雅子, 宇野なおみ, 益岡徹, 朝丘雪路, 矢野顕子</p>
