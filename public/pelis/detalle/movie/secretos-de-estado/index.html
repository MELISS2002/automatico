<h1>Secretos de estado</h1>
<p>2003, mientras los politicos británicos y estadounidenses maniobran para invadir Iraq, la traductora del GCHQ (Cuartel General de Comunicaciones del Gobierno Británico) Katharine Gun (Keira Knightley) filtra un e-mail clasificado que urge a espiar a miembros del Consejo de Seguridad de las Naciones Unidas para forzar una resolución para ir a la Guerra. Acusada de romper el Acta de Secretos Oficiales y enfrentándose a prisión, Katharine y sus abogados están determinados a defender sus acciones. Con su vida, su libertad y su matrimonio amenazados, Katharine deberá luchar por lo que cree.</p>
<p><strong>Director:</strong> Sarah MacFarlane · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Drama, Historia, Suspense</p>
