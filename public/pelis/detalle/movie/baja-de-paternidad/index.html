<h1>Baja de paternidad</h1>
<p>Leo es una adolescente de quince años que ha crecido en Alemania sin padre. Cuando descubre su identidad, se pone inmediatamente en marcha para localizarlo. Lo encuentra en un chiringuito de la costa del norte de Italia. El reencuentro deja a Paolo abrumado y en conflicto. Tras la repentina aparición de Leo en su vida, lucha por equilibrar su relación con ella y con la familia que tiene ahora. Al principio, Leo solo quiere respuestas, pero pronto empieza a desear formar parte de la vida de Paolo.</p>
<p><strong>Director:</strong> Alissa Jung · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama</p>
