<h1>Santa Cláusula 2: La Navidad Corre Peligro</h1>
<p>Las vacaciones comienzan el 1º de noviembre&amp;#8230; y Santa comienza la búsqueda de la perfecta Sra. Claus. Scott Calvin ha sido Santa Claus durante los últimos ocho años y sus leales duendes lo consideran el mejor Santa de todos los tiempos. Pero Scott tiene problemas: su hijo Charlie ha caído en su lista de «traviesos» del año. El mismo Santa se está «desantando» misteriosamente. Y lo peor es que si Scott no se casa antes de la Nochebuena, ¡dejará de ser Santa para siempre! (Está claro en su contrato: la «Sra. Clause»). Desesperado por encontrar una esposa y ayudar a su hijo, Scott se encamina a casa y deja a un suplente para vigilar las cosas en el Polo. Pero cuando este suplente instaura ciertas extrañas redefiniciones de travieso y agradable - poniendo en riesgo la Navidad - es tiempo de que Scott regrese con una nueva bolsa de magia para tratar de salvar a la Navidad.</p>
<p><strong>Director:</strong> Michael Lembeck · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Tim Allen, Judge Reinhold, Wendy Crewson, Elizabeth Mitchell, David Krumholtz, Eric Lloyd</p>
