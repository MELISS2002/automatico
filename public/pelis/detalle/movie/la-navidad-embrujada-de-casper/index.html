<h1>La Navidad embrujada de Casper</h1>
<p>La Navidades se presentan movidas para Casper y para el trío fantasmal (Fatso, Stinkie, Stretch) cuando se encuentran con Bombazo, maestro de fantasmas. Casper no ha conseguido su cuota de susto en el año, de hecho no ha asustado a nadie, y debe hacerlo al menos una vez antes del día de Navidad si no quiere perder sus licencias para asustar. Para ello, el maestro de fantasmas les envía a Kriss, la ciudad más navideña del mundo, donde Casper hará amistad con Mass, una niña que ha perdido el espíritu de la Navidad. El carácter amistoso de Casper hace difícil la misión y tendrán que acudir a su primo gemelo, Susti, para conseguir asustar al menos a una persona&amp;#8230;</p>
<p><strong>Director:</strong> Owen Hurley · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Animación, Familia, Fantasía</p>
<p><strong>Reparto:</strong> David Kaye, Brendon Ryan Barrett, Kathleen Barr, Ian James Corlett, Graeme Kingston, Terry Klassen</p>
