<h1>1 Millón de Seguidores</h1>
<p>Karissa, una joven de 18 años de una pequeña granja de Idaho, es invitada a Tailandia por el mega influencer Jack Mayer para conseguir un lucrativo patrocinio. Rápidamente se hace amiga de otros influencers y participa en un concurso para ganar un patrocinio de 500.000 dólares de Vrap Vodka. Envalentonada por la oportunidad de salvar su granja familiar, Karissa se esfuerza por conseguir más seguidores publicando fotos más atrevidas en la playa y en los clubes. Su éxito se ve amenazado cuando el grupo es secuestrado como parte de una conspiración que nunca vieron venir.</p>
<p><strong>Director:</strong> Harvey Lowry · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Suspense</p>
