<h1>El Ciempiés Humano 2: Secuencia completa</h1>
<p>La película se inicia con los créditos finales de The Human Centipede (First Sequence). La cámara se aleja, para mostrar que la película está siendo reproducida en un ordenador portátil por un hombre en la cabina de vigilancia de un estacionamiento. Se trata de un hombre de nacionalidad británica, que sufre de asma, sobrepeso, mediana edad, reducida estatura y enfermedad mental, que se llama Martin.</p>
<p><strong>Director:</strong> Tom Six · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Crimen, Drama, Terror</p>
