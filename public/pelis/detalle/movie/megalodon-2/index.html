<h1>Megalodón</h1>
<p>Un submarino de aguas profundas, que forma parte de un programa internacional, es atacado por una enorme criatura y queda averiado en el fondo de la fosa oceánica más profunda del Pacífico, con su tripulación atrapada en el interior. El tiempo se acaba y un oceanógrafo chino, el Dr. Chang, recluta a Jonas Taylor, un especialista en rescate en aguas profundas, en contra de los deseos de su hija Suyin, que cree que puede rescatar a la tripulación por sus propios medios. Pero ambos deberán unir sus fuerzas para salvar a la tripulación y también al océano de una amenaza imparable: un tiburón prehistórico de 23 metros conocido con el nombre de Megalodón.</p>
<p><strong>Director:</strong> Jon Turteltaub · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Ciencia ficción, Terror</p>
<p><strong>Reparto:</strong> Jason Statham, 李冰冰, Rainn Wilson, Cliff Curtis, Ruby Rose, Jessica McNamee</p>
