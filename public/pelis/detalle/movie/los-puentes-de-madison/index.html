<p>La apacible pero anodina vida de Francesca Johnson (Meryl Streep), un ama de casa que vive en una granja con su familia, se ve alterada con la llegada de Robert Kincaid (Clint Eastwood), un veterano fotógrafo de la revista National Geographic, que visita el condado de Madison (Iowa) para fotografiar sus viejos puentes. Cuando Francesca invita a Robert a cenar, un amor verdadero y una pasión desconocida nacerá entre ellos.</p>
