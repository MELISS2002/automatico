<h1>El ojo del gato</h1>
<p>Tres cuentos del encantador Stephen King están vinculados por un gato callejero que va de una historia a otra en este espeluznante tríptico que comienza cuando Dick intenta dejar de fumar por cualquier medio necesario. Luego, conocemos a Johnny, un hombre adúltero forzado por el esposo de su amante a la peligrosa cornisa de un edificio. Finalmente, Amanda es amenazada por un gnomo malvado que arroja sospechas sobre el gato de la familia.</p>
<p><strong>Director:</strong> Lewis Teague · <strong>Año:</strong> 1985 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Drew Barrymore, James Woods, Alan King, Kenneth McMillan, Robert Hays, Candy Clark</p>
