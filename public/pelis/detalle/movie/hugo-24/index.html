<h1>Hugo 24</h1>
<p>Hugo tiene 23 años y aún no ha madurado. En la víspera de su 24 cumpleaños se enfrenta a la vida adulta: no tiene trabajo, pero acude a una entrevista en una inmobiliaria, un empleo soñado que le permitiría vestir en traje, algo que le recuerda a su padre ausente. Arrastra un profundo miedo al abandono: su madre está en prisión, su novia se marcha y su familia se resquebraja. Cuando su casero amenaza con desahuciarlo en 24 horas, inicia una carrera contrarreloj que marcará su paso definitivo a la adultez.</p>
<p><strong>Director:</strong> Luc Knowles · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Drama, Suspense</p>
