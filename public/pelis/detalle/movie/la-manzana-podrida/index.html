<h1>La manzana podrida</h1>
<p>Maria, una maestra de primaria que se esfuerza por motivar a una clase de niños de diez años, se ve obstaculizada por un alumno rebelde y caótico. Con su carrera en juego y el comportamiento del niño volviéndose incontrolable, toma una serie de malas decisiones que la llevan a llevarse accidentalmente a esta «manzana podrida» a su casa y encerrarlo allí. Maria intenta desesperadamente rectificar, pero cuando la clase empieza a prosperar y tanto el personal docente como los padres se muestran encantados con la mejoría, se encuentra en una situación sumamente complicada.</p>
<p><strong>Director:</strong> Jonatan Etzler · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Comedia, Suspense</p>
<p><strong>Reparto:</strong> Saoirse Ronan, Eddie Waller, Nia Brown, Jacob Anderson, Rakie Ayola, Robert Emms</p>
