<h1>No Respires 2</h1>
<p>En No Respires 2, la emocionante secuela del gran éxito, nos reencontramos con Norman Nordstrom (Stephen Lang), quien se ha estado escondiendo durante varios años en una cabaña aislada. Vive con una jovencita y ha recreado la familia que le fue robada por un conductor ebrio. Su tranquila vida se hace añicos cuando un grupo de criminales secuestra a la chica. Norman se ve obligado a recurrir a instintos aún más oscuros y creativos para salvarla.</p>
<p><strong>Director:</strong> Rodo Sayagues · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Suspense, Terror</p>
