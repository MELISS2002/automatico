<h1>Conan, el bárbaro</h1>
<p>En la historia de la humanidad, los tiempos más recordados son aquellos de las grandes hazañas y fantásticas aventuras. Esa es la época de Conan el Bárbaro. Conan es capturado cuando tan sólo era un niño después que sus padres fueran asesinados por el malvado Thulsa Doom, el cabecilla de una secta de adoradores a la Serpiente. Quince años de agonía forjarón a Conan como un guerrero insuperable. Liberado por su dueño, Conan, en compañía de sus amigos Subotai, Mongol y Valeria, Reina de los Ladrones, emprenden un viaje en busca de venganza y sabiduría.</p>
<p><strong>Director:</strong> Terry Leonard · <strong>Año:</strong> 1982 · <strong>Géneros:</strong> Acción, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> Arnold Schwarzenegger, James Earl Jones, Max von Sydow, Sandahl Bergman, Ben Davidson, Cassandra Gava</p>
