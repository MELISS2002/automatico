<h1>Recién casados</h1>
<p>Tom Leezak (Ashton Kutcher) y Sarah McNerney (Brittany Murphy), son dos jóvenes que se aman a pesar de ser muy diferentes: él es un modesto reportero de tráfico de un programa de radio nocturno, además de el típico chico apasionado de los deportes. Ella es una escritora de elegantes modales y familia adinerada de Beverly Hills. En contra de los deseos de la familia y del ex-novio de ella, ambos deciden casarse. Los problemas comienzan justo después de la boda, cuando se dan cuenta de que ambos no han sido completamente sinceros y que el matrimonio no es tan sencillo como ellos pensaban. Su luna de miel en Venecia rápidamente se torna en un desastre.</p>
<p><strong>Director:</strong> Shawn Levy · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Ashton Kutcher, Brittany Murphy, Christian Kane, David Moscow, Monet Mazur, David Rasche</p>
