<h1>Lawrence de Arabia</h1>
<p>El Cairo, 1917. Durante la Gran Guerra (1914-1918), T.E. Lawrence, un conflictivo y enigmático oficial británico, es enviado al desierto para participar en una campaña de apoyo a los árabes contra Turquía. Él y su amigo Sherif Alí pondrán en esta misión toda su alma. Los nativos adoran a Lawrence porque ha demostrado sobradamente ser un amante del desierto y del pueblo árabe. En cambio, sus superiores británicos creen que se ha vuelto loco.</p>
<p><strong>Director:</strong> David Lean · <strong>Año:</strong> 1962 · <strong>Géneros:</strong> Aventura, Bélica, Historia</p>
