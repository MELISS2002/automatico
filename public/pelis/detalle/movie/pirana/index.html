<h1>Piraña</h1>
<p>El hombre ha manipulado de nuevo la naturaleza, y esta vez el resultado no es sólo mortal&amp;#8230; ¡es voraz! Una tranquila y deliciosa noche, dos jóvenes excursionistas deciden darse un baño a la luz de la luna en las tranquilas aguas del lago Lost River&amp;#8230; ¡sin saber que van a convertirse en el banquete de una especie de pirañas comedoras de hombres! Sus muertes provocan una investigación que revela la existencia de un experimento secreto del gobierno conocido como Operación Razorteeth. Pero lo peor está por llegar. Este insaciable y macabro ejército de monstruos está trasladándose río abajo, donde un nuevo complejo de vacaciones de verano acaba de abrir sus puertas&amp;#8230; el cual les proporcionará un festín de veraneantes a no ser que un valiente ecologista (Bradford Dillman) y una bella e inteligente investigadora (Heather Menzies) no detengan su mortal avance&amp;#8230; para siempre.</p>
<p><strong>Director:</strong> Joe Dante · <strong>Año:</strong> 1978 · <strong>Géneros:</strong> Ciencia ficción, Comedia, Terror</p>
<p><strong>Reparto:</strong> Bradford Dillman, Heather Menzies, Kevin McCarthy, Keenan Wynn, Dick Miller, Barbara Steele</p>
