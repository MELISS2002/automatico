<h1>La Masacre de Texas: El inicio</h1>
<p>Chrissie y sus tres amigos se preparan para realizar un viaje antes de enviar a uno de ellos a Vietnam. Pero a lo largo del camino, unos motociclistas acosan a los amigos y provocan un accidente que expulsa a Chrissie del vehículo. El policía que llega al lugar mata a uno de los motociclistas y lleva a los amigos a la casa en donde el joven Leatherface está aprendiendo sobre el terror.</p>
<p><strong>Director:</strong> Jonathan Liebesman · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Jordana Brewster, Taylor Handley, Diora Baird, Matt Bomer, R. Lee Ermey, Lew Temple</p>
