<h1>Baghead: Contacto Con La Muerte</h1>
<p>Tras la muerte de su padre, Iris descubre que ha heredado un antiguo bar en ruinas. Viaja a Berlín para identificar el cuerpo de su padre y reunirse con el abogado para hablar sobre su herencia. Lo que ella no sabe es que, cuando firme las escrituras, quedará ligada a una entidad indescriptible que habita en el sótano del bar: Baghead, una criatura que cambia de forma y puede tomar la forma de cualquier persona que haya muerto. Dos mil dólares en efectivo por dos minutos con la criatura es todo lo que necesita la gente para hablar con sus seres queridos y calmar su dolor. Neil, quien ha perdido a su esposa, es el primer cliente de Iris. Al igual que lo hizo su padre, Iris se siente tentada a explotar los poderes de la criatura ayudando a personas desesperadas por algo de dinero. Pero pronto descubre que romper la regla de los dos minutos puede tener consecuencias aterradoras.</p>
<p><strong>Director:</strong> Alberto Corredor · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Freya Allan, Jeremy Irvine, Ruby Barker, Peter Mullan, Anne Müller, Svenja Jung</p>
