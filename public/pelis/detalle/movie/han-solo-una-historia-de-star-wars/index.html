<p>A bordo del Halcón Milenario Han Solo Una Historia de Star Wars trae una nueva aventura con el contrabandista más querido de todos los tiempos. A través de una serie de arriesgadas travesuras en un oscuro y peligroso submundo criminal, Han Solo conoce a su futuro amigo y copiloto y encuentra al apostador Lando Calrissian en un viaje que marcará el curso de uno de los héroes más inesperados de Star Wars.</p>
<p><strong>Director:</strong> Thomas Bentley · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción</p>
