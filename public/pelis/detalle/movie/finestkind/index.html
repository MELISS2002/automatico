<h1>Finestkind</h1>
<p>Charlie (Wallace) quiere alejarse de su aburrida vida cuando le ruega a su hermano mayor, Tom (Foster), que le deje trabajar en su barco pesquero durante el verano. No hay quien le disuada, incluso después de que su primera expedición casi acabe en desastre. Charlie se hace rápidamente amigo del grupo, haciéndose un hueco en New Bedford mientras empieza a salir con Mabel (Jenna Ortega), que intenta labrarse su propio futuro. Los problemas se suceden y, con las deudas acumulándose, los hermanos se ven obligados a idear una forma de conseguir dinero rápido. Envueltos en un peligroso negocio de drogas, consiguen más de lo que esperaban, lo que obliga al padre de Tom, Ray (Jones), famoso en la comunidad por su malhumor, a intervenir de la única manera que sabe.</p>
<p><strong>Director:</strong> Alyssa Boffoli · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Crimen, Drama, Suspense</p>
<p><strong>Reparto:</strong> Ben Foster, Toby Wallace, Jenna Ortega, Tommy Lee Jones, Ismael Cruz Cordova, Clayne Crawford</p>
