<h1>IT: Capítulo 2</h1>
<p>En este segundo capitulo Han pasado 27 años desde que el «Club de los Perdedores», formado por Bill, Berverly, Richie, Ben, Eddie, Mike y Stanley, se enfrentaran al macabro y despiadado Pennywise (Bill Skarsgård). En cuanto tuvieron oportunidad, abandonaron el pueblo de Derry, en el estado de Maine, que tantos problemas les había ocasionado. Sin embargo, ahora, siendo adultos, parece que no pueden escapar de su pasado. Todos deberán enfrentarse de nuevo al temible payaso para descubrir si de verdad están preparados para superar sus traumas de la infancia.</p>
<p><strong>Director:</strong> Andy Muschietti · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Drama, Suspense, Terror</p>
