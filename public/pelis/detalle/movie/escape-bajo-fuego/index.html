<h1>Escape bajo fuego</h1>
<p>Tras sabotear un reactor nuclear iraní, el agente de la CIA Tom Harris descubre que su identidad ha sido revelada a los medios después de que un informante expusiera la implicación de la CIA en la destrucción del reactor. Harris dispone de sólo 30 horas para llegar al aeropuerto de Kandahar y evitar su muerte y captura. Para conseguirlo, necesitará la ayuda de un traductor afgano llamado Mo que desprecia la violencia y el derramamiento de sangre causado por el conflicto bélico. Perseguidos por peligrosas amenazas, entre las que se encuentra el despiadado asesino Kahil, Tom y Mo se verán obligados a unir fuerzas para llegar, de una pieza, a Kandahar.</p>
<p><strong>Director:</strong> Simon Adegbenro · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Acción, Bélica, Suspense</p>
<p><strong>Reparto:</strong> Gerard Butler, Navid Negahban, Travis Fimmel, Ali Fazal, Bahador Foladi, Nina Toussaint-White</p>
