<h1>Solo para parejas</h1>
<p>Cuatro parejas, todos amigos, descienden en una isla tropical resort. Aunque un marido y una esposa están allí para trabajar en su unión, los otros apenas quieren gozar de una cierta diversión en el sol. Sin embargo, pronto encuentran que el paraíso tiene un precio: la participación en sesiones de terapia de pareja es obligatoria. Lo que comenzó como un recorte de vacaciones se convierte en un examen de los problemas comunes que muchos enfrentan.</p>
<p><strong>Director:</strong> Trudy Ramirez · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Vince Vaughn, Jason Bateman, Jon Favreau, Faizon Love, Kristin Davis, Malin Åkerman</p>
