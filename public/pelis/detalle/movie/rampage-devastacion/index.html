<h1>Rampage: Devastación</h1>
<p>Davis Okoye es un especialista en primates de reconocido prestigio que mantiene un vínculo muy importante con un singular gorila albino llamado George, un animal que posee una inteligencia extraordinaria y al que lleva cuidando desde su nacimiento. Cuando este gorila es víctima de una peligrosa modificación genética, su ADN mutará rápidamente y de manera incontrolada. Será entonces cuando George crezca de forma exponencial y se convierta en un monstruo violento. Su tamaño, rapidez, agilidad y violencia estará fuera de control. Pero este gorila no es el único animal que ha mutado, Okoye pronto descubrirá que hay otros animales que tienen el mismo problema, y que destruyen todo lo que encuentran a su paso. Para frenar esta amenaza y recuperar a su entrañable compañero, Okoye deberá enfrentarse a los responsables de esta mutación que está sembrando el pánico en el mundo, pues el primatólogo es el único capaz de frenar a estos monstruos y su amenaza.</p>
<p><strong>Director:</strong> Brad Peyton · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción</p>
<p><strong>Reparto:</strong> Dwayne Johnson, Naomie Harris, Malin Åkerman, Jeffrey Dean Morgan, Jake Lacy, Joe Manganiello</p>
