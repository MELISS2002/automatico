<h1>Leyenda</h1>
<p>Lili es una bella princesa a la que le gusta pasear por el bosque encantado. Ella dice que va a ver a unos parientes, pero en realidad va a encontrarse con Jack, un extraño personaje verde. Mientras, una personificación del diablo intentará extender la noche eterna asesinando al unicornio de esas tierras. Aunque no parece que haya salvación, Jack y sus amigos se enfrentarán a él para salvar al mundo y a la princesa.</p>
<p><strong>Director:</strong> Ridley Scott · <strong>Año:</strong> 1985 · <strong>Géneros:</strong> Aventura, Fantasía</p>
