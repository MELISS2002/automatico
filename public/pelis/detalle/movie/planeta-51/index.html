<h1>Planeta 51</h1>
<p>Historia de una familia de extraterrestres que vive tranquilamente en su planeta hasta la llegada de lo que para ellos es un alienígena: un hombre. El Capitán Charles «Chuck» Baker, astronauta americano, aterriza en Planeta 51 pensando que es la primera persona en pisar el planeta. Para su sorpresa, descubre que el planeta está habitado por pequeñas criaturas verdes que viven felizmente en un mundo plagado de cercas blancas, reminiscencia de la alegre inocencia de la América de los años 50, y cuyo único temor es el de ser invadidos por alienígenas&amp;#8230; ¡como Chuck! Ayudado por su compañero robot «Rover» y su nuevo amigo Lem, Chuck tendrá que abrirse camino a través del deslumbrante y desconcertante paisaje del planeta para no convertirse en pieza permanente del Museo Espacial de Invasores Alienígenas de Planeta 51.</p>
<p><strong>Director:</strong> Jorge Blanco · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Animación, Aventura, Ciencia ficción, Comedia, Familia</p>
<p><strong>Reparto:</strong> Dwayne Johnson, Seann William Scott, Jessica Biel, Justin Long, Gary Oldman, John Cleese</p>
