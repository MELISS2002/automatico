<h1>Shaft</h1>
<p>Cuando el joven Walter Wade mata a un estudiante negro, John Shaft le detiene. Violando la libertad condicional, el acusado abandona el país. Sin embargo, después de una espera de dos años, Shaft le acaba echando el guante a su anónimo regreso a los Estados Unidos. Cuando el millonario padre de Walter paga su fianza de nuevo, Walter queda libre y desea ver a Shaft muerto. No es el único: el mismo destino quieren para él dos de sus corruptos colegas, Jack Roselli y Jimmy Grovitch, así como un traficante de drogas dominicano, Peoples Hernández, que espera vengarse de Shaft por haberle humillado en el barrio que controla.</p>
<p><strong>Director:</strong> John Singleton · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Acción, Aventura, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Samuel L. Jackson, Vanessa Williams, Jeffrey Wright, Christian Bale, Busta Rhymes, Dan Hedaya</p>
