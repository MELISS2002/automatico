<h1>Amadeus</h1>
<p>La pelicula Amadeus nos presenta a Antonio Salieri, el músico más destacado de la corte del Emperador José II de Austria. Entregado completamente a la música, le promete a Dios humildad y castidad si, a cambio, conserva sus extraordinarias dotes musicales. Pero, después de la llegada a la corte de un joven llamado Wolfang Amadeus Mozart, Salieri queda relegado a un segundo plano. Enfurecido por la pérdida de protagonismo, hará todo lo posible para arruinar la carrera del músico de Salzburgo. Mientras tanto, Mozart, ajeno a las maquinaciones de Salieri, sorprende a todos con su genialidad como músico, pero también con sus excentricidades.</p>
<p><strong>Director:</strong> Miloš Forman · <strong>Año:</strong> 1984 · <strong>Géneros:</strong> Drama, Historia, Música</p>
<p><strong>Reparto:</strong> F. Murray Abraham, Tom Hulce, Elizabeth Berridge, Simon Callow, Roy Dotrice, Christine Ebersole</p>
