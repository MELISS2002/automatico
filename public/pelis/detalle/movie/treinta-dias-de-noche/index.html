<h1>Treinta días de noche</h1>
<p>En Barrow, un remoto pueblo de Alaska, durante 30 días de cada invierno el Sol no sale y la noche ocupa todo el día. Ese es el momento en el cual aparece un misterioso grupo de extraños: vampiros sedientos de sangre, listos para tomar ventaja de la ininterrumpida oscuridad y alimentarse de los pocos residentes que permanecen en el pueblo. El comisario de Barrow, Eben (Josh Hartnett), su esposa Stella (Melissa George) y un decreciente grupo de sobrevivientes deberán hacer lo que sea para resistir hasta que reaparezca la luz del día. Basada en la novela gráfica de Steve Niles y Ben Templesmith.</p>
<p><strong>Director:</strong> David Slade · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Josh Hartnett, Melissa George, Danny Huston, Ben Foster, Mark Boone Junior, Mark Rendall</p>
