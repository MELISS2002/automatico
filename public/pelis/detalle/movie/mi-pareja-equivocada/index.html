<h1>Mi pareja equivocada</h1>
<p>Holden McNell y su mejor amigo, Banky Edwards, disfrutan del éxito de su más reciente creación, el cómic de culto ”Bluntman and Chronic”. Cuando conocen a la también creadora de cómics Alyssa Jones, Holden se siente inmediatamente atraído por ella. Las inclinaciones sentimentales de Alyssa, no obstante, apuntan a otra dirección, por lo que prefiere que Holden y ella sean simplemente amigos. Este se plantea un dilema: sintiendo lo que siente por ella, ¿pueden ser tan sólo amigos? Banky, que la conoce, tiene la respuesta: de ninguna manera.</p>
<p><strong>Director:</strong> Kevin Smith · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Ben Affleck, Joey Lauren Adams, Jason Lee, King Mustafa Obafemi, Jason Mewes, Kevin Smith</p>
