<h1>Sin reservas</h1>
<p>Kate Armstrong, reputada chef de un restaurante de moda en Manhattan, vive su vida al igual que dirige su cocina: con una intensidad que cautiva y a la vez intimida a la gente que la rodea. Pero la naturaleza perfeccionista de Kate se pondrá a prueba cuando se tiene que hacer cargo de su sobrina de nueve años, al mismo tiempo que debe lidiar con un nuevo sub-chef que se une a su personal. Nick Palmer, alegre y bastante irresponsable, es completamente distinto de Kate, sin embargo la química que se da entre ellos es innegable. La rivalidad se vuelve romance, pero Kate deberá aprender a expresarse más allá que en el campo de su cocina, si quiere conectarse con Zoe y encontrar la verdadera felicidad con Nick&amp;#8230; Remake norteamericano de la cinta alemana «Deliciosa Marta» (Mostly Martha, 2001)</p>
<p><strong>Director:</strong> Scott Hicks · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
