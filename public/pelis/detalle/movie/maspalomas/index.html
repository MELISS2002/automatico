<h1>Maspalomas</h1>
<p>Tras romper con su pareja, Vicente, de 76 años, lleva la vida que le gusta en Maspalomas: su día a día lo pasa tumbado al sol, de fiesta y buscando el placer. Un accidente inesperado le obliga a regresar a San Sebastián y a reencontrarse con su hija, a quien abandonó años atrás. Vicente tendrá que vivir en una residencia donde se verá empujado a volver al armario y a ocultar una parte de sí mismo que creía resuelta. En este nuevo entorno, Vicente deberá preguntarse si aún está a tiempo de reconciliarse con los demás… y consigo mismo.</p>
<p><strong>Director:</strong> Aitor Arregi · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama</p>
