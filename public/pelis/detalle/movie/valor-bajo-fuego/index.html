<h1>Valor bajo fuego</h1>
<p>Guerra de Irak. Después de destruir accidentalmente uno de sus propios tanques, el teniente coronel Nathan Serling (Denzel Washington) vuelve a casa. El Ejército oculta el incidente y asigna a Serling la misión de investigar al capitán Karen Walden (Meg Ryan), una piloto de helicóptero que, a título póstumo, está a punto de convertirse en la primera mujer héroe de guerra que recibe la medalla al honor por una acción en combate. Ésta fue la primera película que se hizo en Hollywood sobre la I Guerra del Golfo.</p>
<p><strong>Director:</strong> Edward Zwick · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Bélica, Drama, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Denzel Washington, Meg Ryan, Lou Diamond Phillips, Michael Moriarty, Matt Damon, Bronson Pinchot</p>
