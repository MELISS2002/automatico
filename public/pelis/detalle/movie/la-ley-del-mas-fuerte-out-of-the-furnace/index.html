<p>Russell Baze (Christian Bale) y su hermano menor Rodney (Casey Affleck) viven en el Rust Belt, una zona desindustrializada que registra el índice de paro más alto de Estados Unidos. Russell trabaja en una acería a punto de cerrar, mientras que Rodney acaba de regresar de la guerra de Iraq. Ambos sueñan con marcharse para encontrar una vida mejor. Sin embargo, un cruel giro del destino hace que Russell ingrese en prisión y que su hermano se una a una violenta banda criminal.</p>
