<h1>El crimen del padre Amaro</h1>
<p>Amaro, un joven de 24 años recién ordenado sacerdote, llega a la parroquia del pequeño pueblo mexicano de Los Reyes para auxiliar en los servicios del templo al padre Benito. En el pueblo, el padre Amaro conoce a Amelia, una hermosa muchacha de 16 años. Poco a poco, el joven sacerdote se va dando cuenta de cosas que suceden en el pueblo relacionadas con los narcos de la región, encabezados por El Chato Aguilar.</p>
<p><strong>Director:</strong> Carlos Carrera · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Gael García Bernal, Ana Claudia Talancón, Sancho Gracia, Angélica Aragón, Luisa Huertas, Ernesto Gómez Cruz</p>
