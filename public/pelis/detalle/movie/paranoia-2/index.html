<h1>Paranoia</h1>
<p>Tras sufrir una desgracia un año antes, el joven Kale (Shia LaBeouf) protagoniza en la escuela un incidente, por el que es condenado a arresto domiciliario. Su madre Julie (Carrie-Anne Moss), que trabaja noche y día para sacar la familia adelante, no obtiene a cambio más que indiferencia y desidia. Kale empieza a sentir que la casa se le cae encima y acaba convirtiéndose en un mirón que sigue con interés hasta los más pequeños acontecimientos que puede observar desde las ventanas. Un día comienza a sospechar que uno de sus vecinos (David Morse) es un asesino en serie. ¿Será verdad o serán imaginaciones fruto de su encierro forzoso?</p>
<p><strong>Director:</strong> D.J. Caruso · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Drama, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Shia LaBeouf, Sarah Roemer, Carrie-Anne Moss, David Morse, Aaron Yoo, Jose Pablo Cantillo</p>
