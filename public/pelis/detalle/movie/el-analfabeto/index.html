<h1>El analfabeto</h1>
<p>Inocencio Prieto y Calvo recibe una carta diciéndole que es el heredero de la fortuna de su tío de dos millones de pesos. Al no ser capaz de leer, no tiene idea de quién envió la carta o su contenido. Así que él va a la farmacia porque el farmacéutico puede leer la carta a él. Pero mientras espera ser ayudado ve que una niña puede leer. Él calcula que tiene que ser capaz de descubrir el contenido de la carta por sí mismo y decide que va a guardar la carta y ir a la escuela, y esperar a leer la carta por su cuenta.</p>
<p><strong>Director:</strong> Miguel M. Delgado · <strong>Año:</strong> 1961 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Cantinflas, Lilia Prado, Sara García, Ángel Garasa, Miguel Manzano, Carlos Agostí</p>
