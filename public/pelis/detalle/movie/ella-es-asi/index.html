<h1>Ella es así</h1>
<p>Zack (Freddie Prinze Jr.), el chico más popular del instituto, ha sido abandonado por su novia, una joven siempre dispuesta a trepar socialmente. Tras la afrenta, intenta impedir por todos los medios que ella sea elegida la reina anual del instituto y, para ello, apadrina a otra candidata, a la vez que apuesta con un amigo que una chica anónima puede convertirse en la reina de la fiesta de graduación con el adecuado cambio de imagen. La elegida es la tímida Laney (Rachael Leigh Cook). Mientras se esmera en la mejora del aspecto físico de su pupila, el amor se apodera de él.</p>
<p><strong>Director:</strong> Robert Iscove · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Freddie Prinze Jr., Rachael Leigh Cook, Paul Walker, Jodi Lyn O&#x27;Keefe, Kevin Pollak, Anna Paquin</p>
