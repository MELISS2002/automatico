<h1>Metrópolis</h1>
<p>Duke Red ha supervisado la construcción de Ziggurat masivo para ampliar su poder a través del planeta entero. Tima, una muchacha del robot incorporó la imagen de su hija difunta, está en el corazón de estos proyectos. Sin embargo, después de evitar los embragues de Duke en un fuego de laboratorio, encuentra y ofrece amistad a Kenichi, un muchacho que ha viajado a la Metrópoli con su tío policíaco en busca de un científico querido para el tráfico del órgano. ¿Van su relación con Kenichi y la realización de la verdad de su existencia, cambiar su destino?</p>
<p><strong>Director:</strong> りんたろう · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Animación, Ciencia ficción</p>
