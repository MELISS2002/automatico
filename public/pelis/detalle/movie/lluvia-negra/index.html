<h1>Lluvia Negra</h1>
<p>Dos policías de Nueva York se involucran en una guerra de pandillas entre miembros de la Yakuza, la mafia japonesa. Arrestan a uno de sus asesinos y se les ordena escoltarlo de regreso a Japón. Sin embargo, en Japón se las arregla para escapar, y cuando intentan rastrearlo, se adentran más y más en la escena de la mafia japonesa y tienen que aprender que solo pueden ganar jugando el juego, a la manera japonesa.</p>
<p><strong>Director:</strong> Ridley Scott · <strong>Año:</strong> 1989 · <strong>Géneros:</strong> Acción, Drama, Suspense</p>
