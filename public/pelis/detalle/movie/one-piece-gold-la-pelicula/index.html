<h1>One Piece Gold: La película</h1>
<p>Los Piratas del Sombrero de Paja visitan Gran Tesoro, el barco más lujoso del mundo, que es considerado un país. Tras hacer varias apuestas en el casino, en su última apuesta Luffy pierde todo el dinero ganado, además de deber dinero prestado del casino, por lo que Gild Tesoro, el dueño del lugar, retiene a Zoro hasta que sus compañeros devuelvan el dinero que deben. Por ello, Luffy y su banda se alía con Carina, miembro de la banda de Tesoro y antigua compañera de robos de Nami, para infiltrarse en el casino y robar la fortuna de Tesoro. Se ubicaría despues del especial Heart of Gold.</p>
<p><strong>Director:</strong> Hiroaki Miyamoto · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Acción, Animación, Aventura, Comedia</p>
