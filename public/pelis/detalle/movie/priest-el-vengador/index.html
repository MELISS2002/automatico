<h1>Priest - El vengador</h1>
<p>En un mundo asolado por siglos de guerra entre el hombre y los vampiros, Paul Bettany es un legendario guerrero que destacó durante la última Guerra del Vampiro, pero ahora es sólo un sacerdote que vive en compañía de otros hombres en las amuralladas ciudades distópicas controladas por la Iglesia. Sin embargo, cuando su joven sobrina es secuestrada por un grupo de vampiros asesinos que viven en los páramos desolados del exterior, el sacerdote rompe sus sagrados votos y emprende su búsqueda decidido a vengarse de los secuestradores, especialmente de su brutal líder. En esta aventura le acompaña Hicks, el novio de la chica, un sheriff y una sacerdotisa, miembro de la legión de asesinos de vampiros y poseedora de habilidades de combate sobrenaturales.</p>
<p><strong>Director:</strong> Scott Stewart · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Acción, Fantasía, Terror</p>
<p><strong>Reparto:</strong> Paul Bettany, Karl Urban, Lily Collins, Maggie Q, Stephen Moyer, Cam Gigandet</p>
