<h1>Demolición</h1>
<p>Davis Mitchell es un exitoso ejecutivo que sufre una grave desconexión emocional tras la repentina y trágica muerte de su mujer en un accidente de coche. Aunque su suegro intenta por todos los medios que se recupere, continúa bloqueado y se dedica a desmontar compulsivamente toda clase de objetos. Gracias a la ayuda de Karen y de su hijo, a los que acaba de conocer, Davis empieza a reconstruir su vida.</p>
<p><strong>Director:</strong> Jean-Marc Vallée · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Jake Gyllenhaal, Naomi Watts, Chris Cooper, Judah Lewis, C.J. Wilson, Polly Draper</p>
