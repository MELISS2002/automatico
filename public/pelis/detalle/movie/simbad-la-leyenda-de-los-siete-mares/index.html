<h1>Simbad: La leyenda de los siete mares</h1>
<p>Simbad, el aventurero más osado y famoso que cruzó los siete mares, tiene que afrontar el peligro más grande de su vida. Acusado de robar el Libro de la Paz, uno de los tesoros más valiosos del mundo, tendrá que encontrarlo para salvar a Proteus, su mejor amigo. Será Marina, la prometida de Proteus, quien convenza a Simbad de que tiene el deber de cumplir esa misión. Eris, la diosa del caos, trata de impedírselo arrojando contra él la furia de los elementos y una legión de criaturas monstruosas.</p>
<p><strong>Director:</strong> Tim Johnson · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Acción, Animación, Aventura, Familia, Fantasía</p>
