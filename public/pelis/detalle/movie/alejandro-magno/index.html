<h1>Alejandro Magno</h1>
<p>Antigüedad, Helenismo. Alejandro (356-323 a. C.), rey de Macedonia, comenzó a reinar a los veinte años. Se apoderó primero de Grecia y, después de conquistar el inmenso Imperio Persa, siguió avanzando hacia la India. Fue un gran estratega que nunca perdió una batalla, un visionario cuyos sueños, hazañas y destino dejaron huella en la Historia. Cuando murió, a los 33 años, había forjado un imperio sin precedentes en la historia. Los personajes más influyentes de su vida fueron: Filippo, su padre; Olimpia, su madre; Hefestión, su gran amigo; Roxana, su ambiciosa mujer, y el general Ptolomeo, confidente y leal compañero de armas.</p>
<p><strong>Director:</strong> Oliver Stone · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Acción, Aventura, Bélica, Drama, Historia, Romance</p>
