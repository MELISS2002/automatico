<h1>JUNG_E</h1>
<p>En 2194 estalla una guerra civil entre los supervivientes de la catástrofe acaecida en la Tierra. La mayor Jung-e, heroína de guerra, entra en coma tras sufrir graves heridas, y su familia se ve obligada a donar los datos de su cerebro al “Laboratorio de Nueva Generación”. Este laboratorio emplea los datos de Jung-e para fabricar un robot con inteligencia artificial, que utiliza para realizar simulaciones de la guerra. Durante la simulación, Seo-hyun, hija de Jung-e y responsable del equipo de investigación robótica, descubre el secreto de su madre a través de repetidos experimentos.</p>
<p><strong>Director:</strong> 연상호 · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Drama</p>
