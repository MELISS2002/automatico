<h1>Blade Runner 2049</h1>
<p>En 2049, K es uno de los esclavos androides de la nueva serie Nexus-9 llamados replicantes. K también es un Blade Runner, un cazador de replicantes rebeldes, que termina realizando un importante descubrimiento durante una de sus misiones. Luego de ser ordenado buscar y destruir cualquier evidencia del suceso, el androide termina tras la pista de Rick Deckard, un misterioso ex Blade Runner desparecido por más de 30 años. Secuela del icónico filme de ciencia ficción de 1982, Blade Runner.</p>
<p><strong>Director:</strong> Gábor Hegedüs Hege · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Ciencia ficción, Drama</p>
<p><strong>Reparto:</strong> Ryan Gosling, Harrison Ford, Ana de Armas, Dave Bautista, Robin Wright, Sylvia Hoeks</p>
