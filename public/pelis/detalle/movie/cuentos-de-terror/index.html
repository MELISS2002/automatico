<h1>Cuentos de Terror</h1>
<p>Inspirado por E.C. desde 1950, G. Romero y S. King llevan a la pantalla 5 historias de terror imperdibles! La historia comienza con un padre, Stan, que regaña severamente a su hijo, Billy, por ser sorprendido leyendo un libro de Creepshow, una colección de historias cómicas de terror. Después de la pelea, Stan tira el cómic a la basura y luego se retira a la sala de estar, mientras un angustiado Billy suplica a los personajes del cómic que vengan la injusticia, que mágicamente cobra vida rodeando la casa. Una figura fantasmal, el «Tío Creepy», aparece en la ventana del dormitorio del niño y le hace señas para que se acerque, comienza a contar historias.</p>
<p><strong>Director:</strong> George A. Romero · <strong>Año:</strong> 1982 · <strong>Géneros:</strong> Comedia, Terror</p>
<p><strong>Reparto:</strong> Hal Holbrook, Adrienne Barbeau, Fritz Weaver, Leslie Nielsen, Carrie Nye, E.G. Marshall</p>
