<h1>Mi villano favorito</h1>
<p>En una alegre urbanización con cuidados jardines rodeados por verjas de madera pintadas de blanco y llenos de rosales, sobresale una casa negra con el césped amarillento. Los vecinos ignoran que debajo de la vivienda hay un enorme escondite secreto. Allí está Gru, rodeado por un pequeño ejército de lacayos, planeando el mayor robo de toda la historia. ¡Va a robarse con la luna!</p>
<p><strong>Director:</strong> Pierre Coffin · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Animación, Ciencia ficción, Comedia, Crimen, Familia</p>
