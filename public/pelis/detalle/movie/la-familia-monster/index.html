<h1>La familia Monster</h1>
<p>La familia Wünschmann no es exactamente una familia feliz pero mamá Emma animará a todos a dejar sus diferencias de lado e ir juntos a un parque temático. Después de una broma inocente con una muñeca, que resulta ser la bruja Babayaga, los Wünschmann son convertidos en monstruos. Mamá Emma en un vampiro, papá Frank en Frankenstein, la hijita Fee en una momia y el hijo Max en un lobo. Y así es como un viaje normal en un tren fantasma se transforma una aventura ridículamente espeluznante. ¿Encontrará la familia Wünschmann su final feliz?</p>
<p><strong>Director:</strong> Holger Tappe · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Animación, Comedia, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Emily Watson, Nick Frost, Jessica Brown Findlay, Ethan Rouse, Jason Isaacs, Catherine Tate</p>
