<h1>Holocausto Caníbal</h1>
<p>Un grupo de reporteros jóvenes, Alan Yates, su prometida Faye Daniels y dos camarógrafos, Jack Anders y Mark Tomaso, junto con su guía Felipe Ocaña, van al Amazonas, denominado en la película como «Infierno verde», para hacer un documental sobre supuestas tribus caníbales que habitaban en la zona. Cuando terminan los días de plazo y los jóvenes no aparecen, un antropólogo llamado Harold Monroe viaja a la jungla para investigar qué les ocurrió.</p>
<p><strong>Director:</strong> Ruggero Deodato · <strong>Año:</strong> 1980 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Robert Kerman, Francesca Ciardi, Perry Pirkanen, Luca Barbareschi, Salvatore Basile, Ricardo Fuentes</p>
