<h1>Beso Francés</h1>
<p>Kate es una chica convencional que sueña con casarse con su novio Charlie y ser feliz para siempre. El problema es que Charlie se enamora de Juliette, una bella francesa, durante un viaje de negocios a París. Dispuesta a recuperarlo, Kate vuela a la capital francesa. En el avión conoce a Luc, un ladrón con el que no parece tener nada en común. Sin saber cómo ni por qué, Kate se ve viajando por toda Francia descubriendo junto a Luc todo el encanto del país.</p>
<p><strong>Director:</strong> Lawrence Kasdan · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Meg Ryan, Kevin Kline, Timothy Hutton, Jean Reno, Adam Brooks, François Cluzet</p>
