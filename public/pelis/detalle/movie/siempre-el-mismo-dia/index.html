<p>Emma (Hathaway) y Dexter (Sturgess) se conocen el día de su graduación universitaria, un 15 de julio. Ella es una chica idealista de clase trabajadora. Él, en cambio, es un joven rico con ganas de comerse el mundo. Durante veinte años, cada 15 de julio, se muestra su vida cotidiana y lo extraordinaria que es su amistad. Por fin, un día se dan cuenta de que lo que habían estado buscando durante años lo tenían ante sí.</p>
<p><strong>Director:</strong> Lone Scherfig · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Drama, Romance</p>
