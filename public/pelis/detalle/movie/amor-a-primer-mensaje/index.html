<h1>Amor a primer mensaje</h1>
<p>Mientras intenta superar la pérdida de su prometido, Mira Ray envía una serie de mensajes románticos a su antiguo número de teléfono, sin tener en cuenta que el número había sido reasignado al nuevo teléfono de trabajo de Rob Burns. Rob, periodista, queda sorprendido por la honestidad de los mensajes de texto. Cuando le asignan la tarea de escribir un artículo sobre la mega estrella Celine Dion, él le pide ayuda para averiguar cómo conocer a Mira en persona&amp;#8230; y conquistar así su corazón.</p>
<p><strong>Director:</strong> Mark Cockren · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Priyanka Chopra Jonas, Sam Heughan, Céline Dion, Sofia Barclay, Russell Tovey, Lydia West</p>
