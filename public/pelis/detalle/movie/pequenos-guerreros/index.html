<p>El Comando Élite está formado por una patrulla de muñecos militares muy arrogantes y agresivos que han cobrado vida y escapado de sus cajas para acabar con los gorgonitas, unos muñecos de aspecto extraño pero absolutamente pacíficos que sólo sueñan con encontrar la isla de Gorgon. El adolescente Alan Abernathy se verá envuelto en esta contienda y tomará posiciones a favor de los Gorgonitas, lo que le llevará, junto a toda su familia, a convertirse en el nuevo objetivo del Comando Élite, capaz de crear el caos en toda la ciudad.</p>
<p><strong>Director:</strong> Joe Dante · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Comedia, Fantasía</p>
