<h1>El duende maldito 2</h1>
<p>En su cumpleaños número 1.000, un duende leprechaun puede escoger a su novia haciendo que ésta estornude tres veces… La elegida es la hija de su propio esclavo, quien no permite esta unión y da la vida para impedirla. El leprechaun, ciego de ira, jura entonces que en su cumpleaños 2.000 se casará con la descendiente de la hija de su esclavo. Ese día ha llegado y el malvado leprechaun despierta para ir a por su futura mujer, llamada Bridget. Pero ni ella ni su novio Cody ni el tío de éste, Morty, se lo piensan permitir.</p>
<p><strong>Director:</strong> Rodman Flender · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Comedia, Terror</p>
<p><strong>Reparto:</strong> Warwick Davis, Charlie Heath, Shevonne Durkin, Adam Biesk, Arturo Gil, Linda Hopkins</p>
