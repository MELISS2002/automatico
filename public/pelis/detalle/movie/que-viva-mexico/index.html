<h1>¡Que Viva México!</h1>
<p>Veinte años atrás, Pancho Reyes, un próspero y “aspiracionista” clasemediero, abandonó su pueblo y se olvidó por completo de su numerosa y empobrecida familia. De manera inesperada, un día recibe la noticia de que su abuelo, Don Francisco Reyes, un viejo y rico minero, ha muerto y que él es uno de sus posibles herederos. Motivado por la avaricia y acompañado de su mujer, sus hijos y su sirvienta, Pancho viaja al remoto y ruinoso pueblo de La Prosperidad, para al fin reencontrarse con su muy resentida familia. Pero la presencia de Pancho, que siempre fue el favorito del abuelo, y al que todos sus parientes consideran un arrogante, ingrato y malagradecido “fifí”; y la posibilidad de que sea uno de los herederos, despiertan la envidia, el rencor y el odio guardado por tantos años, ocasionando una batalla campal. Una guerra a muerte por la herencia en la que todo se vale entre Pancho y su esperpéntica y folclórica familia: Los Reyes de La Prosperidad.</p>
<p><strong>Director:</strong> Luis Estrada · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Damián Alcázar, Alfonso Herrera, Joaquín Cosío, Ana de la Reguera, Ana Martín, Angelina Peláez</p>
