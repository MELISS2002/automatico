<h1>Wild Wild West: Las Aventuras de Jim West</h1>
<p>Jim West es un viejo héroe de la guerra de Secesión (1861-1865). Artemus Gordon es un imaginativo shériff que lo supera en el arte del disfraz. Cuando los Estados Unidos se ven amenazados por Arliss Loveless, un lunático confederado, el presidente Ulysses Grant encarga a esta excéntrica pareja que se ocupe de él. En un movido viaje desde Washington a Utah, nuestros héroes deberán enfrentarse a los diabólicos artilugios de Loveless.</p>
<p><strong>Director:</strong> David H. Venghaus Jr. · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Comedia, Western</p>
<p><strong>Reparto:</strong> Will Smith, Kevin Kline, Kenneth Branagh, Salma Hayek Pinault, M. Emmet Walsh, Ted Levine</p>
