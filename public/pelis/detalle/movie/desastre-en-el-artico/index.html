<h1>Desastre en el ártico</h1>
<p>En 1941, la Alemania nazi de Hitler invade la Unión Soviética y la guerra se complica enormemente. Para evitar más pérdidas, los aliados se ven obligados a ayudar. Convoyes de buques de carga civiles repletos de material de guerra inician el peligroso viaje hacia las ciudades rusas Murmansk y Arkhangelsk. Atrapados en el mar, sin experiencia en defensa o guerra, los marineros civiles se enfrentan cara a cara con la fuerza superior alemana en el brutal mar ártico.</p>
<p><strong>Director:</strong> Aslaug Konradsdottir · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Bélica, Drama</p>
<p><strong>Reparto:</strong> Tobias Santelmann, Anders Baasmo Christiansen, Heidi Ruud Ellingsen, Preben Hodneland, Adam Lundgren, Jon Ranes</p>
