<p>Hace tiempo que un asesinato dejó huérfanos a dos niños. Las autoridades culparon al hermano, pero la hermana creció creyendo que el verdadero culpable había sido un antiguo espejo maldito. Ahora, completamente rehabilitado y con veinte años cumplidos, el hermano está listo para empezar de nuevo, pero la hermana está decidida a demostrar que fue el espejo lo que destrozó a su familia.</p>
<p><strong>Director:</strong> Mike Flanagan · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Terror</p>
