<h1>Un Cuento Americano</h1>
<p>Un joven ratón llamado Fievel Mousekewitz y su familia emigran de Rusia a Estados Unidos en barco después de que su hogar es destruido por gatos. Durante el viaje, una feroz tormenta lanza a Fievel del barco, y él pierde el contacto con su familia. Afortunadamente, él se las arregla para navegar a Nueva York en una botella. Ahí, la ratona irlandesa Bridget, el italiano Tony y un gato llamado Tiger ayudan a Fievel a buscar a sus seres queridos.</p>
<p><strong>Director:</strong> Don Bluth · <strong>Año:</strong> 1986 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Drama, Familia</p>
<p><strong>Reparto:</strong> Phillip Glasser, Erica Yohn, Nehemiah Persoff, Amy Green, Christopher Plummer, John Finnegan</p>
