<h1>La maldición de la flor dorada</h1>
<p>China, siglo X, dinastía Tang. En vísperas del Festival Chong Yang, el Palacio Imperial se llena de flores doradas. El regreso inesperado del Emperador, con el Príncipe Jai, para celebrar la fiesta con su familia, resulta sospechoso, pues su relación con la Emperatriz es muy fría. Durante muchos años, la Emperatriz y el Príncipe heredero Wan, su hijastro, han mantenido una relación ilícita, pero Wan se siente atrapado y sueña con huir del palacio con Chan, la hija del médico imperial. Mientras tanto, el Príncipe Jai, el hijo fiel, crece preocupado por la salud de la Emperatriz y su obsesión por los crisantemos dorados.</p>
<p><strong>Director:</strong> 张艺谋 · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Acción, Drama, Fantasía</p>
