<h1>Jugando Sucio</h1>
<p>El encantador Dodge Connolly (George Clooney) es veterano futbolista americano que está decidido a alejar a su equipo de las peleas en los bares y a llevarlo a estadios repletos de espectadores. Pero, cuando el patrocinador los abandona y están a punto de perder la liga, Dodge convence a una estrella del fútbol americano universitario para que se una al equipo, con la esperanza de que los espectadores vuelvan a interesarse por el deporte. Así llega Carter Rutherford (John Krasinski), que también fue héroe de guerra; aunque su historia es puesta en duda por la periodista Lexie Littleton (Renée Zellweger), que comienza a vincularse con las dos grandes estrellas del equipo&amp;#8230;</p>
<p><strong>Director:</strong> George Clooney · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> George Clooney, Renée Zellweger, John Krasinski, Wayne Duvall, Stephen Root, Jonathan Pryce</p>
