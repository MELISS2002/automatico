<h1>Armadura de Dios II: Operación Cóndor</h1>
<p>Antes de que terminase la Segunda Guerra Mundial, los nazis escondieron en el desierto del Sáhara el oro que habían robado en diversos países europeos. El general alemán Von Katterling asignó la misión a su ayudante personal y a dieciocho soldados de los que nunca más se supo. Ahora, las Naciones Unidas quieren recuperar el oro para invertirlo en proyectos humanitarios y para lograrlo deciden asignarle la misión a un oriental neutral, Jackie el Cóndor. La misión del Cóndor es clara y precisa: ir al desierto, localizar el oro y recuperarlo.</p>
<p><strong>Director:</strong> Jackie Chan · <strong>Año:</strong> 1991 · <strong>Géneros:</strong> Acción, Aventura, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Jackie Chan, 鄭裕玲, Eva Cobo, 池田昌子, Vincent Lyn, Jonathan Isgar</p>
