<h1>Einstein y la bomba</h1>
<p>¿Qué pasó después de que Einstein huyera de la Alemania nazi? El físico alemán Albert Einstein tenía 66 años cuando se lanzó una bomba atómica sobre Hiroshima el 6 de agosto de 1945. Hasta su muerte, diez años después, estuvo consumido por la culpa y el remordimiento: en 1939, envió una carta a Franklin D. Roosevelt que ayudó a convencer a Estados Unidos de entrar en la carrera armamentista nuclear. Este docudrama usa imágenes de archivo y sus propias palabras para sumergirse en la mente de un genio torturado.</p>
<p><strong>Director:</strong> Anthony Philipson · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Documental, Drama</p>
<p><strong>Reparto:</strong> Aidan McArdle, Andrew Havill, Rachel Barry, Helena Westerman, Leo Ashizawa, Jay Lewis Mitchell</p>
