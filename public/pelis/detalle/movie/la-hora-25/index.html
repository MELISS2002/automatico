<h1>La hora 25</h1>
<p>Después de haber sido condenado a siete años por tráfico de drogas, a Monty Brogan le quedan sólo 24 horas de libertad antes de ingresar en prisión. Después de haber sido el rey de Manhattan, Monty está a punto de decir adiós a sus sueños de grandeza y al disparatado tren de vida que lo alejó de quienes lo querían de verdad. En esas últimas horas de libertad intenta recuperar la relación con su padre y con sus dos mejores amigos de juventud: Jacob, un tímido profesor, y Slaughtery, un brillante broker de Wall Street. Y también con su novia Naturelle, que podría ser la persona que lo delató a la policía.</p>
<p><strong>Director:</strong> Spike Lee · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Crimen, Drama</p>
<p><strong>Reparto:</strong> Edward Norton, Philip Seymour Hoffman, Barry Pepper, Rosario Dawson, Anna Paquin, Brian Cox</p>
