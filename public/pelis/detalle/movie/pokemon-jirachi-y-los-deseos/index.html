<h1>Pokémon: Jirachi y los deseos</h1>
<p>El Cometa del Milenio va a hacer su aparición, tan anticipada desde hace tiempo, en el cielo otra vez. Supuestamente concederá los deseos de todos aquellos que lo vean aparecer por el cielo. Por supuesto, Ash y sus amigos están también interesados en el Festival del Milenio, especialmente cuando asisten a una actuación mágica del Gran Butler. Mucho más interesante es el misterioso objeto que posee Butler ¡a través del cual Max oye una misteriosa voz que le llama! Cuando Jirachi emerge de su sueño, Max tiene un nuevo amigo; por desgracia, solo durante los pocos días que el Cometa del Milenio aparece en el cielo. Max está ansioso por pasar el mayor tiempo posible con su nuevo amigo, pero el Gran Butler tiene sus propios planes para Jirachi, que no soy muy amistosos. Quiere revivir al Groudon Legendario, y Jirachi podría ser capaz de concederle ese deseo. ¿Podrán Max, Ash, May y Brock detener a Butler y salvar a Jirachi antes de que Groudon reaparezca?</p>
<p><strong>Director:</strong> 浅田裕二 · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Acción, Animación, Aventura, Ciencia ficción, Familia, Fantasía</p>
<p><strong>Reparto:</strong> 松本梨香, うえだゆうじ, KAORI, 山田ふしぎ, 大谷育江, 鈴木富子</p>
