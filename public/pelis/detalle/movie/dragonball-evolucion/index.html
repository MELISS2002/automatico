<h1>DragonBall Evolución</h1>
<p>La aventura de Goku comienza de forma bastante inocente en el exterior de la casa de su abuelo, donde Gohan está adiestrando al joven en unas exóticas técnicas marciales. Goku cumple ese día 18 años, y el regalo de Gohan a su nieto es una Bola de Dragón, una esfera pequeña y redonda cuya superficie es blanda y anacarada pero con una blanca translucidez que le proporciona profundidad. Cuatro estrellas flotan en el interior de la esfera. Sólo existen seis más como ella en el mundo, y se dice que cuando las siete Bolas de Dragón están juntas pueden conceder cualquier deseo a quien las posee. Las Bolas de Dragón tienen conexión tanto con el misterioso pasado del propio Goku como con el próximo eclipse solar, que la superstición señala como el inicio del Apocalipsis. Gohan promete contarle todo a Goku durante la cena especial de cumpleaños que está preparando para su nieto.</p>
<p><strong>Director:</strong> James Wong · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Fantasía, Suspense</p>
<p><strong>Reparto:</strong> Justin Chatwin, 周潤發, 박준형, Jamie Chung, Emmy Rossum, James Marsters</p>
