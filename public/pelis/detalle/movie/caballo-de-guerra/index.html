<h1>Caballo de Guerra</h1>
<p>Nos cuenta la extraordinaria historia de amistad que surge entre el joven Albert y un caballo llamado Joey, separándose sus caminos a causa de la Primera Guerra Mundial. El padre de Albert vende a Joey a la caballería del ejército británico para luchar en el frente. Joey será testigo de un extraordinario periodo de la Historia con la Gran Guerra como trasfondo. A pesar de los obstáculos que encuentra en su camino, su coraje será fuente de inspiración para todos los que se cruzan con el noble animal. Albert no puede olvidar a su caballo y abandona su hogar para luchar en los campos de batalla de Francia. Allí busca incansablemente a su amigo para traerlo sano y salvo a casa.</p>
<p><strong>Director:</strong> Steven Spielberg · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Aventura, Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> Jeremy Irvine, Peter Mullan, Emily Watson, Niels Arestrup, David Thewlis, Tom Hiddleston</p>
