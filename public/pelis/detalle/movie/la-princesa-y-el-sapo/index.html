<h1>La princesa y el sapo</h1>
<p>Tiana, una muchacha de origen humilde que vive en Nueva Orleans, trabaja como camarera y cocinera para conseguir realizar el sueño que compartió con su padre, conseguir abrir su propio restaurante. Pero todo cambia cuando el Príncipe Naveen, heredero de la corona de Maldonia, llega a la ciudad. En su camino se cruza el Doctor Facilier, un brujo vudú que engaña al príncipe y lo convierte en un sapo. Atrapado en su nueva forma, Naveen intentará romper el encantamiento utilizando la forma clásica de los cuentos, es decir, con el beso de una princesa. Convence a Tiana para que le bese pero, las cosas no son tan sencillas.</p>
<p><strong>Director:</strong> Ron Clements · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Animación, Familia, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Anika Noni Rose, Bruno Campos, Jim Cummings, Michael-Leon Wooley, Keith David, Jennifer Cody</p>
