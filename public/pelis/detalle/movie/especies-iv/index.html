<h1>Especies IV</h1>
<p>Cuando la inteligente profesora universitaria Miranda Hollander (Helena Mattsson) sufre una pérdida de conciencia, y se despierta entre los restos de una sangrienta carnicería, pide ayuda a su tío Tom (Ben Cross) y éste le revela la terrible verdad: que sólo es humana a medias y que en realidad es un clon de un híbrido de ADN humano y alienígena. Tío y sobrina se verán obligados a huir a México en busca del científico responsable de su creación, pero muy pronto tendrán que enfrentarse a una sanguinaria legión de híbridos mientras se agota el plazo para que Miranda, sin poder evitarlo, deba rendirse ante el instinto asesino que alberga en su propio cuerpo</p>
<p><strong>Director:</strong> Nick Lyon · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Ciencia ficción, Suspense, Terror</p>
<p><strong>Reparto:</strong> Helena Mattsson, Ben Cross, Dominic Keating, Marlene Favela, Meagen Fay, Roger Cudney</p>
