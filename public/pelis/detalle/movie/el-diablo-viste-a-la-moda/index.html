<h1>El diablo viste a la moda</h1>
<p>En el vertiginoso mundo de la moda de Nueva York, la cumbre del éxito la representa la revista Runway, dirigida con mano de hierro por Miranda Priestly. Trabajar como ayudante de Miranda podría abrirle cualquier puerta a Andy Sachs, si no fuera porque es una chica que destaca por su desaliño estilo dentro del grupo de guapísimas periodistas de la revista. Andy comprende muy pronto que para triunfar en ese negocio va a necesitar algo más que iniciativa y preparación. Y la prueba está delante de ella, vestida de pies a cabeza de Prada.</p>
<p><strong>Director:</strong> David Frankel · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Meryl Streep, Anne Hathaway, Emily Blunt, Stanley Tucci, Simon Baker, Adrian Grenier</p>
