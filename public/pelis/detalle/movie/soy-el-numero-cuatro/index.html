<h1>Soy el número cuatro</h1>
<p>Después de que su mundo haya sido destruido por seres de otro planeta, nueve jóvenes alienígenas se esconden en la Tierra. Uno de ellos, el cuarto del grupo y que se hace llamar John Smith, descubre que no está a salvo: sus enemigos se encuentran en la Tierra, han acabado con los tres anteriores y le siguen los pasos para dar con él. Para intentar no ser descubierto el joven cuenta con la ayuda de un guardián que le protege, Henri. Haciéndose pasar por padre e hijo, su nuevo destino es Paradise, un pequeño pueblo de Ohio, donde John conoce a Sara, por la que pronto comienza a sentir una gran atracción.</p>
<p><strong>Director:</strong> D.J. Caruso · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Suspense</p>
