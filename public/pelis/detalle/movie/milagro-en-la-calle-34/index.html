<h1>Milagro en la Calle 34</h1>
<p>Durante un desfile navideño organizado por los grandes almacenes Macy, el hombre que encarna a Santa Claus es sustituido por indisposición. Un anciano llamado Kris se ofrece a la señora Walker, responsable del desfile, para encarnar a Santa Claus. Después del desfile es contratado por dar a la perfección el tipo de personaje, pero todo se complica cuando él asegura que es el auténtico Santa Claus. Remake del film de la Fox «De ilusión también se vive» (Miracle on 34th Street) de 1947.</p>
<p><strong>Director:</strong> Les Mayfield · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Drama, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Mara Wilson, Richard Attenborough, Dylan McDermott, Elizabeth Perkins, J.T. Walsh, James Remar</p>
