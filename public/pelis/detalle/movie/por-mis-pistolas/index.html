<h1>Por mis pistolas</h1>
<p>Fidencio Barrenillo, un boticario en una aldea en la frontera norte de México descubre un título antiguo de una mina en Arizona y decide reclamarlos. Al Tratar de cruzar la frontera es interceptado por un guardia de frontera el cual exagera en la línea del deber. En el camino es capturado por una tribu de Apaches y está a punto de ser quemado vivo, pero gracias al Gran Jefe de la tribu el cual tiene dolor de muelas y descubre que Fidencio puede sanarlo, al sanarlo el jefe ordenó su liberación. Fidencio continuaria su camino y obtendría la eterna amistad del jefe apache.</p>
<p><strong>Director:</strong> Miguel M. Delgado · <strong>Año:</strong> 1968 · <strong>Géneros:</strong> Aventura, Comedia, Western</p>
<p><strong>Reparto:</strong> Cantinflas, Isela Vega, Gloria Coral, Quintín Bulnes, Rhea Frichina, Carlos Cardán</p>
