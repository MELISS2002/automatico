<h1>Sin City: La Ciudad del Pecado</h1>
<p>Bienvenidos a Sin City, ciudad de policías corruptos, atractivas damas y vigilantes desesperados. Algunos están buscando venganza, algunos redención, y otros, ambas cosas. Un universo de héroes inverosímiles que intentan hacer lo correcto. Sin City es una ciudad que vive entre la luz y la oscuridad, llena de personajes singulares. Está por ejemplo Marv (Mickey Rourke), un superviviente que busca vengar la muerte de su único amor. También está Dwight (Clive Owen), un investigador privado que intenta dejar sus problemas atrás. Después de que un policía sea asesinado, Dwight no parará ante nada para proteger a sus amigos. Finalmente, está la historia de Hartigan (Bruce Willis), el último policía honesto de Sin City, que va tras la pista de una joven en manos del sádico hijo de un senador&amp;#8230; con resultados inesperados.</p>
<p><strong>Director:</strong> Robert Rodriguez · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Crimen, Suspense</p>
<p><strong>Reparto:</strong> Bruce Willis, Jessica Alba, Clive Owen, Mickey Rourke, Rutger Hauer, Benicio del Toro</p>
