<p>El Secretario de Defensa David Brice (Gene Hackman) comete un crimen en un arrebato de furia. Para encubrir el escándalo, su fiel ayudante (Will Patton) hace que las sospechas recaigan sobre un espía ruso, y para encontrarlo recluta al comandante de marina Tom Farrell (Kevin Costner). A medida que la investigación avanza, Farrell descubre que todas las pistas lo inculpan directamente a él.</p>
