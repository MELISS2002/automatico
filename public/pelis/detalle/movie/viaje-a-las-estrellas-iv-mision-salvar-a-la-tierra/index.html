<h1>Viaje a las estrellas IV: Misión salvar a la Tierra</h1>
<p>William Shatner, Leonard Nimoy y el resto de la tripulación del USS Enterprise, alcanzan cotas muy elevadas en una de las más aplaudidas e intrigantes aventuras de la saga Star Trek. Estamos en el siglo XXIII y un misterioso poder alienígena amenaza la Tierra, evaporando los océanos y destruyendo la atmósfera. En un frenético intento para salvar a la humanidad, Kirk y su tripulación viajan en el tiempo y regresan al San Francisco de 1986, encontrándose con un mundo de punks, pizza y autobuses de cambio exacto que resultan ser tan alienígenas como todo lo que se han encontrado en los lugares más recónditos de la galaxia. Una misión emocionante y repleta de acción para la nave espacial Enterprise.</p>
<p><strong>Director:</strong> Leonard Nimoy · <strong>Año:</strong> 1986 · <strong>Géneros:</strong> Aventura, Ciencia ficción</p>
<p><strong>Reparto:</strong> William Shatner, Leonard Nimoy, DeForest Kelley, James Doohan, George Takei, Walter Koenig</p>
