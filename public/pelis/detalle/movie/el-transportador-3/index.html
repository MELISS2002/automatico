<h1>El Transportador 3</h1>
<p>Frank Martin (Jason Statham) es un indiscutible especialista en entregas de alto riesgo. En esta ocasión se verá obligado, bajo amenazas, a trasladar dos voluminosas bolsas y a una joven ucraniana, Valentina (Natalya Rudakova), desde Marsella hasta Odessa. ¿Qué hay en las bolsas? ¿quién es la chica? ¿qué hay detrás de esta entrega? Frank no conoce las respuestas, pero lo que realmente no sabe es la trampa que le ha tendido el adversario más despiadado y peligroso que nunca se ha encontrado&amp;#8230;</p>
<p><strong>Director:</strong> Olivier Megaton · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Jason Statham, Natalya Rudakova, François Berléand, Robert Knepper, Jeroen Krabbé, Alex Kobold</p>
