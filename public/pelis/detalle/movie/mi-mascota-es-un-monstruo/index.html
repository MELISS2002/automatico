<h1>Mi mascota es un monstruo</h1>
<p>El protagonista es Angus MacMorrow (Alex Etel), un solitario muchacho escocés que vive con el deseo de que su padre regrese de la guerra. Un día, Angus lleva a casa un extraño objeto que encuentra en la playa, se da cuenta muy pronto de que se trata de un huevo mágico y su fantasía se desborda: se imagina criando a un ser fabuloso: el «monstruo del lago Ness», uno de los mitos escoceses más populares. Intenta mantenerlo oculto y establecer con él un estrecho vínculo de amistad.</p>
<p><strong>Director:</strong> Jay Russell · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Alex Etel, Emily Watson, Ben Chaplin, David Morrissey, Priyanka Xi, Craig Hall</p>
