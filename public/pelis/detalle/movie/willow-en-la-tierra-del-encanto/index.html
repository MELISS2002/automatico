<h1>Willow en la tierra del encanto</h1>
<p>Temerosa de que una profecía declare que una niña nacerá para provocar su caída, la malvada Reina Bavmorda encarcela a todas las mujeres embarazadas dentro de la formidable fortaleza de Nockmaar. Una niña, Elora Danan, nace en las mazmorras de Nockmaar y es identificada como la niña profetizada por una marca de nacimiento en su brazo. Sin embargo, antes de que la hechicera negra llegue para reclamar al niño, la madre de Elora convence a su renuente partera a escapar con el bebé. Willow, un agricultor tímido y aspirante a hechicero, tiene la misión de librar al infante real del mal.</p>
<p><strong>Director:</strong> Ron Howard · <strong>Año:</strong> 1988 · <strong>Géneros:</strong> Acción, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> Warwick Davis, Val Kilmer, Joanne Whalley, Patricia Hayes, Gavan O&#x27;Herlihy, Phil Fondacaro</p>
