<h1>Rebuilding</h1>
<p>Rebuilding es un drama ambientado en el oeste estadounidense contemporáneo que sigue a Dusty, un vaquero que pierde su rancho a causa de un incendio forestal devastador. Obligado a refugiarse en un campamento de la FEMA, Dusty encuentra una comunidad entre otras víctimas que también han perdido sus hogares, incluyendo a su hija y su exesposa. La película explora la reconstrucción emocional y social mientras Dusty lucha por rehacer su vida, enfrentando heridas del pasado y redescubriendo la esperanza y la solidaridad en tiempos difíciles. Dirigida y escrita por Max Walker-Silverman, con una sensibilidad humana y un enfoque en la resiliencia y la comunidad, la película es un retrato íntimo y actual del impacto de la crisis ambiental y la fortaleza humana.</p>
<p><strong>Director:</strong> Max Walker-Silverman · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Josh O&#x27;Connor, Meghann Fahy, Lily LaTorre, Kali Reis, Amy Madigan, Jefferson Mays</p>
