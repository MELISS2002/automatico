<h1>13 fantasmas</h1>
<p>Arthur Kriticos y sus dos hijos, Kathy y Bobby, sólo se tienen los unos a los otros tras haberlo perdido todo. Jean, mujer de Arthur y madre de sus hijos, murió en un incendio que dejó al resto de la familia sin nada, hasta que de repente, Arthur hereda una extraña casa de su misterioso y excéntrico tío Cyrus. La casa está hecha de acero y de cristal y es una maravilla de la arquitectura moderna, con muchos espacios abiertos, impoluta y de líneas rectas. A Arthur y los chicos les cuesta creer su golpe de buena suerte, y al llegar a la nueva casa admiran la elegancia de sus paredes de cristal. Lo que no saben es que la casa de la luz guarda un oscuro secreto.</p>
<p><strong>Director:</strong> Steve Beck · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Suspense, Terror</p>
