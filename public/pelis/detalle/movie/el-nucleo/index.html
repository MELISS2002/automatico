<h1>El núcleo</h1>
<p>El geofísico Dr. Josh Keyes descubre que una fuerza desconocida ha causado que el núcleo interno de la tierra deje de girar. Con el campo magnético del planeta deteriorándose rápidamente, nuestra atmósfera literalmente comienza a desmoronarse con consecuencias catastróficas. Para resolver la crisis, Keyes, junto con un equipo de los científicos más dotados del mundo, viajan al corazón de la tierra. Su misión: detonar un dispositivo que reactive el núcleo.</p>
<p><strong>Director:</strong> Jon Amiel · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Aaron Eckhart, Hilary Swank, Delroy Lindo, Stanley Tucci, Tchéky Karyo, DJ Qualls</p>
