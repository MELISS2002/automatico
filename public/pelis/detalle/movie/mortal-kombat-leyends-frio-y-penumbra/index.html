<h1>Mortal Kombat Leyends: Frío y Penumbra</h1>
<p>El despiadado y sediento de poder Kano está decidido a conquistar el Reino de la Tierra de a un alma por vez. Acompañado de tres fríos mercenarios del clan Dragón Negro, ataca en forma brutal a todos los pueblos indefensos. La elección es simple: rendición o muerte. Kenshi, un guerrero rebelde, pide ayuda a Kuai Liang, el único con la fuerza suficiente para enfrentar al malevolente Kano. Pero los días de guerrero de Kuai Liang habían quedado atrás y Kenshi tiene muy poca disciplina como para derrotar a Kano sin ayuda. Si Kuai Liang no logra romper el glaciar de dudas que lo retiene, el Reino de la Tierra caerá. Hay mucho en juego, y ¡las posibles consecuencias nunca han sido tan nefastas!</p>
<p><strong>Director:</strong> Rick Morales · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Acción, Animación, Fantasía</p>
<p><strong>Reparto:</strong> Manny Jacinto, David Wenham, Artt Butler, Yuri Lowenthal, Sumalee Montano, Patrick Seitz</p>
