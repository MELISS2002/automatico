<p>Un grupo de jóvenes decide reabrir un antiguo campamento de verano, sin saber que el lugar está marcado por la leyenda de Popeye, el marinero. Al caer la noche, sucesos extraños comienzan a suceder, y los consejeros descubren que están siendo perseguidos por una figura implacable. Motivado por una sed de venganza, Popeye convierte el campamento en un escenario de terror donde cada uno deberá luchar para sobrevivir.</p>
