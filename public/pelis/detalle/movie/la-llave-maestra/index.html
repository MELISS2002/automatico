<h1>La llave maestra</h1>
<p>Después de abandonar su trabajo de enfermera en una clínica, Caroline (Hudson) es contratada para cuidar de un anciano que ha sufrido una embolia, aunque la esposa de éste (Rowlands) la acoge con bastante recelo. El matrimonio vive en una siniestra mansión sureña en las afueras de Nueva Orleáns, en el delta del Mississippi (Louisiana). Intrigada por las extrañas costumbres de la enigmática pareja, Caroline decide explorar la casa. Armada con una llave maestra, empieza a abrir todas las puertas hasta que descubre un desván secreto que contiene un terrible secreto.</p>
<p><strong>Director:</strong> Iain Softley · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Drama, Misterio, Suspense, Terror</p>
<p><strong>Reparto:</strong> Kate Hudson, Gena Rowlands, Peter Sarsgaard, John Hurt, Joy Bryant, Marion Zinser</p>
