<h1>Quiero comerme tu páncreas</h1>
<p>Haruki es un misterioso y solitario estudiante de secundaria al que le encanta la lectura, ocupando casi todo su tiempo en la lectura y trabajando en la biblioteca, un día encuentra un libro de bolsillo en el hospital. Su título es «Viviendo con la Muerte». Resulta ser el diario de una compañera de clase, llamada Sakura Yamauchi, una chica de 17 años muy alegre y vivaz a la que le encanta pasar el tiempo con sus amigos y le gusta bromear, ella escribe en su diario que, debido a su enfermedad pancreática, le quedan sólo unos cuantos meses de vida. Esto sorprende e intriga profundamente a Haruki, ya que Sakura nunca le ha revelado a nadie su estado, esto hace que surja una amistad entre ellos muy especial, desvelando la difícil circunstancia por la que atraviesa Sakura no sólo en relación a su enfermedad, sino también a otros factores que convierten su día a día en una cruel pesadilla.</p>
<p><strong>Director:</strong> 牛嶋新一郎 · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Animación, Drama, Romance</p>
<p><strong>Reparto:</strong> 高杉真宙, Lynn, 藤井ゆきよ, 内田雄馬, 福島潤, Atsuko Tanaka</p>
