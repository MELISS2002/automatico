<h1>Ricky Ricón</h1>
<p>Ricky Ricón es el niño más rico del mundo; tiene su propio parque de atracciones, un Burguer en su casa y su profesora de gimnasia es la mismísima Claudia Schiffer. Richie tiene además el amor de sus padres, pero no es feliz; echa de menos jugar al béisbol en la calle con los chicos del barrio. Cuando sus padres desaparecen en el Triángulo de las Bermudas, el muchacho sospecha que detrás de la desaparición se encuentra Laurence Van Dogh, un ejecutivo de Industrias Richie que pretende hacerse con la compañía asesinando a sus padres. Sin embargo, Richie y su nueva pandilla de chiflados amiguetes no están dispuestos a rendirse a la primera&amp;#8230; son capaces de cualquier travesura y la fuerza de la amistad es muy poderosa. Con su ayuda intentará liberar a sus padres y salvar la compañía.</p>
<p><strong>Director:</strong> Donald Petrie · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Comedia, Familia</p>
<p><strong>Reparto:</strong> Macaulay Culkin, John Larroquette, Edward Herrmann, Christine Ebersole, Jonathan Hyde, Michael Maccarone</p>
