<h1>En nombre de la ley</h1>
<p>Pasando por la ciudad de Bannock, un grupo de ganaderos borrachos va por la borda con su celebración y por casualidad mata a un anciano con un tiro vago. Vuelven a casa hasta el sábado inconsciente de su muerte. El oficial de policía de Bannock Jered Maddox más tarde llega allá para detener a cada uno implicado bajo acusación del asesinato. El sábado es dirigido por el barón de la tierra Vince Bronson, un déspota benévolo, que, para oír de la muerte, ofrece la restitución para el incidente.</p>
<p><strong>Director:</strong> Michael Winner · <strong>Año:</strong> 1971 · <strong>Géneros:</strong> Western</p>
<p><strong>Reparto:</strong> Burt Lancaster, Robert Ryan, Lee J. Cobb, Robert Duvall, Sheree North, Albert Salmi</p>
