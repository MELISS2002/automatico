<h1>El brujo y la serpiente blanca</h1>
<p>La historia de la película se basa en la leyenda china y se centra en un joven estudiante (Raymond Lam) que se enamora de una bella mujer (Huang Shengyi), sin saber que ella es una serpiente blanca que ha tomado forma humana. Un monje llamado Fahai (Jet Li) interviene para salvar el alma de joven encerrando a la serpiente blanca en un pozo profundo. Nuevo remake de un clásico de la Shaw Brothers. La cinta original de 1962, White Snake, ya tuvo una adaptación en 1993 titulada Green Snake que dirigio Tsui Hark y protagonizó entre otros, Maggie Cheung.</p>
<p><strong>Director:</strong> 程小東 · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Acción, Fantasía</p>
<p><strong>Reparto:</strong> 李连杰, 文章, 林峯, 黄圣依, 蔡卓妍, 徐若瑄</p>
