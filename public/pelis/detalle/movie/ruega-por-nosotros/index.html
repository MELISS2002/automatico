<h1>Ruega Por Nosotros</h1>
<p>Alice, una joven con problemas de audición que, tras una supuesta visita de la Virgen María, es inexplicablemente capaz de oír, hablar y curar a los enfermos. A medida que se corre la voz y la gente de cerca y de lejos acude a presenciar sus milagros, un periodista caído en desgracia que espera reavivar su carrera visita el pequeño pueblo de Nueva Inglaterra para investigar. Cuando comienzan a producirse sucesos aterradores a su alrededor, empieza a preguntarse si estos fenómenos son obra de la Virgen María o de algo mucho más siniestro.</p>
<p><strong>Director:</strong> Kim Berner · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Misterio, Terror</p>
<p><strong>Reparto:</strong> Jeffrey Dean Morgan, Cricket Brown, William Sadler, Katie Aselton, Cary Elwes, Diogo Morgado</p>
