<h1>Tomb Raider: Las aventuras de Lara Croft</h1>
<p>Lara Croft es una joven e inexperta arqueóloga que se embarcará en su primera aventura para terminar la investigación arqueológica iniciada por su padre, y descubrir así antiguos secretos con el fin de limpiar el deshonrado nombre de su progenitor. Esta expedición llena de peligros será una lucha por la supervivencia, con nuevas pruebas y nuevos enemigos, en la que Croft, poco a poco, se irá convirtiendo en la heroína que todos conocemos. La historia de una mujer corriente que descubre su carácter de luchadora al verse obligada a poner a prueba sus habilidades de lucha con el único propósito de salir con vida.</p>
<p><strong>Director:</strong> G.A. Aguilar · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Aventura, Fantasía</p>
