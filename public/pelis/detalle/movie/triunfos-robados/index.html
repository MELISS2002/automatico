<h1>Triunfos Robados</h1>
<p>Historia sobre una competición de «cheerleaders». Las animadoras del equipo de los «Toro» tienen una coreografía explosiva para hacerse con el trofeo del campeonato nacional. Pero para la nueva capitana el camino a la victoria se tuerce cuando descubre que esta misma coreografía ha sido robada de las animadoras de los «Clover» por la capitana previa. Mientras que ellas desesperadamente buscan una nueva coreografía, las «Clover», con Isis al mando, tienen sus propios problemas: deben conseguir bastante dinero para cubrir los gastos de desplazamiento al campeonato. La tensión sube, el tiempo se agota y ambas capitanas dejan sus equipos exhaustos. Sólo uno puede llevar el trofeo a casa, que ganen las que mejor se menean.</p>
<p><strong>Director:</strong> Peyton Reed · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Kirsten Dunst, Eliza Dushku, Jesse Bradford, Gabrielle Union, Sherry Hursey, Holmes Osborne</p>
