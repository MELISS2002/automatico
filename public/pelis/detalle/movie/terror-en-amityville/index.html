<h1>Terror en Amityville</h1>
<p>Basada en un suceso real. El 14 de noviembre de 1974 en Long Island, Nueva York, la policía recibió una escalofriante llamada telefónica que les condujo a una espantosa escena de un crimen en una residencia en Amityville. Una familia había sido asesinada en sus propias camas. En los siguientes días, Ronald Defeo confesó que él mismo había disparado a sus padres mientras dormían, culpando a unas voces que le decían que debía matarlos. Un año después, George y Kathy Lutz y sus tres hijos se mudan a la misma casa, creyendo que se trata del hogar de sus sueños. Pero poco después de haberse mudado, extrañas situaciones empiezan a suceder, mientras George comienza a ser atormentado por las voces que existen en la casa.</p>
<p><strong>Director:</strong> Andrew Douglas · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Ryan Reynolds, Melissa George, Jesse James, Jimmy Bennett, Chloë Grace Moretz, Rachel Nichols</p>
