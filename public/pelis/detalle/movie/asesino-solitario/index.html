<h1>Asesino solitario</h1>
<p>Después de que su socio haya sido violentamente asesinado por el temido asesino profesional Rogue, el agente del FBI Jack Crawford jura dar caza al esquivo criminal y encargarse personalmente de la venganza de su compañero. Sin embargo, Rogue demuestra ser muy bueno en el arte de desaparecer sin rastro, y no es hasta que han transcurrido tres años que se le vuelve a ver, encendiendo la mecha de una sangrienta guerra entre el líder de las mafias chinas, Chang, y el jefe de los yakuza, Shiro. Ansioso por capturar a Rogue de una vez por todas, Crawford mete a su equipo especial en el meollo del conflicto. No obstante, la sed de sangre de Crawford nubla su juicio profesional, y según se acentúa la violencia, Crawford por fin se encuentra cara a cara con su enemigo para descubrir que nada es lo que parece en lo que respecta a Rogue o a su propio plan.</p>
<p><strong>Director:</strong> Philip G. Atwell · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> 李连杰, Jason Statham, John Lone, 石橋凌, Devon Aoki, 鄭浩南</p>
