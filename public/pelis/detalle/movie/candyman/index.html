<h1>Candyman</h1>
<p>Desde tiempos inmemoriales, los proyectos residenciales del barrio de Cabrini Green en Chicago se han visto amenazados por la historia de un supuesto asesino en serie con un gancho por mano al que se invoca fácilmente repitiendo su nombre cinco veces frente a un espejo. Hoy, una década después de que la última torre de Cabrini fuese derruída, el artista visual Anthony McCoy (Yahya Abdul-Mateen) y su novia Brianna Cartwright (Teyonah Parris), se mudan a un apartamento de lujo de un barrio ahora irreconocible, repleto de millennials y de personas que, por lo general, desconocen su oscuro pasado; Secuela espiritual del clásico slasher del productor Jordan Peele.</p>
<p><strong>Director:</strong> Nia DaCosta · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Yahya Abdul-Mateen II, Teyonah Parris, Colman Domingo, Nathan Stewart-Jarrett, Kyle Kaminsky, Vanessa Williams</p>
