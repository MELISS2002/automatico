<h1>Heavy Metal 2000</h1>
<p>Animación para adultos de ciencia ficción y fantasía donde un minero llamado Tyler se apodera de un fragmento del malvado orbe Loc-Nar, poseyendolo con una insaciable sed de poder e inmortalidad. En su camino, arrasa con una colonia espacial y secuestra a una hermosa joven. Su único error es dejar con vida a su hermana, Julie, quien emprende una letal misión de rescate y venganza. Esta aventura futurista se desarrolla en el planeta F.A.K.K.², mezclando acción, violencia y un estilo visual oscuro al ritmo de la música heavy metal.</p>
<p><strong>Director:</strong> Michael Coldewey · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Acción, Animación, Aventura, Ciencia ficción, Fantasía</p>
<p><strong>Reparto:</strong> Michael Ironside, Julie Strain, Billy Idol, Pier Paquette, Sonja Ball, Brady Moffatt</p>
