<h1>Juventud</h1>
<p>Fred Ballinger (Michael Caine), un gran director de orquesta, pasa unas vacaciones en un hotel de los Alpes con su hija Lena y su amigo Mick, un director de cine al que le cuesta acabar su última película. Fred hace tiempo que ha renunciado a su carrera musical, pero hay alguien que quiere que vuelva a trabajar; desde Londres llega un emisario de la reina Isabel, que debe convencerlo para dirigir un concierto en el Palacio de Buckingham, con motivo del cumpleaños del príncipe Felipe.</p>
<p><strong>Director:</strong> Paolo Sorrentino · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
