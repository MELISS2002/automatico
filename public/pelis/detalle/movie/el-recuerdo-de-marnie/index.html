<h1>El recuerdo de Marnie</h1>
<p>Una historia sobre un fantasma evocador con verdades que contar sobre la amistad, las relaciones familiares y la soledad. Anna vive con sus padres adoptivos, es un verso suelto solitario, siempre pensando en las musarañas. En verano, sus padres deciden enviarle a Norfolk para quedarse con el anciano matrimonio Pegg, donde recorre las dunas cerca del mar. Mientras juega en el agua encuentra una casa, la Casa del Pantano, la cual a Anna le resulta familiar. En la casa se encuentra con una niña enigmática llamada Marnie, que se convierte en la primera amiga de Anna. Pero un día, Marnie desaparece.</p>
<p><strong>Director:</strong> 米林宏昌 · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Animación, Drama, Familia</p>
<p><strong>Reparto:</strong> 高月彩良, 有村架純, 松嶋菜々子, 寺島進, 根岸季衣, 森山良子</p>
