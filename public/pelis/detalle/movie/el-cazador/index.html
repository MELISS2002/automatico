<h1>El Cazador</h1>
<p>Diez años después de la caída de la economía occidental, las minas australianas continúan en actividad y atraen a los hombres más desesperados e incluso los más peligrosos. En medio de una sociedad moribunda, sobrevivir es una combata de cada día y no hay leyes. Eric abandonó todo. Ahora es un vagabundo, un hombre solo, un hombre amargado. Cuando una pandilla le roba lo único que le queda, su coche, decide perseguir a sus miembros. Para encontrarlos, sólo puede contar con Rey, un antiguo miembro de la banda, abandonado por sus amigos cuando recibió una herida. Los dos hombres están obligados a hacer equipo y emprenden un recorrido lleno de sorpresas.</p>
<p><strong>Director:</strong> David Michôd · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Crimen, Drama</p>
<p><strong>Reparto:</strong> Guy Pearce, Robert Pattinson, Scoot McNairy, David Field, Susan Prior, Anthony Hayes</p>
