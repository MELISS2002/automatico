<h1>El escuadrón anti-monstruos</h1>
<p>En los Estados Unidos hay una gran afición al cine fantástico, incluso entre los más jóvenes y entre ellos hay un grupo de jóvenes fans de los monstruos del cine de terror del cine clásico, Monster Squad, cuyos conocimientos de cine pueden ser la clave para salvar el mundo. Porque Drácula en compañía del monstruo de Frankenstein, el Hombre-lobo, la Criatura de la Laguna Negra y la Momia, han llegado a Norteamérica y se dirigen a su pueblo en busca de un antiguo amuleto que les permita dominar la Tierra. La última línea de defensa ante este terrorífico reto son estos chicos que conocen cómo el agua bendita o la plata pueden acabar con varios de estos monstruos.</p>
<p><strong>Director:</strong> Fred Dekker · <strong>Año:</strong> 1987 · <strong>Géneros:</strong> Acción, Comedia, Fantasía</p>
<p><strong>Reparto:</strong> André Gower, Robby Kiger, Stephen Macht, Duncan Regehr, Tom Noonan, Brent Chalem</p>
