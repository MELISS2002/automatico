<h1>Los Tres Mosqueteros</h1>
<p>Los tres mosqueteros. Son conocidos como Athos, Porthos y Aramis, tres guerreros de élite que sirven al rey de Francia como sus mejores mosqueteros. Tras descubrir una malévola conspiración para derrocar al rey, los mosqueteros se cruzan con un joven que aspira a convertirse en héroe, D’Artagnan, y lo toman bajo su tutela. Juntos, los cuatro emprenden una peligrosa misión para frustrar el complot que amenaza no solo a la Corona de Francia, sino al futuro de la propia Europa.</p>
<p><strong>Director:</strong> Paul W. S. Anderson · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Acción, Aventura, Suspense</p>
<p><strong>Reparto:</strong> Logan Lerman, Milla Jovovich, Matthew Macfadyen, Ray Stevenson, Luke Evans, Gabriella Wilde</p>
