<h1>El Último Duelo</h1>
<p>Ambientada en Francia, en 1386, cuenta el enfrentamiento entre el caballero Jean de Carrouges y el escudero Jacques LeGris , al acusar el primero al segundo de abusar de su esposa, Marguerite de Carrouges. El Rey Carlos VI decide que la mejor forma de solucionar el conflicto es un duelo a muerte. El que venza será el ganador, sin embargo, si lo hace el escudero, la esposa del caballero será quemada como castigo por falsas acusaciones.</p>
<p><strong>Director:</strong> Ridley Scott · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Acción, Drama, Historia, Suspense</p>
<p><strong>Reparto:</strong> Matt Damon, Adam Driver, Jodie Comer, Ben Affleck, Harriet Walter, Marton Csokas</p>
