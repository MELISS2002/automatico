<h1>Starship Troopers</h1>
<p>Johnny, Carmen, Dizzy y Ace son cuatro jóvenes amigos que finalizan el instituto y hacen planes para el futuro. En él domina el espacio como el lugar más apetecible para aprender un oficio y trabajar. La Tierra se halla en guerra con una raza de insectos alienígenas gigantes, y los cuatro amigos estudiarán disciplinas para destruirlos. Pero cada uno irá a una unidad diferente, según sus capacidades. Johnny se ve separado de su novia, Carmen, ya que él tiene que ir a infantería. El día que Johnny decide marcharse del ejército, los insectos arrasan su ciudad natal. Es la guerra.</p>
<p><strong>Director:</strong> Paul Verhoeven · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Suspense</p>
