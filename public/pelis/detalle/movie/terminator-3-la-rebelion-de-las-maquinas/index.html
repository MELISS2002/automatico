<h1>Terminator 3: La rebelión de las máquinas</h1>
<p>Ha pasado una década desde que John Connor -Nick Stahl- salvara a la humanidad de la destrucción. En la actualidad John tiene 25 años y vive en la clandestinidad: no hay ninguna prueba documental de su existencia. Así evita ser rastreado por Skynet -la sofisticada corporación de máquinas que una vez intentó acabar con su vida-. Pero, ahora, desde el futuro, ha sido enviado el T-X (Kristanna Loken), la máquina destructora cyborg más desarrollada de Skynet. Su misión es completar el trabajo que no pudo terminar su predecesor, el T-1000. El T-X es una máquina tan implacable como bello su aspecto humano. Ahora la única esperanza de sobrevivir para Connnor es Terminator.</p>
<p><strong>Director:</strong> Jonathan Mostow · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Acción, Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Arnold Schwarzenegger, Nick Stahl, Claire Danes, Kristanna Loken, Earl Boen, David Andrews</p>
