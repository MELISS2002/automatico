<h1>Un rubio</h1>
<p>Juan, joven y mujeriego, vive en los suburbios de Buenos Aires. Debe encontrar rápidamente un compañero de piso porque su hermano se ha ido. Entra a vivir con él Gabriel, compañero de trabajo tranquilo, guapo y&amp;#8230; rubio. Viudo desde hace poco, está luchando por mantener a su hija todavía pequeña. Tímido y reservado, Gabo intenta no hacer caso de las miradas cargadas de sentido de Juan ni del roce de sus manos. Con todas las chicas guapas que entran y salen de su habitación, su “virilidad” no parece cuestionable. Sin embargo, la atracción entre los dos hombres es innegable y lo que empieza como algo puramente sexual y fácil, al vivir ya juntos, se convierte pronto en una fascinante relación de ternura e intimidad, tan dulce como desgarradora.</p>
<p><strong>Director:</strong> Marco Berger · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Gaston Re, Alfonso Barón, Malena Irusta, Ailín Salas, Franco Heiler, Fred Raposo</p>
