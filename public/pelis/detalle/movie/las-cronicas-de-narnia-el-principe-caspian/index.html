<h1>Las crónicas de Narnia: El príncipe Caspian</h1>
<p>La acción de «Las crónicas de Narnia. El Príncipe Caspian» transcurre un año después de los increíbles acontecimientos de «El León, la Bruja y el Armario», cuando los reyes y las reinas de Narnia -los 4 hermanos Pevensie- vuelven a reunirse en ese remoto y fantástico mundo, donde descubrirán que han pasado más de 1.300 años, calculados en tiempo narniano. Durante su ausencia, la Edad de Oro de Narnia ha terminado, y los Telmarinos han conquistado el reino de Narnia, que ahora está dominado por el malvado Rey Miraz, que gobierna sin piedad. Los cuatro niños no tardarán en conocer un nuevo y extraño personaje: el joven Príncipe Caspian, heredero legítimo al trono que se ha visto obligado a esconderse ya que su tío Miraz trama su asesinato para colocar a su hijo recién nacido en el trono.</p>
<p><strong>Director:</strong> Andrew Adamson · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> William Moseley, Anna Popplewell, Skandar Keynes, Georgie Henley, Ben Barnes, Tilda Swinton</p>
