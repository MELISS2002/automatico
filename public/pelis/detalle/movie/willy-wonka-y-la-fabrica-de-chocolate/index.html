<h1>Willy Wonka y la fábrica de chocolate</h1>
<p>Willy Wonka es el excéntrico dueño de una gran fábrica de caramelos. Un día decide ofrecer a cinco niños una entrada dorada que les permitirá recorrer la dulce fábrica. Uno de los ganadores es Charlie Bucket, un niño pobre de buen corazón que espera un futuro mejor para él, para su madre y sus cuatro abuelos. Los otros ganadores resultan ser cuatro insoportables niños.</p>
<p><strong>Director:</strong> Mel Stuart · <strong>Año:</strong> 1971 · <strong>Géneros:</strong> Comedia, Familia, Fantasía</p>
