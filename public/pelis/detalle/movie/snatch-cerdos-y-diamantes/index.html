<h1>Snatch: Cerdos y diamantes</h1>
<p>Franky es un ladrón de diamantes que tiene que entregar un valioso ejemplar a su jefe Avi, pero, antes de hacerlo, se deja convencer por un tal Boris para apostar en un combate ilegal de boxeo. En realidad, se trata de una trampa para arrebatarle el diamante. Cuando Avi se entera, contrata a Tony para encontrar a Franky y al diamante. Descubierto el triste destino de Franky, la recuperación de la gema desaparecida provoca una situación caótica, donde el engaño, el chantaje y el fraude se mezclan de forma sangrienta con perros, diamantes, boxeadores y gran variedad de armas.</p>
<p><strong>Director:</strong> Guy Ritchie · <strong>Año:</strong> 2000 · <strong>Géneros:</strong> Comedia, Crimen</p>
<p><strong>Reparto:</strong> Jason Statham, Alan Ford, Stephen Graham, Brad Pitt, Dennis Farina, Robbie Gee</p>
