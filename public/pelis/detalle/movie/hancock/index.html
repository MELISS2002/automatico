<h1>Hancock</h1>
<p>Un desaliñado superhéroe llamado Hancock protege a los ciudadanos de Los Ángeles, pero provoca grandes daños colaterales después de realizar sus actos heroicos. Eso está bien con Hancock; a él no le importa lo que la gente piense y se le puede encontrar descansando en la banca de un parque, como salvando a una damisela en apuros. pero cuando salva la vida de un ejecutivo y conoce a su hermosa esposa, descubre que también tiene sentimientos.</p>
