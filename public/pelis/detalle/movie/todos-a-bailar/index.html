<h1>Todos a bailar</h1>
<p>Ren (Kevin Bacon), un adolescente recién llegado de Chicago, se ha mudado con su familia a un pequeño pueblo del medio oeste donde el estricto pastor Shaw Moore (John Lithgow) ha prohibido el baile a los jóvenes. Pero Ren, que además de rebelde es un entusiasta de la música, intentará por todos los medios acabar con esa prohibición, al tiempo que se enamora de Ariel (Lori Singer), la hija de Moore.</p>
<p><strong>Director:</strong> Herbert Ross · <strong>Año:</strong> 1984 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Kevin Bacon, Lori Singer, John Lithgow, Dianne Wiest, Chris Penn, Sarah Jessica Parker</p>
