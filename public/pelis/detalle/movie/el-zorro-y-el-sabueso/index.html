<h1>El Zorro y el Sabueso</h1>
<p>La aventura y la diversión de este clásico de la Disney comienzan cuando una adorable viuda adopta un precioso cachorro de zorro llamado Tod. El travieso zorro pronto se encuentra con Toby, un adorable cachorro de perro de caza. Así se hace los dos inseparables amigos&amp;#8230; sin saber que por su naturaleza deberían ser enemigos. Bajo la mirada vigilante de Mamá Búho, Tod y Toby juegan y se divierten en el bosque, inconscientes de que en el futuro tendrán que enfrentarse y poner su amistad a prueba.</p>
<p><strong>Director:</strong> Ted Berman · <strong>Año:</strong> 1981 · <strong>Géneros:</strong> Animación, Aventura, Drama, Familia</p>
<p><strong>Reparto:</strong> Mickey Rooney, Kurt Russell, Pearl Bailey, Jack Albertson, Sandy Duncan, Jeanette Nolan</p>
