<h1>Un secreto mágico</h1>
<p>Van, un joven hada de los dientes con espíritu rebelde, sueña con descubrir qué hay más allá de los límites de su estricta y aislada civilización. Su mundo cambia para siempre cuando conoce a Rupee, el trol más adorable del mundo, y a Gemma, una ingeniosa goblin apasionada por la ciencia. A pesar de los prejuicios que han separado a sus pueblos durante generaciones, los tres emprenden una misión épica para unir sus reinos mágicos y demostrar que la amistad puede derribar cualquier frontera. Pero la temible Reina Araña y sus secuaces no piensan ponérselo fácil, y tratarán de detenerlos a toda costa.</p>
<p><strong>Director:</strong> Michael Johnson · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Animación, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Booboo Stewart, Jailen Bates, Larkin Bell, Mary Deaton, Fran Drescher, Jon Lovitz</p>
