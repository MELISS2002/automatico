<h1>El regalo prometido</h1>
<p>Howard Langston es un atareado hombre de negocios que llega tarde a la clase de karate de su hijo Jamie. Para que le perdone le promete que le regalará lo que le pida por navidad: Jamie le pide un muñeco Turboman. El problema es que el juguete es el más popular y está agotado en todas las jugueterías. Con sólo unas pocas horas para Navidad, Howie inicia una cómica odisea por toda la ciudad a la caza y captura del preciado objeto.</p>
<p><strong>Director:</strong> Brian Levant · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> Arnold Schwarzenegger, Sinbad, Phil Hartman, Rita Wilson, Robert Conrad, Martin Mull</p>
