<h1>Linterna Verde: Primer Vuelo</h1>
<p>El piloto de prueba Hal Jordan es reclutado para unirse a una sociedad llamada “Linterna Verde Corporación”, luego de la puerta de su predecesor Abin Sur. Tras aceptar la misión, es llamado a entrenar bajo la supervisión de un maestro llamado Siniestro. El nuevo recluta descubre que su mentor es en realidad una parte centrar de una conspiración secreta que amenaza las filosofías, tradiciones y herencia de la corporación de linternas verdes.</p>
<p><strong>Director:</strong> Lauren Montgomery · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Acción, Animación, Aventura, Ciencia ficción, Fantasía</p>
