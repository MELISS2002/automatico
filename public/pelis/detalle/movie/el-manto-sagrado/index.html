<h1>El manto sagrado</h1>
<p>Siglo I d.C. En la Roma de Tiberio, el joven y noble Marcelo Galio encuentra en una subasta de esclavos a la bella Diana, enamorada de él desde que eran niños, y ahora pupila del emperador. Marcelo se enfrenta en una violenta puja con Calígula, hijo y sucesor de Tiberio, y consigue quitarle al esclavo griego Demetrio. Enterado el emperador de la disputa, castiga a Marcelo enviándolo a Palestina en calidad de tribuno. Cuando llega, Poncio Pilato acaba de condenar a Cristo a morir en la cruz.</p>
<p><strong>Director:</strong> Henry Koster · <strong>Año:</strong> 1953 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Richard Burton, Jean Simmons, Victor Mature, Richard Boone, Leon Askin, Michael Rennie</p>
