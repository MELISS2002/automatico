<h1>Se les subieron los humos</h1>
<p>Las superestrellas del rap multiplatino Redman y Method Man interpretan a Jamal y Silas, dos chicos normales que fuman algo mágico, as en sus exámenes de ingreso a la universidad y terminan en Harvard. Las formas de la Ivy League son extrañas, pero Silas y Jamal lo toman con calma, hasta que su suministro de humo sobrenatural se agota. Es entonces cuando tienen que comenzar a vivir de acuerdo con su ingenio y confiar en sus recursos naturales para alcanzar la calificación.</p>
<p><strong>Director:</strong> Jesse Dylan · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Method Man, Redman, Obba Babatundé, Mike Epps, Anna Maria Horsford, Fred Willard</p>
