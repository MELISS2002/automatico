<h1>La Dama de Negro</h1>
<p>Arthur Kipps es un joven abogado cuya empresa lo envía a un lugar remoto para vender la casa de un cliente que acaba de fallecer. La gestión, aparentemente rutinaria, tropieza con ciertas dificultades: los vecinos se muestran reacios a hablar sobre la casa o a acercarse a ella; además, nadie está dispuesto a admitir la existencia de una mujer de negro que él está seguro de haber visto.</p>
<p><strong>Director:</strong> James Watkins · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Drama, Suspense, Terror</p>
