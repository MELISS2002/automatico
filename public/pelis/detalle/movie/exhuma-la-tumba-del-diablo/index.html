<h1>Exhuma: La Tumba Del Diablo</h1>
<p>Una renombrada chamana (Kim Go-eun) y su aprendiz son contratados por una enigmática familia adinerada para investigar la enfermedad sobrenatural que afecta a su hijo primogénito. Con la ayuda de un embalsamador y el experto en feng shui más famoso del país (Choi Min-sik), rastrean una tumba familiar oculta, ubicada en tierra sagrada. Percibiendo un aura ominosa alrededor del lugar, el equipo opta por exhumar y reubicar los restos ancestrales de inmediato. Pero algo mucho más oscuro emerge en la remota montaña, desatando fuerzas sobrenaturales que amenazan con destruirlos a todos.</p>
<p><strong>Director:</strong> 장재현 · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Misterio, Suspense, Terror</p>
<p><strong>Reparto:</strong> 최민식, 김고은, 유해진, 이도현, 김재철, 전진기</p>
