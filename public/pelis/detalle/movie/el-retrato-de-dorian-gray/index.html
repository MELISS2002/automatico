<h1>El Retrato de Dorian Gray</h1>
<p>Dorian Gray (Ben Barnes) es un joven aristócrata muy atractivo que, después de haber pasado una solitaria adolescencia en el campo, regresa a Londres, donde ha heredado una mansión. Atraído por la vida nocturna, se sumerge en ella de la mano de Lord Henry Wottom (Colin Firth), que lo conduce a los antros más recónditos y sórdidos de la ciudad. Al joven le fascina el estilo de vida decadente y amoral de Wotton. Por otra parte, su obsesión por alcanzar la eterna juventud lo impulsa a hacer un pacto diabólico: él se mantendrá siempre joven, pero las huellas de su degradación física y moral se reflejarán en un retrato que le ha hecho su amigo el pintor Basil Hallward (Ben Chaplin). Cuando la obsesión de Gray se sale de control, sus intentos desesperados por salvaguardar su secreto convierten su vida, alguna vez privilegiada, en un infierno viviente. Adaptación de la novela de 1890 de Oscar Wilde &amp;#8216;El retrato de Dorian Gray&#x27;.</p>
<p><strong>Director:</strong> Oliver Parker · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Drama, Fantasía, Suspense</p>
<p><strong>Reparto:</strong> Ben Barnes, Colin Firth, Rebecca Hall, Emilia Fox, Ben Chaplin, Fiona Shaw</p>
