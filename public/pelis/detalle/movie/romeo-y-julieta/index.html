<h1>Romeo y Julieta</h1>
<p>En la ciudad de Verona, dos familias tienen una prolongada y vieja disputa. Los Montesco y los Capuleto coexisten bajo la mirada severa del príncipe, pero el odio entre las familias lo amenaza todo, en particular a los niños. Pero cuando el joven Romeo, un Montesco, ve por primera vez a Julieta, la virginal hija Capuleto, ninguna enemistad entre las familias puede evitar que él se enamore de ella, y ella de él.</p>
<p><strong>Director:</strong> Carlo Carlei · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> Hailee Steinfeld, Douglas Booth, Tomas Arana, Christian Cooke, Damian Lewis, Natascha McElhone</p>
