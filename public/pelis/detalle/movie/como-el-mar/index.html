<h1>Como el mar</h1>
<p>Azul y Paula acaban de perder a su mamá. La hermana mayor decide cremar el cuerpo, pero Azul no se conforma y busca dinero para costear un entierro. Revisando los cajones descubre una foto reveladora: Paula en realidad no es su hermana sino su mamá. Azul entra en shock y quiere saber sobre su padre. Paula le cuenta que fue un romance de adolescencia, cuando escapó a Cabo Polonio. El deseo de Azul por conocerlo y la culpa de Paula por la mentira, les hará emprender un viaje a Uruguay.</p>
<p><strong>Director:</strong> Nicolás Gil Lavedra · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Drama</p>
