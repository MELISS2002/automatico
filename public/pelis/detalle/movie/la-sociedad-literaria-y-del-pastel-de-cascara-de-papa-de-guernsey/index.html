<h1>La sociedad literaria y del pastel de cáscara de papa de Guernsey</h1>
<p>Julie Ashton (Kate Winslet, Revolutionary Road) trabaja como escritora de columnas humorísticas sobre la Segunda Guerra Mundial en Londres. Un día, comienza a intercambiar correspondencia con un hombre de la Isla de Guernsey, en el canal de la Mancha. Éste, ante la ocupación nazi, ha formado un club de lectura como tapadera de la resistencia. Poco a poco, Julie va entablando amistad con los integrantes del grupo, mientras éstos le cuentan cómo se formó su sociedad (conocida como La Sociedad Literaria y el Pastel de Piel de Patata de Guernsey), cuáles son sus lecturas favoritas, cómo es su vida tras la trágica batalla… Finalmente, la escritora decide visitar el lugar para ayudar a los isleños a compartir sus historias, sus aventuras, sus tragedias, sus romances….</p>
<p><strong>Director:</strong> Mike Newell · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Drama, Historia, Romance</p>
<p><strong>Reparto:</strong> Lily James, Jessica Brown Findlay, Matthew Goode, Michiel Huisman, Katherine Parkinson, Glen Powell</p>
