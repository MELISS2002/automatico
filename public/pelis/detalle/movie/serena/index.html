<h1>Serena</h1>
<p>Años 20. George y Serena son un apasionado matrimonio de recién casados que se trasladan de Boston a las montañas del norte de Carolina para montar un negocio maderero. George ya está acostumbrado a vivir en el campo, pero para Serena se trata de un hábitat completamente nuevo. A pesar de ello, pronto demuestra que está a la altura de las circunstancias. Pero la vida de la pareja comienza a resquebrajarse cuando Serena se entera de que nunca podrá tener hijos.</p>
<p><strong>Director:</strong> Susanne Bier · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Drama</p>
