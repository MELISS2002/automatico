<h1>La Isla Siniestra</h1>
<p>En el verano de 1954, los agentes judiciales Teddy Daniels (DiCaprio) y Chuck Aule (Ruffalo) son destinados a una remota isla del puerto de Boston para investigar la desaparición de una peligrosa asesina (Mortimer) que estaba recluida en el hospital psiquiátrico Ashecliffe, un centro penitenciario para criminales perturbados dirigido por el siniestro doctor John Cawley (Kingsley). Pronto descubrirán que el centro guarda muchos secretos y que la isla esconde algo más peligroso que los pacientes.</p>
<p><strong>Director:</strong> Martin Scorsese · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Drama, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Leonardo DiCaprio, Mark Ruffalo, Ben Kingsley, Max von Sydow, Michelle Williams, Emily Mortimer</p>
