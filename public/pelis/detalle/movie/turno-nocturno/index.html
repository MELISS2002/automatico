<h1>Turno nocturno</h1>
<p>En los pasillos oscuros de un hospital, deambula el fantasma de una enfermera conocida como «La planchada», famosa por su aspecto impecable. Mientras los pacientes creen que ella está ahí para ayudarlos, las enfermeras y doctores conocen la verdad: deben seguir sus reglas al pie de la letra. «Que nada se te olvide. No te distraigas. No te relaciones con el personal. No te duermas nunca». Rebeca, una nueva enfermera en periodo de prueba, no solo debe demostrar su valía ante sus superiores, sino también enfrentarse a esta misteriosa y temida entidad.</p>
<p><strong>Director:</strong> Rigoberto Castañeda · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Paulina Gaitán, Tony Dalton, Patricia Reyes Spíndola, Enoc Leaño, Fernanda Echevarría, Iazua Larios</p>
