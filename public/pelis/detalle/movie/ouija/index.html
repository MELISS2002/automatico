<h1>Ouija</h1>
<p>En Ouija, un grupo de amigos deben confrontar sus miedos más terroríficos cuando despiertan los poderes obscuros de un tablero antiguo de espíritus. Stiles White dirige el suspenso sobrenatural producido por los compañeros de Platinum Dunes, Michael Bay, Andrew Form y Brad Fuller (La noche de la expiación, La Masacre de Texas, Viernes 13) junto con el productor de Blumhouse Production Jason Blum (Actividad Paranormal, La noche de la expiación), Bennet Schneir (Battleship) y Hasbro. Juliet Snowden y Stiles White escribieron el guión de Ouija, y Universal va a distribuir la película a nivel mundial.</p>
<p><strong>Director:</strong> James Moran · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Daren Kagasoff, Matthew Settle, Olivia Cooke, Ana Coto, Shelley Hennig, Bianca A. Santos</p>
