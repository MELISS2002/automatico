<h1>La Carrera de la Muerte 2</h1>
<p>Death Race 2 tiene lugar en un futuro muy próximo, cuando la economía de Estados Unidos comienza a declinar y la delincuencia violenta inicia una espiral fuera de control. Para contener a la población penal, se crea una serie de cárceles privadas, gobernadas por bandas, asesinos a sangre fría y sociópatas. La peor de estas cárceles es Terminal Island, donde condenado por el asesinato de unos policías llega Carl Lucas, el que será el auténtico protagonista del último reality show de la Carrera de la Muerte. El ganador, si es que alguien logra sobrevivir, tiene como premio la libertad.</p>
<p><strong>Director:</strong> Roel Reiné · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Acción, Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> Luke Goss, Lauren Cohan, Sean Bean, Danny Trejo, Ving Rhames, Tanit Phoenix</p>
