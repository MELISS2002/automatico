<h1>xXx 2: Estado de Emergencia</h1>
<p>Augustus Gibbons (Jackson) es un miembro de la Agencia de Seguridad Nacional norteamericana. Tras librarse de un ataque mortal protagonizado por unos desconocidos, Gibbons sospecha que los asesinos han sido enviados por una facción secreta y radical que actúa desde dentro de la Casa Blanca. Busca entonces a un militar experto y bien entrenado que le ayude a desenmascarar al grupo radical que se esconde tras el Gobierno. Desgraciadamente, Darius Stone (Ice Cube), el hombre más idóneo para este trabajo, está en prisión. Sin embargo, Gibbons le ayuda a fugarse y lo convence para que colabore con él como el agente XXX.</p>
<p><strong>Director:</strong> Lee Tamahori · <strong>Año:</strong> 2005 · <strong>Géneros:</strong> Acción, Aventura, Crimen, Suspense</p>
