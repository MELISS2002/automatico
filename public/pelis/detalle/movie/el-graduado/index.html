<h1>El graduado</h1>
<p>Ben Braddock acaba de salir del cascarón. Al graduarse decide corregir este desequilibrio y en su rebelde búsqueda desafía los ideales y la moral de la generación de sus padres. Por irónico que resulte, es seducido por la resplandeciente señora Robinson, esposa del mejor amigo de su padre. De esa unión saltarán chispas pero su relación sufre un giro inesperado cuando, con gran disgusto de la señora Robinson, Ben se enamora de la hija de ésta.</p>
<p><strong>Director:</strong> Mike Nichols · <strong>Año:</strong> 1967 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Dustin Hoffman, Anne Bancroft, Katharine Ross, Murray Hamilton, William Daniels, Elizabeth Wilson</p>
