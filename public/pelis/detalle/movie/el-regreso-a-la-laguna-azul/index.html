<h1>El regreso a la laguna azul</h1>
<p>Dos jóvenes naúfragos mueren dejando solo a su hijo de dos años en la barca. El niño es recogido en alta mar por un barco, donde Sarah Hargrave, que viaja con su pequeña hija, se hace cargo del niño. Al declararse una epidemia de cólera y para evitar una muerte cierta, Sarah y los niños son puestos en una pequeña embarcación que, después de varios días a la deriva, llega a una isla desierta. Al morir Sarah, los jóvenes se quedan solos y deberán luchar por sobrevivir.</p>
<p><strong>Director:</strong> William A. Graham · <strong>Año:</strong> 1991 · <strong>Géneros:</strong> Aventura, Drama</p>
<p><strong>Reparto:</strong> Milla Jovovich, Brian Krause, Lisa Pelikan, Courtney Barilla, Garette Ratliff Henson, Brian Blain</p>
