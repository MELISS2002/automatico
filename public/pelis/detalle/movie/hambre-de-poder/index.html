<h1>Hambre de poder</h1>
<p>Biopic del creador de McDonald’s. En los años 50, un vendedor de Illinois llamado Ray Kroc conoció a los hermanos Richard y Maurice McDonald que llevaban una hamburguesería al sur de California. Impresionado por la velocidad del sistema de cocina de su hamburguesería de San Bernardino, Kroc visualizó el potencial de la franquicia y hábilmente se fue posicionando para arrebatárselo a los hermanos y crear el hoy imperio de un billón de dólares. Así nació McDonald’s.</p>
<p><strong>Director:</strong> Phil Hardage · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Michael Keaton, Nick Offerman, John Carroll Lynch, Linda Cardellini, B.J. Novak, Laura Dern</p>
