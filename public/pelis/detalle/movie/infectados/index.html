<h1>Infectados</h1>
<p>Año 2024. Han pasado dos años desde que una pandemia mundial asoló el mundo. El virus COVID23 ha sufrido una nueva y peligrosa mutación con un 50% de mortalidad que obligó a los Gobiernos a ordenar un nuevo confinamiento mundial. Nico (KJ Apa) es un repartidor que ha desarrollado una poco común inmunidad al virus, lo que le permite seguir trabajando. Nico quiere estar junto a su novia Sara (Sofia Carson), pero para ello deberá superar la ley marcial y enfrentarse a gente peligrosa, poderosa y muy desesperada.</p>
<p><strong>Director:</strong> Steven Hacker · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Ciencia ficción, Suspense</p>
<p><strong>Reparto:</strong> KJ Apa, Sofia Carson, Craig Robinson, Bradley Whitford, Peter Stormare, Elpidia Carrillo</p>
