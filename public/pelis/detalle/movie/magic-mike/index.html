<h1>Magic Mike</h1>
<p>Mike (Channing Tatum), un joven que persigue el sueño americano, tiene varios trabajos, pero el que más dinero y satisfacción le proporciona es el de stripper en el Xquisite, un club de Tampa para mujeres regentado por Dallas (Matthew McConaughey). En ese mundo Mike introduce a The Kid (Alex Pettyfer), un joven al que acaba de conocer. Allí The Kid descubrirá un trabajo donde todo es alcohol, mujeres guapas, sexo fácil y dinero rápido; en suma, un mundo adictivo pero peligroso.</p>
<p><strong>Director:</strong> Steven Soderbergh · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Comedia, Drama</p>
