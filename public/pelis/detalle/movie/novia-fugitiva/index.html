<h1>Novia Fugitiva</h1>
<p>Ike Graham, redactor de un periódico de Nueva York, abrumado por diversos problemas, decide aislarse en su refugio favorito a fin de encontrar ideas para escribir. Allí se entera del caso de Maggie, una joven que vive en una zona rural del estado de Maryland, a la que le encantan los compromisos matrimoniales, pero le horroriza el matrimonio. Intrigado, Ike escribe una columna sobre el caso de la joven, sin prever el enfado de Maggie y la cadena de enredos que acabará desatando.</p>
<p><strong>Director:</strong> Garry Marshall · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Julia Roberts, Richard Gere, Joan Cusack, Héctor Elizondo, Rita Wilson, Paul Dooley</p>
