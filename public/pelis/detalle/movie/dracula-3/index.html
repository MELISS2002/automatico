<h1>Drácula</h1>
<p>Ésta es una de las primeras versiones sobre el mítico vampiro. Fue realizada por la Universal, productora especializada en el cine de terror. El conde Drácula abandona los Cárpatos y se traslada a Occidente, llevándose como sirviente a un contable. Una vez instalado, se enamora de una joven que ya está prometida. Empieza a a visitarla por las noches y va bebiendo su sangre poco a poco para convertirla así en su esposa. Pero el malestar que sufre la joven alerta a su familia, que busca la ayuda del doctor Van Helsing.</p>
<p><strong>Director:</strong> Tod Browning · <strong>Año:</strong> 1931 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Lugosi Béla, Helen Chandler, David Manners, Dwight Frye, Edward Van Sloan, Herbert Bunston</p>
