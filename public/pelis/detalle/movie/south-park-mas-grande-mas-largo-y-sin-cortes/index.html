<h1>South Park. Más grande, más largo y sin cortes</h1>
<p>Cuando los estudiantes de la escuela primaria de South Park, Stan, Kyle, Cartman y Kenny, deciden entrar a escondidas a ver una película canadiense no apta para menores, su vocabulario sufre un cambio brutal. La indignación de los padres, tras el devastador impacto que sufren sus inocentes y jóvenes mentes al ver la película, da lugar a una incondicional guerra entre Estados Unidos y Canadá. Inesperadamente, los chicos se ven inmersos en una crisis debiendo arriesgar sus vidas en nombre de la libertad de expresión.</p>
<p><strong>Director:</strong> Trey Parker · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Animación, Comedia</p>
