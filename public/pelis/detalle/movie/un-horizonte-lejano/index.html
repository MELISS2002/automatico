<h1>Un horizonte lejano</h1>
<p>Irlanda, 1892. Joseph y sus hermanos malviven del cultivo de unas tierras que son propiedad, como toda la comarca, del poderoso señor Christie. Cuando el padre de Joseph muere en un accidente provocado por los hombres de Christie, el joven decide vengarse, pero no lo consigue. Poco después, para evitar un duelo, emigra a América junto a Shannon, la bella hija de Christie. Nada más llegar a los Estados Unidos, a Shannon le roban todo su dinero; entonces Joseph decide protegerla haciéndola pasar por su hermana.</p>
<p><strong>Director:</strong> Ron Howard · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Aventura, Drama, Romance, Western</p>
<p><strong>Reparto:</strong> Tom Cruise, Nicole Kidman, Thomas Gibson, Robert Prosky, Barbara Babcock, Cyril Cusack</p>
