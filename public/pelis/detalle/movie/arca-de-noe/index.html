<h1>Arca de Noé</h1>
<p>Dos ratones: Vini, un carismático poeta con un terrible miedo escénico, y Tito, un talentoso y encantador guitarrista. Cuando llega el diluvio, solo se permite que un macho y una hembra de cada especie suban al Arca de Noé. Con la ayuda de una ingeniosa cucaracha y buena suerte, Vini y Tito se cuelan en el Arca y juntos intentarán evitar el enfrentamiento entre carnívoros y herbívoros. ¿Podrán estos talentosos polizones usar la música para romper la tensión y ayudar a todas las especies a convivir sin comerse unos a otros durante 40 días y 40 noches?</p>
<p><strong>Director:</strong> Alois Di Leo · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Animación, Comedia, Familia, Fantasía, Música</p>
<p><strong>Reparto:</strong> Rodrigo Santoro, Marcelo Adnet, Alice Braga, Lázaro Ramos, Júlio Andrade, Bruno Gagliasso</p>
