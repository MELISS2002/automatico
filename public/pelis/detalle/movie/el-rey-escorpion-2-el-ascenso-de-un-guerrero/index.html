<h1>El Rey Escorpión 2: El Ascenso de un Guerrero</h1>
<p>Esta es la historia del joven Mathayus y los sucesos que le llevan a convertirse en el Rey Escorpión. Cuando era un niño de 13 años sin preocupaciones, Mathayus fue testigo del rapto y asesinato de su padre, un conocido mercenario, por parte de un celoso rival, Sargon. Enviado a la prestigiosa academia de la Orden del Testigo Negro, Mathayus pasa sus siguientes siete años preparándose para convertirse en un luchador y en un asesino, espoleado por su voto de vengar, algún día, a su padre. Convencido de que la única esperanza de derrotar a Sargon y a su creciente poder consiste en recuperar la espada del Submundo, Mathayus se embarca en una arriesgada odisea sobrenatural, acompañado por una aspirante a guerrera.</p>
<p><strong>Director:</strong> Russell Mulcahy · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Acción, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> Michael Copon, Randy Couture, Karen David, Simon Quarterman, Tom Wu, Andreas Wisniewski</p>
