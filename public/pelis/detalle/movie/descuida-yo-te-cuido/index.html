<h1>Descuida, yo te cuido</h1>
<p>Marla Grayson (Rosamund Pike) no tiene escrúpulos a la hora de beneficiarse de los demás. Después de haberse aprovechado de docenas de jubilados como tutora legal, ella y su compañera Fran (Eiza González) ven a Jennifer Peterson (Dianne Wiest) como la nueva víctima: una gallina de los huevos de oro a la que pueden desplumar fácilmente. Pero mientras intentan llevar a cabo su plan, Marla y Fran descubren que la señora Peterson no es lo que creían, y que sus actos han entorpecido la labor de un importante criminal (Peter Dinklage).</p>
<p><strong>Director:</strong> Urs Hirschbiegel · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Comedia, Crimen, Drama, Suspense</p>
<p><strong>Reparto:</strong> Rosamund Pike, Peter Dinklage, Eiza González, Dianne Wiest, Chris Messina, Isiah Whitlock Jr.</p>
