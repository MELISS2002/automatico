<h1>Piratas del Caribe 3: En el Fin del Mundo</h1>
<p>Siguiendo la estela de lo sucedido en “Piratas del Caribe: El cofre de la muerte”, nuestros héroes, Will Turner y Elizabeth Swann, se han aliado con el capitán Barbossa para buscar y liberar al capitán Jack Sparrow del poder de Davy Jones. Mientras el Holandés Errante y la East India Trading Company causan estragos a lo largo de los Siete Mares, Will y Elizabeth navegan hacia Singapur, donde deben enfrentarse al astuto pirata chino Sao Feng. Ahora, en los mismísimos confines de la tierra, todos ellos deben elegir un bando en la batalla final, ya que no sólo sus vidas y fortunas, sino también el futuro de la piratería clásica, pende de un hilo.</p>
<p><strong>Director:</strong> Gore Verbinski · <strong>Año:</strong> 2007 · <strong>Géneros:</strong> Acción, Aventura, Fantasía</p>
<p><strong>Reparto:</strong> Johnny Depp, Geoffrey Rush, Orlando Bloom, Keira Knightley, Jack Davenport, Bill Nighy</p>
