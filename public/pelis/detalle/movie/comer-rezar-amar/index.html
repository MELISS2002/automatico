<p>Tras varios fracasos sentimentales, una mujer decide encontrarse a sí misma a través de un viaje por Italia, la India, Bali e Indonesia. Liz Gilbert tenía todo lo que una mujer puede soñar, un marido, una casa y una brillante carrera, pero se encontraba perdida, confusa, insatisfecha. Una vez divorciada, y tras un periodo de reflexión, decide abandonar su acomodada vida y lo arriesga todo, emprendiendo un viaje alrededor del mundo. Película basada en el best-seller homónimo y autobiográfico de Elizabeth Gilbert.</p>
<p><strong>Director:</strong> Ryan Murphy · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Drama, Romance</p>
