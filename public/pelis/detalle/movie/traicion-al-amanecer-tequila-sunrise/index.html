<h1>Traición al Amanecer (Tequila Sunrise)</h1>
<p>En una ciudad costera de California, los mejores amigos Mac y Nick están en lados opuestos de la ley. Mac es un ex traficante de drogas que intenta limpiar su acto, mientras que Nick es un detective de alto perfil que intenta derribar a un narcotraficante mexicano llamado Carlos. Pronto, las lealtades de Nick se ponen a prueba cuando comienza una aventura con el restaurador Jo Ann, un interés amoroso de Mac, que lleva a su amigo sin darse cuenta a una trampa orquestada por la policía.</p>
<p><strong>Director:</strong> Robert Towne · <strong>Año:</strong> 1988 · <strong>Géneros:</strong> Crimen, Romance, Suspense</p>
<p><strong>Reparto:</strong> Mel Gibson, Michelle Pfeiffer, Kurt Russell, Raúl Juliá, J.T. Walsh, Arliss Howard</p>
