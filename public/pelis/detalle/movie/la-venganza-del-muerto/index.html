<h1>La venganza del muerto</h1>
<p>En 1870, un forastero (Clint Eastwood) pasa a caballo por la tumba de Jim Duncan, antiguo sheriff de la ciudad fronteriza de Lago, en el sudoeste de Estados Unidos. Los propietarios de la compañía minera, Dave Drake (Mitchell Ryan) y Morgan Allen (Jack Ging) lo contratan para que los defienda de tres pistoleros que, recién salidos de la cárcel, están a punto de llegar a la ciudad. El forastero acepta el trato a condición de hacer las cosas a su manera.</p>
<p><strong>Director:</strong> Clint Eastwood · <strong>Año:</strong> 1973 · <strong>Géneros:</strong> Drama, Misterio, Western</p>
<p><strong>Reparto:</strong> Clint Eastwood, Verna Bloom, Marianna Hill, Mitchell Ryan, Jack Ging, Stefan Gierasch</p>
