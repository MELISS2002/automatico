<h1>Desechos y esperanza</h1>
<p>Dos niños de las favelas de Río de Janeiro encuentran una cartera en el vertedero donde buscan a diario, pero no se imaginan que este descubrimiento podría cambiar sus vidas. Cuando la policía local aparece para ofrecerles una generosa recompensa por la cartera, los dos chicos, Rafael y Gardo, comprenden que han encontrado algo importante. Deciden recurrir a su amigo Rata y los tres se lanzan a una extraordinaria aventura para intentar quedarse con la cartera y descubrir el secreto que esconde.</p>
<p><strong>Director:</strong> Stephen Daldry · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Aventura, Crimen, Drama, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Rickson Tevez, Eduardo Luís, Gabriel Weinstein, Wagner Moura, Selton Mello, Rooney Mara</p>
