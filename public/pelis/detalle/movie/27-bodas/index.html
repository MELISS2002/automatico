<h1>27 bodas</h1>
<p>Jane (Katherine Heigl), la eterna dama de honor -lo ha sido hasta 27 veces- pero nunca la novia, debe hacer frente a su peor pesadilla cuando su hermana (Malin Akerman) se compromete con el hombre de sus sueños. A Jane le encanta acudir a bodas y ayudar a la novia en su día más especial. Está enamorada de su jefe (Edward Burns), pero el día que se decide a confesarle su amor, su atractiva y caprichosa hermana, a la que siempre ha cuidado, entra en escena.</p>
<p><strong>Director:</strong> Anne Fletcher · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Comedia, Romance</p>
