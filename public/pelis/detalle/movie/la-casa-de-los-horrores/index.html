<h1>La Casa de los Horrores</h1>
<p>La rebelde adolescente Amy desafía a sus padres yendo a un carnaval de mala calidad que se ha detenido en la ciudad. En el remolque están su novio, Buzz, y sus amigos Liz y Richie. Pensando que sería divertido pasar la noche en el campamento de terror «Funhouse», los adolescentes presencian el asesinato de un trabajador deformado con una máscara. Encerrados, Amy y sus amigos deben evadir a los trabajadores asesinos del carnaval y escapar antes de que salga de la ciudad al día siguiente.</p>
<p><strong>Director:</strong> Tobe Hooper · <strong>Año:</strong> 1981 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Elizabeth Berridge, Cooper Huckabee, Kevin Conway, Largo Woodruff, Miles Chapin, Jeanne Austin</p>
