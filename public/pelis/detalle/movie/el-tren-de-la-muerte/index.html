<h1>El tren de la muerte</h1>
<p>Jack es un agente secreto que acaba de iniciar unas vacaciones con su familia. Recibe un nuevo encargo: escoltar a una ladrona de un mortífero virus que venderá al gobierno americano. En el tren que los llevará fuera de Eslovaquia, unos mafiosos intentarán adueñarse del virus. La familia de Jack, ajena a su verdadera profesión, va también en el tren que acabará siendo un tren sin control infectado de un virus mortal. Los mandos militares deberán tomar una decisión antes de que el tren descarrile o llegue a una ciudad, infectando a toda la población. Jack deberá ocuparse de su familia, de intentar que el tren no descarrile, de evitar que los militares lo bombardeen y de recuperar el virus.</p>
<p><strong>Director:</strong> Bob Misiorowski · <strong>Año:</strong> 2002 · <strong>Géneros:</strong> Acción, Suspense</p>
<p><strong>Reparto:</strong> Jean-Claude Van Damme, Tomas Arana, Laura Harring, Simona Williams, Susan Gibney, Lucy Jenner</p>
