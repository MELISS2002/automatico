<h1>El jardín de las palabras</h1>
<p>Takao, quien está entrenando para convertirse en un zapatero, se salta la escuela para dibujar zapatos en un jardín de estilo japonés, un día se encuentra con una misteriosa mujer, Yukino, que es mayor que él. Los dos se comienzan a ver una y otra vez, pero sólo en días de lluvia. Con el tiempo ellos empiezan a profundizar su relación y a abrirse el uno al otro. Pero el final de la temporada de lluvias está muy cerca.</p>
<p><strong>Director:</strong> 新海誠 · <strong>Año:</strong> 2013 · <strong>Géneros:</strong> Animación, Drama, Romance</p>
