<h1>Los Fantasmas de mis Ex</h1>
<p>Connor Mead adora su libertad, la diversión y las mujeres… en ese orden. Paul, el hermano de Connor, es más bien el tipo romántico; de hecho, tiene planes de boda. Desafortunadamente, la noche antes del gran evento, Connor está a punto de dar al traste con la boda. Es entonces cuando Connor recibe la visita del fantasma de su tío Wayne, legendario playboy amante de las fiestas y de las mujeres, cuyas proezas han servido de ejemplo para Connor.</p>
<p><strong>Director:</strong> Mark Waters · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Comedia, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Matthew McConaughey, Jennifer Garner, Michael Douglas, Breckin Meyer, Lacey Chabert, Robert Forster</p>
