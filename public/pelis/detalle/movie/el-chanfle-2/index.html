<h1>El Chanfle 2</h1>
<p>Es la continuación de la película mexicana El Chanfle (1979) de Chespirito, la cual fue presentada en las salas de cine en 1982. En esa oportunidad el elenco de la vecindad (con algunas ausencias: la de Carlos Villagran, quien decidió no seguir trabajando con Roberto Gomez Bolaños por una decisión personal, se marchó en 1979 de los dos programas “El Chavo” y “El Chapulín Colorado”. Al año siguiente Ramón Valdez decide acompañarlo, también dejando de trabajar con Chespirito. Regreso con él en 1981, pero un problema de salud que se le detectó a inicio de los años 80’s, le impidieron participar en esta película), daba cabida a la historia del humilde utillero de un equipo de fútbol que logra su sueño al lado de su esposa Tere, tener un niño.</p>
<p><strong>Director:</strong> Chespirito · <strong>Año:</strong> 1982 · <strong>Géneros:</strong> Comedia, Familia</p>
<p><strong>Reparto:</strong> Chespirito, Florinda Meza García, María Antonieta de las Nieves, Rubén Aguirre, Edgar Vivar, Raúl &#x27;Chato&#x27; Padilla</p>
