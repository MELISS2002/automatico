<h1>Open Season: amigos salvajes</h1>
<p>Boog, un oso pardo nada habilidoso, vive en un mundo perfecto en el tranquilo pueblo de Timberline hasta que conoce a Elliot, un flacucho, salvaje y parlanchín ciervo. A pesar de su mejor juicio, Boog libera a Elliot del cazador Shaw y Boog es convencido por este ciervo de salir de su cómoda vida para conocer el bosque. Así regresan los dos busca-problemas a la vida salvaje justo 3 días antes de la temporada de caza. Con la temporada de caza y Shaw sobre ellos, Boog y Elliot deberán aprender a trabajar juntos y unir a las criaturas del bosque para librar una ruda batalla y cazar a los cazadores.</p>
<p><strong>Director:</strong> Roger Allers · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> Martin Lawrence, Ashton Kutcher, Gary Sinise, Debra Messing, Billy Connolly, Georgia Engel</p>
