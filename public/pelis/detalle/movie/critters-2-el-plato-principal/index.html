<h1>Critters 2: El plato principal</h1>
<p>En un planeta primitivo, unos cazadores suben a bordo de su vieja nave espacial. Uno de ellos es UG, que mantiene la apariencia de una estrella de rock &amp;#038; roll que adquirió durante su último viaje a la Tierra. Su torpe acompañante es Cahrli McFadden, un borracho de Groves Bend, Kansas. Mientras la nave se adentra en el espacio, los cazadores reciben un mensaje que les dice que los Critters no han sido aniquilados. Mientras tanto, un hombre en la Tierra tiene un valioso tesoro: miles de huevos con manchas de extraños colores…</p>
<p><strong>Director:</strong> Mick Garris · <strong>Año:</strong> 1988 · <strong>Géneros:</strong> Ciencia ficción, Comedia, Terror</p>
