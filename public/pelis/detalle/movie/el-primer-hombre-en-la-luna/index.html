<h1>El primer hombre en la Luna</h1>
<p>Cuenta la historia de la misión de la NASA que llevó al primer hombre a la luna, centrada en Neil Armstrong y el periodo comprendido entre los años 1961 y 1969. Un relato en primera persona, basado en la novela de James R. Hansen, que explora el sacrificio y el precio que representó, tanto para Armstrong como para Estados Unidos, una de las misiones más peligrosas de la historia.</p>
<p><strong>Director:</strong> Sheila Waldron · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Ryan Gosling, Claire Foy, Jason Clarke, Kyle Chandler, Corey Stoll, Patrick Fugit</p>
