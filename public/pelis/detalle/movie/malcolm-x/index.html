<h1>Malcolm X</h1>
<p>Malcolm Little (1925–1965) nació en Omaha (Nebraska). Su padre, ministro baptista, murió siendo él niño, y su madre acabó en un psiquiátrico cuando el Ku Klux Klan incendió su casa. Después de ser rechazado por el ejército, cayó en la delincuencia y fue a parar a la cárcel. Allí se convirtió al Islam y cambió radicalmente su vida, convirtiéndose pronto en un carismático líder del movimiento de liberación de la comunidad negra norteamericana.</p>
<p><strong>Director:</strong> Spike Lee · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Denzel Washington, Angela Bassett, Albert Hall, Al Freeman Jr., Delroy Lindo, Spike Lee</p>
