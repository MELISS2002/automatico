<h1>Venganza Bajo Cero</h1>
<p>Nels (Liam Neeson) es un hombre honrado que vive en un pequeño pueblo donde todos lo admiran y le agradecen su trabajo como técnico de quitanieves, hasta el punto de concederle el premio al ciudadano del año. Nels es humilde y parece llevar una vida tranquila, pero un día le comunican la noticia de que su hijo ha muerto de sobredosis. Desde ese momento, Nels se da cuenta de que no conocía a su hijo y que todo no siempre es tan apacible como parece. Pero cuando empieza a tirar del hilo descubre toda una trama criminal detrás y decide tomarse la justicia por su mano. Armado con su quitanieves y con la única experiencia adquirida de haber leído novelas policiales, Nels perseguirá a los mafiosos que acabaron con la vida de su hijo, aunque sea lo último que haga. Remake de &amp;#8216;Uno tras otro&#x27;, la cinta noruega dirigida por Hans Peter Molland, quien también se encarga de esta versión.</p>
<p><strong>Director:</strong> Jason Furukawa · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Acción, Crimen, Drama</p>
<p><strong>Reparto:</strong> Liam Neeson, Tom Bateman, Tom Jackson, Laura Dern, Nicholas Holmes, Emmy Rossum</p>
