<h1>Chavín de Huántar, el rescate del siglo</h1>
<p>El 17 de diciembre de 1996, terroristas del MRTA tomaron como rehenes a cientos de personas en la residencia del embajador japonés en Lima, Perú, incluyendo ministros y altos mandos militares. Durante 126 días, el país permaneció en vilo mientras el Ejército peruano planeaba en secreto la Operación Chavín de Huántar, una intervención liderada por el comandante Juan Valer. El 22 de abril de 1997, tras meses de planificación, comandos peruanos llevaron a cabo una operación de rescate que mantuvo a Perú y al mundo en paz.</p>
<p><strong>Director:</strong> Diego de León · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Acción, Drama, Historia</p>
<p><strong>Reparto:</strong> Rodrigo Sánchez-Patiño, André Silva, Sergio Galliani, Miguel Iza, Connie Chaparro, Carlos Thornton</p>
