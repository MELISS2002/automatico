<h1>¡Scooby-Doo! Dulce o Travesura</h1>
<p>¡Mystery Inc. resolvió el caso! Rastrearon a Coco Diablo, líder de la famosa organización criminal que colabora con el caballero negro, Space Kook y Ghost Diver. Con Coco y su gatito en prisión, Mystery Inc. creen que finalmente podrán disfrutar de un descanso. ¡Equivocados! De repente, amenazantes fantasmas doppelgänger de la pandilla de Scooby y los clásicos enemigos favoritos de siempre aparecen en Coolsville para poner en peligro Halloween. ¡Ahora depende de los entrometidos chicos, y su incompatible nueva socia Coco, desenmascarar al último sinvergüenza y salvar Halloween! Para Shaggy y Scooby-Doo, con la búsqueda de dulces en riesgo, ¡esta vez es un tema personal!</p>
<p><strong>Director:</strong> Sara Jane Sherman · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia, Misterio</p>
