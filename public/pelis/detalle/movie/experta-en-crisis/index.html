<h1>Experta en crisis</h1>
<p>El candidato a la presidencia de Bolivia, muy bajo en los sondeos, decide contratar un equipo de asesores norteamericanos liderado por la deteriorada pero aún magnífica estratega “Calamity” Jane Bodine. En su retiro autoimpuesto tras el escándalo que le procuró su apodo y que sacudió hasta lo más profundo de su ser, Jane es persuadida para volver al juego para tener la oportunidad de vencer a su peor enemigo, el odioso Pat Candy, quien ahora asesora a la oposición. Pero mientras Candy se concentra en cada punto débil – tanto dentro como fuera del recorrido de la campaña– Jane se vuelca en una crisis personal tan intensa como la que su equipo aprovecha para aumentar las cifras a nivel nacional&amp;#8230;</p>
<p><strong>Director:</strong> David Gordon Green · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Sandra Bullock, Anthony Mackie, Billy Bob Thornton, Zoe Kazan, Scoot McNairy, Ann Dowd</p>
