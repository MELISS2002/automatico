<p>La historia viene gloriosamente a la vida en la historia épica de Disney sobre el amor y la aventura en el Nuevo Mundo. Pocahontas es una mujer nativa americana cuyo padre ha arreglado para que ella se case con el mejor guerrero de su pueblo. Pero una visión le dice que el cambio está llegando, y pronto ella se encuentra cara a cara con ella en la forma del Capitán John Smith.</p>
<p><strong>Director:</strong> Mike Gabriel · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Animación, Aventura, Familia, Romance</p>
