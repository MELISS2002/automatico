<h1>El bombero atómico</h1>
<p>Cantinflas es un torpe bombero, que un día recibe la visita de su pequeña ahijada, cuya madre murió recientemente en la selva. Después de haber trabajado en unos cuantos incendios, Cantinflas decidió dejar de fumar y convertirse en policía, porque es menos peligroso. Todo va bien hasta que una pandilla de gángsters secuestra a la chica, debido a una herencia monetaria.</p>
<p><strong>Director:</strong> Miguel M. Delgado · <strong>Año:</strong> 1952 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Cantinflas, Roberto Soto, Gilberto González, Elisa Quintanilla, Miguel Manzano, Pascual García Peña</p>
