<h1>La Nueva Pesadilla de Wes Craven</h1>
<p>A diferencia de las partes anteriores de la saga, esta no ocurre a los personajes, sino a los actores que los interpretaron en la primera entrega. Wes Craven vuelve a reunir al elenco original de “Pesadilla en Elm Street” para filmar la última entrega de la saga, pero durante el rodaje, la actriz Heather Lagenkamp empezará a soñar con Freddy, como ocurría en las anteriores películas, pero se da cuenta de que un demonio ha adoptado la imagen del asesino para aterrorizar a los miembros del equipo.</p>
<p><strong>Director:</strong> Wes Craven · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Fantasía, Misterio, Terror</p>
<p><strong>Reparto:</strong> Heather Langenkamp, Robert Englund, Miko Hughes, Wes Craven, David Newsom, Tracy Middendorf</p>
