<h1>Possessor: Controlador de mentes</h1>
<p>Tasya Vos (Riseborough) es una agente de una organización secreta que utiliza implantes cerebrales para controlar el movimiento corporal de otras personas, obligándolas a cometer asesinatos que benefician a toda clase de peces gordos del mundo corporativo. Un día, durante una misión rutinaria, algo sale mal. La agente Vos se ve atrapada dentro de la mente de uno de los sujetos que trataba de controlar (Abbot), cuyo apetito por la violencia se acaba convirtiendo en su peor aliado, superando incluso el suyo propio.</p>
<p><strong>Director:</strong> Larissa Malarek · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Ciencia ficción, Suspense, Terror</p>
<p><strong>Reparto:</strong> Andrea Riseborough, Christopher Abbott, Jennifer Jason Leigh, Sean Bean, Tuppence Middleton, Rossif Sutherland</p>
