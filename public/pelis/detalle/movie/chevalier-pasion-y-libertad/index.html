<h1>Chevalier: Pasión y Libertad</h1>
<p>Biopic de Chevalier de Saint-Georges, hijo de una esclava africana que alcanzó el éxito en la sociedad francesa del siglo XVIII como virtuoso violinista y compositor, además de como renombrado campeón de esgrima. Nacido Joseph Bologne, hijo ilegítimo de su madre, esclava, y un francés dueño de la plantación donde trabajaba su madre, Chevalier creció enfrentado al racismo y al clasismo de la época, pero llegó a codearse con la alta sociedad francesa de su tiempo, conociendo incluso a María Antonieta, reina consorte de Francia.</p>
<p><strong>Director:</strong> Stephen Williams · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Drama, Historia, Música</p>
<p><strong>Reparto:</strong> Kelvin Harrison Jr., Samara Weaving, Lucy Boynton, Alex Fitzalan, Minnie Driver, Sian Clifford</p>
