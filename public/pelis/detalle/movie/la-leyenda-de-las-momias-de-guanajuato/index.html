<h1>La Leyenda de las Momias de Guanajuato</h1>
<p>Secuela del filme animado «La leyenda de la llorona». En esta ocasión Leo San Juan, Don Andrés, Teodora y el Alebrije llegan a Guanajuato para intentar detener a las momias - que han despertado inexplicablemente - y recuperar a su amiga Xóchitl. Con ayuda de Luis, un amigo que conocen en la ciudad, Leo va descubriendo el terrible secreto del acaudalado Rosseau, mientras el resto del equipo se da cuenta que han caído en una trampa.</p>
<p><strong>Director:</strong> Alberto Rodríguez · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia, Terror</p>
<p><strong>Reparto:</strong> Benny Emmanuel, Mayté Cordero, Eduardo España, Rafael Inclán, Andrés Couturier, José Luis Orozco</p>
