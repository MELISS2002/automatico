<h1>La chica del ático</h1>
<p>Kelsey, una joven que honra la memoria de su madre corriendo un maratón y compartiendo su reto en línea, llama la atención de Billy, un dependiente obsesivo que decide secuestrarla y encerrarla en el ático que comparte con su madre en silla de ruedas. Aislada durante años y controlada incluso a través de videos en internet, Kelsey deberá unir fuerzas con la madre de su captor cuando esta descubre la verdad, antes de que la enfermiza fantasía de Billy acabe en tragedia.</p>
<p><strong>Director:</strong> David Weaver · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Crimen, Drama, Película de TV</p>
<p><strong>Reparto:</strong> Sophia Carriere, Keenan Tracey, Jean Louisa Kelly, John Cassini, Beth Fotheringham, Sidney Quesnelle</p>
