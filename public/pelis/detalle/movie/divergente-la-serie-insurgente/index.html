<h1>Divergente la serie Insurgente</h1>
<p>Tris (Shailene Woodley) y Cuatro (Theo James) son fugitivos que tratan de eludir la persecución de Jeanine (Kate Winslet), la líder de los eruditos. Tris pretende averiguar qué era lo que su familia defendió con tanto sacrificio. Atormentada por las decisiones de su pasado, pero decidida a proteger a los suyos, Tris, con la ayuda de Cuatro, se enfrentará a un reto tras otro para desbloquear la verdad de su pasado y el futuro de su mundo. Secuela de «Divergente» (2014).</p>
<p><strong>Director:</strong> Robert Schwentke · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Acción, Ciencia ficción, Suspense</p>
