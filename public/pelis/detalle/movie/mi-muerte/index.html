<h1>Mi muerte</h1>
<p>De vacaciones en una isla frente a la costa de Tailandia, la pareja Neil y Christine se despiertan con resaca y sin recuerdos de la noche anterior. Encuentran fotos en la cámara de Neil y miran horrorizados, cómo Neil parece asesinar a Christine. Con veinticuatro horas hasta el próximo ferry y un tifón que amenaza la isla, Christine y Neil intentan reconstruir los eventos de la noche y quedan atrapados en una red de misterio, magia negra y asesinatos.</p>
<p><strong>Director:</strong> Darren Lynn Bousman · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Misterio, Terror</p>
<p><strong>Reparto:</strong> Maggie Q, Luke Hemsworth, Alex Essoe, Kat Ingkarat, Kelly B. Jones, Caledonia Burr</p>
