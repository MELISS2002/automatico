<p>Anna Fritz es una bellísima y famosísima actriz de cine. Una tarde encuentran su cadáver en un hotel. La noticia de su muerte da la vuelta al planeta. Pau trabaja de celador en el hospital donde han llevado el cuerpo. Es un joven tímido e introvertido. Cuando entra una chica joven que acaba de morir, no puede evitar mirarla. Hace una foto al cadáver de Anna Fritz y la envía a sus amigos Iván y Javi. Estos van al hospital a buscar a Pau para llevarlo a una fiesta. Pero Iván quiere ver el cuerpo desnudo de Anna Fritz. Pau los lleva hasta el cadáver y destapa a Anna Fritz. Los tres admiran la belleza del cuerpo de la actriz. Creyendo que está muerta, Iván mantiene relaciones sexuales con su cuerpo y anima a Pau a hacer lo mismo, a pesar de la desaprobación de Javi, pero cuando Pau está en el acto ella despierta</p>
