<h1>Al servicio del Reich</h1>
<p>Basada en la novela semiautobiográfica «Filip» de Leopold Tyrmand y ambientada en 1943, «Al servicio del Reich» sigue la historia de un cínico y oportunista joven judío polaco que, tras sobrevivir al gueto de Varsovia y ocultar su identidad judía, se hace pasar por francés y trabaja como camarero en un hotel de Frankfurt. Esta fachada le permite llevar a cabo su particular venganza en plena Alemania nazi.</p>
<p><strong>Director:</strong> Michał Kwieciński · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> Eryk Kulm, Victor Meutelet, Caroline Hartig, Zoë Straub, Sandra Drzymalska, Maja Szopa</p>
