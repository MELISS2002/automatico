<h1>El Gordo y el Flaco</h1>
<p>La historia de uno de los dúos cómicos más famosos de la historia del cine. El estadounidense Oliver Hardy y el británico Stan Laurel, más conocidos como El Gordo y el Flaco, protagonizaron un triunfante tour de despedida a principios de los años 1950, en un momento en el que sus carreras estaban de capa caída. Lejos ya de su etapa dorada e ignorados por el público, la pareja se embarca en un tour por Gran Bretaña e Irlanda. Con el apoyo de sus mujeres, Lucille e Ida, y gracias al amor por su trabajo y por sus años de colaboración, Stan y Ollie logran superar un exigente calendario y se aseguran un lugar en el corazón de su público.</p>
<p><strong>Director:</strong> Jon S. Baird · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Steve Coogan, John C. Reilly, Shirley Henderson, Nina Arianda, Rufus Jones, Danny Huston</p>
