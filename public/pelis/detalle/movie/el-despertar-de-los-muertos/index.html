<h1>El Despertar de los Muertos</h1>
<p>La vida de Shaun es un callejón sin salida. Se pasa la vida en la taberna local con su amigo íntimo Ed, discute con su madre y descuida a su novia, Liz. Cuando Liz le deja plantado. Shaun decide, finalmente, poner su vida en orden. Tiene que reconquistar el corazón de su novia, enmendar sus relaciones con su madre y enfrentarse a las responsabilidades de un adulto.</p>
<p><strong>Director:</strong> Edgar Wright · <strong>Año:</strong> 2004 · <strong>Géneros:</strong> Comedia, Terror</p>
<p><strong>Reparto:</strong> Simon Pegg, Nick Frost, Kate Ashfield, Lucy Davis, Dylan Moran, Jessica Hynes</p>
