<h1>La buena esposa</h1>
<p>Joan Castleman (Glenn Close) es una buena esposa, de belleza madura y natural, la mujer perfecta. Pero lo cierto es que lleva cuarenta años sacrificando sus sueños y ambiciones para mantener viva la llama de su matrimonio con su marido, Joe Castleman (Jonathan Pryce). Pero Joan ha llegado a su límite. En vísperas de la entrega del Premio Nobel de Literatura a Joe, Joan decide desvelar su secreto mejor guardado.</p>
<p><strong>Director:</strong> Björn Runge · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Drama</p>
