<h1>Animales Fantásticos: Y Dónde Encontrarlos</h1>
<p>“Animales fantásticos y dónde encontrarlos” comienza en 1926 a medida que Newt Scamander acaba de terminar una excursión por todo el mundo para encontrar y documentar una extraordinaria variedad de creaturas mágicas. Al llegar a Nueva York para una breve escala, quizás pudo haber llegado y partido sin incidente&amp;#8230; si no fuera por un No-Maj (término estadounidense para Muggle) llamado Jacob, un caso mágico perdido y la escapada de algunas de las bestias fantásticas de Newt, lo que podría significar problemas para los mundos tanto de los magos como de los No-Maj.</p>
<p><strong>Director:</strong> David Yates · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Aventura, Fantasía</p>
<p><strong>Reparto:</strong> Eddie Redmayne, Katherine Waterston, Dan Fogler, Alison Sudol, Colin Farrell, Jon Voight</p>
