<h1>Terror bajo la Tierra 5: Líneas de sangre</h1>
<p>El peligro va a alcanzar cotas muy elevadas para el superviviente Burt Gummer (Michael Gross) en su caza del monstruo más peligroso con el que se ha topado hasta el momento. Cuando contratan a Gummer para capturar a un mortífero ser que aterroriza a Sudáfrica, éste y su nuevo compinche, Travis Welker (Jamie Kennedy), se enfrentan a una auténtica lucha por la supervivencia contra dos bestias salvajemente agresivas. Al descubrir que los monstruos han evolucionado hasta convertirse en criaturas aún más letales, su misión suicida les conduce a un nivel de terror desconocido&amp;#8230; mucho mayor del que esperaban encontrar.</p>
<p><strong>Director:</strong> Don Michael Paul · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Acción, Aventura, Ciencia ficción, Comedia, Terror</p>
<p><strong>Reparto:</strong> Michael Gross, Jamie Kennedy, Pearl Thusi, Rea Rangaka, Brandon Auret, Nolitha Zulu</p>
