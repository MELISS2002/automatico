<h1>The Power</h1>
<p>Londres, 1974. Mientras Gran Bretaña se prepara para los apagones eléctricos que se extienden por todo el país, la enfermera en prácticas Val llega para su primer día en el derrumbado East London Royal Infirmary. Con la mayoría de los pacientes y el personal evacuados a otro hospital, Val se ve obligada a trabajar en el turno de noche y se encuentra en un edificio oscuro y casi vacío. Dentro de estos muros se esconde un secreto mortal que obliga a Val a enfrentarse tanto a su propio pasado traumático como a sus miedos más profundos.</p>
<p><strong>Director:</strong> Corinna Faith · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Terror</p>
<p><strong>Reparto:</strong> Rose Williams, Charlie Carrick, Gbemisola Ikumelo, Theo Barklem-Biggs, Nuala McGowan, Emma Rigby</p>
