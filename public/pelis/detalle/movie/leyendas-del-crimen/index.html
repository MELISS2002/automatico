<h1>Leyendas del crimen</h1>
<p>La verdadera historia del ascenso y caída de los gangsters más célebres de Londres, Reggie y Ronnie Kray, ambos interpretados por Tom Hardy. Juntos, los gemelos Kray, se apoderarán de la ciudad. Pero mientras su reino se expande, las luchas por el poder, la feroz locura y una mujer, pondrán en peligro su vínculo fraternal; un débil eslabón que podría causar que su imperio se derrumbe. &amp;#8216;Legend&#x27; es un thriller clásico que nos sumergirá en la secreta historia de la década de los 60 y los extraordinarios acontecimientos que aseguraron la infame carrera de los gemelos Kray.</p>
<p><strong>Director:</strong> Brian Helgeland · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Crimen, Suspense</p>
<p><strong>Reparto:</strong> Tom Hardy, Emily Browning, Christopher Eccleston, David Thewlis, Taron Egerton, Chazz Palminteri</p>
