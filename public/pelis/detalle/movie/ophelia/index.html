<h1>Ophelia</h1>
<p>Ophelia (Daisy Ridley), es una joven adolescente e impetuosa que reside en el castillo de Elsinore como una de las personas de confianza de la Reina Gertrude (Naomi Watts). Su personalidad no pasa desapercibida ante los ojos del Príncipe Hamlet (George MacKay), a quien conquista rápidamente. Ambos se enzarzan en un apasionado romance secreto mientras su reino se encuentra al borde de entrar en guerra, plagado de traición y de intrigas palaciegas. Cuando el padre de Hamlet es asesinado, llevando al príncipe a una sed implacable de venganza, Ophelia trata de contener a las altas esferas del poder danés mientras que lucha por decidir entre ser fiel a su corazón o huir para conservar su propia vida. Versión de Hamlet desde la perspectiva de Ofelia.</p>
<p><strong>Director:</strong> Martina Götthansova · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Drama, Historia, Romance</p>
<p><strong>Reparto:</strong> Daisy Ridley, Naomi Watts, Clive Owen, George MacKay, Tom Felton, Devon Terrell</p>
