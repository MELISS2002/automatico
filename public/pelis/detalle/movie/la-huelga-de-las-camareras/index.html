<h1>La huelga de las camareras</h1>
<p>Nada había preparado a Eva para las exigencias de un gran hotel. Cuando se incorpora al equipo de camareras de piso del suntuoso Hotel Palace de París, donde una noche equivale a su salario anual, conoce a compañeras de fuerte personalidad: Safietou, Aissata, Violette y Simone. Entre risas y dramas , la joven descubre un equipo muy unido frente a la adversidad. Cuando un movimiento social trastorna la vida en el hotel, cada una de estas «manitas» se enfrenta a sus propias decisiones</p>
<p><strong>Director:</strong> Nessim Chikhaoui · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Comedia</p>
<p><strong>Reparto:</strong> Corinne Masiero, Lucie Charles-Alfred, Marie-Sohna Condé, Salimata Kamate, Maïmouna Gueye, Kool Shen</p>
