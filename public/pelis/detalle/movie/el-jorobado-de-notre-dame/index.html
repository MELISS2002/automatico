<h1>El jorobado de Notre Dame</h1>
<p>Oculto a las miradas de todos los ciudadanos de París, en lo alto del campanario de la catedral de Notre Dame, vive Quasimodo. Su tutor, el Juez Frollo, no le permite bajar nunca del campanario. En compañía de tres simpáticas gárgolas de piedra, Victor, Hugo y Laverne, Quasimodo pasa las horas observando el bullicioso ir y venir de la gente. Hasta que un día decide bajar a escondidas y conoce a la bella Esmeralda, con la que vivirá su mayor aventura.</p>
<p><strong>Director:</strong> Gary Trousdale · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Animación, Drama, Familia</p>
<p><strong>Reparto:</strong> Tom Hulce, Demi Moore, Kevin Kline, Tony Jay, Charles Kimbrough, Mary Wickes</p>
