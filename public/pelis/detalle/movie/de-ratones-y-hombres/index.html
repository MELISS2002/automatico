<h1>De ratones y hombres</h1>
<p>Dos grandes amigos, Lennie (John Malkovich) y George (Gary Sinise) se encuentran en paro, en plena era de la depresión norteamericana, y con pocas posibilidades de conseguir trabajo debido al retraso mental de Lennie. Cuando son contratados en el Rancho Tyler ven como su vida progresa a pesar de la estricta supervisión de Curley (Casey Siemaszko), el desagradable hijo del jefe. Pero su mundo se tambalea cuando la insatisfecha esposa de Curley (Sherilyn Fenn) se convierte en víctima inocente de la compasión de Lennie, forzando a George a decidir entre su amistad o él mismo.</p>
<p><strong>Director:</strong> Gary Sinise · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> John Malkovich, Gary Sinise, Ray Walston, Casey Siemaszko, Sherilyn Fenn, John Terry</p>
