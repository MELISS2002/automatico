<h1>Siempre es invierno</h1>
<p>Miguel (David Verdaguer), arquitecto paisajista, viaja a Bélgica con su novia Marta (Amaia Salamanca) para participar en un congreso. Allí se precipita el final de su relación, y tras la ruptura con su pareja decide quedarse a solas unos días más para tratar de recomponer su futuro. Roto y desubicado, Miguel conoce a Olga (Isabelle Renauld), una mujer que trabaja como voluntaria en el congreso de arquitectura. A su lado comenzará a reconstruirse y a entender en qué consiste su nuevo proyecto de vida. Adaptación de la novela «Blitz», del propio David Trueba.</p>
<p><strong>Director:</strong> David Trueba · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Drama, Romance</p>
<p><strong>Reparto:</strong> David Verdaguer, Isabelle Renauld, Amaia Salamanca, Jon Arias, Carla Nieto, Vito Sanz</p>
