<h1>Desconectada</h1>
<p>Cuando su madre desaparece estando de vacaciones en Colombia con su nuevo novio, la búsqueda de respuestas por parte de June se ve entorpecida por la burocracia internacional. Atascada en Los Ángeles, a miles de kilómetros de distancia, June utiliza toda la tecnología a su disposición para intentar encontrarla antes de que sea demasiado tarde. Pero cuanto más profundiza en su búsqueda, su investigación digital levanta más preguntas que respuestas… y cuando June revela secretos sobre su madre, se da cuenta de que nunca la conoció realmente.</p>
<p><strong>Director:</strong> Shawn Tira · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Drama, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Storm Reid, Joaquim de Almeida, Ken Leung, Amy Landecker, Daniel Henney, Nia Long</p>
