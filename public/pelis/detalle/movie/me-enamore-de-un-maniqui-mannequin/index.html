<h1>Me enamoré de un maniquí (Mannequin)</h1>
<p>Jonathan Switcher es el dependiente del departamento de unos grandes almacenes que un día descubre que una de sus maniquíes es una mujer del antiguo egipto que ha cobrado vida. Este hecho se convierte para él en motivo de inspiración para el diseño de los escaparates del negocio. Por otra parte, unos rivales del gremio pretenderán acabar con él con malas artes.</p>
<p><strong>Director:</strong> Michael Gottlieb · <strong>Año:</strong> 1987 · <strong>Géneros:</strong> Comedia, Fantasía, Romance</p>
<p><strong>Reparto:</strong> Andrew McCarthy, Kim Cattrall, Estelle Getty, James Spader, G.W. Bailey, Carole Davis</p>
