<h1>Milla 22: El escape</h1>
<p>James Silva (Mark Wahlberg) es un experimentado agente de la CIA, enviado a un país sospechoso de actividad nuclear ilegal. Cuando el funcionario local, LI (Iko Uwais), llega a la embajada de los EE. UU. buscando intercambiar información sobre material radioactivo robado a cambio de su paso seguro a los EE. UU., Silva tiene la tarea de transportarlo desde el centro de una ciudad, en una peligrosa misión, hasta una pista de aterrizaje a 22 millas de distancia.</p>
<p><strong>Director:</strong> Ana María Cabrera · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Acción, Suspense</p>
<p><strong>Reparto:</strong> Mark Wahlberg, Lauren Cohan, Iko Uwais, John Malkovich, Ronda Rousey, Terry Kinney</p>
