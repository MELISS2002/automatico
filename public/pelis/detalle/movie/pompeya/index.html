<h1>Pompeya</h1>
<p>El Monte del Vesubio, una de las zonas volcánicas más peligrosas del mundo, ha entrado en erupción. En una carrera por salvar la vida, un intrépido y valeroso esclavo de barco se entera de las noticias y hará todo lo posible por volver a casa y asegurarse de salvar a la dueña de su corazón y a su mejor amigo, un gran gladiador sin escapatoria del coliseo en el centro de la ciudad. Pero la batalla contra la madre naturaleza no será la única amenaza a la que se tenga que enfrentar por sacarlos vivos de allí, en su camino se cruzará con un senador romano sin conciencia ni corazón que ha mantenido al pueblo bajo su yugo.</p>
<p><strong>Director:</strong> Paul W. S. Anderson · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Acción, Aventura, Drama, Historia, Romance</p>
<p><strong>Reparto:</strong> Kit Harington, Emily Browning, Adewale Akinnuoye-Agbaje, Kiefer Sutherland, Carrie-Anne Moss, Jared Harris</p>
