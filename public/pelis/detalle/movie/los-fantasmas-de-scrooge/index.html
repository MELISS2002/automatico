<h1>Los Fantasmas de Scrooge</h1>
<p>De Walt Disney Pictures llega el mágico recuento de la adorada historia de Charles Dickens LOS FANTASMAS DE SCROOGE, la cálida aventura de alto vuelo para toda la familia protagonizada por Jim Carrey. Cuando tres fantasmas llevan al avaro Scrooge en un viaje revelador, él descubre el verdadero significado de la Navidad – pero él deberá actuar antes de que sea demasiado tarde.</p>
<p><strong>Director:</strong> Robert Zemeckis · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Animación, Drama, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Jim Carrey, Gary Oldman, Colin Firth, Robin Wright, Cary Elwes, Bob Hoskins</p>
