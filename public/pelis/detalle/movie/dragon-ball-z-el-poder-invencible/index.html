<h1>Dragon Ball Z: El Poder Invencible</h1>
<p>Durante un descanso de primavera llega a la Tierra Paragus, un Saiyajin sobreviviente, este llega a informarle a Vegeta que han conquistado un nuevo planeta para la raza Saiyajin. Trunks intenta convencer a Vegeta de que es una trampa pero no lo logra por lo que decide acompañaralo, junto con ellos van Oolong, Gohan y Kame Sen&#x27;nin. Por otro lado Gokū es contactado por Kaiō Sama para que investigue la aparición de un Saiyajin que ha destruido la galaxia del sur. Con la llegada de Goku, Broly logra soltarse del control mental al que lo tenía sometido su padre. Al despertar su poder destructivo, Broly logra hacer que Goku y sus amigos sean insignificantes ante su dominio Total.</p>
<p><strong>Director:</strong> 山内重保 · <strong>Año:</strong> 1993 · <strong>Géneros:</strong> Acción, Animación, Ciencia ficción</p>
