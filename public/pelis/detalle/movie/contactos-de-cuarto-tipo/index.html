<h1>Contactos de cuarto tipo</h1>
<p>Thriller basado en hechos reales, ambientado en Alaska, en el que una mujer investiga una serie de misteriosas desapariciones ocurridas en el lugar durante los últimos 40 años. A finales del año 2000, los pacientes de la terapeuta Abbey Tyler, bajo hipnosis, reflejaron comportamientos que sugerían encuentros con seres no humanos. Antes de dormir, todos ellos aseguraban haber visto un búho que les observaba desde fuera de la ventana. Y despertaban completamente paralizados, escuchando ruidos terroríficos que provenían de fuera de la habitación. La doctora prosiguió con sus investigaciones, descubriendo que la desaparición de personas y sucesos extraños en la región se remontaba a los años 60.</p>
<p><strong>Director:</strong> Olatunde Osunsanmi · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Ciencia ficción, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Milla Jovovich, Elias Koteas, Will Patton, Hakeem Kae-Kazim, Corey Johnson, Enzo Cilenti</p>
