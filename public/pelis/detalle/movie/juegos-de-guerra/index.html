<h1>Juegos de guerra</h1>
<p>A David Lughtman, estudiante de diecisiete años, le han suspendido varias asignaturas. Pero haciendo uso de su gran habilidad con las computadoras, logra cambiar las notas y aprobar el curso. Un día, jugando con su máquina, David entra en contacto con «Joshua», la computadora del Departamento de Defensa de los Estados Unidos, y decide «jugar a la guerra». El muchacho cree que es un juego más pero, sin darse cuenta, desafía a «Joshua» a un escalofriante juego de guerra termonuclear mundial. Entre las dos máquinas planean desplegar todas las estrategias y opciones para una Tercera Guerra Mundial.</p>
<p><strong>Director:</strong> John Badham · <strong>Año:</strong> 1983 · <strong>Géneros:</strong> Ciencia ficción, Drama, Suspense</p>
<p><strong>Reparto:</strong> Matthew Broderick, Dabney Coleman, John Wood, Ally Sheedy, Barry Corbin, Juanin Clay</p>
