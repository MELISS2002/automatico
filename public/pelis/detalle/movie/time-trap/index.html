<p>Un grupo de estudiantes se aventura en las cuevas de una remota ubicación de Texas para encontrar a su profesor favorito de arqueología, que ha desaparecido sin dejar rastro mientras buscaba la Fuente de la Vida. Sin saberlo, se introducen en un lugar en el que cambia el sentido de la noción del espacio/tiempo, lo que les obliga a adentrarse cada vez más en la cueva para averiguar qué oscuro secreto les aguarda en ella.</p>
<p><strong>Director:</strong> Mark Dennis · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Aventura, Ciencia ficción</p>
