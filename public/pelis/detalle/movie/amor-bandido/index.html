<h1>Amor bandido</h1>
<p>Joan es un joven de 16 años ingenuo y enamoradizo, hijo de un importante juez nacional muy adinerado que llevan una relación familiar conflictiva. Un día decide escaparse junto a Luciana (35), una hermosa mujer que trabaja como profesora en su colegio. Engañando a parientes y amigos, Joan y su pareja van a una casona en el interior del país para dar rienda suelta a su amor. Pero pronto Joan descubre con horror que ha caído en una trampa. Ahora Joan deberá luchar para salvar su vida, descubriendo en el camino el lado oscuro del amor.</p>
<p><strong>Director:</strong> Daniel Werner · <strong>Año:</strong> 2021 · <strong>Géneros:</strong> Drama, Romance, Suspense</p>
<p><strong>Reparto:</strong> Renato Quattordio, Romina Ricci, Rafael Ferro, Mónica Gonzaga, Sergio Prina, Susana Manchini</p>
