<h1>Guerra fría</h1>
<p>Hong Kong, la ciudad más segura de Asia, donde la policía ha sido durante mucho tiempo intocable. Pero al acercarse la medianoche, una llamada anónima al cuartel general de la policía avisa de la desaparición de un camión cargado de los equipamientos más modernos además de cinco oficiales de alto cargo. Los secuestradores parecen conocer directamente los procedimientos de la policía. Para poder liberar a los rehenes, la policía debe cumplir una serie de demandas, entre ellas la de entregar a cambio un gran rescate. Cualquier retraso les puede costar la vida, mientras el reloj sigue corriendo.</p>
<p><strong>Director:</strong> 陸劍青 · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Acción, Suspense</p>
<p><strong>Reparto:</strong> 郭富城, 梁家輝, 楊采妮, 林家棟, 錢嘉樂, 安志傑</p>
