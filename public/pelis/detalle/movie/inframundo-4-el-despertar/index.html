<h1>Inframundo 4: El despertar</h1>
<p>Quince años han pasado desde que Selene y su amante Michael, híbrido entre humano y licántropo, derrotaran al Vampiro Mayor Marcus en Underworld Evolution. En esos años la humanidad ha descubierto la existencia tanto del clan de los vampiros como del de los licántropos y se ha lanzado a una lucha encarnizada para erradicar ambas especies. Selene, capturada durante el genocidio, se despierta después de más de una década y se da cuenta de que se encuentra cautiva en un laboratorio herméticamente cerrado en Antigen, una poderosa corporación biotecnológica que se dedica a desarrollar la vacuna en contra de los virus que han creado a vampiros y licántropos. Selene se siente destrozada cuando descubre que Michael está muerto, pero su dolor es eclipsado por el descubrimiento de que mientras se hallaba en estado de criogenización ha dado a luz a la hija de ambos, Eve.</p>
<p><strong>Director:</strong> Måns Mårlind · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Acción, Fantasía, Terror</p>
<p><strong>Reparto:</strong> Kate Beckinsale, Stephen Rea, Michael Ealy, Theo James, India Eisley, Charles Dance</p>
