<h1>Carrie: un extraño presentimiento</h1>
<p>Carrie White, una tímida adolescente que vive con su madre, una fanática religiosa, es objeto de las burlas constantes de sus compañeros de instituto. Cuando, en las duchas del gimnasio, la chica sufre un ataque de histeria al tener su primera menstruación, a una de sus compañeras se le ocurre gastarle una broma macabra durante la fiesta de graduación. Lo que todos ignoran es que Carrie posee poderes telequinésicos. Adaptación de la novela homónima de Stephen King.</p>
<p><strong>Director:</strong> Brian De Palma · <strong>Año:</strong> 1976 · <strong>Géneros:</strong> Suspense, Terror</p>
