<h1>Por siempre cenicienta: Una historia de amor</h1>
<p>Por siempre jamás cuenta la “verdadera” historia de Cenicienta. En la Edad Media, tras la muerte de su amado padre, la pequeña Danielle se queda huérfana y se convierte en la criada de su nueva madrastra, una mujer empeñada en casar a una de sus dos hijas con el alocado Príncipe Henry. A pesar del mal trato que recibe Danielle por parte de su madrastra y hermanastras, crece y se convierte en una damisela cuyo destino se cruzará fortuitamente con el del príncipe Henry, que también tiene problemas en su propia casa.</p>
<p><strong>Director:</strong> Andy Tennant · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Comedia, Drama, Romance</p>
<p><strong>Reparto:</strong> Drew Barrymore, Anjelica Huston, Dougray Scott, Patrick Godfrey, Megan Dodds, Melanie Lynskey</p>
