<h1>La historia sin fin</h1>
<p>Escondido en el desván de su colegio, Bastian devora durante las horas de clase un libro enigmático, ”La Historia Sin Fin”, que relata la paulatina destrucción del Reino de Fantasía. Una especie de ”Nada” misteriosa destruye el país y a las criaturas que lo habitan. A medida que avanza en la lectura, Bastian se da cuenta de que la salvación de Fantasía depende de él; de que consiga entrar dentro del libro&amp;#8230;</p>
<p><strong>Director:</strong> Wolfgang Petersen · <strong>Año:</strong> 1984 · <strong>Géneros:</strong> Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Noah Hathaway, Barret Oliver, Tami Stronach, Alan Oppenheimer, Sydney Bromley, Patricia Hayes</p>
