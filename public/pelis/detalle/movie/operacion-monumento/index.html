<h1>Operación monumento</h1>
<p>A finales de la II Guerra Mundial (1939-1945), a un selecto grupo de historiadores, directores de museos y expertos en arte, tanto británicos como norteamericanos, se les encomienda la importante y peligrosa misión de recuperar las obras de arte robadas por los nazis durante la guerra para devolvérselas a sus legítimos propietarios. Era una misión imposible: las obras estaban muy bien custodiadas y el ejército alemán tenía orden de destruirlas en cuanto el Reich cayera. Pero aquellos hombres, en una carrera contrarreloj, arriesgaron sus vidas para evitar la destrucción de miles de años de cultura de la humanidad.</p>
<p><strong>Director:</strong> George Clooney · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Acción, Bélica, Drama, Historia</p>
<p><strong>Reparto:</strong> George Clooney, Matt Damon, Bill Murray, John Goodman, Cate Blanchett, Hugh Bonneville</p>
