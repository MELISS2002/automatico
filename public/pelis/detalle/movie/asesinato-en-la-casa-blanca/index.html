<h1>Asesinato En La Casa Blanca</h1>
<p>Una joven funcionaria aparece asesinada en la Casa Blanca. De la investigación se encarga el detective de homicidios de la policía de Washington D.C. Harlan Regis. El caso no es fácil, pero es que además los miembros del servicio secreto no parecen dispuestos a colaborar; es más: siembran su camino de obstáculos y pistas falsas. Sólo la agente Nina Chance se decide a ayudarlo. Mientras tanto, el Presidente debe resolver una crisis con Corea del Norte, que retiene como rehenes a un grupo de americanos.</p>
<p><strong>Director:</strong> Dwight H. Little · <strong>Año:</strong> 1997 · <strong>Géneros:</strong> Acción, Crimen, Drama, Misterio, Suspense</p>
