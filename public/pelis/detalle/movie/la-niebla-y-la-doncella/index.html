<h1>La niebla y la doncella</h1>
<p>No siempre las cosas son como parecen y a menudo, lo obvio no resulta ser lo real. Al sargento Bevilaqua, de la Guardia Civil, le encomiendan la tarea de investigar la muerte de un joven en la isla canaria de La Gomera. Todo apuntaba a Juan Luis Gómez Padilla, político de renombre en la isla, al que un tribunal popular absolvió a pesar de la aparente evidencia de las primeras pesquisas. El sargento y su inseparable cabo Chamorro intentarán esclarecer este embrollado caso, con presiones políticas y con la dificultad añadida de intentar no levantar suspicacias al reabrir un caso que sus compañeros daban por cerrado.</p>
<p><strong>Director:</strong> Andrés M. Koppel · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Crimen, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Quim Gutiérrez, Verónica Echegui, Aura Garrido, Roberto Álamo, Marian Álvarez, Sanny van Heteren</p>
