<h1>Lágrimas del Sol</h1>
<p>Un equipo comandado por el teniente Waters, un veterano oficial de la unidad especial SEAL, se adentra en el corazón de África con la misión de rescatar a Lena Kendrick, una doctora americana que trabaja en una zona muy conflictiva. Pero, cuando la encuentran, ella se niega a abandonar a los refugiados y exige a Waters que los escolte a todos a través de la peligrosa jungla nigeriana. El oficial tendrá que enfrentarse a un grave dilema: obedecer las órdenes recibidas o, por el contrario, seguir los dictados de su propia conciencia.</p>
<p><strong>Director:</strong> Antoine Fuqua · <strong>Año:</strong> 2003 · <strong>Géneros:</strong> Acción, Bélica, Drama</p>
<p><strong>Reparto:</strong> Bruce Willis, Monica Bellucci, Cole Hauser, Eamonn Walker, Johnny Messner, Nick Chinlund</p>
