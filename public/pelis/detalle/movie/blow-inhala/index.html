<h1>Blow: Inhala</h1>
<p>Basada en hechos reales, cuenta la historia de George Jung, un hombre de familia humilde que consiguió hacerse multimillonario gracias a su propia versión del sueño americano. Durante su estancia en la cárcel se adentra en el mundo del narcotráfico en Colombia, y a través de un ingenioso sistema de importación llega a comerciar la mayor parte de la cocaína que entra en Estados Unidos durante los 70. Acompañado por Mirtha y Delgado, formarán un triángulo que compartirá situaciones límite dominadas por la pasión, el odio, la amistad y una desmedida ambición de poder.</p>
<p><strong>Director:</strong> Ted Demme · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Crimen, Drama</p>
