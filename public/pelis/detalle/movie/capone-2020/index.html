<h1>Capone</h1>
<p>Despiadado hombre de negocios y contrabandista que gobernó Chicago con puño de hierro, Alfonse Capone fue el gángster más infame y temido de la tradición estadounidense. A la edad de 47 años, después de casi una década de prisión, la demencia pudre la mente de Alfonse y su pasado se hace presente. Los recuerdos desgarradores de sus orígenes violentos y brutales se funden en su vida de vigilia. Mientras pasa su último año rodeado de familiares con el FBI al acecho, este patriarca enfermo lucha por colocar el recuerdo de la ubicación de millones de dólares que escondió en su propiedad.</p>
<p><strong>Director:</strong> Diane Hassinger Newman · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Crimen, Drama</p>
<p><strong>Reparto:</strong> Tom Hardy, Linda Cardellini, Matt Dillon, Kyle MacLachlan, Kathrine Narducci, Jack Lowden</p>
