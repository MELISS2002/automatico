<h1>Los Perdedores</h1>
<p>Una historia de caminos cruzados y venganza, centrada en un grupo de las Fuerzas Especiales, enviado a la jungla boliviana y traicionado por uno los suyos, del que sólo saben su nombre: Max. Dados por muertos, el grupo hace planes para igualar el marcador, cuando se les une la misteriosa Aisha, que tiene sus propios planes. Trabajan juntos en secreto para seguir la pista del bien custodiado Max, quien pretende involucrar al mundo en una guerra global de alta tecnología.</p>
<p><strong>Director:</strong> Sylvain White · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Acción, Aventura, Crimen, Misterio, Suspense</p>
