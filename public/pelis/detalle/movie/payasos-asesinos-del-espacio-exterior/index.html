<h1>Payasos Asesinos del Espacio Exterior</h1>
<p>Deb y Mike ven caer un meteorito en el bosque. Cuando se acercan a investigar descubren que se trata de una carpa de circo llena de payasos asesinos. Después de huir de ellos por los pelos, acuden a la comisaría donde chocan con la incredulidad de Kirk, un viejo policía antipático. Sin embargo, ante su insistencia, consiguen la ayuda de Dave, un amigo de la infancia de Deb, que les ayuda en este surrealista caso. Mientras, la población sufre los hilarantes ataques de los payasos&amp;#8230;</p>
<p><strong>Director:</strong> Stephen Chiodo · <strong>Año:</strong> 1988 · <strong>Géneros:</strong> Ciencia ficción, Comedia, Terror</p>
<p><strong>Reparto:</strong> Grant Cramer, Suzanne Snyder, John Allen Nelson, John Vernon, Royal Dano, Christopher Titus</p>
