<h1>Shakespeare enamorado</h1>
<p>Londres, 1593, reinado de Isabel I Tudor. William Shakespeare, joven dramaturgo de gran talento, necesita urgentemente poner fin a la mala racha por la que está pasando su carrera. Por mas que lo intenta y, a pesar de la presión de los productores y de los dueños de salas de teatro, no consigue concentrarse en su nueva obra: «Romeo y Ethel, la hija del pirata». Lo que Will necesita es una musa y la encontrará en la bella Lady Viola, con la que mantiene un romance secreto. Ahora bien, ella guarda dos secretos que él debe descubrir.</p>
<p><strong>Director:</strong> John Madden · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Comedia, Historia, Romance</p>
<p><strong>Reparto:</strong> Joseph Fiennes, Gwyneth Paltrow, Geoffrey Rush, Tom Wilkinson, Judi Dench, Imelda Staunton</p>
