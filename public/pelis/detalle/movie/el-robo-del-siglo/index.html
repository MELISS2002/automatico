<h1>El robo del siglo</h1>
<p>Llueve copiosamente y en la calle no hay un alma. Araujo está refugiado bajo el alero de un local cerrado. Delante está la fachada del Banco Río. Es viernes 13 de enero de 2006. Los francotiradores del Grupo Halcón están a la espera de una orden. Más de tres centenares de policías diseminados por el lugar aguardan la voz de su jefe. Miguel Sileo, el negociador, deja diluir las esperanzas de que Vitette, uno de los líderes de la banda de ladrones que entró a la sucursal del Banco Río de Acassuso de señales de vida. Las pizzas que había pedido como condición se habían enfriado. El grupo Halcón recibe la orden y entra: se encuentran con lo inesperado. Armas de juguete y una veintena de rehenes asustados los esperan dentro; no hay señales del grupo de ladrones.</p>
<p><strong>Director:</strong> Teresita Barusso · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Comedia, Crimen, Suspense</p>
<p><strong>Reparto:</strong> Guillermo Francella, Diego Peretti, Luis Luque, Pablo Rago, Rafael Ferro, Mariano Argento</p>
