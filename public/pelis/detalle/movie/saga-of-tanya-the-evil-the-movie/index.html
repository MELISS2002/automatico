<h1>Saga of Tanya the Evil: The Movie</h1>
<p>El tiempo es UC 1926. El 203º Batallón de Magos Aéreos del Ejército Imperial dirigido por la Mayor Tanya Degurechaff ha ganado la batalla hacia el sur contra los rezagados de la República. Esperaban que se les dieran vacaciones después de regresar victoriosos, pero en cambio reciben órdenes especiales de la sede del personal tan pronto como llegan a casa. Se les dice que hubo signos de un despliegue a gran escala cerca de la frontera entre el Imperio y la Federación.</p>
<p><strong>Director:</strong> 上村泰 · <strong>Año:</strong> 2019 · <strong>Géneros:</strong> Acción, Animación, Bélica, Fantasía</p>
