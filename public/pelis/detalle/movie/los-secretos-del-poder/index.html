<h1>Los secretos del poder</h1>
<p>Thriller acerca de un congresista y un reportero que se ven envueltos en un caso de brutales asesinatos que, aparentemente, no tienen relación entre sí. Russell Crowe es Cal McCaffrey, un periodista de Washington D.C., cuyo olfato le lleva a desenmarañar los misteriosos asesinatos de algunas de las figuras más prometedoras de la política y de la gran empresa. El apuesto congresista Stephen Collins representa el futuro de su partido: debido a su honradez, ha sido elegido presidente del comité que supervisa los gastos de defensa. Hasta que alguien asesina brutalmente a su ayudante/amante y los secretos se escapan de su escondite. McCaffrey tiene la dudosa fortuna de ser un viejo amigo de Collins y de que su jefa sea totalmente despiadada y le mande a investigar el caso. Mientras sigue la pista del asesino con la ayuda de su compañera Della, descubre una tapadera que amenaza con hacer temblar las estructuras del poder de la nación.</p>
<p><strong>Director:</strong> Kevin Macdonald · <strong>Año:</strong> 2009 · <strong>Géneros:</strong> Crimen, Misterio, Suspense</p>
<p><strong>Reparto:</strong> Russell Crowe, Ben Affleck, Rachel McAdams, Helen Mirren, Robin Wright, Jason Bateman</p>
