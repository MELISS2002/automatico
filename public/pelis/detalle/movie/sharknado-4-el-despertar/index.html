<h1>Sharknado 4: El despertar</h1>
<p>Cinco años después de que la Costa Este de Estados Unidos fuera devastada en Sharknado 3, Fin, su familia y el universo han estado felizmente libres de sharnados en los años intermedios, pero ahora los tiburones (¡y tornados!) se están multiplicando en los lugares (y formas) más insospechados. Como los sharknados vuelven con más fuerza que nunca, Fin Shepard (Ian Ziering) necesitará la ayuda de algunos nuevos amigos en su incansable lucha para proteger el mundo de la amenaza sharknádica.</p>
<p><strong>Director:</strong> Anthony C. Ferrante · <strong>Año:</strong> 2016 · <strong>Géneros:</strong> Ciencia ficción, Comedia</p>
<p><strong>Reparto:</strong> Ian Ziering, Ryan Whitney, Tara Reid, David Hasselhoff, Gary Busey, Tommy Davidson</p>
