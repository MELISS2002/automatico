<h1>Miedo</h1>
<p>Nicole Walker es una bella joven de 16 años que vive con su padre, su madrastra y su hermanastro. Una noche al salir a una fiesta con su mejor amiga, conoce a David en una discoteca, y desde esa noche comienzan una tórrida relación adolescente. En un comienzo todo va muy bien porque David parece encanatador, pero poco a poco David, a raíz de los celos y de la pésima relación con el padre de ella, empieza a mostrar su verdera personalidad hasta convertirse en una pesadilla para Nicole y toda su familia. Cuenado Nicole decide terminar con David provocará el despertar del psicópata que él lleva adentro pues él jamás aceptará esta decisión, desembocando todo en un final trágico.</p>
<p><strong>Director:</strong> James Foley · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Mark Wahlberg, Reese Witherspoon, William L. Petersen, Alyssa Milano, Amy Brenneman, Tracy Fraim</p>
