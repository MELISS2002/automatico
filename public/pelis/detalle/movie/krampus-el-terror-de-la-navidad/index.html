<h1>Krampus: El Terror de la Navidad</h1>
<p>El espíritu de la Navidad simboliza la unión familiar y en la generosidad, pero cuando Max ve que su familia se resquebraja pierde la fe en estos valores. Esto despertará la ira del Krampus, un ser mitológico que acecha al niño y a sus parientes para atormentarles las fiestas y hacerles vivir un infierno. Para enfrentarse al Krampus y salvar la vida, Max y los suyos tendrán que dejar a un lado sus diferencias y unir sus fuerzas contra el monstruo.</p>
<p><strong>Director:</strong> Michael Dougherty · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Comedia, Fantasía, Terror</p>
<p><strong>Reparto:</strong> Adam Scott, Toni Collette, David Koechner, Allison Tolman, Conchata Ferrell, Emjay Anthony</p>
