<h1>El bus de la vida</h1>
<p>Andrés, un profesor de música que trabaja en Madrid tiene que trasladarse a un pueblo vasco para cubrir la plaza que ha quedado libre en un instituto. Con los 40 recién cumplidos y sin haber superado nunca el miedo escénico, siente que su nueva vida le está alejando del sueño de ser músico. Al llegar allí, en su primer día de clase sufre un desmayo a causa de un fuerte pitido en el oído: es cáncer. Para recibir tratamiento debe desplazarse al hospital de Bilbao en EL BUS DE LA VIDA, un viejo autocar que traslada gratuitamente a todos los pacientes de la zona. Gracias a las risas, confesiones, experiencias y miedos compartidos con sus compañeros de viaje, Andrés irá obteniendo fuerza para enfrentarse por fin a sus miedos y llegar a cumplir su sueño.</p>
<p><strong>Director:</strong> Ibon Cormenzana · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Dani Rovira, Susana Abaitua, Julen Castillo, Miriam Rubio, Pablo Scapigliati, Javier Tolosa</p>
