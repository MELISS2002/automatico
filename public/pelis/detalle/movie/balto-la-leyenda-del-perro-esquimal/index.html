<h1>Balto: La leyenda del perro esquimal</h1>
<p>Balto, un perro lobo siberiano, mezcla de husky y lobo, se siente confundido en cuanto a sus orígenes y está marginado en Alaska, excepto por sus verdaderos amigos. Un día, se extiende una epidemia de difteria entre los niños de Nome, pero una violenta tormenta de nieve bloquea todas las rutas de transporte y la obtención de las medicinas necesarias se hace imposible&amp;#8230; a menos que un grupo de perros pueda cruzar mil kilómetros tirando de un trineo a través de la atroz tormenta ártica y volver con la antitoxina. Y sólo Balto puede rescatar a los perros y salvar a los niños.</p>
<p><strong>Director:</strong> Simon Wells · <strong>Año:</strong> 1995 · <strong>Géneros:</strong> Animación, Aventura, Drama, Familia</p>
<p><strong>Reparto:</strong> Kevin Bacon, Bob Hoskins, Bridget Fonda, Jim Cummings, Phil Collins, Juliette Brewer</p>
