<h1>Quien encuentra un amigo, encuentra un tesoro</h1>
<p>Alan (Terence Hill), un sempiterno apostador en las carreras de caballos, ha de escapar de la persecución de la banda de Frisco Joe, a quien ha birlado quince mil dólares que perdió&amp;#8230; al equivocarse de caballo ganador. En su huida, Alan se cuela de polizón en el pequeño barco de Charlie (Bud Spencer), un navegante solitario que hace travesías de propaganda de la Mermelada Puffin. Alan lleva consigo un plano de cierta isla donde su tío Brandy, enfermo de meningitis, asegura que hay un gran tesoro escondido. Al llegar a la isla de Pongo-Pongo, donde según su tío Brandy se encuentra el tesoro, Alan y Charlie han de hacer frente a multitud de peripecias, ya que el lugar indicado en el mapa es un viejo puerto militar defendido por Kamasuka, un soldado japonés que no se ha enterado todavía de que ha terminado la II Guerra Mundial&amp;#8230;</p>
<p><strong>Director:</strong> Sergio Corbucci · <strong>Año:</strong> 1981 · <strong>Géneros:</strong> Acción, Aventura, Comedia</p>
<p><strong>Reparto:</strong> Terence Hill, Bud Spencer, John Fujioka, Louise Bennett, Sal Borgese, Kainowa Lauritzen</p>
