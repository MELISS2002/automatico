<h1>Beavis Y Butt Head Recorren America</h1>
<p>Durante años Beavis y Butthead fueron dos de los personajes de animación más famosos de todos los USA, gracias a sus apariciones en la cadena musical MTV. En la pelicula ambos se despiertan de un sueño muy raro y se dan cuenta de que les falta la tele. Alguien les ha robado su bien más preciado sin el cual no pueden vivir, por lo que salen a la calle a buscarla. Eso los llevará a vivir una serie de aventuras, aventuras que sólo se les pueden presentar a Beavis y Butthead.</p>
<p><strong>Director:</strong> Mike Judge · <strong>Año:</strong> 1996 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Crimen, Música</p>
<p><strong>Reparto:</strong> Mike Judge, Bruce Willis, Demi Moore, Cloris Leachman, Robert Stack, Jacqueline Barba</p>
