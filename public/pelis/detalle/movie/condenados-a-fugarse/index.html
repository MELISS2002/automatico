<h1>Condenados a fugarse</h1>
<p>Nueva York, 1932. Ray Gibson es un delincuente de poca monta que acaba de colarse en el club Spanky y detecta enseguida a su primera víctima de la noche. El ingenuo Claude Banks, aspirante a contable, ha salido con su novia esa noche y poco sospecha que se ha convertido en el blanco de Ray. La cartera de Claude pasa a manos de Ray, quien cree haber conseguido así el dinero para pagar la deuda de juego que tiene con Spanky. Pero Ray se lleva un chasco porque Claude, que también tiene el vicio del juego, está tan arruinado como él.</p>
<p><strong>Director:</strong> Ted Demme · <strong>Año:</strong> 1999 · <strong>Géneros:</strong> Comedia, Crimen</p>
<p><strong>Reparto:</strong> Eddie Murphy, Martin Lawrence, Obba Babatundé, Nick Cassavetes, Anthony Anderson, Barry Shabaka Henley</p>
