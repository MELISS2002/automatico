<h1>Cocodrilo Dundee</h1>
<p>Michael Dundee es un amigable y rudo cazador de cocodrilos en los salvajes campos australianos que, por su original filosofía de la vida, es considerado como un héroe entre los suyos. Su fama llega a oídos de Sue Charlton, una reportera de Nueva York que decide ir a Australia para visitarle y, una vez allí, le convence para que le acompañe en su viaje de regreso a América.</p>
<p><strong>Director:</strong> Peter Faiman · <strong>Año:</strong> 1986 · <strong>Géneros:</strong> Aventura, Comedia</p>
