<h1>Alexander y un día terrible, horrible, malo ¡muy malo!</h1>
<p>Sigue las hazañas de Alexander, un niño de 11 años que atraviesa el día más terrible y horrible de su joven vida: un día que comienza con goma de mascar enredada en su cabello, seguido de una calamidad tras otra. Cuando Alexander cuenta las desventuras de su desastroso día a su optimista familia, nadie parece comprenderlo y él comienza a preguntarse si las cosas malas sólo le ocurren a él. Pero pronto descubrirá que no está solo, cuando su madre, su padre, su hermano y su hermana también se vean envueltos en su peor, más terrible y horrible día. Cualquiera que diga que los días malos no existen sencillamente nunca vivió uno.</p>
<p><strong>Director:</strong> Miguel Arteta · <strong>Año:</strong> 2014 · <strong>Géneros:</strong> Comedia, Familia</p>
<p><strong>Reparto:</strong> Steve Carell, Jennifer Garner, Ed Oxenbould, Dylan Minnette, Kerris Dorsey, Elise Vargas</p>
