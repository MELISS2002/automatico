<h1>Mini espías 4: Los ladrones del tiempo</h1>
<p>Ocho años después de la tercera película, el OSS se ha hecho la mejor agencia del espía del mundo, mientras el departamento de Niños del Espía se ha hecho desde entonces difunto. Una espía jubilada Marissa (Jessica Alba) se devuelve en la acción junto con sus hijastros cuando un Cronometrador maníaco (Jeremy Piven) intenta asumir el mundo. A fin de salvar el mundo, Rebecca (Rowan Blanchard) y Cecil (Mason Cook) debe formar un equipo con su madrastra odiada. Carmen y Juni también han crecido desde entonces y proporcionarán aparatos a ellos.</p>
<p><strong>Director:</strong> Robert Rodriguez · <strong>Año:</strong> 2011 · <strong>Géneros:</strong> Acción, Aventura, Comedia, Familia</p>
<p><strong>Reparto:</strong> Jessica Alba, Joel McHale, Rowan Blanchard, Mason Cook, Jeremy Piven, Alexa PenaVega</p>
