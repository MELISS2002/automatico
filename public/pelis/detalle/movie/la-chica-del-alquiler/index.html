<h1>La Chica del Alquiler</h1>
<p>Después de que Lorena, la mujer que él creía el amor de su vida, le deja plantado ante el altar, a Sebastián no se le ocurre mejor idea que buscarla en la casa de playa que alquilaron para su luna de miel. Allí se cruza en su camino, Valeria, la chica del alquiler, quien se empeña en curar su despecho, romper sus rígidos esquemas y convertirlo en un nuevo Sebastián hasta que la novia fugitiva aparece en la playa con Tomas, el padrino de la boda.</p>
<p><strong>Director:</strong> Carlos Caridad Montero · <strong>Año:</strong> 2023 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Agustín Segnini, Daniela Alvarado, Patricia Schwarzgruber, Luis Alfredo Olavarrieta, Augusto Nitti, César Bencid</p>
