<h1>Rey de reyes</h1>
<p>En el 63 a. C., Pompeyo conquista y saquea Jerusalén, asesinando a la mayor parte de judíos que viven allí. Entra en el Templo para tomar el supuesto tesoro de Salomón, asesinando a los sacerdotes que estaban allí. Dentro del Templo, solo descubre un rollo de escrituras escrito por Moisés. Aunque estaba por quemarlo, decide entregarlo a un anciano del Templo. Luego, Pompeyo y su ejército terminan una masacre en las afueras de la ciudad. Años después, una serie de rebeliones estallan contra la autoridad de Roma, por lo que los romanos crucifican a muchos de los líderes y colocan a Herodes el Grande en el trono de Judea.</p>
<p><strong>Director:</strong> Nicholas Ray · <strong>Año:</strong> 1961 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Jeffrey Hunter, Siobhán McKenna, Hurd Hatfield, Ron Randell, Viveca Lindfors, Rita Gam</p>
