<h1>Horton y el mundo de los Quién</h1>
<p>Un elefante imaginativo llamado Horton oye un débil grito de auxilio proveniente de una diminuta mota de polvo que flota en el aire. Horton sospecha que podría haber vida en esa mota y, a pesar de la comunidad circundante, que cree que ha perdido la cabeza, está decidido a salvarla.</p>
<p><strong>Director:</strong> Steve Martino · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Familia, Fantasía</p>
