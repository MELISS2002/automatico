<p>Un meteorito cae en el desierto de California, en principio uno más de los que chocan con nuestro planeta. Pero este meteorito va a provocar el caos al contener vida alienígena, lo cual va a dar un nuevo significado al principio de la ley del más fuerte. Las cosas comienzan a agravarse cuando aparecen toda clase de curiosos bichos circulando por ahí, pero en lo que no han caído los alienígenas es en un equipo formado por Ira, Allison, Harry y Wayne, un grupo de científicos que tratarán de desbaratar un más que probable desastre sin precedentes.</p>
<p><strong>Director:</strong> Ivan Reitman · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Acción, Ciencia ficción, Comedia</p>
