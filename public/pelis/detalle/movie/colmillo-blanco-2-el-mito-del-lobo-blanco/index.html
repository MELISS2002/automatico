<h1>Colmillo blanco 2: El mito del lobo blanco</h1>
<p>Henry Casey es un joven que vive en compañía de Colmillo Blanco, mitad lobo, mitad perro, en las montañas de Alaska a principios de siglo. Durante uno de sus viajes por el río para recoger unas provisiones, la canoa en la que ambos viajan vuelca y Henry cae al agua, siendo arrastrado por la fuerte corriente. A pesar de los esfuerzos de Colmillo Blanco por salvar a su amo, el animal no logra dar con él. Sin embargo, Henry es rescatado por una princesa de una tribu india, cuyos miembros están sufriendo una hambruna que amenaza con hacerles desaparecer.</p>
<p><strong>Director:</strong> Ken Olin · <strong>Año:</strong> 1994 · <strong>Géneros:</strong> Aventura, Familia</p>
<p><strong>Reparto:</strong> Scott Bairstow, Charmaine Craig, Al Harrington, Alfred Molina, Victoria Racimo, Anthony Ruivivar</p>
