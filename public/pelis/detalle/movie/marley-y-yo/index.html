<h1>Marley y Yo</h1>
<p>Los recién casados John y Jenny Grogan deciden dejar atrás los duros inviernos de Michigan para instalarse en la soleada West Palm Beach (Florida). Los dos consiguen empleo en dos periódicos rivales, compran su primera casa y afrontan los retos del matrimonio. Cuando John le confiesa a su amigo y colega Sebastian que aún no se siente preparado para ser padre, éste le sugiere que le regale a Jenny un perro. Los Grogan adoptan un bonito cachorro de Labrador que, poco después, se convierte en una mole de 45 kilos que transforma la casa en una verdadera catástrofe.</p>
<p><strong>Director:</strong> David Frankel · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Comedia, Familia</p>
<p><strong>Reparto:</strong> Owen Wilson, Jennifer Aniston, Eric Dane, Kathleen Turner, Alan Arkin, Nathan Gamble</p>
