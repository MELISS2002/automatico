<h1>La agonía y el éxtasis</h1>
<p>Renacimiento italiano, principios del siglo XVI (Cinquecento). Cuando el papa Julio II encarga a Miguel Ángel que pinte el techo de la Capilla Sixtina, el artista rechaza el trabajo. El Papa lo obliga a aceptarlo, pero Miguel Ángel destruye su obra y huye de Roma. Cuando, por fin, reanuda el proyecto, éste se convierte en un enfrentamiento de férreas voluntades, avivado por constantes diferencias artísticas y temperamentales. Drama histórico basado en un bestseller de Irving Stone.</p>
<p><strong>Director:</strong> Carol Reed · <strong>Año:</strong> 1965 · <strong>Géneros:</strong> Drama, Historia</p>
<p><strong>Reparto:</strong> Charlton Heston, Rex Harrison, Diane Cilento, Harry Andrews, Alberto Lupo, Adolfo Celi</p>
