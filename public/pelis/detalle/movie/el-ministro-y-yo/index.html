<h1>El ministro y yo</h1>
<p>Mateo Melgarejo, es notario y escriba para los analfabetos de Santo Domingo, un barrio al norte del Zócalo de la Ciudad de México. Un amigo Squatter pide su ayuda en la negociación con la oficina de censo de la tierra para regularizar un título de la tierra. Después de una gran frustración con la burocracia del gobierno, escribe una carta al ministro, ganando una audiencia con él. El ministro contrata a Melgarejo para reformar la oficina, y el designado procede a dar una conferencia a los funcionarios sobre sus deberes en una sociedad democrática. Al final, abandona el puesto, regresando a Santo Domingo para ayudar a sus pobres residentes.</p>
<p><strong>Director:</strong> Miguel M. Delgado · <strong>Año:</strong> 1976 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Cantinflas, Chela Castro, Lucía Méndez, Ángel Garasa, Manolita Saval, Delia Peña Orta</p>
