<h1>La banda presidencial</h1>
<p>Cuatro amigos cuarentones, cansados de su patético y rutinario existir, deciden cambiar sus vidas de un día para el otro asaltando el casino más grande y exclusivo de Lima. Lo harán la noche de Halloween, disfrazados con las máscaras de los cuatro expresidentes peruanos más polémicos de las últimas décadas: Fujimori, Toledo, Humala y Alan García. En medio del asalto, terminarán tomando como rehén a un cliente, sin saber que éste es un conocido congresista. Al día siguiente, descubrirán en el teléfono de éste, información que compromete al gobierno. De repente, un gobierno corrupto está en las manos de estos cuatro perdedores, que podrían, sin haberlo planeado, convertirse en héroes anónimos.</p>
<p><strong>Director:</strong> Eduardo Mendoza de Echave · <strong>Año:</strong> 2022 · <strong>Géneros:</strong> Comedia, Crimen, Drama</p>
