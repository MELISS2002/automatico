<h1>Cartas desde Iwo Jima</h1>
<p>Segunda Guerra Mundial (1939-1945). Rodada íntegramente en japonés, la película ofrece la versión nipona de la batalla de Iwo Jima, el episodio más cruento de la guerra del Pacífico, en el que murieron más de 20.000 japoneses y 7.000 estadounidenses. El objetivo de la batalla para los japoneses era conservar un islote insignificante, pero de gran valor estratégico, pues desde allí defendían la integridad de su territorio. El mismo año, Eastwood dirigió también »Banderas de nuestros padres», que narra la misma batalla desde el punto de vista norteamericano. La versión japonesa muestra cómo el general Tadamichi Kuribayashi (Ken Watanabe) organizó la resistencia a través de un sistema de túneles.</p>
<p><strong>Director:</strong> Clint Eastwood · <strong>Año:</strong> 2006 · <strong>Géneros:</strong> Acción, Bélica, Drama</p>
<p><strong>Reparto:</strong> 渡辺謙, Kazunari Ninomiya, 伊原剛志, 加瀬亮, 中村獅童, Hiroshi Watanabe</p>
