<h1>Orca, La ballena asesina</h1>
<p>Durante años, el capitán Nolan ha vivido obsesionado con la idea de cazar un peligroso ejemplar de orca, la reina de los mares. En una de sus expediciones se encuentra con un grupo de esas gigantescas criaturas y decide cazarlas con la ayuda de su tripulación. Consigue capturar a una hembra embarazada que lucha desesperadamente por liberarse, pero, al acercarse demasiado a la hélice del barco, queda mortalmente herida y pierde al ballenato que esperaba. Aunque el macho se ve obligado a observar impotente la tragedia, desde ese momento la venganza será el único objetivo de su vida.</p>
<p><strong>Director:</strong> Michael Anderson · <strong>Año:</strong> 1977 · <strong>Géneros:</strong> Suspense, Terror</p>
<p><strong>Reparto:</strong> Richard Harris, Charlotte Rampling, Will Sampson, Bo Derek, Keenan Wynn, Robert Carradine</p>
