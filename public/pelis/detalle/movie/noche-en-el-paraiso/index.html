<h1>Noche en el paraíso</h1>
<p>Tae Goo es un miembro destacado de una banda criminal. Tiene una hermana menor y un sobrino. Su hermana menor está enferma. Tae Goo decide dejar la banda criminal por su hermana menor y su sobrino, pero otra banda criminal tiene como objetivo a Tae Goo. Su hermana menor y su sobrino mueren en la explosión de un automóvil causada por la otra banda criminal. Tae Goo se venga de la persona que cree que es responsable. Tae Goo luego huye a la isla de Jeju. Allí, conoce a Jae Yeon, a quien no le queda mucho tiempo de vida. Ambos sienten simpatía el uno por el otro.</p>
<p><strong>Director:</strong> Shin Soo-jung · <strong>Año:</strong> 2020 · <strong>Géneros:</strong> Acción, Crimen, Suspense</p>
<p><strong>Reparto:</strong> 엄태구, 전여빈, 차승원, 이기영, 박호산, 현봉식</p>
