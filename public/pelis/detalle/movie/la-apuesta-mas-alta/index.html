<h1>La apuesta más alta</h1>
<p>Cinco desconocidos son invitados una noche a un lujoso hotel para una partida de póquer de alto riesgo. Lo que comienza como un concurso de fortuna se convierte rápidamente en algo mucho más peligroso. A medida que aumenta la tensión y afloran los secretos, los jugadores se dan cuenta de que lo que está en juego no es sólo el dinero, sino la supervivencia. En una noche de peligro creciente, la confianza se convierte en un arma, y cada elección puede sellar su destino.</p>
<p><strong>Director:</strong> Tony Dean Smith · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Suspense</p>
