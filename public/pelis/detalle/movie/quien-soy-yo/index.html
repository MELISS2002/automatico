<h1>¿Quién soy yo?</h1>
<p>Jackie es reclutado por la CIA para formar parte de un comando de élite, que recibe la orden de asaltar un laboratorio secreto de armamento tecnológico en la jungla africana. Traicionados por su jefe, todo el equipo muere excepto Jackie, que es abandonado inconsciente en la jungla. Una tribu le recoge y le cura, aunque sufre de amnesia que le impide saber quién es y cómo llegó hasta allí. Su lucha por descubrir su verdadera identidad le hará sufrir la persecución de sus antiguos enemigos, y no podrá confiar en nadie nunca más.</p>
<p><strong>Director:</strong> Jackie Chan · <strong>Año:</strong> 1998 · <strong>Géneros:</strong> Acción, Aventura, Comedia, Suspense</p>
<p><strong>Reparto:</strong> Jackie Chan, Michelle Ferre, 山本未來, Ron Smerczak, Ed Nelson, Ton Pompert</p>
