<p>Un niño robótico, el primero programado para amar, David es adoptado como un caso de prueba por un empleado de Cybertronics y su esposa. Aunque gradualmente se convierte en su hijo, una serie de circunstancias inesperadas hacen que esta vida sea imposible para David. Sin la aceptación final de los seres humanos o las máquinas, David se embarca en un viaje para descubrir dónde realmente pertenece, descubriendo un mundo en el que la línea entre el robot y la máquina es a la vez vasta y profundamente delgada.</p>
<p><strong>Director:</strong> Steven Spielberg · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Aventura, Ciencia ficción, Drama</p>
