<p>Basada en una historia real, narra cómo la pareja formada por los jóvenes Tami Oldham y su novio Richard se hace a la mar en su velero, pero en medio del océano se ven sorprendidos por una de las mayores tormentas jamás registradas. Tras el paso del huracán, Richard sale herido, y Tami tendrá que ponerse al mando para intentar sobrevivir a la deriva con el velero roto, sin comida y sin agua.</p>
<p><strong>Director:</strong> Baltasar Kormákur · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Aventura, Romance, Suspense</p>
