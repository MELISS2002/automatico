<h1>Pares y Nones</h1>
<p>Como la ley ha sido incapaz de echar a los jugadores y corredores de apuestas de Miami, que están bajo el liderazgo de Parapolis el Griego, el almirante O&#x27;Connor declara la guerra contra el juego, teniendo a Johnny Firpo como su mejor arma. Johnny tiene un medio hermano, Charlie, ahora camionero, pero antiguo jugador que trabajaba para Parapolis. Su padre, Mike, jugador de cartas abandonó a los chicos y a sus madres, pero no antes de haber enseñado a Charlie todos sus trucos de juego. Johnny le pide ayuda, pero éste no quiere volver al mundo del juego. Johnny le engaña diciéndole que Mike se está quedando ciego y necesita una costosa operación, y ¿qué mejor que ganar el dinero a través del juego? Charlie enseña a Johnny los trucos que conoce de juego y Puppa, una atractiva joven, enamorada de Johnny también decide ayudarle contándole las operaciones de Parapolis. ¿Los hermanos desarticularán la banda de apostadores clandestinos?</p>
<p><strong>Director:</strong> Sergio Corbucci · <strong>Año:</strong> 1978 · <strong>Géneros:</strong> Acción, Comedia, Crimen</p>
<p><strong>Reparto:</strong> Terence Hill, Bud Spencer, Luciano Catenacci, Marisa Laurito, Kim McKay, Sal Borgese</p>
