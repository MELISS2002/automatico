<h1>El Cabo del Miedo</h1>
<p>Sam Bowden es un abogado corporativo de un pueblo pequeño. Max Cady es un violador psicótico tatuado, fumador de cigarros, que cita la Biblia. ¿Qué tienen en común? Hace catorce años, Sam era un defensor público asignado al juicio por violación de Max Cady, y cometió un grave error: ocultó un documento de su cliente analfabeto que podría haberlo absuelto. Ahora, el caprichoso y bibliófilo Cady ha sido liberado, y tiene la intención de enseñarle a Sam Bowden y su familia una o dos cosas sobre la pérdida.</p>
<p><strong>Director:</strong> Martin Scorsese · <strong>Año:</strong> 1991 · <strong>Géneros:</strong> Crimen, Drama, Suspense</p>
<p><strong>Reparto:</strong> Robert De Niro, Nick Nolte, Jessica Lange, Juliette Lewis, Joe Don Baker, Robert Mitchum</p>
