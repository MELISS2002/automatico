<h1>Nunca me abandones (Never Let Me Go)</h1>
<p>Adaptación de una novela de Kazuo Ishiguro, el autor de «Lo que queda del día», que también fue llevada al cine (James Ivory, 1993). Kathy, Tommy y Ruth pasan su infancia en Hailsham, un internado inglés aparentemente idílico, donde descubren un tenebroso e inquietante secreto sobre su futuro. Cuando abandonan el colegio y se acercan al destino que les aguarda, el amor, los celos y la traición amenazan con separarlos.</p>
<p><strong>Director:</strong> Mark Romanek · <strong>Año:</strong> 2010 · <strong>Géneros:</strong> Ciencia ficción, Drama, Romance</p>
<p><strong>Reparto:</strong> Carey Mulligan, Keira Knightley, Andrew Garfield, Izzy Meikle-Small, Ella Purnell, Charlie Rowe</p>
