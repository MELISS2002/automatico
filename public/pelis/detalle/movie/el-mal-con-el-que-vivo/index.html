<h1>El Mal con el que vivo</h1>
<p>Tras una serie de extraños sucesos que la llevan a cuestionarse la vida aislada de su familia en un recinto fortificado en lo profundo de la selva inglesa, Willow, de 10 años, sigue a sus padres en una de sus excursiones secretas nocturnas al corazón del antiguo bosque. Pero al ver a su padre sufrir una terrible transformación, ella también se ve atrapada por el oscuro secreto ancestral que han intentado ocultar tan desesperadamente.</p>
<p><strong>Director:</strong> Alexander J. Farrell · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Drama, Suspense, Terror</p>
