<p>Adaptación de High Rise, novela publicada por J.G. Ballard a mediados de los años ‘70. La historia narra la llegada del doctor Robert Laing a la Torre Elysium, un enorme rascacielos dentro del cual se desarrolla todo un mundo aparte, en el cual parece existir la sociedad ideal. Pero secretamente, el recién llegado se sentirá perturbado ante la posibilidad de que este orden utópico no sea tal. Sospechas que rápidamente serán corroboradas de la forma más siniestra.</p>
<p><strong>Director:</strong> Ben Wheatley · <strong>Año:</strong> 2015 · <strong>Géneros:</strong> Drama</p>
