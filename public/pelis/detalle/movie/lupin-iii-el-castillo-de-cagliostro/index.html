<p>Lupin, un elegante y atlético ladrón, y su compañero Jigen viajan al pequeño ducado europeo de Cagliostro. Allí ayudarán a la bella Clarice, que intenta librarse del temible Conde Cagliostro, e intentarán resolver el misterio de un tesoro oculto que data del siglo XV.</p>
<p><strong>Director:</strong> Hayao Miyazaki · <strong>Año:</strong> 1979 · <strong>Géneros:</strong> Animación, Aventura, Comedia, Crimen</p>
<p><strong>Reparto:</strong> 山田康雄, 小林清志, Eiko Masuyama, 井上真樹夫, 納谷悟朗, Sumi Shimamoto</p>
