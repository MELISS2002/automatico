<h1>Alfa</h1>
<p>Una aventura épica y una historia de supervivencia ambientada en la Europa de hace 20.000 años, durante la última glaciación. En mitad de su primera cacería con el grupo de élite de su tribu, un joven es herido y dado por muerto. Al despertar se encontrará débil y solo, y deberá aprender a sobrevivir y abrirse camino ante la dura y cruel naturaleza. Acompañado a regañadientes de un lobo abandonado por su manada, los dos aprenderán a confiar el uno en el otro, convertirse en aliados y superar los innumerables peligros para intentar encontrar el camino a casa antes de que llegue el letal invierno.</p>
<p><strong>Director:</strong> Albert Hughes · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Aventura, Drama</p>
<p><strong>Reparto:</strong> Kodi Smit-McPhee, Jóhannes Haukur Jóhannesson, Marcin Kowalczyk, Jens Hultén, Natassia Malthe, Spencer Bogaert</p>
