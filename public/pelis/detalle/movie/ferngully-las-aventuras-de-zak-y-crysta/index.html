<h1>FernGully, Las Aventuras De Zak Y Crysta</h1>
<p>La película narra la historia de FernGully, una selva tropical cerca del «Monte Peligro», Australia. Una curiosa hada llamada Crysta ve una parte del mundo que nunca había visto más allá de la copa de los árboles y piensa que los seres humanos habitan en la montaña cercana. Pero el sabio espíritu del bosque y figura materna para Crysta, Maga Luna, dice que los seres humanos están extintos. En la escena de apertura, ella dice que huyeron, aterrados por el ataque de Hexxus, el espíritu de la destrucción y todo lo que es tóxico para la naturaleza, para nunca volver y presuntamente han muerto; Hexxus fue derrotado por Maga Luna y fue encarcelado dentro de un árbol. Crysta menciona una nube que ella vio aumentando cerca de la montaña peligro, y Maga Luna lo identifica como humo, pero descarta la especulación de Crysta que el humo es Hexxus, diciendo que el fue aprisionado para toda la eternidad.</p>
<p><strong>Director:</strong> Bill Kroyer · <strong>Año:</strong> 1992 · <strong>Géneros:</strong> Animación, Aventura, Familia, Fantasía</p>
<p><strong>Reparto:</strong> Samantha Mathis, Jonathan Ward, Christian Slater, Robin Williams, Tim Curry, Grace Zabriskie</p>
