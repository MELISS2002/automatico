<h1>Definitivamente, tal vez</h1>
<p>Will es un padre de treinta y tantos años, residente en Manhattan, a punto de divorciarse. Maya, su hija de diez años, empieza a preguntarle sobre su vida antes de casarse. Maya quiere saberlo todo, cómo se conocieron sus padres y cómo se enamoraron. La historia de Will empieza en 1992, cuando todavía era un joven e ingenuo aspirante a político que se mudó de Wisconsin a Nueva York para trabajar en la campaña presidencial. Para satisfacer la curiosidad de Maya, Will rememora el pasado de un joven idealista que aprende los tejemanejes de la política en una gran urbe, y le cuenta que conoció a tres mujeres muy diferentes.</p>
<p><strong>Director:</strong> Adam Brooks · <strong>Año:</strong> 2008 · <strong>Géneros:</strong> Comedia, Romance</p>
<p><strong>Reparto:</strong> Ryan Reynolds, Abigail Breslin, Elizabeth Banks, Isla Fisher, Rachel Weisz, Kevin Kline</p>
