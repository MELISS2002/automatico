<h1>Mis muertos tristes</h1>
<p>Ema, una médica de 60 años, puede ver y escuchar a los muertos. Los llama “presencias” y ha vivido toda su vida evitando que ese don la conecte con el sufrimiento de otros. Pero cuando su sobrina Julie —una joven perturbada que también puede comunicarse con los muertos, aunque de una forma mucho más intensa y sexual— llega a su casa, Ema se ve obligada a involucrarse. Lo que comienza como un reencuentro familiar se convierte en una perturbadora cadena de eventos que alteran el equilibrio entre el mundo de los vivos y los muertos, contagiando a todo un barrio con voces del más allá. Mientras las fronteras entre la vida, la muerte y el deseo se desdibujan, Ema tendrá que enfrentarse a su pasado, su hija, y los fantasmas que nunca dejó ir.</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Drama</p>
<p><strong>Reparto:</strong> Mercedes Morán, Dolores Fonzi, Alejandra Flechner, Carolina Sánchez Álvarez, Carlos Portaluppi, Germán de Silva</p>
