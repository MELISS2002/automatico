<h1>That Time I Got Reincarnated as a Slime</h1>
<p>Satoru Mikami es un hombre de 37 años que tiene un trabajo que no le gusta, sin salida y que no es feliz con la vida que lleva, pero cuando muere a manos de un ladrón y piensa que es su fin, se despierta descubriendo que se ha reencarnado en un mundo de magia y espada… ¡pero como un slime! Ahora tendrá que acostumbrarse a su nueva vida, aunque por suerte contará con dos habilidades únicas que le ayudarán a sobrevivir: una que le proporciona una gran comprensión de todo lo que le rodea, y otra que le permite copiar las habilidades de sus oponentes.</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2018 · <strong>Géneros:</strong> Action &amp; Adventure, Animación, Comedia, Sci-Fi &amp; Fantasy</p>
<p><strong>Reparto:</strong> 岡咲美保, 前野智昭, 江口拓也, 大塚芳忠, 泊明日菜, 小林親弘</p>
