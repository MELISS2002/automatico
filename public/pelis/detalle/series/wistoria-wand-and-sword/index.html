<h1>Wistoria: Wand and Sword</h1>
<p>Will es un chico muy trabajador que se inscribe en una academia de magia con la esperanza de convertirse en un gran hechicero. Por desgracia, su plan tiene un fallo crítico: que no tiene la capacidad de usar magia. Las miradas de desprecio de sus compañeros e instructores hacen que Will se desanime en ocasiones, pero sigue adelante con una fuerza de voluntad inquebrantable. No puede usar una varita, pero puede blandir su espada en su intento por llegar a lo más alto de un mundo dominado por la magia. Solo necesita creer en sus propios puntos fuertes y recordar la promesa que le hizo a alguien muy importante para él&amp;#8230;</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Action &amp; Adventure, Animación, Sci-Fi &amp; Fantasy</p>
