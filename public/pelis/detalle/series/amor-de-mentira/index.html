<h1>Amor de mentira</h1>
<p>La vida de Meri se derrumba cuando su prometido la engaña antes de la boda. Peor aún, pierde su casa por un fraude. Sin dinero y sin hogar, toca fondo hasta que la suerte le sonríe. Gana Beauté Palace, una lujosa casa valorada en cinco mil millones de wones, en un evento de premios de un centro comercial. La trampa está en que debe seguir casada y asistir a la ceremonia con su esposo. Incapaz de localizar a su ex, Meri recurre a Kim Wooju, un desconocido que comparte el mismo nombre que él, y le ruega que se haga pasar por su esposo. Para engañar al perspicaz investigador de al lado, deben mantener la farsa de recién casados. ¿Podrán conservar Beauté Palace sin que los descubran?</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2025 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Choi Woo-shik, Jung So-min, 신슬기, Bae Na-ra, Seo Bum-june, Moon Seung-you</p>
