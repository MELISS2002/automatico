<h1>Beso de sirena</h1>
<p>Cha Wooseok recibe una misteriosa llamada de una informante que afirma tener pruebas de un asesinato relacionado con un fraude. Antes de revelar la verdad, la informante muere. La investigación de Wooseok lo lleva a la Subasta Real y a su subastadora principal, Han Seol-ah, cuyos tres prometidos han muerto en circunstancias sospechosas. Para revelar la verdad, o quizás para ponerla a prueba, Wooseok propone fingir una relación. Al descubrir sus secretos, se da cuenta de que podría haber caído en una red de la que no puede escapar, y que escapar podría costarle todo.</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Crimen, Drama, Misterio</p>
