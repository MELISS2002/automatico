<h1>Classroom of the Elite</h1>
<p>Kiyotaka Ayanokouji acaba de entrar en la Academia Tokyo Koudo Ikusei, de la cual se dice que el 100% de sus estudiantes acaban yendo a la universidad o encontrando un buen trabajo. Sin embargo nuestro protagonista acaba en la Clase 1-D, donde la escuela pone a todos los alumnos con problemas. Y lo que es más, cada mes la escuela otorga a los estudiantes puntos por valor de 100.000 yenes, y las clases emplean un sistema por el cual se puede hablar, dormir e incluso molestar a los compañeros durante las clases.</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2017 · <strong>Géneros:</strong> Animación, Drama, Misterio</p>
<p><strong>Reparto:</strong> 千葉翔也, 鬼頭明里, 竹達彩奈, 久保ユリカ, 市道真央, 逢坂良太</p>
