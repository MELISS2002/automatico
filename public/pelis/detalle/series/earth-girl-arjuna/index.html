<h1>Earth Girl Arjuna</h1>
<p>Todo comienza cuando Juna Ariyoshi, de 15 años, le pide a su amigo Tokio Oshima ver el mar, pero no el mar contaminado de la ciudad de Tokio, sino que desea ver el mar puro y cristalino al otro lado de la montaña. Es así como los dos emprenden un hermoso viaje en motocicleta hasta que una fuerza desconocida los hace volcar, provocando así la muerte de Juna. En medio de la sala de operaciones, ella despierta y puede ver su propio cuerpo flotando justo en el momento en que sus signos vitales cesan. Es entonces despedida a gran velocidad hacia el cielo, observando un hermoso amanecer y, además, viendo cómo criaturas con formas de gusano absorben y destruyen la tierra.</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2001 · <strong>Géneros:</strong> Animación, Drama, Sci-Fi &amp; Fantasy</p>
<p><strong>Reparto:</strong> 東山麻美, Tomokazu Seki, Aya Hisakawa, 沢海陽子, 鈴鹿千春, 宇和川恵美</p>
