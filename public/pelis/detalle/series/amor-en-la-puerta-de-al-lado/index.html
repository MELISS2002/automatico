<h1>Amor en la puerta de al lado</h1>
<p>Bae Seok Ryu siempre ha sido una persona destacada y llena de energía. Después de graduarse de la universidad, fue contratada por un gran conglomerado global como directora de proyectos. Sin embargo, un incidente en su trabajo la lleva a renunciar y quedarse desempleada, enfrentándose a una crisis personal. En medio de esta crisis, Bae Seok Ryu se reencuentra con Choi Seung Hyo, el hijo de la amiga de su madre. Él es el joven arquitecto más destacado del país y dirige el taller de arquitectura «In». No solo es casi perfecto como arquitecto, sino que también es muy atractivo y tiene una gran personalidad. Desde que sus madres se hicieron amigas cuando tenían cuatro años, ambos han compartido muchas experiencias, incluyendo momentos embarazosos que Seung Hyo quiere borrar de su vida. Ahora, ya adultos, sus caminos se cruzan de nuevo cuando Seok Ryu, tratando de reiniciar su vida defectuosa, reaparece en la pacífica vida de Seung Hyo.</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2024 · <strong>Géneros:</strong> Comedia, Drama</p>
<p><strong>Reparto:</strong> Jung Hae-in, Jung So-min, Kim Ji-eun, Yun Ji-on, 박지영, 조한철</p>
