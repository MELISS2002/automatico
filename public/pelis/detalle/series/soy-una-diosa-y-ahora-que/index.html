<h1>Soy una Diosa ¿Y ahora qué?</h1>
<p>La historia comienza con Nanami Momozono, una chica que ha perdido su casa a causa de las deudas de juego de su padre y ha sido abandonada por éste. Al encontrarse en el parque sin casa o lugar adónde ir, conoce a un joven y lo «salva» ya que estaba siendo amenazado por un perro, a cambio de dicho acto el joven le concede su propiedad y el derecho de ser el «nuevo» dios de la tierra. Cuando Nanami va a la propiedad al principio cree que es una broma ya que resulta ser un templo, pero todo cambia cuando conoce a Tomoe el familiar del antiguo dios de la tierra que no estará dispuesto a aceptar tan fácilmente a Nanami como su nueva ama, siguiendo enojado por el abandono de su antiguo amo, ahora Nanami se ve afrontar un nuevo mundo donde ella tendrá que probar tanto al mundo de los dioses como ella misma que puede llegar a ser una deidad digna (junto con la ayuda de Tomoe) tendrá que aprender como hacer el trabajo de dios de la tierra y más en un mundo donde la ciencia y la Tecnología han superado la creencia religiosa.</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2012 · <strong>Géneros:</strong> Animación, Comedia, Sci-Fi &amp; Fantasy</p>
<p><strong>Reparto:</strong> Yui Horie, 三森すずこ, 浪川大輔, 岸尾だいすけ, 佐藤聡美, 山崎バニラ</p>
