<h1>Hana-Kimi</h1>
<p>La estrella del atletismo japonés-estadounidense Mizuki consiguió que la transfieran a una escuela secundaria en Japón&amp;#8230; ¡pero no a cualquier escuela! Para estar cerca de su ídolo, el saltador de altura Izumi Sano, irá a una escuela secundaria exclusivamente para hombres&amp;#8230; ¡y se disfrazará de niño! Pero el destino quiso que fueran más que compañeros de clase&amp;#8230; ¡son compañeros de cuarto! Ahora, Mizuki debe guardar su secreto en el salón de clases, el vestuario y su propio dormitorio. Y sus compañeros de clase (y la enfermera de la escuela) deben lidiar con un nuevo estudiante transferido que puede hacerles cuestionar su propia orientación&amp;#8230;</p>
<p><strong>Director:</strong> N/D · <strong>Año:</strong> 2026 · <strong>Géneros:</strong> Animación, Comedia</p>
<p><strong>Reparto:</strong> 山根綺, 八代拓, 戸谷菊之介, 内山昂輝, 梅原裕一郎, 川島零士</p>
